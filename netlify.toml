# APRENS · configuración de Netlify
# La app vive en la subcarpeta app/. No hay build: son ficheros estáticos.
# (Los headers están en app/_headers para que funcionen también con "drag & drop".)
[build]
  publish = "app"
  command = ""

# Contador anónimo de uso: /api/uso (recibe eventos) y /api/uso-resumen
# (los lee el índice de escritorio con la clave USO_CLAVE). Solo funciona en el
# despliegue conectado a GitHub: con «drag & drop» de app/ no se publican.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
