ición en vivo gradual: tu escalera de peldaños y dos llaves en cada exposición, el QUÉ (conductual) y el CÓMO (acompañamiento interno AIS).", "pub": "paciente", "path": "app/exposicion/index.html", "app": "https://aprens-app.netlify.app/#/tool/escalera_exposicion", "url": "https://aprens-app.netlify.app/exposicion/", "src": "https://github.com/tofol24/mindplace/blob/claude/eloquent-newton-u7d70k/app/exposicion/index.html", "estado": "publicado"}, {"cat": "peques-y-familias", "emoji": "🗺️", "nombre": "La exploradora valiente", "desc": "Juego infantil de exposición gradual para la ansiedad de separación (para madres y padres): escalera de misiones de valiente y dos llaves, el QUÉ y el CÓMO (co-regulación AIS).", "pub": "paciente", "path": "app/exploradora/index.html", "app": "https://aprens-app.netlify.app/#/tool/exploradora_valiente", "url": "https://aprens-app.netlify.app/exploradora/", "src": "https://github.com/tofol24/mindplace/blob/claude/eloquent-newton-u7d70k/app/exploradora/index.html", "estado": "publicado"}, {"cat": "peques-y-familias", "emoji": "🌙", "nombre": "Ritual diario · calma y atención", "desc": "Pauta parental para regulación y rabietas: ritual diario de audios AIS, 3 normas y refuerzo, parada de pensamiento con respiración y grounding 5-4-3-2-1.", "pub": "paciente", "path": "app/ritual/index.html", "app": "https://aprens-app.netlify.app/#/tool/ritual_calma", "url": "https://aprens-app.netlify.app/ritual/", "src": "https://github.com/tofol24/mindplace/blob/claude/eloquent-newton-u7d70k/app/ritual/index.html", "estado": "publicado"}, {"cat": "peques-y-familias", "emoji": "🧸", "nombre": "Rincón de calma", "desc": "Juegos infantiles cortos, visuales y lúdicos para practicar estar con lo que siento: la flor y la vela (respiración), el abrazo sentido y el detective de sensaciones.", "pub": "paciente", "path": "app/rincon/index.html", "app": "https://aprens-app.netlify.app/#/tool/rincon_calma", "url": "https://aprens-app.netlify.app/rincon/", "src": "https://github.com/tofol24/mindplace/blob/claude/eloquent-newton-u7d70k/app/rincon/index.html", "estado": "publicado"}, {"cat": "deporte", "emoji": "🚵", "nombre": "Pedalea desde dentro", "desc": "Ciclismo de competición desde la tarea y el amor a la bici, no el látigo: pirámide de rendimiento (atención→…→resultado), entreno de montaña y continuidad, AIS hacia el dolor, látigo vs amor firme, banco de autoverbalizaciones para acompañar a tu cuerpo, modo prueba, revisión semanal y ICE. Nombre y diminutivo editables.", "pub": "paciente", "path": "app/tools-standalone/pedalea_desde_dentro_aprens.html", "app": "https://aprens-app.netlify.app/#/tool/pedalea_desde_dentro", "url": "https://aprens-app.netlify.app/tools-standalone/pedalea_desde_dentro_aprens.html", "src": "https://github.com/tofol24/mindplace/blob/claude/eloquent-newton-u7d70k/app/tools-standalone/pedalea_desde_dentro_aprens.html", "estado": "publicado"}, {"cat": "deporte", "emoji": "🎾", "nombre": "Entre punto y punto", "desc": "Tenis de competición (adolescente): mapa atencional del juego (saque, resto, error no forzado, bucle, punto clave, cambio de lado, miradas de fuera, cansancio), autorregistro al salir de la pista con los tres parámetros TEC, exposición en imaginación para sostener la tensión y verse jugando bien con ella dentro, y escalera progresiva de mirada hacia adentro (AIS) hasta la pista con la raqueta.", "pub": "paciente", "path": "app/tools-standalone/entre_punto_y_punto_aprens.html", "app": "https://aprens-app.netlify.app/#/tool/entre_punto_y_punto", "url": "https://aprens-app.netlify.app/tools-standalone/entre_punto_y_punto_aprens.html", "src": "https://github.com/tofol24/mindplace/blob/claude/eloquent-newton-u7d70k/app/tools-standalone/entre_punto_y_punto_aprens.html", "estado": "publicado"}, {"cat": "parar-y-regular-impulsos", "emoji": "🤍", "nombre": "Estoy aquí conmigo", "desc": "Para adolescentes: entrenar la presencia interna y el apego seguro con una misma tras una ruptura o cuando cuesta sostener la soledad. STOP, respiración de presencia, ¿deseo o alivio?, apego sano vs dependencia, registro y plan de apoyo (TEC–AIS).", "pub": "paciente", "path": "app/tools-standalone/estoy_aqui_conmigo_ais.html", "app": "https://aprens-app.netlify.app/#/tool/estoy_aqui_conmigo", "url": "https://aprens-app.netlify.app/tools-standalone/estoy_aqui_conmigo_ais.html", "src": "https://github.com/tofol24/mindplace/blob/claude/eloquent-newton-u7d70k/app/tools-standalone/estoy_aqui_conmigo_ais.html", "estado": "publicado"}, {"cat": "trabajo", "emoji": "🚪", "nombre": "Toco desde dentro", "desc": "Para trabajo comercial de puerta fría: respiración AIS antes de tocar, acompañar el cuerpo (no arrastrarlo), reencuadrar amenaza→reto, soltar los «no» y cerrar el día antes de llegar a casa para no arrastrar fatiga a la familia.", "pub": "paciente", "path": "app/tools-standalone/toco_desde_dentro_aprens.html", "app": "https://aprens-app.netlify.app/#/tool/toco_desde_dentro", "url": "https://aprens-app.netlify.app/tools-standalone/toco_desde_dentro_aprens.html", "src": "https://github.com/tofol24/mindplace/blob/claude/eloquent-newton-u7d70k/app/tools-standalone/toco_desde_dentro_aprens.html", "estado": "publicado"}, {"cat": "peques-y-familias", "emoji": "🐨", "nombre": "La familia de Koa (cuento)", "desc": "Cuento ilustrado e interactivo para dormir (3 años, familia monoparental): muchas formas de familia y todas con amor, desde el apego seguro. Cada página con pregunta y gesto de apego, y una guía completa para mamá.", "pub": "paciente", "path": "app/tools-standalone/cuento_familia_aprens.html", "app": "https://aprens-app.netlify.app/#/tool/cuento_familia", "url": "https://aprens-app.netlify.app/tools-standalone/cuento_familia_aprens.html", "src": "https://github.com/tofol24/mindplace/blob/claude/eloquent-newton-u7d70k/app/tools-standalone/cuento_familia_aprens.html", "estado": "publicado"}, {"cat": "peques-y-familias", "emoji": "⏱️", "nombre": "El tiempo límite (peques)", "desc": "Para madres y padres: enseñar a tu peque a empezar por sí mismo. Primero la honestidad emocional (compartir la sensación y pedir un abrazo, desde la complicidad y no la culpa), luego el entrenamiento del tiempo límite de 2 minutos, la tolerancia a la frustración sin ser rescatado y los límites claros. Bilingüe castellano/català.", "pub": "paciente", "path": "app/tools-standalone/tiempo_limite_peques.html", "app": "https://aprens-app.netlify.app/#/tool/tiempo_limite", "url": "https://aprens-app.netlify.app/tools-standalone/tiempo_limite_peques.html", "src": "https://github.com/tofol24/mindplace/blob/claude/eloquent-newton-u7d70k/app/tools-standalone/tiempo_limite_peques.html", "estado": "publicado"}, {"cat": "peques-y-familias", "emoji": "🌊", "nombre": "Cuando todo se hace demasiado", "desc": "Para familias con perfil TEA (9–12 años): acompañar el desbordamiento ante la frustración y los cambios, no «parar rabietas». Semáforo de capacidad, «primero yo» (regulación del adulto), qué necesita / qué le digo / hablo o espero, fuera de casa, entrenar en calma, entender lo que pasó y un plan familiar. Doble entrada niño/adulto. Modo tranquilo. Todo se guarda solo en el dispositivo.", "pub": "paciente", "path": "app/tools-standalone/cuando-todo-demasiado.html", "app": "https://aprens-app.netlify.app/#/tool/peques_desbordamiento", "url": "https://aprens-app.netlify.app/tools-standalone/cuando-todo-demasiado.html", "src": "https://github.com/tofol24/mindplace/blob/claude/eloquent-newton-u7d70k/app/tools-standalone/cuando-todo-demasiado.html", "estado": "publicado"}, {"cat": "peques-y-familias", "emoji": "📖", "nombre": "Los cuentos de Nil", "desc": "Tres cuentos visuales para peques (9–12) con perfil TEA: reconocer cuánto espacio (capacidad) queda por dentro, no «portarse bien». «No era así como tenía que pasar» (cambios), «Hoy todo pesaba más» (acumulación y fuera de casa) y «No salió como yo pensaba» (frustración social). Incluye «¿Y a mí qué me pasa?» para hacer tu propio m /", "app": "https://aprens-app.netlify.app/#/tool/retorno_trabajo", "antigua": true, "src": null, "estado": "publicado"}]};

var KEY = "aprens_indice_escritorio";
function load(){ try{ return JSON.parse(localStorage.getItem(KEY)) || {}; }catch(e){ return {}; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(st)); }catch(e){} }
var st = load(); st.fav = st.fav || {}; st.rec = st.rec || []; st.cat = st.cat || "todas"; st.pub = st.pub || "todo";

D.items.forEach(function(it, i){ it.k = it.path || it.url || ("i"+i); });
var $ = function(id){ return document.getElementById(id); };
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function norm(s){ return String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,""); }
function hl(s, q){
  s = esc(s); if(!q) return s;
  var i = norm(s).indexOf(q); if(i<0) return s;
  return s.slice(0,i)+"<mark>"+s.slice(i,i+q.length)+"</mark>"+s.slice(i+q.length);
}
var PUB = {paciente:"Pacientes", profesional:"Profesional", centro:"Centro"};

function estadoTag(it){
  if(it.estado==="publicado") return '<span class="tag ok">Publicado</span>';
  if(it.estado==="protegido") return '<span class="tag ok">Publicado · con contraseña</span>';
  if(it.estado==="no-publicado") return '<span class="tag no">Sin publicar</span>';
  if(it.estado==="sin-url") return '<span class="tag no">Sin dirección pública</span>';
  if(it.estado==="nativo") return '<span class="tag">App iOS</span>';
  return "";
}
function abrirURL(it){ return it.app && !it.antigua ? it.app : it.url; }

function card(it, q){
  var main = abrirURL(it), fav = !!st.fav[it.k];
  var h = '<div class="card" data-k="'+esc(it.k)+'"><div class="top"><span class="em">'+esc(it.emoji)+'</span><div class="tt"><div class="nm">'+
    (main ? '<a href="'+esc(main)+'" target="_blank" rel="noopener" data-open="1">'+hl(it.nombre,q)+'</a>' : hl(it.nombre,q))+
    '</div></div><button class="star'+(fav?' on':'')+'" data-fav="1" title="'+(fav?'Quitar de favoritos':'Añadir a favoritos')+'" aria-label="Favorito">'+(fav?'★':'☆')+'</button></div>';
  h += '<div class="ds">'+hl(it.desc,q)+(it.nota?' '+esc(it.nota):'')+'</div>';
  h += '<div class="tags">'+estadoTag(it)+'<span class="tag'+(it.pub==="profesional"?' pro':'')+'">'+(PUB[it.pub]||"")+'</span></div>';
  if(it.sub && it.sub.length) h += '<div class="sub">'+it.sub.map(function(s){ return '<a href="'+esc(s.url)+'" target="_blank" rel="noopener" data-open="1">'+esc(s.n)+'</a>'; }).join(" · ")+'</div>';
  h += '<div class="acts">';
  if(main) h += '<a class="btn pri" href="'+esc(main)+'" target="_blank" rel="noopener" data-open="1">Abrir</a>';
  if(it.app && it.url && !it.antigua && it.url!==it.app) h += '<a class="btn ghost" href="'+esc(it.url)+'" target="_blank" rel="noopener" data-open="1" title="El archivo suelto, fuera de la app">Archivo suelto</a>';
  if(main) h += '<button class="btn" data-copy="'+esc(main)+'">Copiar enlace</button>';
  if(it.src) h += '<a class="btn ghost" href="'+esc(it.src)+'" target="_blank" rel="noopener">Código</a>';
  h += '</div>';
  if(it.path) h += '<div class="path">'+hl(it.path,q)+'</div>';
  return h + '</div>';
}

function pasa(it, q){
  if(st.pub!=="todo" && it.pub!==st.pub) return false;
  if(!q) return true;
  return norm(it.nombre+" "+it.desc+" "+(it.path||"")+" "+(it.url||"")+" "+(it.sub||[]).map(function(s){return s.n;}).join(" ")).indexOf(q)>=0;
}

function render(){
  var q = norm($("q").value.trim());
  var counts = {}, total = 0;
  D.items.forEach(function(it){ if(pasa(it,q)){ counts[it.cat]=(counts[it.cat]||0)+1; total++; if(st.fav[it.k]) counts.favoritos=(counts.favoritos||0)+1; } });
  $("cats").innerHTML = '<button data-cat="todas" class="'+(st.cat==="todas"?'on':'')+'"><span class="e">📚</span><span class="l">Todo</span><span class="n">'+total+'</span></button>' +
    D.cats.map(function(c){
      return '<button data-cat="'+c.id+'" class="'+(st.cat===c.id?'on':'')+'"><span class="e">'+c.emoji+'</span><span class="l">'+esc(c.label)+'</span><span class="n">'+(counts[c.id]||0)+'</span></button>';
    }).join("");
  var html = "";
  D.cats.forEach(function(c){
    if(st.cat!=="todas" && st.cat!==c.id) return;
    var its = D.items.filter(function(it){ return (c.id==="favoritos" ? st.fav[it.k] : it.cat===c.id) && pasa(it,q); });
    if(!its.length) return;
    if(st.cat==="todas" && c.id==="favoritos" && q) return; // en búsqueda no duplicar
    html += '<section class="sec" id="s-'+c.id+'"><h2><span>'+c.emoji+'</span>'+esc(c.label)+'</h2><p class="d">'+esc(c.desc)+'</p><div class="grid">'+its.map(function(it){ return card(it,q); }).join("")+'</div></section>';
  });
  $("list").innerHTML = html || '<p class="empty">'+(st.cat==="favoritos" ? 'Aún no tienes favoritos. Marca la ☆ de cualquier tarjeta.' : 'No hay nada con esa búsqueda.')+'</p>';
  var rec = st.rec.map(function(k){ return D.items.filter(function(it){ return it.k===k; })[0]; }).filter(Boolean);
  $("recent").innerHTML = rec.length && !q ? '<h3>Abiertos hace poco</h3><div class="rchips">'+rec.map(function(it){
    return '<a class="rchip" href="'+esc(abrirURL(it))+'" target="_blank" rel="noopener" data-k="'+esc(it.k)+'" data-open="1">'+esc(it.emoji)+' '+esc(it.nombre)+'</a>'; }).join("")+'</div>' : "";
  [].forEach.call(document.querySelectorAll("#pub button"), function(b){ b.classList.toggle("on", b.getAttribute("data-v")===st.pub); });
  save();
}

function toast(t){ var e=$("toast"); e.textContent=t; e.classList.add("show"); clearTimeout(toast.t); toast.t=setTimeout(function(){ e.classList.remove("show"); },1600); }
function copiar(txt){
  var ok=function(){ toast("Enlace copiado"); };
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(ok,function(){ fb(txt); ok(); }); } else { fb(txt); ok(); }
}
function fb(txt){ var t=document.createElement("textarea"); t.value=txt; t.style.position="fixed"; t.style.opacity="0"; document.body.appendChild(t); t.select(); try{document.execCommand("copy");}catch(e){} t.remove(); }

document.addEventListener("click", function(e){
  var t = e.target.closest("button, a"); if(!t) return;
  if(t.hasAttribute("data-cat")){ st.cat=t.getAttribute("data-cat"); render(); window.scrollTo(0,0); return; }
  if(t.parentNode && t.parentNode.id==="pub"){ st.pub=t.getAttribute("data-v"); render(); return; }
  var c = t.closest("[data-k]"), k = c && c.getAttribute("data-k");
  if(t.hasAttribute("data-fav")){ if(st.fav[k]) delete st.fav[k]; else st.fav[k]=1; render(); return; }
  if(t.hasAttribute("data-copy")){ copiar(t.getAttribute("data-copy")); return; }
  if(t.hasAttribute("data-open") && k){ st.rec=[k].concat(st.rec.filter(function(x){ return x!==k; })).slice(0,8); save(); setTimeout(render,300); }
  if(t.id==="tema"){ var cur=document.documentElement.getAttribute("data-theme"); var nx = cur==="dark"?"light":(cur==="light"?"":"dark"); if(nx) document.documentElement.setAttribute("data-theme",nx); else document.documentElement.removeAttribute("data-theme"); st.tema=nx; save(); }
});
$("q").addEventListener("input", function(){ if(this.value && st.cat==="favoritos") st.cat="todas"; render(); });
document.addEventListener("keydown", function(e){
  if(e.key==="/" && document.activeElement!==$("q")){ e.preventDefault(); $("q").focus(); }
  if(e.key==="Escape"){ $("q").value=""; render(); }
});
if(st.tema) document.documentElement.setAttribute("data-theme", st.tema);
var nTool = D.items.filter(function(i){ return !i.antigua; }).length;
$("foot").innerHTML = nTool+' herramientas y páginas · '+(D.items.length-nTool)+' webs antiguas<br>Generado el '+D.generado+' desde la rama <b>'+esc(D.rama)+'</b>'+(D.comprobado?'':' (sin comprobar publicación)')+'.<br>Para actualizarlo: <code>python3 scripts/indice-escritorio.py --comprobar</code><br><button id="tema" type="button">Claro / oscuro</button>';
render();
</script>
</body>
