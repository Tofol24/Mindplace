<title>APRENS · Mapa de Pareja — Evaluación</title>
<!--
  APRENS · MAPA DE PAREJA — ARCHIVO 1: CUESTIONARIO DEL PACIENTE
  =============================================================
  · 100% local: HTML + CSS + JS vanilla. Sin backend, sin CDN, sin fuentes
    externas, sin analítica, sin APIs. Funciona offline al descargarlo.
  · Privacidad por diseño: por defecto los datos SOLO viven en memoria del
    navegador durante la sesión. localStorage se usa ÚNICAMENTE si la persona
    pulsa "Guardar borrador en este dispositivo".
  · No hace diagnósticos. No decide continuidad/separación. Genera un bloque de
    datos (APRENS_PAIR_DATA_V1) para que el profesional lo organice.

  CÓMO MODIFICAR PREGUNTAS / REGLAS
  ---------------------------------
  · Las preguntas se definen en el array SECTIONS (más abajo). Cada campo tiene
    un `key` (que va al JSON), un `type` y su texto. Añade/edita ahí.
  · Los tipos disponibles están en renderField().
  · La lógica de cribado de seguridad está en SECURITY y evalSecurity().
  · Los borradores operativos de objetivos se generan en draftGoal().
-->
<style>
:root{
  --bg:#F4F2EC; --card:#FFFFFF; --ink:#26302E; --muted:#6E756C; --line:#E4DFD3;
  --sage:#6F8F83; --sage-d:#577469; --ocre:#C6A66B; --coral:#CE8A56; --rojo:#B85C52;
  --azul:#7895A8; --focus:#2f6f60; --shadow:0 1px 2px rgba(40,49,47,.06),0 6px 24px rgba(40,49,47,.06);
  --r:16px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,"Noto Sans",sans-serif;
  font-size:17px;line-height:1.55;-webkit-text-size-adjust:100%}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 120px}
header.top{position:sticky;top:0;z-index:20;background:rgba(244,242,236,.94);
  backdrop-filter:saturate(1.1) blur(6px);border-bottom:1px solid var(--line)}
.top .in{max-width:720px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{font-weight:800;letter-spacing:.02em;font-size:15px}
.brand span{color:var(--sage-d)}
.progress{flex:1;height:8px;background:#e7e3d7;border-radius:999px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--sage);transition:width .3s ease}
.pcount{font-size:13px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}

h1{font-size:26px;line-height:1.2;margin:22px 0 6px}
h2{font-size:21px;margin:4px 0 2px}
.kick{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--sage-d);margin-top:24px}
p.lead{color:#3c433f;margin:.4em 0}
.muted{color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);padding:18px;margin:14px 0}
.note{background:#f3f6f4;border:1px solid #dbe6e1;border-radius:12px;padding:12px 14px;font-size:15px;color:#3a463f}
.warn{background:#fbf1ea;border:1px solid #eecbb4;color:#6e4a30}
.danger{background:#fbeeec;border:1px solid #e6bdb6;color:#7a3d33}

.field{margin:16px 0}
.field>label.q,.qlabel{display:block;font-weight:600;margin-bottom:8px}
.hint{font-size:14px;color:var(--muted);margin:-2px 0 8px}
input[type=text],input[type=number],textarea,select{
  width:100%;font:inherit;color:var(--ink);background:#fff;border:1.5px solid var(--line);
  border-radius:12px;padding:12px 13px}
textarea{min-height:92px;resize:vertical}
input:focus,textarea:focus,select:focus,button:focus-visible,.opt:focus-within{
  outline:3px solid var(--focus);outline-offset:1px}
/* Escalas 0–10 (rejilla par: 0–5 / 6–10) */
.scale{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
@media(min-width:560px){ .scale{grid-template-columns:repeat(11,1fr)} }
.scale .sbtn{min-height:46px;border:1.5px solid var(--line);background:#fff;
  border-radius:10px;font-weight:700;color:#41504b;cursor:pointer}
.scale .sbtn[aria-pressed=true]{background:var(--sage);border-color:var(--sage-d);color:#fff}
.scends{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:6px}
/* Opciones (radio/checkbox) accesibles */
.opts{display:flex;flex-direction:column;gap:8px}
.opts.row{flex-direction:row;flex-wrap:wrap}
.opt{display:flex;align-items:flex-start;gap:10px;border:1.5px solid var(--line);border-radius:12px;
  padding:11px 13px;cursor:pointer;background:#fff}
.opt input{margin-top:3px;width:20px;height:20px;accent-color:var(--sage-d);flex:0 0 auto}
.opt.sel{border-color:var(--sage-d);background:#f2f7f5}
.opt .t{flex:1}
.prefna{margin-top:8px;font-size:14px}

.actions{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(244,242,236,.96);
  border-top:1px solid var(--line);backdrop-filter:blur(6px)}
.actions .in{max-width:720px;margin:0 auto;padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  display:flex;gap:10px}
button.btn{font:inherit;font-weight:700;border-radius:12px;padding:13px 16px;cursor:pointer;border:1.5px solid transparent}
button.primary{background:var(--sage);color:#fff;flex:1}
button.primary:hover{background:var(--sage-d)}
button.ghost{background:#fff;border-color:var(--line);color:var(--ink)}
button.ghost:disabled{opacity:.4;cursor:not-allowed}
button.link{background:none;border:none;color:var(--sage-d);text-decoration:underline;cursor:pointer;font:inherit;padding:6px}
.hide{display:none!important}
.pill{display:inline-block;font-size:12px;font-weight:700;background:#eef3f1;color:var(--sage-d);
  border-radius:999px;padding:3px 10px;margin:2px 4px 2px 0}
pre.data{white-space:pre-wrap;word-break:break-word;background:#20302c;color:#e9f0ec;border-radius:12px;
  padding:14px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;max-height:40vh;overflow:auto}
ul.clean{padding-left:20px}ul.clean li{margin:4px 0}
.req{color:var(--rojo)}
@media (min-width:640px){ .wrap{padding-bottom:110px} }
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<header class="top">

<main class="wrap" id="main">

<nav class="actions" id="nav" aria-label="Navegación del cuestionario">

<script>
"use strict";
/* ==========================================================================
   ESTADO (solo memoria por defecto)
   ========================================================================== */
var STATE = { meta:{}, ans:{} };   // ans[key] = valor
var STEP = 0;
var LS_KEY = "aprens_pareja_borrador";

/* ==========================================================================
   CATÁLOGOS reutilizables
   ========================================================================== */
var LIK_FREQ = ["Nunca","Rara vez","A veces","A menudo","Casi siempre"];       // 0..4
var LIK_AC   = ["Nada","Un poco","Bastante","Mucho","Totalmente"];             // 0..4
var SI_NO    = ["Sí","A veces","No","Prefiero no responder"];

var PROTECCIONES = ["Atacar","Criticar","Justificarme","Convencer","Exigir","Perseguir",
  "Comprobar","Controlar","Preguntar repetidamente","Callar","Retirarme","Bloquearme",
  "Escapar","Complacer","Ceder","Ironizar","Amenazar con dejar la relación",
  "Desconectar afectivamente","Otras"];

var VALORES = ["Respetuoso/a","Honesto/a","Cariñoso/a","Justo/a","Responsable","Comprensivo/a",
  "Libre","Leal","Paciente","Valiente","Coherente","Cuidadoso/a"];

// Dimensiones del "modelo de pareja" (clave interna → etiqueta)
var DIMS = [
  ["fidelidad","Fidelidad / exclusividad"],["privacidad","Privacidad"],["autonomia","Autonomía"],
  ["tiempo","Tiempo compartido"],["sexualidad","Sexualidad"],["dinero","Dinero"],
  ["hijos","Hijos"],["tareas","Tareas / reparto doméstico"],["familias","Familias de origen"],
  ["amistades","Amistades"],["trabajo","Trabajo"],["ocio","Ocio"],["futuro","Proyecto de futuro"]
];

/* ==========================================================================
   CRIBADO DE SEGURIDAD (privado)  — NUNCA se muestra al otro miembro.
   Cada ítem: si la respuesta alcanza `flagFrom` (índice de opción) suma señal.
   ========================================================================== */
var SEC_OPTS = ["Nunca","Alguna vez","Con frecuencia","Prefiero no responder"]; // 0..3
var SECURITY = [
  {key:"miedo",     t:"¿Sientes miedo de tu pareja en algún momento?"},
  {key:"fisica",    t:"¿Ha habido empujones, golpes u otra violencia física?"},
  {key:"amenazas",  t:"¿Te ha amenazado a ti o a personas que quieres?"},
  {key:"coercion",  t:"¿Te has sentido obligado/a a hacer cosas por presión o coerción?"},
  {key:"economico", t:"¿Controla o limita tu acceso al dinero?"},
  {key:"digital",   t:"¿Controla tu móvil, mensajes, ubicación o redes?"},
  {key:"aislar",    t:"¿Ha intentado alejarte de tu familia o amistades?"},
  {key:"sexual",    t:"¿Has sentido presión o coerción en lo sexual?"},
  {key:"objetos",   t:"¿Ha roto objetos o dañado cosas para asustarte?"},
  {key:"terceros",  t:"¿Existen amenazas hacia hijos/as u otras personas?"},
  {key:"libre",     t:"¿Puedes responder este cuestionario con libertad y en un lugar seguro?", invert:true}
];
/* Reglas de activación (deterministas, NO diagnósticas):
   - "libre" es inverso: preocupa si NO puede responder con libertad.
   - Física/amenazas/coerción/sexual/objetos/terceros → señal desde "Alguna vez".
   - Miedo/económico/digital/aislar → señal desde "Con frecuencia" (o "Alguna vez" acumulado). */
function evalSecurity(){
  var s = STATE.ans.seguridad || {};
  var hard=["fisica","amenazas","coercion","sexual","objetos","terceros"];
  var soft=["miedo","economico","digital","aislar"];
  var flags=[]; var score=0;
  hard.forEach(function(k){ var v=s[k]; if(v===1||v===2){flags.push(k);score+=2;} });
  soft.forEach(function(k){ var v=s[k]; if(v===2){flags.push(k);score+=2;} else if(v===1){flags.push(k);score+=1;} });
  if(s.libre===2||s.libre===1){ flags.push("libre"); score+=2; } // no puede responder con libertad
  // riesgo autolesivo / agresión / consumo se recogen aparte (campo riesgo)
  var r = s.riesgo||[];
  if(r.indexOf("suicida")>=0){ flags.push("riesgo_suicida"); score+=3; }
  if(r.indexOf("agresion")>=0){ flags.push("riesgo_agresion"); score+=3; }
  if(r.indexOf("consumo")>=0){ flags.push("consumo"); score+=1; }
  var level = score>=4 ? "rojo" : (score>=1 ? "naranja" : "verde");
  return { level:level, score:score, flags:flags, requiereValoracion: level!=="verde" };
}

/* ==========================================================================
   DEFINICIÓN DEL CUESTIONARIO (SECTIONS)
   Cada sección = un paso. `fields` describe los campos.
   ========================================================================== */
function scaleFields(defs, ends){ // helper: lista de escalas 0–10
  return defs.map(function(d){ return {type:"scale", key:d[0], q:d[1], ends:ends||["0 · nada","10 · mucho"]}; });
}
var SECTIONS = [
  /* 0 · Portada / identificación --------------------------------------- */
  { id:"intro", title:"Mapa de Pareja", intro:true, fields:[
    {type:"html", html:'<p class="lead">Este cuestionario nos ayudará a comprender cómo estás viviendo actualmente vuestra relación. <b>No hay respuestas correctas.</b> Nos interesa conocer tu experiencia.</p>'
      +'<div class="note">Complétalo <b>individualmente</b>, sin consensuar las respuestas con tu pareja. Tus respuestas se usan dentro de vuestro proceso de terapia de pareja y no sustituyen tu terapia individual.</div>'},
    {type:"text", key:"idPareja", q:"Código de pareja", meta:true, required:true,
      hint:"El mismo código que os ha dado vuestra psicóloga (para poder emparejar ambas evaluaciones)."},
    {type:"radioMeta", key:"miembro", q:"¿Quién eres en esta evaluación?", meta:true, required:true,
      opts:[["A","Miembro A"],["B","Miembro B"]], hint:"Vuestra psicóloga os indica quién es A y quién es B."},
    {type:"privacy"}
  ]},

  /* 1 · Seguridad (privado, antes de todo lo relacional) ---------------- */
  { id:"seguridad", title:"Antes de empezar", kick:"Espacio privado y cuidado", fields:[
    {type:"html", html:'<div class="note">Estas preguntas son <b>privadas</b> y solo las verá tu psicóloga. No aparecerán en ningún resumen dirigido a tu pareja. Responde con calma; si alguna no te encaja, puedes marcar «Prefiero no responder».</div>'},
    {type:"secGroup"},
    {type:"checks", key:"seg_riesgo", q:"¿Alguna de estas situaciones está presente ahora mismo?", secRisk:true,
      opts:[["suicida","Pensamientos de hacerme daño o de no querer seguir viviendo"],
            ["agresion","Miedo a poder llegar a agredir a alguien"],
            ["consumo","Un consumo (alcohol u otras sustancias) que me preocupa"],
            ["ninguna","Ninguna de estas"]],
      hint:"Marcar aquí solo sirve para que tu profesional lo tenga en cuenta y pueda acompañarte."}
  ]},

  /* 2 · Contexto -------------------------------------------------------- */
  { id:"contexto", title:"Contexto", kick:"Sección 1", fields:[
    {type:"text", key:"ctx_tiempo", q:"¿Cuánto tiempo lleváis en relación?"},
    {type:"radio", key:"ctx_convivencia", q:"¿Convivís actualmente?", opts:[["si","Sí"],["no","No"],["aveces","A ratos / en transición"]]},
    {type:"text", key:"ctx_hijos", q:"¿Tenéis hijos/as o personas a vuestro cuidado? ¿Cuántos y qué edades?"},
    {type:"textarea", key:"ctx_cambios", q:"¿Ha habido cambios importantes recientes? (mudanza, trabajo, salud, pérdidas, nacimiento…)"},
    {type:"textarea", key:"ctx_motivo", q:"¿Cuál es el motivo por el que acudís a terapia de pareja?"},
    {type:"text", key:"ctx_desde", q:"¿Desde cuándo notáis esta dificultad?"},
    {type:"radio", key:"ctx_quien", q:"¿Quién propuso venir a terapia?", opts:[["yo","Sobre todo yo"],["pareja","Sobre todo mi pareja"],["ambos","Los dos"],["otro","Otra persona / derivación"]]},
    {type:"textarea", key:"ctx_espera", q:"¿Qué esperas conseguir con esta terapia?"}
  ]},

  /* 3 · Mi experiencia de la relación (escalas) ------------------------- */
  { id:"escalas", title:"Mi experiencia de la relación", kick:"Sección 2", fields:[
    {type:"html", html:'<p class="muted">Del 0 al 10, ¿cómo vives hoy cada aspecto? Piensa en las últimas semanas.</p>'}
  ].concat(scaleFields([
    ["satisfaccion","Satisfacción general con la relación"],
    ["seguridad","Sensación de seguridad emocional"],
    ["confianza","Confianza"],
    ["respeto","Respeto mutuo"],
    ["libertad","Libertad para ser yo mismo/a"],
    ["comunicacion","Comunicación"],
    ["apoyo","Apoyo cuando lo necesito"],
    ["afecto","Afecto y cariño"],
    ["intimidad","Intimidad emocional"],
    ["sexualidad","Sexualidad"],
    ["cooperacion","Cooperación en el día a día"],
    ["admiracion","Admiración hacia mi pareja"],
    ["proyecto","Proyecto común de futuro"],
    ["limites","Capacidad de poner límites"],
    ["reparacion","Capacidad de reparar después de un conflicto"]
  ]), [
    {type:"textarea", key:"cambiar3", q:"Si solo pudiera cambiar tres cosas de nuestra relación, serían…"}
  ])},

  /* 4 · Fortalezas ------------------------------------------------------ */
  { id:"fortalezas", title:"Lo que funciona", kick:"Sección 3", fields:[
    {type:"textarea", key:"f_funciona", q:"¿Qué funciona bien entre vosotros?"},
    {type:"textarea", key:"f_admiro", q:"¿Qué admiras de tu pareja?"},
    {type:"textarea", key:"f_une", q:"¿Qué os une?"},
    {type:"textarea", key:"f_momentos", q:"¿En qué momentos funcionáis mejor?"},
    {type:"textarea", key:"f_noperder", q:"¿Qué no querrías perder?"}
  ]},

  /* 5 · Ciclo de conflicto --------------------------------------------- */
  { id:"ciclo", title:"Un conflicto reciente", kick:"Sección 4", fields:[
    {type:"html", html:'<p class="muted">Piensa en <b>un episodio concreto</b> reciente. Nos ayuda a entender el patrón, no a decidir quién tiene razón.</p>'},
    {type:"textarea", key:"c_ocurrio", q:"¿Qué ocurrió?"},
    {type:"textarea", key:"c_interprete", q:"¿Qué interpretaste / qué te dijiste por dentro?"},
    {type:"text", key:"c_cuerpo", q:"¿Qué notaste en tu cuerpo?"},
    {type:"text", key:"c_emocion", q:"¿Qué emoción apareció?"},
    {type:"text", key:"c_temiste", q:"¿Qué temiste?"},
    {type:"text", key:"c_necesitabas", q:"¿Qué necesitabas en ese momento?"},
    {type:"text", key:"c_impulso", q:"¿Qué impulso apareció (lo que te salía hacer)?"},
    {type:"textarea", key:"c_hiciste", q:"¿Qué hiciste finalmente?"},
    {type:"textarea", key:"c_pareja", q:"¿Qué hizo tu pareja?"},
    {type:"textarea", key:"c_despues", q:"¿Qué ocurrió después?"},
    {type:"text", key:"c_termino", q:"¿En qué terminó?"}
  ]},

  /* 6 · Mi manera de protegerme ---------------------------------------- */
  { id:"proteccion", title:"Mi manera de protegerme", kick:"Sección 5", fields:[
    {type:"checks", key:"p_estrategias", q:"Cuando el conflicto aprieta, ¿qué sueles hacer? (marca las que te representen)",
      opts:PROTECCIONES.map(function(x){return [x,x];})},
    {type:"textarea", key:"p_evita", q:"Cuando haces eso, ¿qué intentas evitar o proteger?"}
  ]},

  /* 7 · Experiencia interna (TEC/AIS) ---------------------------------- */
  { id:"tec", title:"Cómo me acompaño por dentro", kick:"Sección 6", fields:[
    {type:"html", html:'<div class="note">Este bloque explora, de forma orientativa, cómo vives por dentro la activación emocional. <b>No es un diagnóstico</b> ni una prueba; es un modelo clínico en desarrollo (TEC — Teoría del Efecto Consciente) que tu profesional interpretará contigo.</div>'}
  ].concat(scaleFields([
    ["detecto","Cuando me activo, lo noto en el cuerpo",],
    ["permanecer","Puedo quedarme unos segundos sintiéndolo sin reaccionar"],
    ["noReaccionar","Puedo NO reaccionar de inmediato aunque la emoción esté fuerte"],
    ["difSensPens","Distingo la sensación del cuerpo de los pensamientos que la acompañan"],
    ["autoacompano","Puedo acompañarme sin necesitar que mi pareja me tranquilice"],
    ["elijo","Puedo elegir qué hacer aunque la emoción siga presente"]
  ], ["0 · casi nunca","10 · casi siempre"]))},

  /* 8 · Apego y autonomía ---------------------------------------------- */
  { id:"autonomia", title:"Cercanía y autonomía", kick:"Sección 7", fields:[
    {type:"html", html:'<p class="muted">No hay respuestas mejores ni peores. Describe tu tendencia, del 0 al 10.</p>'}
  ].concat(scaleFields([
    ["abandono","Me preocupa que mi pareja pueda dejarme"],
    ["reaseguro","Necesito que me confirme a menudo que todo está bien"],
    ["solo","Me cuesta estar solo/a"],
    ["donde","Necesito saber dónde está o qué hace"],
    ["aprobacion","Dependo de su aprobación para estar tranquilo/a"],
    ["desacuerdo","Me cuesta expresar desacuerdo por miedo a su reacción"],
    ["limites","Me cuesta poner límites"],
    ["identidad","Temo perder mi identidad dentro de la relación"],
    ["evito_intimidad","Evito la intimidad emocional profunda"],
    ["retirada","Cuando aumenta la cercanía, tiendo a retirarme"],
    ["autonomia","Necesito mi espacio y autonomía"],
    ["pedir","Confío en poder pedir apoyo cuando lo necesito"]
  ], ["0 · nada","10 · mucho"]))},

  /* 9 · Empatía --------------------------------------------------------- */
  { id:"empatia", title:"Ponerme en su lugar", kick:"Sección 8", fields:scaleFields([
    ["comprender","Puedo comprender su posición aunque no esté de acuerdo"],
    ["escuchar","Puedo escuchar antes de defenderme"],
    ["detectar","Puedo detectar cuándo está sufriendo"],
    ["validar","Puedo validar su emoción sin aceptar necesariamente su interpretación"]
  ], ["0 · casi nunca","10 · casi siempre"]) },

  /* 10 · Asertividad y límites ----------------------------------------- */
  { id:"asertividad", title:"Decir, pedir, sostener", kick:"Sección 9", fields:scaleFields([
    ["decirNo","Puedo decir no"],
    ["expresar","Puedo expresar una necesidad"],
    ["tolerarNo","Puedo tolerar que mi pareja diga no"],
    ["pedirEspacio","Puedo pedir espacio sin castigar"],
    ["respetar","Respeto el espacio del otro"],
    ["sostener","Puedo mantener un límite aunque se moleste"],
    ["noNegoc","Sé qué cosas son no negociables para mí"]
  ], ["0 · casi nunca","10 · casi siempre"]) },

  /* 11 · Confianza ------------------------------------------------------ */
  { id:"confianza", title:"Confianza", kick:"Sección 10", fields:[
    {type:"html", html:'<p class="muted">No hace falta dar detalles aquí. Del 0 al 10, ¿cómo lo vives?</p>'}
  ].concat(scaleFields([
    ["transparencia","Hay transparencia entre nosotros"],
    ["promesas","Las promesas se cumplen"],
    ["sospecha","Vivo con sospecha o alerta"],
    ["comprobacion","Siento necesidad de comprobar cosas"],
    ["reparacion_c","Cuando algo se rompe, podemos repararlo"]
  ], ["0 · nada","10 · mucho"]), [
    {type:"radio", key:"conf_hablar", q:"Sobre confianza, ¿cómo prefieres continuar?",
      opts:[["cuestionario","Puedo responder aquí"],["psicologa","Prefiero hablar de esto directamente con la psicóloga"]]}
  ])},

  /* 12 · Intimidad y sexualidad ---------------------------------------- */
  { id:"intimidad", title:"Intimidad y sexualidad", kick:"Sección 11", fields:[
    {type:"html", html:'<div class="note">Tema sensible y voluntario. En cada pregunta puedes elegir «Prefiero no responder».</div>'},
    {type:"scalePNA", key:"int_satisf", q:"Satisfacción con la vida íntima"},
    {type:"scalePNA", key:"int_deseo", q:"Nivel de deseo"},

var main = document.getElementById("main");
var pbar = document.getElementById("pbar");
var pcount = document.getElementById("pcount");
var btnPrev = document.getElementById("btnPrev");
var btnNext = document.getElementById("btnNext");

function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function uid(){ return "f"+Math.random().toString(36).slice(2,9); }

function renderField(f){
  if(f.type==="html") return '<div class="field">'+f.html+'</div>';
  if(f.type==="privacy") return ''
    +'<div class="field"><div class="note" style="font-size:14px">'
    +'Por privacidad, tus respuestas se guardan <b>solo en la memoria de este navegador</b> mientras dure la sesión. '
    +'Si cierras la pestaña se borran. Si lo necesitas, al final podrás pulsar «Guardar borrador en este dispositivo».'
    +'</div></div>';

  var id=uid(); var val = f.meta ? STATE.meta[f.key] : STATE.ans[f.key];
  var reqmark = f.required ? ' <span class="req" aria-hidden="true">·</span>' : '';
  var head = f.q ? '<span class="qlabel" id="'+id+'">'+esc(f.q)+reqmark+'</span>' : '';
  var hint = f.hint ? '<div class="hint">'+esc(f.hint)+'</div>' : '';

  // Escala 0–10
  if(f.type==="scale" || f.type==="scalePNA"){
    var ends = f.ends || ["0 · nada","10 · mucho"];
    var btns='';
    for(var i=0;i<=10;i++){ btns+='<button type="button" class="sbtn" data-key="'+f.key+'" data-val="'+i+'" '
      +'aria-pressed="'+(val===i?'true':'false')+'">'+i+'</button>'; }
    var pna = f.type==="scalePNA" ? '<label class="prefna"><input type="checkbox" data-pna="'+f.key+'" '
      +(val==="pna"?'checked':'')+'> Prefiero no responder</label>' : '';
    return '<div class="field" role="group" aria-labelledby="'+id+'">'+head+hint
      +'<div class="scale">'+btns+'</div>'
      +'<div class="scends"><span>'+esc(ends[0])+'</span><span>'+esc(ends[1])+'</span></div>'+pna+'</div>';
  }
  // Texto / textarea
  if(f.type==="text"||f.type==="textarea"){
    var tag = f.type==="textarea"
      ? '<textarea id="'+id+'i" data-key="'+f.key+'" data-meta="'+(f.meta?1:0)+'">'+esc(val||"")+'</textarea>'
      : '<input type="text" id="'+id+'i" data-key="'+f.key+'" data-meta="'+(f.meta?1:0)+'" value="'+esc(val||"")+'">';
    return '<div class="field"><label class="q" for="'+id+'i">'+esc(f.q)+reqmark+'</label>'+hint+tag+'</div>';
  }
  // Radio (una opción)
  if(f.type==="radio"||f.type==="radioMeta"){
    var meta = f.type==="radioMeta";
    var name="r_"+f.key;
    var opts=f.opts.map(function(o){
      var sel=(val===o[0]);
      return '<label class="opt'+(sel?' sel':'')+'"><input type="radio" name="'+name+'" value="'+esc(o[0])+'" '
        +'data-key="'+f.key+'" data-meta="'+(meta?1:0)+'" '+(sel?'checked':'')+'><span class="t">'+esc(o[1])+'</span></label>';
    }).join('');
    return '<div class="field" role="radiogroup" aria-labelledby="'+id+'">'+head+hint+'<div class="opts">'+opts+'</div></div>';
  }
  // Checks (varias opciones)
  if(f.type==="checks"){
    var arr = (f.secRisk? (STATE.ans.seguridad&&STATE.ans.seguridad.riesgo) : STATE.ans[f.key]) || [];
    var opts2=f.opts.map(function(o){
      var sel=arr.indexOf(o[0])>=0;
      return '<label class="opt'+(sel?' sel':'')+'"><input type="checkbox" value="'+esc(o[0])+'" '
        +'data-checks="'+f.key+'" '+(f.secRisk?'data-secrisk="1"':'')+(f.max?' data-max="'+f.max+'"':'')+' '
        +(sel?'checked':'')+'><span class="t">'+esc(o[1])+'</span></label>';
    }).join('');
    return '<div class="field" role="group" aria-labelledby="'+id+'">'+head+hint+'<div class="opts">'+opts2+'</div></div>';
  }
  // Grupo de seguridad
  if(f.type==="secGroup"){
    STATE.ans.seguridad = STATE.ans.seguridad || {};
    var g = SECURITY.map(function(q){
      var cur = STATE.ans.seguridad[q.key];
      var opts3 = SEC_OPTS.map(function(lbl,ix){
        var sel = cur===ix;
        return '<label class="opt'+(sel?' sel':'')+'" style="flex:1 1 46%"><input type="radio" name="sec_'+q.key+'" '
          +'data-sec="'+q.key+'" value="'+ix+'" '+(sel?'checked':'')+'><span class="t">'+esc(lbl)+'</span></label>';
      }).join('');
      return '<fieldset style="border:none;padding:0;margin:0 0 14px"><legend class="qlabel" style="padding:0">'+esc(q.t)+'</legend>'
        +'<div class="opts row">'+opts3+'</div></fieldset>';
    }).join('');
    return '<div class="field">'+g+'</div>';
  }
  // Rejilla del modelo de pareja
  if(f.type==="modelGrid"){
    STATE.ans.modelo = STATE.ans.modelo || {};
    var rows = DIMS.map(function(d){
      var m = STATE.ans.modelo[d[0]] || {};
      return '<div class="card" style="margin:10px 0;padding:14px">'
        +'<div style="font-weight:700;margin-bottom:8px">'+esc(d[1])+'</div>'
        +'<label class="q" style="font-weight:500;font-size:15px">¿Qué necesito?</label>'
        +'<input type="text" data-model="'+d[0]+'" data-slot="necesito" value="'+esc(m.necesito||"")+'">'
        +'<label class="q" style="font-weight:500;font-size:15px;margin-top:8px">¿Qué deseo (idealmente)?</label>'
        +'<input type="text" data-model="'+d[0]+'" data-slot="deseo" value="'+esc(m.deseo||"")+'">'
        +'<label class="q" style="font-weight:500;font-size:15px;margin-top:8px">¿Qué puedo negociar?</label>'
        +'<input type="text" data-model="'+d[0]+'" data-slot="negociable" value="'+esc(m.negociable||"")+'">'
        +'<label class="q" style="font-weight:500;font-size:15px;margin-top:8px">¿Qué no puedo aceptar?</label>'
        +'<input type="text" data-model="'+d[0]+'" data-slot="noAcepto" value="'+esc(m.noAcepto||"")+'">'
        +'</div>';
    }).join('');
    return '<div class="field">'+rows+'</div>';
  }
  return '';
}

function renderStep(){
  var sec = SECTIONS[STEP];
  var html = '';
  if(sec.kick) html += '<div class="kick">'+esc(sec.kick)+'</div>';
  html += '<h1>'+esc(sec.title)+'</h1>';
  if(sec.final){ main.innerHTML = renderFinal(); afterRender(); return; }
  sec.fields.forEach(function(f){ html += renderField(f); });
  main.innerHTML = html;
  afterRender();
}

function afterRender(){
  // progreso
  var total = SECTIONS.length;
  var pct = Math.round((STEP)/(total-1)*100);
  pbar.style.width = pct+"%";
  document.querySelector(".progress").setAttribute("aria-valuenow", String(pct));
  pcount.textContent = (STEP+1)+" / "+total;
  btnPrev.disabled = (STEP===0);
  btnNext.textContent = (STEP>=SECTIONS.length-2) ? "Ver mi resumen ›" : "Continuar ›";
  if(SECTIONS[STEP].final) document.getElementById("nav").classList.add("hide");
  else document.getElementById("nav").classList.remove("hide");
  window.scrollTo(0,0);
  wireInputs();
}

/* ==========================================================================
   RECOGIDA DE DATOS (event delegation)
   ========================================================================== */
function wireInputs(){
  // Escalas
  Array.prototype.forEach.call(main.querySelectorAll(".sbtn"), function(b){
    b.addEventListener("click", function(){
      var k=b.getAttribute("data-key"), v=parseInt(b.getAttribute("data-val"),10);
      STATE.ans[k]=v;
      var group=b.parentNode;
      Array.prototype.forEach.call(group.querySelectorAll(".sbtn"), function(x){
        x.setAttribute("aria-pressed", x===b?"true":"false"); });
      // si había "prefiero no responder", desmarcar
      var pna=main.querySelector('[data-pna="'+k+'"]'); if(pna) pna.checked=false;
    });
  });
  Array.prototype.forEach.call(main.querySelectorAll("[data-pna]"), function(c){
    c.addEventListener("change", function(){
      var k=c.getAttribute("data-pna");
      if(c.checked){ STATE.ans[k]="pna";
        var g=main.querySelectorAll('.sbtn[data-key="'+k+'"]');
        Array.prototype.forEach.call(g,function(x){x.setAttribute("aria-pressed","false");});
      } else { delete STATE.ans[k]; }
    });
  });
  // Texto/textarea
  Array.prototype.forEach.call(main.querySelectorAll("[data-key]"), function(el){
    if(el.classList.contains("sbtn")) return;
    if(el.tagName==="INPUT" && el.type==="text" || el.tagName==="TEXTAREA"){
      el.addEventListener("input", function(){
        var k=el.getAttribute("data-key"); var meta=el.getAttribute("data-meta")==="1";
        (meta?STATE.meta:STATE.ans)[k]=el.value;
      });
    }
  });
  // Radios
  Array.prototype.forEach.call(main.querySelectorAll('input[type=radio][data-key]'), function(r){
    r.addEventListener("change", function(){
      var k=r.getAttribute("data-key"), meta=r.getAttribute("data-meta")==="1";
      (meta?STATE.meta:STATE.ans)[k]=r.value; markOpt(r);
    });
  });
  // Seguridad radios
  Array.prototype.forEach.call(main.querySelectorAll('input[data-sec]'), function(r){
    r.addEventListener("change", function(){
      STATE.ans.seguridad=STATE.ans.seguridad||{};
      STATE.ans.seguridad[r.getAttribute("data-sec")]=parseInt(r.value,10); markOpt(r);
    });
  });
  // Checkboxes
  Array.prototype.forEach.call(main.querySelectorAll('input[type=checkbox][data-checks]'), function(c){
    c.addEventListener("change", function(){
      var k=c.getAttribute("data-checks"); var secrisk=c.getAttribute("data-secrisk")==="1";
      var max=c.getAttribute("data-max"); max=max?parseInt(max,10):0;
      var store, arr;
      if(secrisk){ STATE.ans.seguridad=STATE.ans.seguridad||{}; store=STATE.ans.seguridad; arr=store.riesgo=store.riesgo||[]; }
      else { arr=STATE.ans[k]=STATE.ans[k]||[]; }
      var v=c.value; var i=arr.indexOf(v);
      // "ninguna" exclusivo
      if(c.checked){
        if(v==="ninguna"){ arr.length=0; }
        else { var ni=arr.indexOf("ninguna"); if(ni>=0) arr.splice(ni,1); }
        if(max && arr.length>=max){ c.checked=false; return; }
        if(i<0) arr.push(v);
      } else { if(i>=0) arr.splice(i,1); }
      if(secrisk) STATE.ans.seguridad.riesgo=arr; else STATE.ans[k]=arr;
      markOpt(c);
      // refrescar exclusividad visual
      if(v==="ninguna" && c.checked){ renderStep(); }
    });
  });
  // Modelo de pareja
  Array.prototype.forEach.call(main.querySelectorAll('input[data-model]'), function(el){
    el.addEventListener("input", function(){
      var d=el.getAttribute("data-model"), slot=el.getAttribute("data-slot");
      STATE.ans.modelo=STATE.ans.modelo||{}; STATE.ans.modelo[d]=STATE.ans.modelo[d]||{};
      STATE.ans.modelo[d][slot]=el.value;
    });
  });
}
function markOpt(input){
  var opt=input.closest(".opt"); if(!opt) return;
  if(input.type==="radio"){
    var name=input.name;
    Array.prototype.forEach.call(document.getElementsByName(name),function(r){
      var o=r.closest(".opt"); if(o) o.classList.toggle("sel", r.checked);
    });
  } else { opt.classList.toggle("sel", input.checked); }
}

/* ==========================================================================
   VALIDACIÓN mínima (solo lo imprescindible: código de pareja y miembro)
   ========================================================================== */
function validateStep(){
  var sec=SECTIONS[STEP];
  var miss=[];
  sec.fields.forEach(function(f){
    if(f.required){
      var v=f.meta?STATE.meta[f.key]:STATE.ans[f.key];
      if(!v || (typeof v==="string" && !v.trim())) miss.push(f.q);
    }
  });
  if(miss.length){ alert("Para continuar, completa:\n· "+miss.join("\n· ")); return false; }
  return true;
}

/* ==========================================================================
   OBJETIVOS → borradores operativos (deterministas, editables por la psicóloga)
   ========================================================================== */
function draftGoal(raw){
  if(!raw || !raw.trim()) return null;
  var t=raw.toLowerCase();
  var map=[
    [/(discut|pele|grit|insult|escala)/, "Aprender a detener la escalada y mantener conversaciones difíciles sin insultos, amenazas ni retirada punitiva."],
    [/(comunic|hablar|escuch|entend)/, "Mejorar la comunicación: expresar necesidades en primera persona y escuchar sin interrumpir ni defenderme de inmediato."],
    [/(confian|celos|comprob|sospech|infidel)/, "Reconstruir la confianza con acuerdos concretos de transparencia y reduciendo conductas de comprobación."],
    [/(límit|limite|respet|espacio)/, "Aprender a poner y sostener límites con respeto, y a tolerar los límites del otro."],
    [/(autonom|dependen|solo|libertad)/, "Ampliar mi autonomía emocional: acompañar lo que siento sin necesitar que mi pareja regule mi estado."],
    [/(sex|íntim|intim|deseo)/, "Poder hablar de intimidad y sexualidad con seguridad y sin presión, acercando expectativas."],
    [/(cariñ|afecto|distan|frí|fri)/, "Recuperar gestos de afecto cotidianos y momentos compartidos de calidad."],
    [/(decid|separ|segui|continu|futur)/, "Clarificar, con acompañamiento profesional, qué proyecto de relación queremos y qué pasos concretos lo sostienen."]
  ];
  for(var i=0;i<map.length;i++){ if(map[i][0].test(t)) return map[i][1]; }
  return "Concretar este objetivo en conductas observables y evaluables (a definir con la psicóloga).";
}

/* ==========================================================================

      motivo:a.ctx_motivo, desde:a.ctx_desde, quienPropuso:a.ctx_quien, espera:a.ctx_espera },
    escalas:pick(a,["satisfaccion","seguridad","confianza","respeto","libertad","comunicacion","apoyo",
      "afecto","intimidad","sexualidad","cooperacion","admiracion","proyecto","limites","reparacion"]),
    cambiar3:a.cambiar3,
    fortalezas:{ funciona:a.f_funciona, admiro:a.f_admiro, une:a.f_une, momentos:a.f_momentos, noPerder:a.f_noperder },
    ciclo:{ ocurrio:a.c_ocurrio, interprete:a.c_interprete, cuerpo:a.c_cuerpo, emocion:a.c_emocion,
      temiste:a.c_temiste, necesitabas:a.c_necesitabas, impulso:a.c_impulso, hiciste:a.c_hiciste,
      pareja:a.c_pareja, despues:a.c_despues, termino:a.c_termino },
    proteccion:{ estrategias:a.p_estrategias||[], evita:a.p_evita },
    tec:pick(a,["detecto","permanecer","noReaccionar","difSensPens","autoacompano","elijo"]),
    autonomia:pick(a,["abandono","reaseguro","solo","donde","aprobacion","desacuerdo","limites",
      "identidad","evito_intimidad","retirada","autonomia","pedir"]),
    empatia:pick(a,["comprender","escuchar","detectar","validar"]),
    asertividad:pick(a,["decirNo","expresar","tolerarNo","pedirEspacio","respetar","sostener","noNegoc"]),
    confianza:{ escalas:pick(a,["transparencia","promesas","sospecha","comprobacion","reparacion_c"]),
      preferencia:a.conf_hablar },
    intimidad:{ satisf:a.int_satisf, deseo:a.int_deseo, hablar:a.int_hablar, presion:a.int_presion,
      afecto:a.int_afecto, discrepancias:a.int_discrepancias },
    modeloPareja:a.modelo||{},
    valores:{ seleccionados:(a.val_sel||[]).concat(a.val_otro&&a.val_otro.trim()?[a.val_otro.trim()]:[]),
      alejamiento:a.val_alejo },
    continuidad:{ reconstruir:a.cont_reconstruir, esperanza:a.cont_esperanza, compromiso:a.cont_compromiso,
      dudas:a.cont_dudas, cambiar:a.cont_cambiar, dependeMi:a.cont_yo, necesitaPareja:a.cont_pareja },
    objetivos:objetivos,
    // BLOQUE PRIVADO: solo para la psicóloga; el panel lo aísla y nunca lo muestra a la otra parte.
    seguridad:{ nivel:sec.level, requiereValoracion:sec.requiereValoracion, senales:sec.flags, respuestas:a.seguridad||{} }
  };
}
function pick(o,keys){ var r={}; keys.forEach(function(k){ if(o[k]!==undefined) r[k]=o[k]; }); return r; }

/* ==========================================================================
   VISTA FINAL (personal + profesional) + mensaje de seguridad
   ========================================================================== */
function renderFinal(){
  var data=buildData();
  var sec=evalSecurity();
  var a=STATE.ans;

  // Mensaje de seguridad (sin instrucciones que aumenten riesgo)
  var secBlock='';
  if(sec.requiereValoracion){
    secBlock='<div class="card danger"><b>Antes de continuar</b><p style="margin:.4em 0">Algunas de tus respuestas indican que, antes de continuar con una evaluación conjunta, sería conveniente realizar una valoración profesional individual de seguridad. Coméntalo con tu psicóloga cuando os veáis; ella sabrá cómo acompañarte.</p></div>';
  }

  // Resumen amable (SIN etiquetas, SIN seguridad, SIN interpretaciones)
  var fort=[]; ["f_funciona","f_admiro","f_une","f_momentos","f_noperder"].forEach(function(k){ if(a[k]&&a[k].trim()) fort.push(a[k].trim()); });
  var vals=(data.valores.seleccionados||[]);
  var objs=data.objetivos.map(function(o){return o.expresado;});
  var areas=[]; if(a.cambiar3&&a.cambiar3.trim()) areas.push(a.cambiar3.trim());
  if(a.cont_cambiar&&a.cont_cambiar.trim()) areas.push(a.cont_cambiar.trim());

  var personal='<div class="card"><div class="kick" style="margin-top:0">Tu resumen</div>'
    +'<p class="lead">Gracias por tu tiempo y tu sinceridad. Esto es un pequeño reflejo de lo que has compartido; lo importante lo trabajaréis con tu psicóloga.</p>'
    +block("Fortalezas que has nombrado", fort)
    +block("Áreas que te gustaría trabajar", areas)
    +block("Cómo quieres estar en los momentos difíciles", vals)
    +block("Lo que te gustaría conseguir", objs)
    +'</div>';

  // Vista profesional
  var json=JSON.stringify(data,null,1);
  var prof='<div class="card"><div class="kick" style="margin-top:0">Para tu psicóloga</div>'
    +'<div class="note warn" style="font-size:14px">Este bloque contiene información personal. Envíalo <b>únicamente</b> a tu profesional por el canal que hayáis acordado.</div>'
    +'<pre class="data" id="paydata" aria-label="Datos para la psicóloga">'+esc(json)+'</pre>'
    +'<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:12px">'
    +'<button class="btn primary" id="btnCopy" type="button" style="flex:1">Copiar para mi psicóloga</button>'
    +'<button class="btn ghost" id="btnDraft" type="button">Guardar borrador en este dispositivo</button>'
    +'</div>'
    +'<p class="hint" id="copymsg" role="status" aria-live="polite"></p>'
    +'<button class="link" id="btnRestart" type="button" style="margin-top:8px">Empezar de nuevo (borra todo)</button>'
    +'</div>';

  return '<div class="kick">Evaluación completada</div><h1>Ya casi está</h1>'
    + secBlock + personal + prof;
}
function block(title, arr){
  if(!arr || !arr.length) return '';
  return '<div style="margin-top:12px"><div style="font-weight:700">'+esc(title)+'</div><ul class="clean">'
    + arr.map(function(x){return '<li>'+esc(x)+'</li>';}).join('') + '</ul></div>';
}

/* ==========================================================================
   ACCIONES vista final
   ========================================================================== */
main.addEventListener("click", function(e){
  var t=e.target;
  if(t.id==="btnCopy"){ doCopy(); }
  if(t.id==="btnDraft"){ saveDraft(); }
  if(t.id==="btnRestart"){ restart(); }
});
function doCopy(){
  var txt=document.getElementById("paydata").textContent;
  var msg=document.getElementById("copymsg");
  function ok(){ msg.textContent="Copiado. Ya puedes pegarlo donde tu psicóloga te haya indicado."; }
  function fail(){ msg.textContent="No se pudo copiar automáticamente. Mantén pulsado el texto y cópialo a mano."; }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(ok, function(){ legacyCopy(txt)?ok():fail(); });
  } else { legacyCopy(txt)?ok():fail(); }
}
function legacyCopy(txt){
  try{ var ta=document.createElement("textarea"); ta.value=txt; ta.setAttribute("readonly","");
    ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select();
    var ok=document.execCommand("copy"); document.body.removeChild(ta); return ok; }catch(e){ return false; }
}
function saveDraft(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify({meta:STATE.meta, ans:STATE.ans}));
    document.getElementById("copymsg").textContent="Borrador guardado en este dispositivo. Podrás recuperarlo al reabrir esta página en este navegador.";
  }catch(e){ document.getElementById("copymsg").textContent="No se pudo guardar el borrador en este navegador."; }
}
function restart(){
  if(!confirm("¿Seguro? Se borrarán todas tus respuestas de esta sesión (y el borrador guardado, si existe).")) return;
  try{ localStorage.removeItem(LS_KEY); }catch(e){}
  STATE={meta:{},ans:{}}; STEP=0; renderStep();
}

/* ==========================================================================
   NAVEGACIÓN
   ========================================================================== */
btnNext.addEventListener("click", function(){
  if(!validateStep()) return;
  if(STEP<SECTIONS.length-1){ STEP++; renderStep(); }
});
btnPrev.addEventListener("click", function(){ if(STEP>0){ STEP--; renderStep(); } });
document.addEventListener("keydown", function(e){
  if(e.altKey && e.key==="ArrowRight"){ btnNext.click(); }
  if(e.altKey && e.key==="ArrowLeft"){ btnPrev.click(); }
});

/* ==========================================================================
   ARRANQUE — ofrecer recuperar borrador si existe (opt-in previo)
   ========================================================================== */
(function init(){
  var draft=null;
  try{ var raw=localStorage.getItem(LS_KEY); if(raw) draft=JSON.parse(raw); }catch(e){}
  if(draft && draft.ans){
    if(confirm("Hemos encontrado un borrador guardado en este dispositivo. ¿Quieres recuperarlo?")){
      STATE.meta=draft.meta||{}; STATE.ans=draft.ans||{};
    } else { try{ localStorage.removeItem(LS_KEY); }catch(e){} }
  }
  renderStep();
})();
</script>
