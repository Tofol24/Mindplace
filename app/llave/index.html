<!DOCTYPE html>
<!--
  LA LLAVE DE PASO · APRENS
  Fontanero autónomo · cuadro ansioso-depresivo de larga evolución.
  Entrenamiento TEC-AIS en los momentos reales de su jornada:
  antes de bajar de la furgoneta, al volver a subir, y antes de entrar en casa.
  Respiración curiosa con anclaje en la barriga (densidad), parada de pensamiento
  y pausa antes de contestar al cliente (latencia), bandeja para la carga
  administrativa, límites, honestidad emocional con tono sereno y abrazo sentido.
  Informe diario para enviar al psicólogo por WhatsApp.
  Standalone · sin recursos externos (CSP) · datos solo en el dispositivo.
-->
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#b0703c">
<title>La llave de paso · APRENS</title>
<script>if(window.top!==window.self)document.documentElement.classList.add("embed");</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-512.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="La llave de paso">
<style>
  :root{
    --bg:#f3f0ea; --bg2:#eae5da; --card:#fffdf9; --tinta:#28251f; --suau:#756d61;
    --cobre:#b0703c; --cobre-d:#8a5427; --cobre-lt:#f4e4d2;
    --agua:#2f7f93; --agua-d:#215f6e; --agua-lt:#dcecf0;
    --verde:#4f8a66; --verde-d:#39674c; --verde-lt:#e2efe6;
    --alerta:#a9564e; --alerta-lt:#f6e5e2;
    --pizarra:#4b5b66; --pizarra-d:#374751; --pizarra-lt:#dfe6ea;
    --oro:#a9781f; --linia:#e6ddcd; --linia2:#dbcfb9;
    --ombra:0 8px 26px rgba(90,70,30,.10); --ombra-s:0 2px 12px rgba(90,70,30,.07);
    --serif:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,'Times New Roman',serif;
    --r:18px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:linear-gradient(180deg,#eae5da 0%,var(--bg) 240px);color:var(--tinta);line-height:1.55;font-size:16.5px;
    -webkit-font-smoothing:antialiased;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
  .wrap{max-width:620px;margin:0 auto;padding:0 15px}

  .top{position:sticky;top:0;z-index:40;background:linear-gradient(180deg,var(--bg) 62%,rgba(243,240,234,0));padding:12px 15px 10px;display:flex;align-items:center;gap:10px;max-width:620px;margin:0 auto}
  .logo{width:33px;height:33px;border-radius:50%;background:var(--cobre);color:#fff;display:grid;place-items:center;font-weight:700;font-family:var(--serif);font-size:12px;flex:0 0 auto}
  .top .tt{font-family:var(--serif);font-weight:700;font-size:15.5px;line-height:1.05}
  .top .ts{font-size:10px;color:var(--suau)}
  .top .sp{margin-left:auto}
  .iconbtn{background:var(--card);border:1px solid var(--linia);color:var(--tinta);min-width:38px;height:38px;border-radius:11px;cursor:pointer;font-size:12.5px;font-weight:600;padding:0 11px;font-family:inherit}
  .iconbtn.stop{border-color:#dcb4af;color:var(--alerta)}
  .lang{display:inline-flex;border:1px solid var(--linia);border-radius:999px;overflow:hidden;background:var(--card);box-shadow:var(--ombra-s);flex:0 0 auto}
  .lang button{border:0;background:transparent;font-family:inherit;font-size:11.5px;font-weight:700;letter-spacing:.05em;padding:8px 11px;cursor:pointer;color:var(--suau);min-height:38px}
  .lang button.on{background:var(--cobre);color:#fff}
  /* Embebida en el hub de APRENS: el hub ya pone logo, titulo y "Atras".
     Se oculta el duplicado y se conserva el boton "Parar" siempre accesible. */
  .embed .top{padding:7px 15px 4px}
  .embed .top .logo,.embed .top .tw{display:none}

  h1.view-t{font-family:var(--serif);font-size:24px;margin:8px 0 2px;font-weight:700;line-height:1.18}
  .view-s{color:var(--suau);font-size:14.5px;margin:0 0 14px}
  .kick{display:inline-block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--cobre-d);background:var(--cobre-lt);border:1px solid var(--linia);padding:5px 12px;border-radius:999px;font-weight:600;margin:6px 0}

  .card{background:var(--card);border:1px solid var(--linia);border-radius:var(--r);padding:18px 16px;margin:14px 0;box-shadow:var(--ombra-s)}
  .card h2{font-family:var(--serif);font-size:18px;margin:0 0 6px;display:flex;align-items:center;gap:9px;line-height:1.25}
  .card h2 .e{font-size:20px;flex:0 0 auto}
  .card .lead{color:var(--suau);font-size:14px;margin:2px 0 10px}
  .muted{color:var(--suau);font-size:13.5px}
  .quote{font-family:var(--serif);font-style:italic;color:var(--cobre-d);background:var(--cobre-lt);border-left:4px solid var(--oro);border-radius:0 12px 12px 0;padding:12px 15px;margin:12px 0;font-size:15.5px;line-height:1.5}
  .nota{font-size:13px;color:var(--suau);background:var(--bg2);border-radius:12px;padding:11px 13px;margin:10px 0;line-height:1.5}
  .nota b{color:var(--tinta)}

  /* Botones grandes de acción */
  .big{display:flex;align-items:center;gap:14px;width:100%;border:0;border-radius:18px;cursor:pointer;font-family:inherit;
    padding:19px 17px;margin:11px 0;text-align:left;color:#fff;box-shadow:var(--ombra-s);transition:transform .07s}
  .big:active{transform:scale(.99)}
  .big .bi{font-size:29px;flex:0 0 auto}
  .big .bt{display:block;font-weight:700;font-size:17.5px;line-height:1.15}
  .big .bd{display:block;font-size:12.5px;opacity:.93;font-weight:400;margin-top:3px;line-height:1.35}
  .big.cobre{background:linear-gradient(150deg,var(--cobre),#965d2c)}
  .big.agua{background:linear-gradient(150deg,var(--agua),#256b7c)}
  .big.verde{background:linear-gradient(150deg,var(--verde),#417458)}
  .big.slate{background:linear-gradient(150deg,var(--pizarra),#3d4d57)}

  .quick{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin:13px 0}
  .qb{background:var(--card);border:1.5px solid var(--linia2);border-radius:14px;padding:12px 6px;cursor:pointer;font-family:inherit;text-align:center;color:var(--tinta);transition:transform .07s}
  .qb:active{transform:scale(.97)}
  .qb .qe{font-size:22px;display:block;margin-bottom:3px}
  .qb .ql{font-size:11.5px;font-weight:600;line-height:1.25;display:block}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:13px;background:var(--cobre);color:#fff;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;padding:14px 18px;min-height:50px;transition:transform .07s}
  .btn:active{transform:scale(.98)}
  .btn.full{width:100%}
  .btn.ghost{background:transparent;color:var(--cobre-d);border:1.5px solid var(--cobre)}
  .btn.agua{background:var(--agua)}
  .btn.verde{background:var(--verde)}
  .btn.slate{background:var(--pizarra)}
  .btn.wa{background:#1f9e53}
  .btn.sm{padding:9px 14px;min-height:42px;font-size:13.5px;border-radius:11px}
  .btn.danger{background:var(--alerta)}
  .btn[disabled]{opacity:.5}
  .btnrow{display:flex;gap:9px;flex-wrap:wrap}.btnrow .btn{flex:1}
  .btn:focus-visible,.big:focus-visible,.chip:focus-visible,.scaleb:focus-visible,.tab:focus-visible,.qb:focus-visible{outline:3px solid var(--oro);outline-offset:2px}
  .link{background:none;border:0;color:var(--cobre-d);text-decoration:underline;cursor:pointer;font-family:inherit;font-size:13.5px;padding:8px 4px;min-height:40px}

  .stat3{display:flex;gap:9px;text-align:center;flex-wrap:wrap}
  .stat3>div{flex:1;min-width:76px;background:var(--cobre-lt);border:1px solid var(--linia);border-radius:13px;padding:12px 6px}
  .stat3 b{display:block;font-family:var(--serif);font-size:24px;color:var(--cobre-d);line-height:1}
  .stat3 span{font-size:10.5px;color:var(--suau);line-height:1.3;display:block;margin-top:3px}
  .stat3>div.a{background:var(--agua-lt)} .stat3>div.a b{color:var(--agua-d)}
  .stat3>div.v{background:var(--verde-lt)} .stat3>div.v b{color:var(--verde-d)}

  /* Anillo de respiración */
  .ring-wrap{display:flex;flex-direction:column;align-items:center;margin:14px 0}
  .ring{width:190px;height:190px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 50% 42%,var(--agua-lt),#bcd9e0);box-shadow:inset 0 0 0 2px rgba(47,127,147,.25);transition:transform 1s ease-in-out}
  .ring .ri{width:126px;height:126px;border-radius:50%;background:var(--card);display:grid;place-items:center;text-align:center;box-shadow:var(--ombra-s);padding:8px}
  .ring .rf{font-family:var(--serif);font-size:21px;color:var(--agua-d)}
  .ring .rs{font-size:12px;color:var(--suau);margin-top:2px}
  .rverb{font-family:var(--serif);font-style:italic;color:var(--agua-d);text-align:center;font-size:15.5px;margin:12px auto 2px;max-width:23em;min-height:3.4em;line-height:1.42;transition:opacity .4s}

  /* Manómetro */
  .mano{display:block;margin:4px auto 2px;max-width:230px}
  .mano-lbl{text-align:center;font-size:13px;color:var(--suau);margin-top:-6px}

  /* Chips / escalas */
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{flex:1 1 auto;min-width:92px;min-height:48px;border:1.5px solid var(--linia2);border-radius:13px;background:var(--card);cursor:pointer;font-family:inherit;font-size:14px;color:var(--tinta);padding:10px 12px;display:flex;align-items:center;justify-content:center;gap:6px;text-align:center;line-height:1.22}
  .chip.sel{border-width:2px;font-weight:600}
  .chip.sel[data-pole="mal"]{background:var(--alerta-lt);border-color:var(--alerta);color:#8d403a}
  .chip.sel[data-pole="mid"]{background:#f6edd2;border-color:var(--oro);color:var(--cobre-d)}
  .chip.sel[data-pole="bien"]{background:var(--verde-lt);border-color:var(--verde);color:var(--verde-d)}
  .chip.sel:not([data-pole]){background:var(--cobre-lt);border-color:var(--cobre);color:var(--cobre-d)}
  .scale{display:flex;gap:4px}
  .scaleb{flex:1;min-width:0;min-height:46px;border:1.5px solid var(--linia2);border-radius:11px;background:var(--card);cursor:pointer;font-family:inherit;font-weight:700;font-size:15px;color:var(--suau);padding:0}
  .scaleb.sel{background:var(--cobre);border-color:var(--cobre);color:#fff}
  .scaleb.sel.a{background:var(--agua);border-color:var(--agua)}
  .scale-ends{display:flex;justify-content:space-between;font-size:12px;color:var(--suau);margin-top:5px}
  input[type=text],textarea{width:100%;border:1.5px solid var(--linia2);border-radius:12px;padding:11px 12px;font-family:inherit;font-size:15px;color:var(--tinta);background:var(--card)}
  textarea{resize:vertical;min-height:58px;line-height:1.5}
  input:focus,textarea:focus{outline:none;border-color:var(--cobre)}
  label.fld{display:block;font-size:13px;color:var(--suau);margin:10px 0 4px;font-weight:600}
  .ok-flash{background:var(--verde-lt);border:1px solid var(--verde);color:var(--verde-d);border-radius:12px;padding:13px 15px;margin:12px 0;font-size:14px;display:none}
  .ok-flash.show{display:block;animation:fade .3s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  .two{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin:8px 0}
  @media(max-width:430px){.two{grid-template-columns:1fr}}
  @media(max-width:340px){.quick{grid-template-columns:1fr 1fr}}
  .col{border-radius:13px;padding:13px;font-size:13px;line-height:1.45}
  .col.bien{background:var(--verde-lt);border:1px solid #cfe0d4}
  .col.mal{background:var(--alerta-lt);border:1px solid #e6cdc9}
  .col h4{margin:0 0 6px;font-size:13.5px}.col.bien h4{color:var(--verde-d)}.col.mal h4{color:#8d403a}
  .col ul{margin:0;padding-left:16px}.col li{margin:3px 0}

  .verb{display:flex;gap:9px;align-items:flex-start;background:var(--agua-lt);border:1px solid #c9dee4;border-radius:13px;padding:11px 12px;margin:7px 0}
  .verb .vt{flex:1;font-family:var(--serif);font-style:italic;color:var(--agua-d);font-size:15px;line-height:1.42}
  .verb .va{display:flex;gap:3px;flex:0 0 auto}
  .verb .va button{background:none;border:0;cursor:pointer;font-size:15px;padding:3px;min-height:34px}
  .fav-on{color:var(--oro)}

  .rec{background:var(--card);border:1px solid var(--linia);border-radius:13px;padding:11px 13px;margin:9px 0}
  .rec .rh{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .rec .rd{font-size:11.5px;color:var(--suau)}
  .rec .rb{font-size:13px;color:var(--suau);margin-top:5px;line-height:1.5}
  .empty{color:var(--suau);font-style:italic;font-size:13.5px;padding:8px 0}

  /* Bandeja */
  .item{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--linia);border-radius:13px;padding:10px 12px;margin:8px 0}
  .item.done{opacity:.5}
  .item.done .it{text-decoration:line-through}
  .item .ic{font-size:19px;flex:0 0 auto}
  .item .it{flex:1;font-size:14.5px;line-height:1.35;word-break:break-word}
  .item .ib{background:none;border:0;cursor:pointer;font-size:17px;padding:5px;min-height:38px;min-width:34px;color:var(--suau)}
  .item .ib.ok{color:var(--verde)}
  .catrow{display:flex;gap:6px;flex-wrap:wrap;margin:9px 0}
  .cat{border:1.5px solid var(--linia2);background:var(--card);border-radius:999px;padding:7px 13px;font-size:13px;font-family:inherit;cursor:pointer;color:var(--tinta);min-height:40px}
  .cat.sel{background:var(--cobre-lt);border-color:var(--cobre);color:var(--cobre-d);font-weight:600}

  /* Pasos numerados */
  .steps{counter-reset:s;padding:0;margin:10px 0;list-style:none}
  .steps li{counter-increment:s;position:relative;padding:9px 0 9px 40px;font-size:14.5px;line-height:1.48;border-bottom:1px solid var(--bg2)}
  .steps li:last-child{border-bottom:0}
  .steps li::before{content:counter(s);position:absolute;left:0;top:9px;width:26px;height:26px;border-radius:50%;background:var(--agua-lt);color:var(--agua-d);font-weight:700;font-size:13px;display:grid;place-items:center;font-family:var(--serif)}

  .ldc{display:flex;gap:8px;text-align:center;margin:10px 0}
  .ldc>div{flex:1;border-radius:13px;padding:11px 5px;border:1px solid var(--linia)}
  .ldc b{display:block;font-family:var(--serif);font-size:21px;line-height:1.1}
  .ldc span{font-size:10px;color:var(--suau);display:block;margin-top:3px;line-height:1.3}
  .ldc .L{background:var(--agua-lt)} .ldc .L b{color:var(--agua-d)}
  .ldc .D{background:var(--cobre-lt)} .ldc .D b{color:var(--cobre-d)}
  .ldc .C{background:var(--verde-lt)} .ldc .C b{color:var(--verde-d)}

  .msgbox{background:var(--bg2);border:1.5px solid var(--linia);border-radius:12px;padding:13px;font-size:12.5px;line-height:1.7;color:#3a352c;max-height:250px;overflow-y:auto;white-space:pre-wrap;word-break:break-word;margin:11px 0;-webkit-user-select:all;user-select:all}

  .stopcard{background:var(--alerta-lt);border:1.5px solid #dcb4af;border-radius:var(--r);padding:18px 16px;margin:14px 0}
  .stopcard h2{color:#8d403a}
  .callbtn{display:flex;align-items:center;gap:11px;width:100%;border:1.5px solid #dcb4af;background:var(--card);border-radius:14px;padding:14px 15px;margin:9px 0;cursor:pointer;font-family:inherit;font-size:15.5px;font-weight:600;color:var(--tinta);text-decoration:none;text-align:left}
  .callbtn .ce{font-size:22px}
  .callbtn small{display:block;font-weight:400;font-size:12px;color:var(--suau);margin-top:2px}

  footer{text-align:center;color:var(--suau);font-size:12px;margin:26px 0 10px;line-height:1.55}
  footer b{font-family:var(--serif);color:var(--cobre-d)}

  .nav{position:fixed;bottom:0;left:0;right:0;z-index:45;background:var(--card);border-top:1px solid var(--linia);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom));max-width:620px;margin:0 auto}
  .tab{flex:1;background:none;border:0;cursor:pointer;font-family:inherit;color:var(--suau);display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:10px;font-weight:600;border-radius:10px}
  .tab .te{font-size:19px}.tab.on{color:var(--cobre-d)}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="top">
  <div class="logo">ap</div>
  <div class="tw"><div class="tt" id="topTit">La llave de paso</div><div class="ts" id="topSub">APRENS · TEC–AIS</div></div>
  <span class="sp"></span>
  <div class="lang" role="group" aria-label="Idioma / Idioma">
    <button id="btEs" class="on" onclick="setLang('es')">CAST</button>
    <button id="btCa" onclick="setLang('ca')">CAT</button>
  </div>
  <button class="iconbtn stop" id="btStop" onclick="go('parar')" aria-label="Necesito parar">🛟 Parar</button>
</div>

<main class="wrap" id="app"></main>
<nav class="nav" id="nav"></nav>

<script src="assets/js/aprens-core.js"></script>
<script>
"use strict";
/* ============================================================
   LA LLAVE DE PASO · APRENS
   Fontanería y oficios autónomos a domicilio · TEC–AIS
   Todo local, sin backend ni recursos externos.

   BILINGÜE castellano / català.
   A diferencia de tiempo_limite_peques.html, que es material de lectura y
   guarda todo su texto en un diccionario T={es,ca}, esta herramienta es
   interactiva y su texto va repartido por los constructores de vista. Aquí
   cada literal se escribe con t("castellà","català"): las dos versiones
   quedan juntas en el mismo sitio, así que no se puede añadir una frase
   nueva y olvidar traducirla, ni se acumulan claves huérfanas.
   ============================================================ */

var LS="llave_paso_db_v1", MEM=null;
function lsGet(){ try{return localStorage.getItem(LS);}catch(e){return MEM;} }
function lsSet(v){ try{localStorage.setItem(LS,v);}catch(e){MEM=v;} }
var DEFAULT={ settings:{nombre:"",telPsico:"",telPareja:"",lang:"",voz:false}, eventos:[], dias:{}, bandeja:[], frasesFav:[], frasesUser:[] };
var DB=load();
function load(){ try{ var d=JSON.parse(lsGet()); if(!d) return clone(DEFAULT); var b=clone(DEFAULT);
  for(var k in d){ b[k]=d[k]; } for(var s in DEFAULT.settings){ if(b.settings[s]===undefined) b.settings[s]=DEFAULT.settings[s]; } return b;
  }catch(e){ return clone(DEFAULT); } }
function save(){ try{ lsSet(JSON.stringify(DB)); }catch(e){} }
function clone(o){ return JSON.parse(JSON.stringify(o)); }

/* ---------- idioma ---------- */
/* Orden de preferencia: ?lang= en la URL (para poder mandar el enlace ya en
   catalán) > lo que el usuario eligiera antes > castellano. */
var LANG=(function(){
  var u=(new URLSearchParams(location.search).get("lang")||"").toLowerCase();
  if(u==="ca"||u==="es") return u;
  if(DB.settings.lang==="ca"||DB.settings.lang==="es") return DB.settings.lang;
  return "es";
})();
function t(es,ca){ return LANG==="ca" ? ca : es; }
function setLang(l){
  LANG=l; DB.settings.lang=l; save();
  document.documentElement.lang=l;
  document.getElementById("btEs").classList.toggle("on", l==="es");
  document.getElementById("btCa").classList.toggle("on", l==="ca");
  render(); window.scrollTo(0,0);
}

function esc(s){ return String(s==null?"":s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function q(s){ return String(s==null?"":s).replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }
function uid(){ return Date.now().toString(36)+Math.floor(Math.random()*1e6).toString(36); }
function p2(n){ return ("0"+n).slice(-2); }
function hoy(){ var d=new Date(); return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate()); }
function nowHM(){ var d=new Date(); return p2(d.getHours())+":"+p2(d.getMinutes()); }
var MESES={es:["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"],
           ca:["gen","feb","març","abr","maig","juny","jul","ago","set","oct","nov","des"]};
function fechaLarga(iso){ if(!iso) return ""; var p=iso.split("-");
  return parseInt(p[2],10)+" "+MESES[LANG][parseInt(p[1],10)-1]; }
function daysAgo(n){ var d=new Date(); d.setDate(d.getDate()-n); return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate()); }
function within7(iso){ return iso>=daysAgo(6); }
function nombre(){ return (DB.settings.nombre||"").trim(); }
function plural(n,sing,plu){ return n===1?sing:plu; }

var DIA_DEF={ resp:0, paradas:0, abrazos:0, honestidad:0, limites:0, siAutomatico:0, trabajos:0,
  presionIni:null, presionFin:null, barriga:"", acomp:[], latencia:null, cierre:false, dejado:"", nota:"" };
function dia(d){ d=d||hoy(); if(!DB.dias[d]) DB.dias[d]=clone(DIA_DEF);
  for(var k in DIA_DEF){ if(DB.dias[d][k]===undefined) DB.dias[d][k]=clone(DIA_DEF)[k]; }
  return DB.dias[d]; }

if(window.Aprens){ try{ Aprens.config({toolId:"llave_de_paso", toolName:"La llave de paso", toolVersion:1}); }catch(e){} }
function ev(t_,extra){
  DB.eventos.push(Object.assign({t:t_,ts:Date.now(),date:hoy(),hm:nowHM()},extra||{}));
  if(DB.eventos.length>1200) DB.eventos=DB.eventos.slice(-1200);
  if(window.Aprens){ try{ Aprens.save({id:uid(),date:hoy(),ts:Date.now(),modulo:'llave_'+t_,param:(t_==='parada'||t_==='limite'?'latencia':'densidad')}); }catch(e){} }
  save();
}

/* ---------- racha / continuidad ---------- */
function activo(d){ return d && (d.resp>0||d.paradas>0||d.abrazos>0||d.honestidad>0||d.cierre); }
function racha(){ var n=0; for(var i=0;i<400;i++){ var k=daysAgo(i); var d=DB.dias[k];
    if(activo(d)){ n++; } else if(i>0){ break; } }
  return n; }

/* ---------- guía por voz (opcional, hands-free para el oficio) ---------- */
/* Un fontanero tiene las manos ocupadas/sucias: poder respirar guiado por voz,
   sin mirar la pantalla, es la diferencia entre hacerlo o no. Usa la voz del
   propio dispositivo (SpeechSynthesis); nada sale del móvil. Opcional y silenciable. */
var VOZ_OK=('speechSynthesis' in window);
function speak(txt){
  if(!DB.settings.voz || !VOZ_OK || !txt) return;
  try{
    var u=new SpeechSynthesisUtterance(String(txt).replace(/<[^>]+>/g,''));
    u.lang=(LANG==='ca'?'ca-ES':'es-ES'); u.rate=0.92; u.pitch=1;
    window.speechSynthesis.cancel(); window.speechSynthesis.speak(u);
  }catch(e){}
}
function vozLabel(){ return (DB.settings.voz?'🔊 ':'🔇 ')+t("Guía por voz","Guia per veu"); }
function toggleVoz(){
  DB.settings.voz=!DB.settings.voz; save();
  var b=document.getElementById('vozBtn'); if(b) b.innerHTML=vozLabel();
  if(DB.settings.voz){ speak(t("Guía por voz activada","Guia per veu activada")); }
  else if(VOZ_OK){ try{ window.speechSynthesis.cancel(); }catch(e){} }
}

/* ---------- motor de respiración (reutilizable) ---------- */
function respFases(){ return [[t("Coge aire","Agafa aire"),4,1.16],["·",1,1.16],[t("Suelta despacio","Deixa anar a poc a poc"),6,0.84]]; }
function breathRun(opts){
  opts=opts||{};
  var fases=opts.fases||respFases(), ciclos=opts.ciclos||3, verbs=opts.verbs||[], onEnd=opts.onEnd;
  var i=-1, c=0, v=0;
  setVerb(verbs[0]);
  function step(){
    i++;
    if(i>=fases.length){ i=0; c++; v++; setVerb(verbs[v%(verbs.length||1)]);
      if(c>=ciclos){ fin(); return; } }
    var f=fases[i], ring=document.getElementById('ring'); if(!ring) return;
    var rf=document.getElementById('rf'); if(rf) rf.textContent=f[0];
    if(f[0] && f[0]!=='·') speak(f[0]);
    ring.style.transitionDuration=f[1]+'s'; ring.style.transform='scale('+f[2]+')';
    var left=f[1]; var rs=document.getElementById('rs'); if(rs) rs.textContent=left+'s';
    var iv=setInterval(function(){ left--; var r=document.getElementById('rs'); if(!r){ clearInterval(iv); return; }
      r.textContent=(left>0?left:0)+'s'; if(left<=0){ clearInterval(iv); step(); } },1000);
    timers.push(iv);
  }
  function fin(){ var ring=document.getElementById('ring');
    if(ring){ ring.style.transitionDuration='.6s'; ring.style.transform='scale(1)'; }
    var rf=document.getElementById('rf'); if(rf) rf.textContent=opts.finTxt||t("Aquí","Aquí");
    var rs=document.getElementById('rs'); if(rs) rs.textContent='';
    var fv=opts.finVerb||t("Ya estás aquí. Nota la barriga un segundo más.","Ja hi ets. Nota la panxa un segon més.");
    setVerb(fv); speak(fv);
    if(onEnd) onEnd();
  }
  function setVerb(x){ var el=document.getElementById('rverb'); if(!el||!x) return;
    el.style.opacity=0; setTimeout(function(){ el.textContent=x; el.style.opacity=1; },250); }
  step();
}
function ringHTML(inicial,verbo,size){
  var s=size?('width:'+size+'px;height:'+size+'px'):'';
  return '<div class="ring-wrap"><div class="ring" id="ring" style="'+s+'"><div class="ri"><div>'+
    '<div class="rf" id="rf">'+esc(inicial||t("Prepárate","Prepara't"))+'</div><div class="rs" id="rs"></div></div></div></div>'+
    '<div class="rverb" id="rverb">'+esc(verbo||'')+'</div>'+
    (VOZ_OK?('<div style="text-align:center;margin-top:8px"><button type="button" class="link" id="vozBtn" onclick="toggleVoz()">'+vozLabel()+'</button></div>'):'')+
    '</div>';
}

/* ---------- manómetro (SVG) ---------- */
function manoHTML(v){
  var val=(v===null||v===undefined)?null:v;
  var pct=(val===null?0:val/10);
  var a0=-220, a1=40, ang=a0+(a1-a0)*pct;
  var cx=100, cy=100, r=72;
  function pt(deg,rad){ var th=deg*Math.PI/180; return [cx+rad*Math.cos(th), cy+rad*Math.sin(th)]; }
  var arcS=pt(a0,r), arcE=pt(a1,r), needle=pt(ang,r-14);
  var col = val===null? '#c9c1b4' : (val<=3?'#4f8a66':(val<=6?'#a9781f':'#a9564e'));
  var h='<svg class="mano" viewBox="0 0 200 140" role="img" aria-label="'+t("Manómetro de presión","Manòmetre de pressió")+'">';
  h+='<path d="M '+arcS[0].toFixed(1)+' '+arcS[1].toFixed(1)+' A '+r+' '+r+' 0 1 1 '+arcE[0].toFixed(1)+' '+arcE[1].toFixed(1)+'" fill="none" stroke="#e6ddcd" stroke-width="13" stroke-linecap="round"/>';
  if(val!==null){
    var nd=pt(ang,r), large=((ang-a0)>180)?1:0;
    h+='<path d="M '+arcS[0].toFixed(1)+' '+arcS[1].toFixed(1)+' A '+r+' '+r+' 0 '+large+' 1 '+nd[0].toFixed(1)+' '+nd[1].toFixed(1)+'" fill="none" stroke="'+col+'" stroke-width="13" stroke-linecap="round"/>';
    h+='<line x1="'+cx+'" y1="'+cy+'" x2="'+needle[0].toFixed(1)+'" y2="'+needle[1].toFixed(1)+'" stroke="'+col+'" stroke-width="4" stroke-linecap="round"/>';
  }
  h+='<circle cx="'+cx+'" cy="'+cy+'" r="7" fill="'+col+'"/>';
  h+='<text x="100" y="128" text-anchor="middle" font-family="Georgia,serif" font-size="27" font-weight="700" fill="'+col+'">'+(val===null?'—':val)+'</text>';
  h+='</svg>';
  return h;
}
function presionTxt(v){ if(v===null||v===undefined) return t("sin medir","sense mesurar");
  return v<=3 ? t("baja · la instalación aguanta","baixa · la instal·lació aguanta")
    : (v<=6 ? t("media · ojo, va subiendo","mitjana · compte, va pujant")
            : t("alta · esto revienta por el punto más débil","alta · això peta pel punt més feble")); }

/* ================= ANTES DE ENTRAR EN CASA ================= */
/* La frase que dirá en voz alta tiene que sonar bien en las dos lenguas, y el
   catalán no concuerda como el castellano (buit/buida, «los hombros» pero
   «les espatlles»). Así que no se deduce la forma: se guardan las cuatro.
   zona: clave · emoji · {lengua:[con artículo, género, número]}
   textura: clave · {lengua:[masc.sg, fem.sg, masc.pl, fem.pl]} */
var hon={zona:null,textura:null,necesito:null};
var HON_ZONAS=[
  ["barriga","🫃",{es:["la barriga","f","sg"],   ca:["la panxa","f","sg"]}],
  ["pecho","🫀",  {es:["el pecho","m","sg"],     ca:["el pit","m","sg"]}],
  ["garganta","🗣️",{es:["la garganta","f","sg"], ca:["la gola","f","sg"]}],
  ["hombros","💪",{es:["los hombros","m","pl"],  ca:["les espatlles","f","pl"]}],
  ["mandibula","😬",{es:["la mandíbula","f","sg"],ca:["la mandíbula","f","sg"]}],
  ["cuerpo","🧍", {es:["el cuerpo entero","m","sg"],ca:["el cos sencer","m","sg"]}]
];
var HON_TEXT=[
  ["pesado",  {es:["pesado","pesada","pesados","pesadas"], ca:["pesat","pesada","pesats","pesades"]}],
  ["apretado",{es:["apretado","apretada","apretados","apretadas"], ca:["tibant","tibant","tibants","tibants"]}],
  ["vacio",   {es:["vacío","vacía","vacíos","vacías"], ca:["buit","buida","buits","buides"]}],
  ["ruidoso", {es:["ruidoso por dentro","ruidosa por dentro","ruidosos por dentro","ruidosas por dentro"],
               ca:["sorollós per dins","sorollosa per dins","sorollosos per dins","sorolloses per dins"]}],
  ["cansado", {es:["cansado","cansada","cansados","cansadas"], ca:["cansat","cansada","cansats","cansades"]}],
  ["encogido",{es:["encogido","encogida","encogidos","encogidas"], ca:["encongit","encongida","encongits","encongides"]}],
  ["revuelto",{es:["revuelto","revuelta","revueltos","revueltas"], ca:["regirat","regirada","regirats","regirades"]}],
  ["tenso",   {es:["tenso","tensa","tensos","tensas"], ca:["tens","tensa","tensos","tenses"]}]
];
function honNecs(){ return [
  ["silencio", t("un rato de silencio","una estona de silenci")],
  ["notrabajo",t("que no me pregunten por el trabajo","que no em preguntin per la feina")],
  ["abrazo",   t("un abrazo","una abraçada")],
  ["diezmin",  t("diez minutos y luego estoy","deu minuts i després hi soc")],

function zonaInfo(k){ for(var i=0;i<HON_ZONAS.length;i++){ if(HON_ZONAS[i][0]===k) return HON_ZONAS[i][2][LANG]; } return null; }
function textForma(k,gen,num){ for(var i=0;i<HON_TEXT.length;i++){ if(HON_TEXT[i][0]===k){

function informeTxt(){
  var d=dia(), n=nombre(), L=[], r=racha();
  var pend=DB.bandeja.filter(function(x){ return !x.done; }).length;
  L.push(t("LA LLAVE DE PASO · ","LA CLAU DE PAS · ")+fechaLarga(hoy())+(n?(" · "+n):""));
  L.push("");
  L.push(t("Respiraciones curiosas: ","Respiracions curioses: ")+d.resp);
  L.push(t("Paradas de pensamiento: ","Parades de pensament: ")+d.paradas);
  L.push(t("Abrazo sentido: ","Abraçada sentida: ")+(d.abrazos>0?(d.abrazos+" ✓"):t("hoy no","avui no")));
  L.push(t("Honestidad emocional: ","Honestedat emocional: ")+(d.honestidad>0
    ? t("sí, "+d.honestidad+" "+plural(d.honestidad,"vez","veces")+" (tono sereno, sin explicar el porqué)",
        "sí, "+d.honestidad+" "+plural(d.honestidad,"vegada","vegades")+" (to serè, sense explicar el perquè)")
    : t("hoy no","avui no")));
  L.push(t("Límites: "+d.limites+" "+plural(d.limites,"puesto","puestos")+" · "+d.siAutomatico+" "+plural(d.siAutomatico,"sí automático","síes automáticos"),
          "Límits: "+d.limites+" "+plural(d.limites,"posat","posats")+" · "+d.siAutomatico+" "+plural(d.siAutomatico,"sí automàtic","sís automàtics")));
  L.push("");
  L.push(t("Manómetro: ","Manòmetre: ")+(d.presionIni===null?"—":d.presionIni)+t(" al empezar → "," en començar → ")+(d.presionFin===null?"—":d.presionFin)+t(" al cerrar"," en tancar"));
  if(d.barriga) L.push(t("Barriga: ","Panxa: ")+labelBarriga(d.barriga));
  L.push(t("Latencia (el segundo de antes): ","Latència (el segon d'abans): ")+(d.latencia===null?"—":d.latencia+"/10"));
  L.push(t("Densidad (vueltas a la barriga): ","Densitat (tornades a la panxa): ")+(d.resp+d.paradas));
  L.push(t("Continuidad: "+r+" "+plural(r,"día seguido","días seguidos"),
          "Continuïtat: "+r+" "+plural(r,"dia seguit","dies seguits")));
  L.push(t(pend===1?"En la bandeja queda 1 cosa anotada, no en la cabeza":"En la bandeja quedan "+pend+" cosas anotadas, no en la cabeza",
          pend===1?"A la safata queda 1 cosa apuntada, no al cap":"A la safata queden "+pend+" coses apuntades, no al cap"));
  if(d.dejado) L.push(t("Se ha quedado fuera de casa: «","S'ha quedat fora de casa: «")+d.dejado+"»");
  L.push(t("Cierre del día: ","Tancament del dia: ")+(d.cierre?t("hecho ✓","fet ✓"):t("pendiente","pendent")));
  if((d.nota||"").trim()){ L.push(""); L.push(t("Nota: ","Nota: ")+d.nota.trim()); }
  return L.join("\n");
}
function enviarWA(){
  var tel=(DB.settings.telPsico||'').replace(/[^\d]/g,'');
  var url='https://wa.me/'+tel+'?text='+encodeURIComponent(informeTxt());
  try{ window.open(url,'_blank'); }catch(e){ location.href=url; }
  if(!tel) flash(t("Si pones el número en Ajustes, se abre directo con tu psicólogo.",
                   "Si poses el número a Ajustos, s'obre directament amb el teu psicòleg."));
  ev('informe');
}
function copiarInforme(btn){ copiar(informeTxt(),btn); }

function semanaHTML(){
  var keys=Object.keys(DB.dias).filter(within7).sort().reverse();
  if(!keys.length) return '';
  var h='<div class="card"><h2><span class="e">🗓️</span>'+t("Estos días","Aquests dies")+'</h2>';
  h+=keys.map(function(k){ var d=DB.dias[k];
    return '<div class="rec"><div class="rh"><span class="rd"><b>'+esc(fechaLarga(k))+'</b></span><span class="rd">'+
      (d.cierre?t("🏠 cerrado","🏠 tancat"):'')+'</span></div>'+
      '<div class="rb">'+d.resp+t(" respiraciones · "," respiracions · ")+d.paradas+t(" paradas · "," parades · ")+
      d.abrazos+" "+t(plural(d.abrazos,"abrazo","abrazos"),plural(d.abrazos,"abraçada","abraçades"))+
      (d.honestidad>0?t(" · 💬 lo dijo"," · 💬 ho va dir"):'')+
      (d.limites>0?(" · 🚫 "+d.limites+" "+t(plural(d.limites,"límite","límites"),plural(d.limites,"límit","límits"))):'')+'</div></div>'; }).join('');
  h+='<div class="btnrow" style="margin-top:8px"><button class="btn sm ghost" onclick="copiarSemana(this)">📋 '+
     t("Copiar la semana","Copiar la setmana")+'</button></div></div>';
  return h;
}
function copiarSemana(btn){
  var keys=Object.keys(DB.dias).filter(within7).sort();
  var L=[t("LA LLAVE DE PASO · semana ","LA CLAU DE PAS · setmana ")+fechaLarga(daysAgo(6))+" → "+fechaLarga(hoy())+(nombre()?(" · "+nombre()):"")];
  var tr=0,tp=0,ta=0,th=0,tl=0,ts=0,tc=0;
  keys.forEach(function(k){ var d=DB.dias[k]; tr+=d.resp; tp+=d.paradas; ta+=d.abrazos; th+=d.honestidad; tl+=d.limites; ts+=d.siAutomatico; if(d.cierre) tc++;
    L.push("· "+fechaLarga(k)+": "+d.resp+t(" resp · "," resp · ")+d.paradas+t(" paradas · "," parades · ")+d.abrazos+" "+
      t(plural(d.abrazos,"abrazo","abrazos"),plural(d.abrazos,"abraçada","abraçades"))+" · "+
      (d.honestidad>0?t("lo dijo","ho va dir"):t("no lo dijo","no ho va dir"))+t(" · cierre "," · tancament ")+(d.cierre?t("sí","sí"):"no")); });
  L.push("");
  L.push(t("Totales: ","Totals: ")+tr+t(" respiraciones curiosas · "," respiracions curioses · ")+tp+
    t(" paradas de pensamiento · "," parades de pensament · ")+ta+t(" abrazos sentidos"," abraçades sentides"));
  L.push(t("Honestidad emocional: ","Honestedat emocional: ")+th+t(" veces · Límites: "," vegades · Límits: ")+tl+
    t(" · Síes automáticos: "," · Sís automàtics: ")+ts);
  L.push(t("Cierres de día: ","Tancaments de dia: ")+tc+"/"+keys.length+t(" · Continuidad: "," · Continuïtat: ")+racha()+t(" días seguidos"," dies seguits"));
  copiar(L.join("\n"),btn);
}

function crearFrase(){ var x=(document.getElementById('newFrase').value||'').trim(); if(!x) return;
  if(DB.frasesUser.indexOf(x)<0) DB.frasesUser.unshift(x); save(); go('frases'); }
function delFrase(x){ x=String(x); DB.frasesUser=DB.frasesUser.filter(function(f){ return f!==x; });
  DB.frasesFav=DB.frasesFav.filter(function(f){ return f!==x; }); save(); go('frases'); }
function favFrase(x,btn){ x=String(x); var i=DB.frasesFav.indexOf(x);
  if(i>=0){ DB.frasesFav.splice(i,1); btn.textContent='☆'; btn.classList.remove('fav-on'); }
  else { DB.frasesFav.push(x); btn.textContent='★'; btn.classList.add('fav-on'); } save(); }

function copiar(txt,btn){ txt=String(txt);
  function ok(){ if(btn){ var o=btn.textContent; btn.textContent='✓'; setTimeout(function(){ btn.textContent=o; },1500); } }
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(ok).catch(fb); } else { fb(); }
  function fb(){ var ta=document.createElement('textarea'); ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); ok(); }catch(e){} document.body.removeChild(ta); }
}
function exportJSON(){ try{
    var blob=new Blob([JSON.stringify({app:'la_llave_de_paso',v:1,exportado:new Date().toISOString(),db:DB},null,2)],{type:'application/json'});
    var url=URL.createObjectURL(blob); var a=document.createElement('a'); a.href=url; a.download='llave_de_paso_'+hoy()+'.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a); setTimeout(function(){ URL.revokeObjectURL(url); },1000);
    flash(t("Archivo generado ✓","Fitxer generat ✓"));
  }catch(e){ alert(t("No se pudo generar el archivo.","No s'ha pogut generar el fitxer.")); } }
