<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Formentor Flow · Manager</title>
<meta name="theme-color" content="#103A44">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Flow Manager">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icon.svg">
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  :root{
    --mar:#103A44; --mar-2:#1B5A68; --mar-3:#2E7C8A;
    --pi:#5C7A56; --pi-2:#47623F;
    --arena:#C7B393; --llauto:#A87C39; --llauto-2:#855F26;
    --clay:#B0563A; --clay-2:#8F4229;
    --piedra:#F4F0E8; --piedra-2:#ECE6DA; --blanc:#FCFBF7;
    --tinta:#17242A; --tinta-2:#4E5A5F; --tinta-3:#7A848A;
    --linia:#DDD6C8; --linia-2:#E9E3D6;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:"SFMono-Regular","SF Mono",ui-monospace,Menlo,Consolas,monospace;
  }
  html,body{height:100%;}
  body{font-family:var(--sans);background:var(--mar);color:var(--tinta);-webkit-font-smoothing:antialiased;line-height:1.5;display:flex;justify-content:center;}
  .app{width:100%;max-width:440px;background:var(--piedra);min-height:100dvh;display:flex;flex-direction:column;position:relative;box-shadow:0 0 60px rgba(0,0,0,.25);}

  header{background:var(--mar);color:var(--blanc);padding:calc(env(safe-area-inset-top) + 14px) 18px 14px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10;}
  header .mk{width:30px;height:30px;flex:none;}
  header .ht{flex:1;}
  header .ht .b{font-family:var(--serif);font-size:1.05rem;line-height:1.1;}
  header .ht .s{font-family:var(--mono);font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--arena);margin-top:2px;}
  .breathe{flex:none;font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mar);background:var(--arena);border:1px solid var(--arena);border-radius:16px;padding:6px 11px;cursor:pointer;min-height:32px;}
  .breathe:active{transform:scale(.97);}
  .lang{display:flex;gap:4px;flex:none;}
  .lang button{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.06em;color:rgba(255,255,255,.7);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:16px;padding:6px 9px;cursor:pointer;min-height:32px;}
  .lang button.on{background:var(--arena);color:var(--mar);border-color:var(--arena);}

  main{flex:1;padding:20px 18px;overflow-y:auto;}
  footer{padding:12px 18px calc(env(safe-area-inset-bottom) + 14px);font-family:var(--mono);font-size:9px;letter-spacing:.04em;color:var(--tinta-3);text-align:center;border-top:1px solid var(--linia-2);background:var(--piedra);}

  .screen{display:none;animation:fade .32s ease;}
  .screen.on{display:block;}
  @keyframes fade{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
  @media(prefers-reduced-motion:reduce){.screen.on{animation:none;}}

  h1{font-family:var(--serif);font-size:1.5rem;line-height:1.12;margin-bottom:6px;}
  .lead{color:var(--tinta-2);font-size:.95rem;margin-bottom:18px;}

  /* home */
  .sits{display:flex;flex-direction:column;gap:9px;}
  .sit{display:flex;align-items:center;gap:13px;width:100%;text-align:left;background:var(--blanc);border:1px solid var(--linia);border-radius:14px;padding:15px 16px;font-family:var(--sans);font-size:1.0rem;font-weight:600;color:var(--tinta);cursor:pointer;min-height:56px;transition:transform .12s,border-color .12s;}
  .sit:hover{border-color:var(--mar-2);transform:translateX(2px);}
  .sit:active{transform:scale(.99);}
  .sit:focus-visible{outline:2px solid var(--llauto);outline-offset:2px;}
  .sit .d{width:14px;height:14px;border-radius:50%;flex:none;}
  .sit .ar{margin-left:auto;color:var(--tinta-3);font-size:1.1rem;}
  .privacy{margin-top:18px;background:var(--piedra-2);border:1px solid var(--linia);border-radius:11px;padding:13px 15px;font-size:.84rem;color:var(--tinta-2);}
  .privacy b{color:var(--tinta);}

  /* step bar */
  .stepbar{display:flex;gap:5px;margin-bottom:14px;}
  .stepbar .s{flex:1;text-align:center;font-family:var(--mono);font-size:9px;letter-spacing:.06em;text-transform:uppercase;padding:8px 0;border-radius:20px;background:var(--piedra-2);color:var(--tinta-3);border:1px solid var(--linia);cursor:pointer;}
  .stepbar .s.on{background:var(--mar);color:var(--blanc);border-color:var(--mar);}
  .stepbar .s.done{background:var(--blanc);color:var(--pi-2);border-color:var(--pi);}

  .ctx{display:flex;align-items:center;gap:8px;margin-bottom:14px;}
  .ctx .d{width:11px;height:11px;border-radius:50%;flex:none;}
  .ctx .nm{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--tinta-2);}
  .ctx .ex{margin-left:auto;font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--llauto-2);background:none;border:1px solid var(--linia);border-radius:16px;padding:6px 11px;cursor:pointer;}
  .ctx .ex:focus-visible{outline:2px solid var(--llauto);outline-offset:2px;}

  .example{display:none;background:var(--blanc);border:1px solid var(--linia);border-radius:13px;padding:14px 16px;margin-bottom:16px;}
  .example.on{display:block;}
  .example .ln{font-size:.9rem;line-height:1.5;padding:8px 0;}
  .example .ln.bad{color:var(--clay-2);border-bottom:1px dashed var(--linia);}
  .example .ln.good{color:var(--pi-2);}
  .example .mk{font-weight:700;margin-right:6px;}

  /* para — componente AIS de respiración (congelado; ver BreathingIllustration en el script) */
  :root{--llum:#E9B458;--halo-a:rgba(46,124,138,.20);--halo-b:rgba(199,179,147,.10);}
  /* ================= BreathingIllustration ================= */
  .breathing-stage{
    position:relative;
    width:min(100%, calc(56vh * 820 / 1240));
    aspect-ratio:820 / 1240;
    margin:14px auto 50px;
    -webkit-tap-highlight-color:transparent;
    user-select:none;-webkit-user-select:none;
    touch-action:manipulation;
  }
  @supports (height:1svh){ .breathing-stage{width:min(100%, calc(56svh * 820 / 1240));} }
  .breathing-stage > *{position:absolute;inset:0;width:100%;height:100%;}

  /* capa 0: halo de respiración (detrás de la ilustración, se ve por la transparencia) */
  .breath-halo{
    inset:auto;left:50%;top:var(--halo-y,45%);
    width:96%;height:auto;aspect-ratio:1;
    border-radius:50%;
    background:radial-gradient(circle, var(--halo-a) 0%, var(--halo-b) 46%, rgba(199,179,147,0) 70%);
    transform:translate(-50%,-50%) scale(.86);
    opacity:.35;
    will-change:transform,opacity;
    pointer-events:none;
    transition:top .35s ease;
  }
  .breathing-stage[data-view="tree"]{--halo-y:52%;}
  .breathing-stage[data-view="body"]{--halo-y:46%;}

  /* capa 1: ilustración (intacta) */
  .base-illustration{
    object-fit:contain;display:block;
    opacity:0;transition:opacity .25s ease;
    pointer-events:none;
    -webkit-user-drag:none;
  }
  .breathing-stage[data-view="body"] .base-illustration[data-view="body"],
  .breathing-stage[data-view="tree"] .base-illustration[data-view="tree"]{opacity:1;}

  /* capa 2: interacción */
  .interaction-layer{overflow:visible;pointer-events:none;}
  .view-layer{display:none;}
  .breathing-stage[data-view="body"] .view-layer[data-view="body"],
  .breathing-stage[data-view="tree"] .view-layer[data-view="tree"]{display:inline;}
  /* copa = maraña de pensamientos: se remueve suavemente en reposo y se aquieta al respirar */
  @keyframes copaSway{0%,100%{transform:rotate(-1.7deg)}50%{transform:rotate(1.7deg)}}
  #pinoCopa{transform-box:fill-box;transform-origin:50% 94%;animation:copaSway 6.5s ease-in-out infinite;}
  .breathing-stage.running #pinoCopa{animation-duration:12s;}
  @media(prefers-reduced-motion:reduce){#pinoCopa{animation:none;}}
  .hit-zone{fill:transparent;stroke:transparent;pointer-events:all;cursor:pointer;outline:none;}
  .show-hits .hit-zone{stroke:#B0563A;stroke-width:3;stroke-dasharray:10 8;fill:rgba(176,86,58,.06);}
  .hit-zone:focus-visible{stroke:var(--llauto);stroke-width:4;stroke-dasharray:none;}
  .zone-glow{opacity:0;}
  .zone-dot{fill:var(--llum);opacity:0;}
  .zone-mark{fill:none;stroke:var(--llum);stroke-width:3;stroke-dasharray:6 7;opacity:0;transition:opacity .3s ease;}
  .zone.noticed .zone-mark{opacity:.95;}
  .zone-label rect{fill:rgba(252,251,247,.86);stroke:rgba(16,58,68,.14);stroke-width:1.5;}
  .zone-label text{font-family:var(--mono);font-size:24px;letter-spacing:3px;fill:var(--mar);font-weight:600;}
  .zone-label line{stroke:rgba(16,58,68,.35);stroke-width:2;}
  .zone-label{opacity:.62;transition:opacity .35s ease;}
  .zone.on .zone-label,.zone.noticed .zone-label{opacity:1;}
  .zone.noticed .zone-label text{fill:var(--llauto-2);}

  .flow-trail-soft{fill:none;stroke:var(--llum);stroke-width:16;stroke-linecap:round;stroke-linejoin:round;opacity:.28;}
  .flow-trail-core{fill:none;stroke:#FFF3D6;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;opacity:.9;}
  .flow-dot,.anchor-halo{opacity:0;}

  /* capa 3: UI */
  .breathing-ui{inset:auto 0 auto 0;top:calc(100% + 8px);height:40px;display:flex;justify-content:center;pointer-events:none;}
  .phase-pill{
    display:flex;align-items:baseline;gap:9px;
    background:rgba(252,251,247,.9);border:1px solid var(--linia);
    border-radius:24px;padding:6px 15px 7px;
    color:var(--mar-2);
    opacity:0;transition:opacity .3s ease;
    -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
  }
  .breathing-stage.running .phase-pill{opacity:1;}
  .phase-pill .pl{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;}
  .phase-pill .pn{font-family:var(--serif);font-size:22px;line-height:1;min-width:.7em;text-align:center;}
  .phase-pill .ph{font-family:var(--serif);font-style:italic;font-size:.82rem;color:var(--tinta-2);}

  @media (prefers-reduced-motion:reduce){
    .flow-trail-soft,.flow-trail-core{display:none;}
    .base-illustration,.breath-halo{transition:none;}
  }
  /* ========================================================= */
  /* Manager · ajuste responsive: en pantallas bajas (Safari con barras, iPhone SE) la ilustración cede
     altura para que «Empezar» quede visible sin desplazar. En pantallas normales manda el 56svh del componente. */
  #paraStage{width:min(100%, calc(56vh * 820 / 1240), calc(max(100vh - 360px - env(safe-area-inset-top) - env(safe-area-inset-bottom), 180px) * 820 / 1240));}
  @supports (height:1svh){ #paraStage{width:min(100%, calc(56svh * 820 / 1240), calc(max(100svh - 360px - env(safe-area-inset-top) - env(safe-area-inset-bottom), 180px) * 820 / 1240));} }
  .stage-cue{text-align:center;margin-top:4px;min-height:18px;font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--llauto-2);}
  .ais-metaphor{text-align:center;font-size:.84rem;color:var(--tinta-2);margin:6px 12px 4px;}
  .ais-rhythm{text-align:center;margin-top:6px;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--tinta-3);}
  .ais-debug{margin-top:14px;border-top:1px dashed var(--linia);padding-top:10px;font-size:.82rem;color:var(--tinta-2);}
  .ais-debug pre{margin-top:6px;font-family:var(--mono);font-size:10px;line-height:1.6;color:var(--tinta-3);}
  .para-ais{text-align:center;font-family:var(--serif);font-style:italic;font-size:.97rem;line-height:1.4;color:var(--mar-2);margin:12px 14px 4px;}
  .start-btn{display:block;margin:8px auto 0;}
  .breath-count{text-align:center;margin-top:6px;min-height:16px;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mar-3);}
  .breath-count .bc-n{font-family:var(--serif);font-size:15px;font-weight:600;color:var(--llauto-2);margin-right:4px;letter-spacing:0;}
  .para-q{font-family:var(--serif);font-size:1.3rem;line-height:1.2;color:var(--mar);text-align:center;margin:14px 4px 12px;}
  .para-x{background:var(--blanc);border:1px solid var(--linia);border-radius:14px;padding:15px 17px;margin-bottom:8px;font-size:.93rem;color:var(--tinta);}
  .para-x em{color:var(--llauto-2);font-style:italic;}

  /* ---- modo cuerpo / árbol (Pi de Formentor) ---- */
  .figmode{display:flex;justify-content:center;gap:6px;margin:8px 0 -4px;}
  .figmode button{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--tinta-3);background:var(--piedra);border:1px solid var(--linia);border-radius:20px;padding:5px 12px;cursor:pointer;}
  .figmode button.on{color:var(--mar);border-color:var(--mar-3);background:var(--blanc);font-weight:700;}

  /* ordena */
  .qlist{list-style:none;display:flex;flex-direction:column;gap:9px;}
  .qlist li{background:var(--blanc);border:1px solid var(--linia);border-left:3px solid var(--llauto);border-radius:12px;padding:12px 14px;font-size:.95rem;line-height:1.4;}
  .qlist li.key{border-left-color:var(--mar);background:#EEF3F1;font-weight:600;color:var(--mar);}

  /* comunica */
  .dirtog{display:flex;gap:8px;margin-bottom:14px;}
  .dirtog button{flex:1;font-family:var(--mono);font-size:10px;letter-spacing:.05em;text-transform:uppercase;font-weight:600;padding:11px 6px;border-radius:22px;border:1px solid var(--linia);background:var(--blanc);color:var(--tinta-2);cursor:pointer;min-height:44px;}
  .dirtog button.on{background:var(--pi);color:var(--blanc);border-color:var(--pi);}
  .field{margin-bottom:9px;}
  .field .row{display:flex;gap:8px;align-items:flex-start;}
  .mic{flex:none;width:46px;min-height:46px;border-radius:11px;border:1px solid var(--linia);background:var(--blanc);color:var(--mar-2);display:grid;place-items:center;cursor:pointer;}
  .mic svg{width:19px;height:19px;}
  .mic.rec{background:var(--clay);color:#fff;border-color:var(--clay);animation:micpulse 1.2s ease-in-out infinite;}
  @keyframes micpulse{0%,100%{box-shadow:0 0 0 0 rgba(176,86,58,.5);}50%{box-shadow:0 0 0 7px rgba(176,86,58,0);}}
  @media(prefers-reduced-motion:reduce){.mic.rec{animation:none;}}
  .michint{font-size:.8rem;color:var(--tinta-2);margin:0 0 12px;display:flex;align-items:center;gap:7px;}
  .golden{font-family:var(--serif);font-style:italic;font-size:.94rem;color:var(--mar-2);background:var(--piedra-2);border:1px solid var(--linia);border-left:3px solid var(--llauto);border-radius:11px;padding:11px 14px;margin-bottom:12px;line-height:1.4;}
  .golden .el{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--llauto-2);font-style:normal;margin-bottom:5px;}
  .field label{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--tinta-3);margin-bottom:5px;}
  .field textarea{width:100%;flex:1;background:var(--blanc);border:1px solid var(--linia);border-radius:11px;padding:11px 13px;font-family:var(--sans);font-size:.96rem;color:var(--tinta);resize:none;line-height:1.4;min-height:44px;}
  .field textarea:focus{outline:none;border-color:var(--mar-2);box-shadow:0 0 0 3px rgba(46,124,138,.12);}
  .field textarea::placeholder{color:var(--tinta-3);opacity:.8;}
  .preview{background:var(--mar);color:#EAF1EF;border-radius:14px;padding:13px 15px;margin-top:6px;}
  .preview h5{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--arena);margin-bottom:9px;}
  .preview pre{font-family:var(--mono);font-size:12px;line-height:1.55;white-space:pre-wrap;word-break:break-word;color:#EAF1EF;}
  .preview .empty{color:rgba(234,241,239,.45);font-style:italic;font-family:var(--sans);font-size:.9rem;}
  .micro{margin-top:12px;font-family:var(--serif);font-style:italic;font-size:.95rem;color:var(--mar-2);text-align:center;line-height:1.4;}

  /* verifica */
  .vq{font-family:var(--serif);font-size:1.18rem;line-height:1.25;color:var(--mar);margin-bottom:14px;}
  .checks{display:flex;flex-direction:column;gap:8px;}
  .chk{display:flex;align-items:center;gap:12px;background:var(--blanc);border:1px solid var(--linia);border-radius:12px;padding:13px 15px;font-size:.95rem;color:var(--tinta);cursor:pointer;text-align:left;}
  .chk .bx{width:22px;height:22px;border-radius:6px;border:2px solid var(--linia);flex:none;display:grid;place-items:center;color:transparent;font-size:13px;}
  .chk.on{border-color:var(--pi);}
  .chk.on .bx{background:var(--pi);border-color:var(--pi);color:#fff;}

  .actions{display:flex;gap:9px;margin-top:18px;}
  .btn{flex:1;font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;padding:14px 10px;border-radius:24px;border:1px solid var(--linia);background:var(--blanc);color:var(--tinta);cursor:pointer;min-height:48px;}
  .btn.primary{background:var(--mar);color:var(--blanc);border-color:var(--mar);}
  .btn.gold{background:var(--llauto);color:var(--blanc);border-color:var(--llauto);}
  .btn:active{transform:scale(.98);}
  .btn.copied{background:var(--pi);color:var(--blanc);border-color:var(--pi);}

  /* ---- pantalla de entrada: curiosidad / control ---- */
  .entry-q{font-family:var(--serif);font-size:1.5rem;line-height:1.2;color:var(--mar);text-align:center;margin:6px 4px 18px;}
  .fork{display:flex;flex-direction:column;gap:12px;margin-bottom:16px;}
  .bigfork{display:flex;align-items:center;gap:14px;text-align:left;padding:18px 18px;border-radius:20px;border:1.5px solid var(--linia);background:var(--blanc);cursor:pointer;min-height:88px;}
  .bigfork:active{transform:scale(.99);}
  .bigfork.cur{border-color:#8CA57F;background:#F2F5EE;}
  .bigfork.con{border-color:#D2A08C;background:#F8F0EC;}
  .bigfork .fk-e{font-size:30px;flex:none;line-height:1;}
  .bigfork .fk-n{display:block;font-family:var(--serif);font-size:1.35rem;color:var(--mar);line-height:1.1;}
  .bigfork.cur .fk-n{color:var(--pi-2,#47623F);} .bigfork.con .fk-n{color:#8F4229;}
  .bigfork .fk-d{display:block;font-family:var(--read,"Newsreader",Georgia,serif);font-size:.86rem;color:var(--tinta-2);margin-top:4px;line-height:1.35;}
  .daycard{background:var(--piedra);border:1px solid var(--linia);border-radius:16px;padding:15px 17px;margin-bottom:16px;}
  .daybal .dl{font-family:var(--read,Georgia,serif);font-style:italic;font-size:.92rem;color:var(--tinta-3);}
  .barrow{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px;}
  .barrow .cur{color:var(--pi-2,#47623F);} .barrow .con{color:#8F4229;}
  .bar{height:8px;border-radius:6px;background:#E7C4B6;overflow:hidden;}
  .bar>span{display:block;height:100%;background:#7C9A6E;border-radius:6px;}
  .daymsg{font-family:var(--serif);font-size:1rem;line-height:1.35;color:var(--mar-2);margin-top:11px;text-wrap:balance;}
  .diario-link{display:inline-block;margin-top:10px;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--mar-3);background:none;border:0;cursor:pointer;padding:0;}
  .back-link{display:inline-block;margin:0 0 10px;font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--tinta-3);background:none;border:0;cursor:pointer;padding:6px 0;}
  /* diario */
  .diaday{padding:11px 2px;border-bottom:1px solid var(--linia-2,#E9E3D6);}
  .diaday:last-child{border-bottom:0;}
  .dd-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;}
  .dd-date{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--tinta-2);}
  .dd-cnt{font-family:var(--serif);font-size:.95rem;color:var(--tinta);}

<script>
/* ============================================================
   Formentor Flow · Manager (V2)
   Método Centre APRENS · psicología aplicada al funcionamiento
   organizacional. Sin backend, sin tracking, sin almacenamiento.
   ============================================================ */
var LANG='es';

/* =========================================================
   1) MOTOR — tiempo y estado. No sabe nada de imágenes.
   ========================================================= */
var AIS_BREATH = { inhale: 3000, anchor: 2000, exhale: 7000, pause: 1000 };
/* Modo prueba: zonas táctiles visibles y variables de estado. En Manager: false. */
var AIS_DEBUG = false;
var AISEngine = (function(){
  var T = AIS_BREATH, CYCLE = T.inhale + T.anchor + T.exhale + T.pause;
  var Q_EXIT = -0.38;   /* tramo visual COPA/GARGANTA → EXTERIOR (fuera del modelo de 3 zonas) */
  var RESID = 0.62;     /* luz de conciencia que QUEDA en las raíces: permanece brillante al exhalar aunque el aire suba y salga */
  function sine(x){ return -(Math.cos(Math.PI * x) - 1) / 2; }
  function smooth(a, b, x){ var t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); }

  /* Estado visual en un instante (ms desde el inicio). Determinista: sirve para el punto y para la estela. */
  function at(ms){
    var cyc = Math.floor(ms / CYCLE), c = ms - cyc * CYCLE;
    var s = { cycle: cyc };
    if (c < T.inhale){
      var p = c / T.inhale;
      s.phase = 'inhale'; s.elapsed = c; s.dur = T.inhale; s.progress = p;
      s.q = sine(p);                                   /* 0 garganta/copa → 1 barriga/raíces */
      s.dot = Math.min(1, p / 0.12);
      s.anchor = cyc > 0 ? RESID * (1 - smooth(0, 0.7, p)) : 0;   /* la huella se funde mientras el indicador vuelve a bajar */
      s.breath = 0.86 + 0.14 * sine(p);
    } else if (c < T.inhale + T.anchor){
      var p2 = (c - T.inhale) / T.anchor;
      s.phase = 'anchor'; s.elapsed = c - T.inhale; s.dur = T.anchor; s.progress = p2;
      s.q = 1; s.dot = 1 - smooth(0, 0.35, p2) * 0.6;
      s.anchor = smooth(0, 0.35, p2);                               /* aparece el anclaje */
      s.breath = 1;
    } else if (c < T.inhale + T.anchor + T.exhale){
      var p3 = (c - T.inhale - T.anchor) / T.exhale, u = sine(p3);
      s.phase = 'exhale'; s.elapsed = c - T.inhale - T.anchor; s.dur = T.exhale; s.progress = p3;
      s.q = 1 - (1 - Q_EXIT) * u;                      /* 1 → 0 → exterior, continuo */
      s.dot = s.q >= 0 ? Math.min(1, 0.4 + smooth(0, 0.12, p3) * 0.6) : 1 - s.q / Q_EXIT;
      s.anchor = RESID + (1 - RESID) * (1 - smooth(0, 0.07, p3));   /* paso breve (~0,5 s) a huella; luego constante toda la exhalación */
      s.breath = 1 - 0.14 * u;
    } else {
      var p4 = (c - T.inhale - T.anchor - T.exhale) / T.pause;
      s.phase = 'pause'; s.elapsed = c - T.inhale - T.anchor - T.exhale; s.dur = T.pause; s.progress = p4;
      s.q = Q_EXIT; s.dot = 0; s.anchor = RESID; s.breath = 0.86;   /* huella constante en la pausa */
    }
    s.n = Math.min(Math.round(s.dur / 1000), Math.floor(s.elapsed / 1000) + 1);
    return s;
  }

  var state = {
    running: false, t0: 0, raf: null,
    breathPhase: 'idle', breathCount: 0, breathProgress: 0,
    attentionPos: 0, activeZone: null, noticedZone: null, view: 'body'
  };
  var listeners = [];
  function emit(s, ms){ for (var i = 0; i < listeners.length; i++) listeners[i](s, ms); }
  function loop(now){
    var ms = now - state.t0, s = at(ms);
    state.breathPhase = s.phase; state.breathProgress = s.progress;
    state.attentionPos = Math.max(0, s.q); state.breathCount = s.cycle;
    emit(s, ms);
    state.raf = requestAnimationFrame(loop);
  }
  return {
    CYCLE: CYCLE, Q_EXIT: Q_EXIT, at: at, state: state,
    on: function(fn){ listeners.push(fn); },
    start: function(){ if (state.running) return; state.running = true; state.t0 = performance.now(); state.raf = requestAnimationFrame(loop); },
    stop: function(){
      if (state.raf) cancelAnimationFrame(state.raf);
      state.raf = null; state.running = false;
      state.breathPhase = 'idle'; state.breathProgress = 0; state.attentionPos = 0; state.activeZone = null;
      emit(null, 0);
    }
  };
})();

/* =========================================================
   2) GEOMETRÍA — coordenadas en el viewBox 820×1240 de cada ilustración.
   Recorrido: EXTERIOR → z1 (garganta/copa) → z2 (pecho/tronco) → z3 (barriga/raíces)
   ========================================================= */
/* Ilustración base: organismo real (820×1240). El AIRE (azul) recorre nariz→barriga por 'route';
   la CONCIENCIA (amarilla) NACE en la copa/frente y baja por 'mind' hasta las raíces/barriga.
   Cuerpo y Árbol comparten el recorrido; sólo cambian las etiquetas y dónde está z1
   (garganta en Cuerpo, copa/frente en Árbol). */
var GEO = {
  body: {
    route: [[407,175],[407,245],[407,300],[407,395],[407,470],[409,600],[408,700],[405,807]],
    anchors: { ext: 0, z1: 2, z2: 4, z3: 7 },      /* índices en route */
    mind:  [[406,120],[406,220],[407,320],[407,440],[407,560],[406,690],[405,807]],
    hits: { z1:[407,300,74,58], z2:[407,470,180,150], z3:[405,810,165,190] },
    labels:{ z1:[500,300,'L'], z2:[600,455,'L'], z3:[585,815,'L'] },
    glow:  { z1:[407,300,72], z2:[407,470,150], z3:[405,807,165] },
    haloY: '46%'
  },
  tree: {
    route: [[407,175],[407,245],[407,300],[407,395],[407,470],[409,600],[408,700],[405,807]],
    anchors: { ext: 0, z1: 2, z2: 4, z3: 7 },
    mind:  [[406,120],[406,220],[407,320],[407,440],[407,560],[406,690],[405,807]],
    hits: { z1:[405,130,300,150], z2:[407,470,95,120], z3:[405,880,300,190] },
    labels:{ z1:[560,120,'L'], z2:[540,470,'L'], z3:[600,905,'L'] },
    glow:  { z1:[405,120,150], z2:[407,470,95], z3:[405,807,175] },
    haloY: '50%'
  }
};
/* q ∈ [Q_EXIT, 1]: Q_EXIT = exterior, 0 = z1, 0.5 = z2, 1 = z3. El mismo q da el mismo punto semántico en ambas vistas. */
var ZQ = { z1: 0, z2: 0.5, z3: 1 };
function prepRoute(g){
  var pts = g.route, cum = [0];
  for (var i = 1; i < pts.length; i++) cum.push(cum[i-1] + Math.hypot(pts[i][0]-pts[i-1][0], pts[i][1]-pts[i-1][1]));
  var a = g.anchors;
  g._cum = cum;
  g._keys = [ [AISEngine.Q_EXIT, cum[a.ext]], [0, cum[a.z1]], [0.5, cum[a.z2]], [1, cum[a.z3]] ];
  /* recorrido de la conciencia: copa/frente (q=0) → raíces/barriga (q=1) */
  var m = g.mind, mc = [0];
  for (var j = 1; j < m.length; j++) mc.push(mc[j-1] + Math.hypot(m[j][0]-m[j-1][0], m[j][1]-m[j-1][1]));
  g._mcum = mc;
}
/* punto de la conciencia para q∈[0,1] (se recorta): 0 = copa/frente, 1 = raíces/barriga */
function mindPointAt(g, q){
  var m = g.mind, mc = g._mcum, total = mc[mc.length-1];
  var L = Math.min(1, Math.max(0, q)) * total;
  for (var j = 1; j < mc.length; j++) if (L <= mc[j]){
    var f = (L - mc[j-1]) / (mc[j] - mc[j-1] || 1);
    return [m[j-1][0] + f * (m[j][0] - m[j-1][0]), m[j-1][1] + f * (m[j][1] - m[j-1][1])];
  }
  return m[m.length-1].slice();
}
function pointAt(g, q){
  var k = g._keys, L;
  if (q <= k[0][0]) L = k[0][1];
  else if (q >= k[3][0]) L = k[3][1];
  else for (var i = 0; i < 3; i++) if (q <= k[i+1][0]){ L = k[i][1] + (q - k[i][0]) / (k[i+1][0] - k[i][0]) * (k[i+1][1] - k[i][1]); break; }
  var cum = g._cum, pts = g.route;
  for (var j = 1; j < cum.length; j++) if (L <= cum[j]){
    var f = (L - cum[j-1]) / (cum[j] - cum[j-1] || 1);
    return [pts[j-1][0] + f * (pts[j][0] - pts[j-1][0]), pts[j-1][1] + f * (pts[j][1] - pts[j-1][1])];
  }
  return pts[pts.length - 1].slice();
}
prepRoute(GEO.body); prepRoute(GEO.tree);

/* =========================================================
   3) TEXTOS
   ========================================================= */
var AIS_I18N = {

    phase: { inhale: 'Breathe in', anchor: 'Stay', exhale: 'Breathe out', pause: 'Pause' },

var BreathingIllustration = (function(){
  var NS = 'http://www.w3.org/2000/svg';
  var stage = document.getElementById('paraStage');
  var haloEl = document.getElementById('breathHalo');
  var dotEl = document.getElementById('flowDot');
  var airEl = document.getElementById('airDot');
  var anchorEl = document.getElementById('anchorHalo'), anchorScale = document.getElementById('anchorScale');
  var trailSoft = document.getElementById('trailSoft'), trailCore = document.getElementById('trailCore');
  var phLbl = document.getElementById('phLbl'), phNum = document.getElementById('phNum'), phHint = document.getElementById('phHint');
  var ui = { lang: 'es', view: 'body' };
  var zoneEls = { body: {}, tree: {} };
  var tapCb = null;
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  function el(tag, attrs, parent){ var e = document.createElementNS(NS, tag); for (var k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }

  function build(view, root){
    var g = GEO[view];
    ['z1','z2','z3'].forEach(function(z){
      var grp = el('g', { 'class': 'zone', 'data-zone': z }, root);
      var gl = g.glow[z];
      el('circle', { 'class': 'zone-glow', cx: gl[0], cy: gl[1], r: gl[2], fill: 'url(#gZone)' }, grp);
      var p = g.route[g.anchors[z]];
      el('circle', { 'class': 'zone-dot', cx: p[0], cy: p[1], r: 7 }, grp);
      var h = g.hits[z];
      el('ellipse', { 'class': 'zone-mark', cx: h[0], cy: h[1], rx: Math.max(40, h[2] * 0.72), ry: Math.max(34, h[3] * 0.72) }, grp);
      var lb = g.labels[z], lg = el('g', { 'class': 'zone-label' }, grp);
      el('line', { x1: p[0] + 14, y1: p[1], x2: lb[0] - 6, y2: lb[1] }, lg);
      var rect = el('rect', { x: lb[0], y: lb[1] - 22, rx: 22, ry: 22, height: 44, width: 160 }, lg);
      var tx = el('text', { x: lb[0] + 18, y: lb[1] + 8 }, lg);
      var hit = el('ellipse', { 'class': 'hit-zone', 'data-zone': z, cx: h[0], cy: h[1], rx: h[2], ry: h[3], tabindex: '0', role: 'button' }, grp);
      hit.addEventListener('click', function(e){ e.preventDefault(); toggleNoticed(z); });
      hit.addEventListener('keydown', function(e){ if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); toggleNoticed(z); } });
      zoneEls[view][z] = { grp: grp, glow: grp.children[0], dot: grp.children[1], rect: rect, text: tx, hit: hit };
    });
  }
  build('body', document.getElementById('zonesBody'));
  build('tree', document.getElementById('zonesTree'));

  function toggleNoticed(z){
    var st = AISEngine.state;
    st.noticedZone = st.noticedZone === z ? null : z;
    paintNoticed();
    if (tapCb) tapCb(st.noticedZone);
  }
  function paintNoticed(){
    ['body','tree'].forEach(function(v){
      ['z1','z2','z3'].forEach(function(z){
        zoneEls[v][z].grp.classList.toggle('noticed', AISEngine.state.noticedZone === z);
        zoneEls[v][z].hit.setAttribute('aria-pressed', AISEngine.state.noticedZone === z ? 'true' : 'false');
      });
    });
  }

  function paintLabels(){
    var t = AIS_I18N[ui.lang];
    ['body','tree'].forEach(function(v){
      ['z1','z2','z3'].forEach(function(z){
        var o = zoneEls[v][z], name = t.zones[v][z];
        o.text.textContent = name;
        o.rect.setAttribute('width', Math.round(name.length * 17.5 + 36));   /* ancho por nº de caracteres: evita getBBox en elementos ocultos (Safari) */
        o.hit.setAttribute('aria-label', t.aria[z].replace('{z}', t.zin[v][z]));
      });
    });
  }

  function pathFrom(g, qs){
    var d = '';
    for (var i = 0; i < qs.length; i++){ var p = pointAt(g, qs[i]); d += (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1); }
    return d;
  }

  var lastPhase = null, lastN = null;
  function render(s, ms){
    var g = GEO[ui.view], zs = zoneEls[ui.view];
    if (!s){   /* reposo */
      haloEl.style.transform = 'translate(-50%,-50%) scale(.86)'; haloEl.style.opacity = '.35';
      dotEl.style.opacity = 0; airEl.style.opacity = 0; anchorEl.style.opacity = 0;
      trailSoft.setAttribute('d', ''); trailCore.setAttribute('d', '');
      ['body','tree'].forEach(function(v){ ['z1','z2','z3'].forEach(function(z){ var o = zoneEls[v][z]; o.glow.style.opacity = 0; o.dot.style.opacity = 0; o.grp.classList.remove('on'); }); });
      stage.classList.remove('running'); lastPhase = null; lastN = null;
      return;
    }
    stage.classList.add('running');

    /* halo de respiración: solo transform + opacity */
    var b = reduce ? 0.93 : s.breath;
    haloEl.style.transform = 'translate(-50%,-50%) scale(' + b.toFixed(4) + ')';
    haloEl.style.opacity = (0.45 + (s.breath - 0.86) / 0.14 * 0.4).toFixed(3);

    /* DOS LUCES:
       · AZUL = aire → baja al inhalar y sube/sale al exhalar (sigue s.q).
       · AMARILLA = conciencia → baja siguiendo al aire (el aire es el cebo) y se
         QUEDA en las raíces (luz de anclaje); no sube al exhalar. */
    var p = pointAt(g, s.q);
    airEl.setAttribute('transform', 'translate(' + p[0].toFixed(1) + ' ' + p[1].toFixed(1) + ')');
    airEl.style.opacity = (s.phase === 'pause' ? 0 : (s.phase === 'anchor' ? s.dot * 0.55 : s.dot)).toFixed(3);
    if (s.phase === 'inhale'){
      /* la conciencia NACE en la copa/frente (q pequeño) y baja por el tronco hasta las raíces */
      var cq = Math.max(0, s.q - 0.06), cp = mindPointAt(g, cq);
      var fade = Math.max(0, Math.min(1, (1 - s.progress) / 0.2));   /* se funde en las raíces al final */
      dotEl.setAttribute('transform', 'translate(' + cp[0].toFixed(1) + ' ' + cp[1].toFixed(1) + ')');
      dotEl.style.opacity = (s.dot * fade).toFixed(3);
    } else { dotEl.style.opacity = 0; }
    /* estela del aire: azul al exhalar (sube/sale), cálida al inhalar */
    if (!reduce && (s.phase === 'inhale' || s.phase === 'exhale')){
      var back = AISEngine.at(Math.max(0, ms - 520)), qs = [];
      var q0 = back.phase === s.phase ? back.q : (s.phase === 'inhale' ? 0 : 1);
      for (var i = 0; i <= 8; i++) qs.push(q0 + (s.q - q0) * i / 8);
      var d = pathFrom(g, qs);
      trailSoft.setAttribute('d', d); trailCore.setAttribute('d', d);
      trailSoft.style.opacity = (s.dot * 0.28).toFixed(3); trailCore.style.opacity = (s.dot * 0.9).toFixed(3);
      var ex = s.phase === 'exhale';
      trailSoft.style.stroke = ex ? '#7CC4E6' : '#FFE9B8';
      trailCore.style.stroke = ex ? '#EAF6FF' : '#FFF3D6';
    } else { trailSoft.setAttribute('d', ''); trailCore.setAttribute('d', ''); }

    /* anclaje en barriga/raíces: aparece y permanece como huella */
    var ap = g.route[g.anchors.z3];
    var breathe = (s.phase === 'anchor' && !reduce) ? 1 + 0.05 * Math.sin(s.progress * Math.PI) : 1;
    anchorEl.setAttribute('transform', 'translate(' + ap[0] + ' ' + ap[1] + ')');
    anchorScale.setAttribute('transform', 'scale(' + breathe.toFixed(4) + ')');
    anchorEl.style.opacity = s.anchor.toFixed(3);

    /* zona activa = cercanía de la atención a cada zona */
    var best = null, bestV = 0;
    ['z1','z2','z3'].forEach(function(z){
      var v = Math.max(0, 1 - Math.abs(s.q - ZQ[z]) / 0.3) * s.dot;
      if (s.phase === 'anchor' && z === 'z3') v = 1;
      var o = zs[z];
      o.glow.style.opacity = (v * 0.85).toFixed(3);
      o.dot.style.opacity = (v * 0.9).toFixed(3);
      if (v > bestV){ bestV = v; best = z; }
    });
    var active = bestV > 0.45 ? best : null;
    AISEngine.state.activeZone = active;
    ['body','tree'].forEach(function(v){ ['z1','z2','z3'].forEach(function(z){ zoneEls[v][z].grp.classList.toggle('on', z === active); }); });

    /* texto de fase */
    if (s.phase !== lastPhase || s.n !== lastN){
      var t = AIS_I18N[ui.lang];
      phLbl.textContent = t.phase[s.phase];
      phNum.textContent = s.n;
      phHint.textContent = t.hint[s.phase];
      lastPhase = s.phase; lastN = s.n;
    }
  }
  AISEngine.on(render);

  return {
    setView: function(v){
      ui.view = v; AISEngine.state.view = v;
      stage.setAttribute('data-view', v);
      /* No se toca el temporizador: el siguiente frame dibuja el mismo q en la otra ilustración. */
      if (!AISEngine.state.running) render(null, 0);
    },
    setLang: function(l){ ui.lang = l; lastPhase = null; paintLabels(); },
    toggleHits: function(on){ stage.classList.toggle('show-hits', on); },
    onZoneTap: function(fn){ tapCb = fn; },
    setNoticed: function(z){ AISEngine.state.noticedZone = z; paintNoticed(); },
    init: function(){ paintLabels(); paintNoticed(); render(null, 0); }
  };
})();

  var t=U(), defs=fieldSet(), wrap=el('fields'); wrap.innerHTML='';
  var canVoice=speechAvailable();
  if(canVoice){ var hint=document.createElement('div'); hint.className='michint'; hint.innerHTML=MIC_SVG_SM+'<span>'+t.michint+'</span>'; wrap.appendChild(hint); }
  defs.forEach(function(f){
    var key=fieldKey(f);
    var d=document.createElement('div'); d.className='field';
    var lab=document.createElement('label'); lab.textContent=f[1];
    var row=document.createElement('div'); row.className='row';
    var ta=document.createElement('textarea'); ta.rows=1; ta.setAttribute('placeholder',f[2]); ta.value=state.vals[key]||'';
    ta.addEventListener('input',function(){ state.vals[key]=ta.value; ta.style.height='auto'; ta.style.height=ta.scrollHeight+'px'; renderPreview(); });
    row.appendChild(ta);
    if(canVoice) row.appendChild(makeMic(ta,key));
    d.appendChild(lab); d.appendChild(row); wrap.appendChild(d);
    if(ta.value){ ta.style.height='auto'; ta.style.height=ta.scrollHeight+'px'; }
  });
  var t2=U();
  el('prevTitle').textContent = state.sit==='relevo'?t2.prevRelevo:(state.dir==='up'?t2.prevUp:t2.prevDown);
  renderPreview();
}
function buildMessage(){
  var defs=fieldSet(), lines=[];
  defs.forEach(function(f){ var v=(state.vals[fieldKey(f)]||'').trim(); if(v) lines.push(f[1].toUpperCase()+': '+v); });
  return lines.join('\n');
}
function renderPreview(){
  var msg=buildMessage(), body=el('prevBody');
  if(msg){ body.textContent=msg; body.classList.remove('empty'); }
  else { body.textContent=U().empty; body.classList.add('empty'); }
}

/* VERIFICA */
function renderVerifica(){
  var t=U(); el('verQ').textContent=t.verQ;
  el('verBack').textContent=t.verBack; el('verDone').textContent=t.verDone;
  el('microV').textContent = SITU[state.sit].micro[LANG];
  var wrap=el('checks'); wrap.innerHTML='';
  t.checks.forEach(function(c,i){
    var b=document.createElement('button'); b.type='button'; b.className='chk'+(state.checks[i]?' on':'');
    b.innerHTML='<span class="bx">✓</span><span>'+c+'</span>';
    b.addEventListener('click',function(){ state.checks[i]=!state.checks[i]; b.classList.toggle('on',state.checks[i]); });
    wrap.appendChild(b);
  });
}

/* ---------- navigation ---------- */
function openFlow(k){
  state.sit=k; state.momento=null; state.step='para'; state.dir='down'; state.vals={}; state.checks={}; state.exOpen=false;
  setScreen('s-flow'); renderCtx(); showStep('para');
}
function openMomento(k){
  state.sit=null; state.momento=k; state.step='para'; state.dir='down'; state.vals={}; state.checks={}; state.exOpen=false; state.anchor=null;
  if(MOMENTOS[k].figMode) state.figMode=MOMENTOS[k].figMode;
  setScreen('s-flow'); renderCtx(); showStep('para');
}
function home(){ stopBreath(); stopRec(); state.momento=null; goEntry(); }
function setLang(l){
  stopRec(); LANG=l;
  el('l-es').classList.toggle('on',l==='es'); el('l-en').classList.toggle('on',l==='en');
  document.documentElement.lang=l;
  renderEntry();
  if(el('s-home').classList.contains('on')) renderList();
  if(el('s-diario').classList.contains('on')) renderDiario();
  if(el('s-flow').classList.contains('on')){ renderCtx(); showStep(state.step); }
}
function setDir(d){ stopRec(); state.dir=d; renderComunica(); }

/* ---------- events ---------- */
el('l-es').addEventListener('click',function(){setLang('es');});
el('l-en').addEventListener('click',function(){setLang('en');});
el('breatheBtn').addEventListener('click',function(){ tap('curiosidad'); openMomento('respiro'); });
el('entryCur').addEventListener('click',function(){ goBranch('curiosidad'); });
el('entryCon').addEventListener('click',function(){ goBranch('control'); });
el('diarioLink').addEventListener('click',function(){ renderDiario(); setScreen('s-diario'); window.scrollTo(0,0); });
el('listBack').addEventListener('click',goEntry);
el('diaBack').addEventListener('click',goEntry);
el('diarioClear').addEventListener('click',clearDiario);
el('diarioActivate').addEventListener('click',activateDiario);
el('diarioDeact').addEventListener('click',deactivateDiario);
el('exBtn').addEventListener('click',function(){ state.exOpen=!state.exOpen; renderCtx(); });
el('dir-down').addEventListener('click',function(){setDir('down');});
el('dir-up').addEventListener('click',function(){setDir('up');});
BreathingIllustration.onZoneTap(function(zk){ setAnchor(zk ? AISZR[zk] : null); });
el('startBtn').addEventListener('click',function(){
  if(state.step!=='para'||AISEngine.state.running)return;
  if(!state.anchor){
    if(state.momento){ state.anchor='belly'; } /* curiosidad → destino: las raíces */
    else { return; } /* situaciones: hay que anclar primero */
  }
  startBreath();
});
if(AIS_DEBUG){ /* solo pruebas: zonas táctiles visibles + estado */
  var dbg=document.createElement('div'); dbg.className='ais-debug';
  dbg.innerHTML='<label><input type="checkbox" id="aisHits"> zonas táctiles</label><pre id="aisState"></pre>';
  el('aisRhythm').parentNode.insertBefore(dbg, el('aisRhythm').nextSibling);
  el('aisHits').addEventListener('change',function(){ BreathingIllustration.toggleHits(this.checked); });
  AISEngine.on(function(){ var s=AISEngine.state; el('aisState').textContent=
    'breathPhase '+s.breathPhase+'\nattentionPos '+s.attentionPos.toFixed(2)+'\nactiveZone '+(s.activeZone||'—')+'\nnoticedZone '+(s.noticedZone||'—')+'\nbreathCount '+s.breathCount+'\nview '+s.view; });
}
el('paraBack').addEventListener('click',home);
el('paraNext').addEventListener('click',function(){ if(state.momento){ home(); return; } showStep('ordena');});
el('ordBack').addEventListener('click',function(){showStep('para');});
el('ordNext').addEventListener('click',function(){showStep('comunica');});
el('comBack').addEventListener('click',function(){showStep('ordena');});
el('comNext').addEventListener('click',function(){showStep('verifica');});
el('verBack').addEventListener('click',function(){showStep('comunica');});
el('verDone').addEventListener('click',home);
el('copyBtn').addEventListener('click',function(){
  var msg=buildMessage(); if(!msg)return;
  var btn=el('copyBtn'), done=function(){ btn.classList.add('copied'); btn.textContent=U().copied; setTimeout(function(){btn.classList.remove('copied');btn.textContent=U().copy;},1600); };
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(msg).then(done,function(){fallbackCopy(msg);done();}); }
  else { fallbackCopy(msg); done(); }
});
function fallbackCopy(txt){var ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');}catch(e){}document.body.removeChild(ta);}

/* ---------- service worker (offline) ---------- */
if('serviceWorker' in navigator){
  window.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}

/* ---------- init ---------- */
BreathingIllustration.init();
renderEntry();
</script>
</body>
</html>
