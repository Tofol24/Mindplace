<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Formentor Flow · Manager</title>
<meta name="theme-color" content="#103A44">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Flow Manager">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icon.svg">
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  :root{
    --mar:#103A44; --mar-2:#1B5A68; --mar-3:#2E7C8A;
    --pi:#5C7A56; --pi-2:#47623F;
    --arena:#C7B393; --llauto:#A87C39; --llauto-2:#855F26;
    --clay:#B0563A; --clay-2:#8F4229;
    --piedra:#F4F0E8; --piedra-2:#ECE6DA; --blanc:#FCFBF7;
    --tinta:#17242A; --tinta-2:#4E5A5F; --tinta-3:#7A848A;
    --linia:#DDD6C8; --linia-2:#E9E3D6;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:"SFMono-Regular","SF Mono",ui-monospace,Menlo,Consolas,monospace;
  }
  html,body{height:100%;}
  body{font-family:var(--sans);background:var(--mar);color:var(--tinta);-webkit-font-smoothing:antialiased;line-height:1.5;display:flex;justify-content:center;}
  .app{width:100%;max-width:440px;background:var(--piedra);min-height:100dvh;display:flex;flex-direction:column;position:relative;box-shadow:0 0 60px rgba(0,0,0,.25);}

  header{background:var(--mar);color:var(--blanc);padding:calc(env(safe-area-inset-top) + 14px) 18px 14px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10;}
  header .mk{width:30px;height:30px;flex:none;}
  header .ht{flex:1;}
  header .ht .b{font-family:var(--serif);font-size:1.05rem;line-height:1.1;}
  header .ht .s{font-family:var(--mono);font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--arena);margin-top:2px;}
  .lang{display:flex;gap:4px;flex:none;}
  .lang button{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.06em;color:rgba(255,255,255,.7);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:16px;padding:6px 9px;cursor:pointer;min-height:32px;}
  .lang button.on{background:var(--arena);color:var(--mar);border-color:var(--arena);}

  main{flex:1;padding:20px 18px;overflow-y:auto;}
  footer{padding:12px 18px calc(env(safe-area-inset-bottom) + 14px);font-family:var(--mono);font-size:9px;letter-spacing:.04em;color:var(--tinta-3);text-align:center;border-top:1px solid var(--linia-2);background:var(--piedra);}

  .screen{display:none;animation:fade .32s ease;}
  .screen.on{display:block;}
  @keyframes fade{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
  @media(prefers-reduced-motion:reduce){.screen.on{animation:none;}}

  h1{font-family:var(--serif);font-size:1.5rem;line-height:1.12;margin-bottom:6px;}
  .lead{color:var(--tinta-2);font-size:.95rem;margin-bottom:18px;}

  /* home */
  .sits{display:flex;flex-direction:column;gap:9px;}
  .sit{display:flex;align-items:center;gap:13px;width:100%;text-align:left;background:var(--blanc);border:1px solid var(--linia);border-radius:14px;padding:15px 16px;font-family:var(--sans);font-size:1.0rem;font-weight:600;color:var(--tinta);cursor:pointer;min-height:56px;transition:transform .12s,border-color .12s;}
  .sit:hover{border-color:var(--mar-2);transform:translateX(2px);}
  .sit:active{transform:scale(.99);}
  .sit:focus-visible{outline:2px solid var(--llauto);outline-offset:2px;}
  .sit .d{width:14px;height:14px;border-radius:50%;flex:none;}
  .sit .ar{margin-left:auto;color:var(--tinta-3);font-size:1.1rem;}
  .privacy{margin-top:18px;background:var(--piedra-2);border:1px solid var(--linia);border-radius:11px;padding:13px 15px;font-size:.84rem;color:var(--tinta-2);}
  .privacy b{color:var(--tinta);}

  /* step bar */
  .stepbar{display:flex;gap:5px;margin-bottom:14px;}
  .stepbar .s{flex:1;text-align:center;font-family:var(--mono);font-size:9px;letter-spacing:.06em;text-transform:uppercase;padding:8px 0;border-radius:20px;background:var(--piedra-2);color:var(--tinta-3);border:1px solid var(--linia);cursor:pointer;}
  .stepbar .s.on{background:var(--mar);color:var(--blanc);border-color:var(--mar);}
  .stepbar .s.done{background:var(--blanc);color:var(--pi-2);border-color:var(--pi);}

  .ctx{display:flex;align-items:center;gap:8px;margin-bottom:14px;}
  .ctx .d{width:11px;height:11px;border-radius:50%;flex:none;}
  .ctx .nm{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--tinta-2);}
  .ctx .ex{margin-left:auto;font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--llauto-2);background:none;border:1px solid var(--linia);border-radius:16px;padding:6px 11px;cursor:pointer;}
  .ctx .ex:focus-visible{outline:2px solid var(--llauto);outline-offset:2px;}

  .example{display:none;background:var(--blanc);border:1px solid var(--linia);border-radius:13px;padding:14px 16px;margin-bottom:16px;}
  .example.on{display:block;}
  .example .ln{font-size:.9rem;line-height:1.5;padding:8px 0;}
  .example .ln.bad{color:var(--clay-2);border-bottom:1px dashed var(--linia);}
  .example .ln.good{color:var(--pi-2);}
  .example .mk{font-weight:700;margin-right:6px;}

  /* para */
  .breath{display:grid;place-items:center;padding:14px 0 6px;}
  .ring{width:150px;height:150px;border-radius:50%;border:2px solid var(--mar-3);display:grid;place-items:center;color:var(--mar-2);transform:scale(.7);will-change:transform,opacity;}
  /* la respiración la anima startBreath() por JS: la escala del círculo se calcula por frame según inhala/retén/exhala */
  .ring .bl{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;}
  .ring .bn{display:block;font-family:var(--serif);font-size:28px;line-height:1;margin-top:4px;}
  .ring-txt{text-align:center;pointer-events:none;}
  .para-q{font-family:var(--serif);font-size:1.3rem;line-height:1.2;color:var(--mar);text-align:center;margin:14px 4px 12px;}
  .para-x{background:var(--blanc);border:1px solid var(--linia);border-radius:14px;padding:15px 17px;margin-bottom:8px;font-size:.93rem;color:var(--tinta);}
  .para-x em{color:var(--llauto-2);font-style:italic;}

  /* ordena */
  .qlist{list-style:none;display:flex;flex-direction:column;gap:9px;}
  .qlist li{background:var(--blanc);border:1px solid var(--linia);border-left:3px solid var(--llauto);border-radius:12px;padding:12px 14px;font-size:.95rem;line-height:1.4;}
  .qlist li.key{border-left-color:var(--mar);background:#EEF3F1;font-weight:600;color:var(--mar);}

  /* comunica */
  .dirtog{display:flex;gap:8px;margin-bottom:14px;}
  .dirtog button{flex:1;font-family:var(--mono);font-size:10px;letter-spacing:.05em;text-transform:uppercase;font-weight:600;padding:11px 6px;border-radius:22px;border:1px solid var(--linia);background:var(--blanc);color:var(--tinta-2);cursor:pointer;min-height:44px;}
  .dirtog button.on{background:var(--pi);color:var(--blanc);border-color:var(--pi);}
  .field{margin-bottom:9px;}
  .field .row{display:flex;gap:8px;align-items:flex-start;}
  .mic{flex:none;width:46px;min-height:46px;border-radius:11px;border:1px solid var(--linia);background:var(--blanc);color:var(--mar-2);display:grid;place-items:center;cursor:pointer;}
  .mic svg{width:19px;height:19px;}
  .mic.rec{background:var(--clay);color:#fff;border-color:var(--clay);animation:micpulse 1.2s ease-in-out infinite;}
  @keyframes micpulse{0%,100%{box-shadow:0 0 0 0 rgba(176,86,58,.5);}50%{box-shadow:0 0 0 7px rgba(176,86,58,0);}}
  @media(prefers-reduced-motion:reduce){.mic.rec{animation:none;}}
  .michint{font-size:.8rem;color:var(--tinta-2);margin:0 0 12px;display:flex;align-items:center;gap:7px;}
  .golden{font-family:var(--serif);font-style:italic;font-size:.94rem;color:var(--mar-2);background:var(--piedra-2);border:1px solid var(--linia);border-left:3px solid var(--llauto);border-radius:11px;padding:11px 14px;margin-bottom:12px;line-height:1.4;}
  .golden .el{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--llauto-2);font-style:normal;margin-bottom:5px;}
  .field label{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--tinta-3);margin-bottom:5px;}
  .field textarea{width:100%;flex:1;background:var(--blanc);border:1px solid var(--linia);border-radius:11px;padding:11px 13px;font-family:var(--sans);font-size:.96rem;color:var(--tinta);resize:none;line-height:1.4;min-height:44px;}
  .field textarea:focus{outline:none;border-color:var(--mar-2);box-shadow:0 0 0 3px rgba(46,124,138,.12);}
  .field textarea::placeholder{color:var(--tinta-3);opacity:.8;}
  .preview{background:var(--mar);color:#EAF1EF;border-radius:14px;padding:13px 15px;margin-top:6px;}
  .preview h5{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--arena);margin-bottom:9px;}
  .preview pre{font-family:var(--mono);font-size:12px;line-height:1.55;white-space:pre-wrap;word-break:break-word;color:#EAF1EF;}
  .preview .empty{color:rgba(234,241,239,.45);font-style:italic;font-family:var(--sans);font-size:.9rem;}
  .micro{margin-top:12px;font-family:var(--serif);font-style:italic;font-size:.95rem;color:var(--mar-2);text-align:center;line-height:1.4;}

  /* verifica */
  .vq{font-family:var(--serif);font-size:1.18rem;line-height:1.25;color:var(--mar);margin-bottom:14px;}
  .checks{display:flex;flex-direction:column;gap:8px;}
  .chk{display:flex;align-items:center;gap:12px;background:var(--blanc);border:1px solid var(--linia);border-radius:12px;padding:13px 15px;font-size:.95rem;color:var(--tinta);cursor:pointer;text-align:left;}
  .chk .bx{width:22px;height:22px;border-radius:6px;border:2px solid var(--linia);flex:none;display:grid;place-items:center;color:transparent;font-size:13px;}
  .chk.on{border-color:var(--pi);}
  .chk.on .bx{background:var(--pi);border-color:var(--pi);color:#fff;}

  .actions{display:flex;gap:9px;margin-top:18px;}
  .btn{flex:1;font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;padding:14px 10px;border-radius:24px;border:1px solid var(--linia);background:var(--blanc);color:var(--tinta);cursor:pointer;min-height:48px;}
  .btn.primary{background:var(--mar);color:var(--blanc);border-color:var(--mar);}
  .btn.gold{background:var(--llauto);color:var(--blanc);border-color:var(--llauto);}
  .btn:active{transform:scale(.98);}
  .btn.copied{background:var(--pi);color:var(--blanc);border-color:var(--pi);}
</style>
</head>
<body>
<div class="app">
  <header>
    <svg class="mk" viewBox="0 0 32 32" fill="none" aria-hidden="true"><circle cx="16" cy="16" r="15" stroke="#C7B393" stroke-width="1.3"/><path d="M6 20c3.2 0 3.2-9 6.5-9s3.3 9 6.5 9 3.2-9 6.5-9" stroke="#FCFBF7" stroke-width="1.7" stroke-linecap="round"/></svg>
    <div class="ht"><div class="b">Formentor Flow</div><div class="s" id="hsub">Manager</div></div>
    <div class="lang">
      <button id="l-es" class="on" type="button">ES</button>
      <button id="l-en" type="button">EN</button>
    </div>
  </header>

  <main>
    <!-- HOME -->
    <section class="screen on" id="s-home">
      <h1 id="home-q"></h1>
      <p class="lead" id="home-l"></p>
      <div class="sits" id="sits"></div>
      <div class="privacy" id="home-priv"></div>
    </section>

    <!-- FLOW -->
    <section class="screen" id="s-flow">
      <div class="stepbar" id="stepbar"></div>
      <div class="ctx">
        <span class="d" id="ctxDot"></span><span class="nm" id="ctxName"></span>
        <button class="ex" id="exBtn" type="button"></button>
      </div>
      <div class="example" id="example"></div>

      <!-- PARA -->
      <div class="step-body" id="st-para">
        <div class="breath"><div class="ring" id="ring"><div class="ring-txt" id="ringTxt"></div></div></div>
        <div class="para-q" id="paraQ"></div>
        <div class="para-x" id="paraX"></div>
        <div class="actions">
          <button class="btn" id="paraBack" type="button"></button>
          <button class="btn primary" id="paraNext" type="button"></button>
        </div>
      </div>

      <!-- ORDENA -->
      <div class="step-body" id="st-ordena" style="display:none">
        <ul class="qlist" id="qlist"></ul>
        <div class="actions">
          <button class="btn" id="ordBack" type="button"></button>
          <button class="btn primary" id="ordNext" type="button"></button>
        </div>
      </div>

      <!-- COMUNICA -->
      <div class="step-body" id="st-comunica" style="display:none">
        <div class="dirtog" id="dirtog">
          <button id="dir-down" class="on" type="button"></button>
          <button id="dir-up" type="button"></button>
        </div>
        <div class="golden" id="goldenCue"></div>
        <div id="fields"></div>
        <div class="preview"><h5 id="prevTitle"></h5><pre id="prevBody"></pre></div>
        <div class="micro" id="micro"></div>
        <div class="actions">
          <button class="btn" id="comBack" type="button"></button>
          <button class="btn gold" id="copyBtn" type="button"></button>
        </div>
        <div class="actions" style="margin-top:9px">
          <button class="btn primary" id="comNext" type="button"></button>
        </div>
      </div>

      <!-- VERIFICA -->
      <div class="step-body" id="st-verifica" style="display:none">
        <div class="vq" id="verQ"></div>
        <div class="checks" id="checks"></div>
        <div class="micro" id="microV"></div>
        <div class="actions">
          <button class="btn" id="verBack" type="button"></button>
          <button class="btn primary" id="verDone" type="button"></button>
        </div>
      </div>
    </section>
  </main>

  <footer id="foot"></footer>
</div>

<script>
/* ============================================================
   Formentor Flow · Manager (V2)
   Método Centre APRENS · psicología aplicada al funcionamiento
   organizacional. Sin backend, sin tracking, sin almacenamiento.
   ============================================================ */
var LANG='es';

/* ---------- UI strings ---------- */
var STR={
  es:{
    hsub:"Manager", foot:"Formentor Flow · Manager — método Centre APRENS · en el dispositivo",
    homeQ:"¿Qué necesita el sistema ahora?",
    homeL:"Elige lo que está pasando. Te acompaño en unos pasos para convertir la presión en información.",
    priv:"<b>Esta herramienta no evalúa cómo trabajas. Te ayuda a ordenar cómo responder.</b> Sin cuenta, sin registros, sin analítica y sin conexión propia. El dictado por voz, si lo usas, emplea el reconocimiento del propio dispositivo o navegador.",
    steps:{para:"Para",ordena:"Ordena",comunica:"Comunica",verifica:"Verifica"},
    inhala:"Inhala", reten:"Retén", pausa:"Pausa", exhala:"Exhala", breathStatic:"Inhala 3 · Retén 1 · Exhala 4",
    paraQ:"¿Vas a transmitir información o activación?",

  en:{

    priv:"<b>This tool does not assess how you work. It helps you order how to respond.</b> No account, no records, no analytics and no connection of its own. Voice dictation, if you use it, relies on your device's or browser's own speech recognition.",

    inhala:"Breathe in", reten:"Hold", pausa:"Pause", exhala:"Breathe out", breathStatic:"In 3 · Hold 1 · Out 4",
    paraQ:"Will you pass on information or activation?",

    verBack:"← Communicate", verDone:"↻ New situation",
    dirDown:"Downward", dirUp:"Upward",

    empty:"Fill the fields to see the message…",
    example:"See example", exampleHide:"Hide example",

    eligeLbl:"Choose · before you say it",
    golden:"How do I want to treat this person while we sort this out? How would I want to receive this message?",

    checks:["Knows what to do.","Knows by when.","Knows what's the priority.","Can flag a difficulty.","We know when to check."]
  }
};

/* ---------- situations (order matters) ---------- */
var SITORDER=["incidencia","sobrecarga","conflicto","prioridad","coordinacion","relevo"];
var SITU={
  incidencia:{ color:"#B0563A",
    name:{es:"Incidencia",en:"Incident"},
    ordena:{es:["¿Qué ha ocurrido objetivamente?","¿Afecta al huésped o al servicio?","¿Qué necesita resolverse ahora?","¿Quién tiene capacidad para resolverlo?","¿Quién necesita estar informado?"],
             en:["What happened, objectively?","Does it affect the guest or the service?","What needs solving now?","Who can actually solve it?","Who needs to be informed?"]},
    ex:{es:{bad:"Se ha roto el aire de la 214, arregladlo ya.",good:"Avería de A/C en la 214, con huésped dentro. Mantenimiento: prioridad alta, antes de las 15:00. Recepción informada por si procede recolocar."},

  sobrecarga:{ color:"#A87C39",

             en:["Which demands are competing?","What's really the priority?","What can wait?","What resource is missing?","What do we change: deadline, priority or resources?"]},
    ex:{es:{bad:"No llegamos. Falta gente y todo es urgente.",good:"Tenemos tres demandas simultáneas. Con los recursos actuales garantizamos A y B antes de las 18:00. Para incorporar C necesitamos modificar plazo, prioridad o recursos."},

    micro:{es:"Priorizar también es decidir qué puede esperar.",en:"Prioritising is also deciding what can wait."} },
  conflicto:{ color:"#8F4229",
    name:{es:"Conflicto",en:"Conflict"},

    ex:{es:{bad:"Housekeeping siempre nos retrasa, así es imposible.",good:"Dos habitaciones VIP no estaban listas a la hora acordada; afecta al check-in. Propongo alinear con Housekeeping el orden de prioridad de las VIP para hoy."},
        en:{bad:"Housekeeping always delays us, it's impossible.",good:"Two VIP rooms weren't ready at the agreed time; it affects check-in. I propose aligning the VIP priority order with Housekeeping for today."}},
    micro:{es:"Antes de responder, separa lo ocurrido de lo que interpretas.",en:"Before responding, separate what happened from what you interpret."} },
  prioridad:{ color:"#1B5A68",
    name:{es:"Cambio de prioridad",en:"Priority change"},
    ordena:{es:["¿Qué nueva prioridad aparece?","¿Por qué?","Si esto pasa a ser prioritario, ¿qué deja de serlo?","¿Quién necesita conocer el cambio?","¿Qué impacto tendrá?"],

        en:{bad:"Everyone on the group arrival now, drop what you're doing.",good:"VIP group arrives at 17:00: it becomes the priority. We push room B setup to 19:00. Front desk and F&B, confirm the change."}},
    micro:{es:"Una nueva prioridad necesita desplazar otra.",en:"A new priority needs to displace another."} },
  coordinacion:{ color:"#5C7A56",
    name:{es:"Coordinación",en:"Coordination"},
    ordena:{es:["¿Quién necesita saber qué?","¿Quién es responsable?","¿Qué dependencia existe entre departamentos?","¿Qué plazo existe?","¿Cómo comprobaremos que la coordinación se ha producido?"],
             en:["Who needs to know what?","Who is responsible?","What dependency exists between departments?","What's the deadline?","How will we check coordination happened?"]},
    ex:{es:{bad:"Que alguien avise a cocina de lo del evento.",good:"Evento de 40 pax a las 20:30. Cocina: menú confirmado. Sala: montaje a las 19:30. Mantenimiento: luces a las 19:00. Revisamos a las 19:45 que todo esté listo."},
        en:{bad:"Someone tell the kitchen about the event.",good:"Event for 40 pax at 20:30. Kitchen: menu confirmed. Floor: setup at 19:30. Maintenance: lighting at 19:00. We check at 19:45 that all is ready."}},
    micro:{es:"Coordinar termina cuando todos saben qué reciben y cuándo.",en:"Coordination ends when everyone knows what they get and when."} },
  relevo:{ color:"#2E7C8A",
    name:{es:"Relevo",en:"Handover"},
    ordena:{es:["¿Qué queda pendiente?","¿En qué estado está?","¿Quién asume la responsabilidad?","¿Qué prioridad tiene?","¿Cuándo debe revisarse?"],
             en:["What's still pending?","What state is it in?","Who takes responsibility?","What priority is it?","When should it be reviewed?"]},
    ex:{es:{bad:"Te dejo el turno, ahí queda todo más o menos.",good:"Pendiente: la 305 pide late check-out (sin confirmar). Estado: a la espera de Housekeeping. Responsable turno tarde: [rol]. Prioridad: media. Revisar a las 16:00."},
        en:{bad:"I'm leaving you the shift, it's all more or less there.",good:"Pending: 305 requests late check-out (unconfirmed). State: waiting on Housekeeping. Late-shift owner: [role]. Priority: medium. Review at 16:00."}},
    micro:{es:"Un relevo termina cuando el otro sabe qué recibe.",en:"A handover ends when the other person knows what they receive."} }
};

/* ---------- COMUNICA field sets ---------- */
var FIELDS={
  down:{es:[["que","Qué","Qué hay que hacer, en concreto"],["quien","Quién","Persona o rol responsable"],["cuando","Cuándo","Plazo / momento"],["prioridad","Prioridad","Alta / media / qué va primero"],["criterio","Criterio de finalización","Cómo sabremos que está hecho"]],
        en:[["que","What","What needs doing, specifically"],["quien","Who","Person or role responsible"],["cuando","When","Deadline / moment"],["prioridad","Priority","High / medium / what comes first"],["criterio","Done when","How we'll know it's complete"]]},
  up:{es:[["situacion","Situación","Qué está pasando, en una frase"],["impacto","Impacto","A quién / a qué afecta"],["necesidad","Necesidad","Qué decisión o recurso hace falta"],["propuesta","Propuesta","Qué propones tú"]],
      en:[["situacion","Situation","What's happening, in one line"],["impacto","Impact","Who / what it affects"],["necesidad","Need","What decision or resource is required"],["propuesta","Proposal","What you propose"]]},
  relevo:{es:[["pendiente","Pendiente","Qué queda por hacer"],["estado","Estado","En qué punto está"],["responsable","Responsable","Quién lo asume"],["prioridad","Prioridad","Alta / media / baja"],["revision","Siguiente revisión","Cuándo se comprueba"]],
          en:[["pendiente","Pending","What's left to do"],["estado","State","Where it stands"],["responsable","Owner","Who takes it on"],["prioridad","Priority","High / medium / low"],["revision","Next review","When it's checked"]]}
};
/* which microphrase to show in COMUNICA, by direction (falls back to situation micro) */
var MICRO_DIR={ up:{es:"Comunicar hacia arriba no es quejarse: es facilitar decisiones.",en:"Communicating upward isn't complaining: it's enabling decisions."} };

/* ---------- voice dictation (Web Speech API) ---------- */
var MIC_SVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2.5" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3.2"/></svg>';
var MIC_SVG_SM='<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="flex:none;color:var(--mar-2)"><rect x="9" y="2.5" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3.2"/></svg>';
function speechAvailable(){return !!(window.SpeechRecognition||window.webkitSpeechRecognition);}
var rec=null, recBtn=null, recBase='';
function makeMic(ta,key){
  var b=document.createElement('button');b.type='button';b.className='mic';b.setAttribute('aria-label','Dictar');b.innerHTML=MIC_SVG;
  b.addEventListener('click',function(){ if(rec&&recBtn===b){stopRec();return;} startRec(ta,key,b); });
  return b;
}
function startRec(ta,key,btn){
  stopRec();
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition; if(!SR)return;
  try{rec=new SR();}catch(e){rec=null;return;}
  rec.lang=(LANG==='en'?'en-US':'es-ES'); rec.interimResults=true; rec.continuous=true; rec.maxAlternatives=1;
  recBtn=btn; recBase=ta.value?ta.value.replace(/\s+$/,'')+' ':''; btn.classList.add('rec');
  rec.onresult=function(e){
    var fin='',intp='';
    for(var i=0;i<e.results.length;i++){var r=e.results[i];if(r.isFinal)fin+=r[0].transcript+' ';else intp+=r[0].transcript;}
    var v=(recBase+fin+intp).replace(/\s+/g,' ').replace(/^\s+/,'');
    ta.value=v; state.vals[key]=v; ta.style.height='auto'; ta.style.height=ta.scrollHeight+'px'; renderPreview();
  };
  rec.onerror=function(){stopRec();};
  rec.onend=function(){stopRec();};
  try{rec.start();}catch(e){stopRec();}
}
function stopRec(){ if(rec){try{rec.onend=null;rec.stop();}catch(e){} rec=null;} if(recBtn){recBtn.classList.remove('rec');recBtn=null;} }

/* ---------- state ---------- */
var state={sit:null,step:"para",dir:"down",vals:{},checks:{},exOpen:false};
var STEPS=["para","ordena","comunica","verifica"];
function U(){return STR[LANG];}
function el(id){return document.getElementById(id);}
function setScreen(id){var s=document.querySelectorAll('.screen');for(var i=0;i<s.length;i++)s[i].classList.remove('on');el(id).classList.add('on');}

/* ---------- home ---------- */
function renderHome(){
  var t=U();
  el('hsub').textContent=t.hsub; el('home-q').textContent=t.homeQ; el('home-l').textContent=t.homeL;
  el('home-priv').innerHTML=t.priv; el('foot').textContent=t.foot;
  var wrap=el('sits'); wrap.innerHTML='';
  SITORDER.forEach(function(k){
    var s=SITU[k];
    var b=document.createElement('button'); b.className='sit'; b.type='button';
    b.innerHTML='<span class="d" style="background:'+s.color+'"></span>'+s.name[LANG]+'<span class="ar">→</span>';
    b.addEventListener('click',function(){openFlow(k);});
    wrap.appendChild(b);
  });
}

/* ---------- step bar ---------- */
function renderStepBar(){
  var t=U(), bar=el('stepbar'), idx=STEPS.indexOf(state.step);
  bar.innerHTML='';
  STEPS.forEach(function(k,i){
    var d=document.createElement('div');
    d.className='s'+(i===idx?' on':(i<idx?' done':''));
    d.textContent=t.steps[k];
    d.addEventListener('click',function(){ if(state.sit) showStep(k); });
    bar.appendChild(d);
  });
}

/* ---------- context + example ---------- */
function renderCtx(){
  var s=SITU[state.sit], t=U();
  el('ctxDot').style.background=s.color;
  el('ctxName').textContent=s.name[LANG];
  el('exBtn').textContent=state.exOpen?t.exampleHide:t.example;
  var ex=el('example');
  if(state.exOpen){
    var e=s.ex[LANG];
    ex.innerHTML='<div class="ln bad"><span class="mk">✕</span>'+e.bad+'</div><div class="ln good"><span class="mk">✓</span>'+e.good+'</div>';
    ex.classList.add('on');
  } else { ex.classList.remove('on'); ex.innerHTML=''; }
}

/* ---------- steps ---------- */
function showStep(step){
  stopRec();
  if(step!=='para') stopBreath();
  state.step=step;
  ['para','ordena','comunica','verifica'].forEach(function(k){ el('st-'+k).style.display=(k===step?'block':'none'); });
  renderStepBar();
  if(step==='para')renderPara();
  if(step==='ordena')renderOrdena();
  if(step==='comunica')renderComunica();
  if(step==='verifica')renderVerifica();
}

/* PARA + breathing 4-4 */
function renderPara(){
  var t=U();
  el('paraQ').textContent=t.paraQ;
  el('paraX').innerHTML=t.paraX;
  el('paraBack').textContent=t.paraBack; el('paraNext').textContent=t.paraNext;
  startBreath();
}
var breathRAF=null, breathT0=0;
/* Ritmos de respiración por tipo de situación (regular, no relajar).
   reinicio 3-0-6 (agudo) · foco 4-4-4-4 (box) · bajar 4-2-6 (exhala larga). */
var BREATH={
  reinicio:{cls:'bReinicio',dur:9000, phases:[['in',3],['ex',6]]},
  foco:    {cls:'bFoco',    dur:16000,phases:[['in',4],['hold',4],['ex',4],['pausa',4]]},
  bajar:   {cls:'bBajar',   dur:12000,phases:[['in',4],['hold',2],['ex',6]]}
};
var SITMODE={incidencia:'reinicio',sobrecarga:'foco',prioridad:'foco',coordinacion:'foco',conflicto:'bajar',relevo:'bajar'};
function breathLabel(typ){var u=U();return typ==='in'?u.inhala:typ==='ex'?u.exhala:typ==='pausa'?u.pausa:u.reten;}
function breathStaticTxt(m){return m.phases.map(function(p){return breathLabel(p[0])+' '+p[1];}).join(' · ');}
function breathAt(phases,ms){var t=0;for(var i=0;i<phases.length;i++){var len=phases[i][1]*1000;if(ms<t+len){var n=Math.floor((ms-t)/1000)+1;if(n>phases[i][1])n=phases[i][1];return{type:phases[i][0],n:n};}t+=len;}var L=phases[phases.length-1];return{type:L[0],n:L[1]};}
function bEase(t){ return t*t*(3-2*t); } /* smoothstep */
function startBreath(){
  stopBreath();
  var ring=el('ring');
  var m=BREATH[SITMODE[state.sit]||'foco'];
  var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var MIN=reduce?0.88:0.7, MAX=reduce?1.06:1.12;
  var total=0, bounds=[];
  m.phases.forEach(function(p){ bounds.push([p[0],total,total+p[1]*1000,p[1]]); total+=p[1]*1000; });
  if(ring) ring.style.transform='scale('+MIN+')';
  breathT0=performance.now();
  var last=-1,lastT='';
  (function loop(){
    var r=el('ring'), tx=el('ringTxt'); if(!r||!tx){breathRAF=null;return;}
    var ms=(performance.now()-breathT0)%total;
    var ph=bounds[bounds.length-1];
    for(var i=0;i<bounds.length;i++){ if(ms<bounds[i][2]){ ph=bounds[i]; break; } }
    var typ=ph[0], within=ms-ph[1], len=ph[2]-ph[1], p=len>0?within/len:0, scale;
    if(typ==='in') scale=MIN+(MAX-MIN)*bEase(p);
    else if(typ==='ex') scale=MAX-(MAX-MIN)*bEase(p);
    else if(typ==='hold') scale=MAX;
    else scale=MIN;
    r.style.transform='scale('+scale.toFixed(3)+')';
    r.style.opacity=(0.6+0.4*((scale-MIN)/(MAX-MIN))).toFixed(3);
    var n=Math.floor(within/1000)+1; if(n>ph[3])n=ph[3];
    if(n!==last||typ!==lastT){ tx.innerHTML='<span class="bl">'+breathLabel(typ)+'</span><span class="bn">'+n+'</span>'; last=n; lastT=typ; }
    breathRAF=requestAnimationFrame(loop);
  })();
}
function stopBreath(){ if(breathRAF){cancelAnimationFrame(breathRAF);breathRAF=null;} }

/* ORDENA (adaptive per situation) */
function renderOrdena(){
  var t=U(), ul=el('qlist'); ul.innerHTML='';
  var qs=SITU[state.sit].ordena[LANG];
  qs.forEach(function(q){
    var li=document.createElement('li');
    if(state.sit==='prioridad' && /deja de serlo|stops being/.test(q)) li.className='key';
    li.textContent=q; ul.appendChild(li);
  });
  el('ordBack').textContent=t.ordBack; el('ordNext').textContent=t.ordNext;
}

/* COMUNICA */
function fieldSet(){
  if(state.sit==='relevo') return FIELDS.relevo[LANG];
  return (state.dir==='up')?FIELDS.up[LANG]:FIELDS.down[LANG];
}
function renderComunica(){
  var t=U(), isRelevo=(state.sit==='relevo');
  el('dirtog').style.display=isRelevo?'none':'flex';
  el('dir-down').textContent=t.dirDown; el('dir-up').textContent=t.dirUp;
  el('dir-down').classList.toggle('on',state.dir==='down'); el('dir-up').classList.toggle('on',state.dir==='up');
  el('comBack').textContent=t.comBack; el('comNext').textContent=t.comNext;
  el('copyBtn').textContent=t.copy;
  el('goldenCue').innerHTML='<span class="el">'+t.eligeLbl+'</span>'+t.golden;
  renderFields();
  // microphrase
  var m = (!isRelevo && state.dir==='up') ? MICRO_DIR.up[LANG] : SITU[state.sit].micro[LANG];
  el('micro').textContent = m;
}
function fieldKey(f){ return (state.sit==='relevo'?'rel':state.dir)+'.'+f[0]; }
function renderFields(){
  stopRec();
  var t=U(), defs=fieldSet(), wrap=el('fields'); wrap.innerHTML='';
  var canVoice=speechAvailable();
  if(canVoice){ var hint=document.createElement('div'); hint.className='michint'; hint.innerHTML=MIC_SVG_SM+'<span>'+t.michint+'</span>'; wrap.appendChild(hint); }
  defs.forEach(function(f){
    var key=fieldKey(f);
    var d=document.createElement('div'); d.className='field';
    var lab=document.createElement('label'); lab.textContent=f[1];
    var row=document.createElement('div'); row.className='row';
    var ta=document.createElement('textarea'); ta.rows=1; ta.setAttribute('placeholder',f[2]); ta.value=state.vals[key]||'';
    ta.addEventListener('input',function(){ state.vals[key]=ta.value; ta.style.height='auto'; ta.style.height=ta.scrollHeight+'px'; renderPreview(); });
    row.appendChild(ta);
    if(canVoice) row.appendChild(makeMic(ta,key));
    d.appendChild(lab); d.appendChild(row); wrap.appendChild(d);
    if(ta.value){ ta.style.height='auto'; ta.style.height=ta.scrollHeight+'px'; }
  });
  var t2=U();
  el('prevTitle').textContent = state.sit==='relevo'?t2.prevRelevo:(state.dir==='up'?t2.prevUp:t2.prevDown);
  renderPreview();
}
function buildMessage(){
  var defs=fieldSet(), lines=[];
  defs.forEach(function(f){ var v=(state.vals[fieldKey(f)]||'').trim(); if(v) lines.push(f[1].toUpperCase()+': '+v); });
  return lines.join('\n');
}
function renderPreview(){
  var msg=buildMessage(), body=el('prevBody');
  if(msg){ body.textContent=msg; body.classList.remove('empty'); }
  else { body.textContent=U().empty; body.classList.add('empty'); }
}

/* VERIFICA */
function renderVerifica(){
  var t=U(); el('verQ').textContent=t.verQ;
  el('verBack').textContent=t.verBack; el('verDone').textContent=t.verDone;
  el('microV').textContent = SITU[state.sit].micro[LANG];
  var wrap=el('checks'); wrap.innerHTML='';
  t.checks.forEach(function(c,i){
    var b=document.createElement('button'); b.type='button'; b.className='chk'+(state.checks[i]?' on':'');
    b.innerHTML='<span class="bx">✓</span><span>'+c+'</span>';
    b.addEventListener('click',function(){ state.checks[i]=!state.checks[i]; b.classList.toggle('on',state.checks[i]); });
    wrap.appendChild(b);
  });
}

/* ---------- navigation ---------- */
function openFlow(k){
  state.sit=k; state.step='para'; state.dir='down'; state.vals={}; state.checks={}; state.exOpen=false;
  setScreen('s-flow'); renderCtx(); showStep('para');
}
function home(){ stopBreath(); stopRec(); setScreen('s-home'); }
function setLang(l){
  stopRec(); LANG=l;
  el('l-es').classList.toggle('on',l==='es'); el('l-en').classList.toggle('on',l==='en');
  document.documentElement.lang=l;
  renderHome();
  if(el('s-flow').classList.contains('on')){ renderCtx(); showStep(state.step); }
}
function setDir(d){ stopRec(); state.dir=d; renderComunica(); }

/* ---------- events ---------- */
el('l-es').addEventListener('click',function(){setLang('es');});
el('l-en').addEventListener('click',function(){setLang('en');});
el('exBtn').addEventListener('click',function(){ state.exOpen=!state.exOpen; renderCtx(); });
el('dir-down').addEventListener('click',function(){setDir('down');});
el('dir-up').addEventListener('click',function(){setDir('up');});
el('paraBack').addEventListener('click',home);
el('paraNext').addEventListener('click',function(){showStep('ordena');});
el('ordBack').addEventListener('click',function(){showStep('para');});
el('ordNext').addEventListener('click',function(){showStep('comunica');});
el('comBack').addEventListener('click',function(){showStep('ordena');});
el('comNext').addEventListener('click',function(){showStep('verifica');});
el('verBack').addEventListener('click',function(){showStep('comunica');});
el('verDone').addEventListener('click',home);
el('copyBtn').addEventListener('click',function(){
  var msg=buildMessage(); if(!msg)return;
  var btn=el('copyBtn'), done=function(){ btn.classList.add('copied'); btn.textContent=U().copied; setTimeout(function(){btn.classList.remove('copied');btn.textContent=U().copy;},1600); };
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(msg).then(done,function(){fallbackCopy(msg);done();}); }
  else { fallbackCopy(msg); done(); }
});
function fallbackCopy(txt){var ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');}catch(e){}document.body.removeChild(ta);}

/* ---------- service worker (offline) ---------- */
if('serviceWorker' in navigator){
  window.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}

/* ---------- init ---------- */
renderHome();
</script>
