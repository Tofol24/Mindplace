<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#8aa981">
<title>Cómo funciona esta herramienta · APRENS</title>
</head>
<body>
<div class="top" id="topbar" style="display:none">
  <button id="volverBtn">← Volver</button>
  <div class="rgt"><button id="muteBtn">🔊 Voz</button><button id="exitBtn" aria-label="Salir">✕</button></div>
</div>

<div class="stage" id="cover">
  <div>
    <div class="eyebrow">APRENS · para empezar</div>
    <h1>Cómo funciona esta herramienta</h1>
    <p>Un recorrido breve y tranquilo por lo que encontrarás aquí. Puedes verlo con calma; no tienes que recordar nada.</p>
    <button class="play" id="startBtn">▶ Reproducir</button>
    <div class="mutebar"><button id="coverMute">🔊 Con voz · tocar para silenciar</button></div>
  </div>
</div>

<div class="stage" id="show">
  <div class="art" id="art"></div>
  <div class="cap" id="cap"><p></p></div>
  <div class="dots" id="dots"></div>
  <div class="ctrl">
    <button class="cbtn" id="prevBtn" aria-label="Anterior">‹</button>
    <button class="cbtn big" id="playBtn" aria-label="Pausa">⏸</button>
    <button class="cbtn" id="nextBtn" aria-label="Siguiente">›</button>
  </div>
</div>

<script>
/* ---------- Ilustraciones calmadas ---------- */
function svg(inner,vb){ return '<svg viewBox="'+(vb||'0 0 200 150')+'">'+inner+'</svg>'; }
function orbe(cx,cy,r,mode){ var s='';
  if(mode==='breath') s+='<circle class="breathe" cx="'+cx+'" cy="'+cy+'" r="'+(r*1.7)+'" fill="#cfe0d5" opacity=".45"/>';
  s+='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="#cfe0d5" opacity="'+(mode==='faint'?.3:.9)+'"/>';
  s+='<circle cx="'+cx+'" cy="'+cy+'" r="'+(r*.55)+'" fill="#fbf8f1" opacity="'+(mode==='faint'?.35:.95)+'"/>'; return s; }
function movil(inner){ return '<rect x="58" y="12" width="84" height="128" rx="16" fill="#f4efe6" stroke="#cbbfa8" stroke-width="2"/>'+inner; }
/* tarjeta con un icono de módulo (paths en viewport 24, centrados en la tarjeta) */
function icoCard(x,path){ return '<g transform="translate('+x+',66)">'+
  '<rect x="-30" y="-30" width="60" height="60" rx="14" fill="#f4efe6" stroke="#cbbfa8" stroke-width="2"/>'+
  '<g transform="translate(-12,-12)" fill="none" stroke="#565a41" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+path+'</g></g>'; }
function duo(a,b){ return svg(icoCard(66,a)+icoCard(134,b)); }
var IC={
  entender:'<path d="M12 3a9 9 0 0 0-9 9c0 4 3 6 3 6h12s3-2 3-6a9 9 0 0 0-9-9z"/><path d="M9 21h6"/>',
  orientar:'<circle cx="12" cy="12" r="9"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/><circle cx="12" cy="12" r="1.5"/>',
  acompanar:'<path d="M12 21c-4-2.5-7-5.5-7-9a4 4 0 0 1 7-2.6A4 4 0 0 1 19 12c0 3.5-3 6.5-7 9z"/>',
  diferenciar:'<path d="M8 3v18M16 3v18M3 8h5M16 8h5M3 16h5M16 16h5"/>',
  recuperar:'<path d="M4 20h4v-5h4v-5h4V5h4"/>',
  registrar:'<path d="M4 4h13l3 3v13H4zM8 4v5h8"/><path d="M8 14h8M8 18h5"/>',
  mapa:'<path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/>',
  plan:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>'
};

window.SCENES=[
  { art:svg(orbe(82,80,20,'breath')+orbe(124,82,15,'faint')),
    text:'Esta herramienta acompaña el trabajo con tu profesional. No sustituye tu terapia: va contigo entre sesiones.' },
  { art:svg(movil('<rect x="72" y="26" width="56" height="28" rx="9" fill="#cf9077"/><rect x="94" y="35" width="12" height="12" rx="2.5" fill="#fff"/>')),
    text:'Arriba del todo, siempre, tienes un botón: «Necesito parar». Si algo te agobia, púlsalo y te ayuda a volver al presente. No hace falta terminar nada.' },
  { art:duo(IC.entender,IC.orientar),
    text:'Abajo tienes espacios y vas a tu ritmo. «Entender» lo que te pasa, y «Orientarme» al presente cuando aparezca un sobresalto.' },
  { art:duo(IC.acompanar,IC.diferenciar),
    text:'«Acompañar» la activación con respiración y presencia. Y «Diferenciar» entre un recuerdo, una alarma del cuerpo y un peligro real.' },
  { art:duo(IC.recuperar,IC.registrar),
    text:'«Recuperar», poco a poco, lo que el miedo te había quitado. Y «Registrar» cómo te va, en menos de dos minutos.' },
  { art:duo(IC.mapa,IC.plan),
    text:'«Mi mapa», para ver lo que tu cuerpo aprendió. Y un «Plan» para los momentos difíciles, con tus contactos de apoyo.' },
  { art:svg('<g class="breathe">'+orbe(100,80,22,'breath')+'</g>'),
    text:'Todo se queda solo en tu teléfono. Ve despacio: aquí no tienes que luchar contigo, solo comprenderte y recuperar tu vida, paso a paso.', quote:true }
];
// Voz grabada (01.m4a … 07.m4a).
window.AUDIO_DIR='assets/audio/alerta-guia/';
window.VOLVER='cuerpo-en-alerta.html';
</script>
<script src="assets/historia-engine.js"></script>
</body>
</html>
