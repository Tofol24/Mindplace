NOTA: Esta herramienta es de uso anónimo: no le solicita nombre completo, NIF, email, teléfono ni dirección. Lo que escriba sobre el suceso se queda únicamente en su dispositivo: el código de resultado que envía a su psicólogo contiene solo números, nunca el relato. Es un instrumento complementario de evaluación clínica y no sustituye el consentimiento informado firmado de su proceso asistencial.`;
const CONSENT_OPCIONALES=[
 "Autorizo recibir las sesiones de atención psicológica mediante herramientas de comunicación (p. ej. WhatsApp), que cuentan con cifrado que garantiza la confidencialidad.",
 "Consiento el envío de informes y documentación de los servicios de atención psicológica mediante correo electrónico y/o WhatsApp."
];

/* ═══ CODIFICACIÓN DEL CÓDIGO CORTO ═══
   Formato (sin separadores internos; los guiones son solo visuales):
     AP5 1 <AAMMDD> <alias3> <edad2><sexo> <lec17> <pcl20> <extra7> <func7> <cons> <chk>
   Alfabeto A36 (0-9 A-Z): seguro para WhatsApp, para dictar y para mayúsculas.
   El punto "." marca «sin contestar». Nunca viaja texto clínico en el código.  */
const A36="0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ";
const e36=n=>A36[Math.max(0,Math.min(35,n|0))];
const d36=c=>{const i=A36.indexOf(c);return i<0?0:i;};
/* LEC: máscara de 6 bits → valor 0-17 (16 = "no estoy seguro", 17 = "no me aplica") */
function lecEnc(m){m=m|0;if(m&32)return 17;if(m&16)return 16;return m&15;}
function lecDec(v){return v===17?32:v===16?16:(v&15);}
function checksum(s){let h=7;for(let i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))%36;}return A36[h];}
function agrupa(s){return (s.match(/.{1,5}/g)||[]).join("-");}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
</script>
<script>
/* ══════════════ ESTADO ══════════════ */
let modo=null, vista="selector", S=null, qIdx=0, ultimoCodigo="", informeActual=null, aliasSel=null;

function nuevoS(){
  return {fecha:HOY(),alias:"",edad:"",sexo:"-",lec:{},idx:{ev:0,cuando:0,repet:0,relato:""},
          pcl:new Array(20).fill(null),diso:{desper:null,desrea:null},dur:null,lat:null,
          func:{},sn:{},consent:null};
}
function getDB(){try{return JSON.parse(localStorage.getItem(KEY)||"{}");}catch(e){return {};}}
function setDB(d){try{localStorage.setItem(KEY,JSON.stringify(d));}catch(e){}}

/* ══════════════ CÓDIGO ══════════════ */
function genCodigo(s){
  const f=(s.fecha||HOY()).replace(/-/g,"").slice(2);
  const al=((s.alias||"").toUpperCase().replace(/[^A-Z0-9]/g,"")+"...").slice(0,3);
  const ed=String(s.edad||"").replace(/\D/g,"").slice(0,2).padStart(2,"0");
  const sx=({H:"H",M:"M",X:"X"})[s.sexo]||".";
  let lec="";for(let i=0;i<17;i++)lec+=e36(lecEnc(s.lec[i]||0));
  let pcl="";for(let i=0;i<20;i++)pcl+=(s.pcl[i]==null?".":String(s.pcl[i]));
  const ex=[e36(s.idx.ev||0),String(s.idx.cuando||0),String(s.idx.repet||0),
            (s.dur==null?".":String(s.dur)),(s.lat==null?".":String(s.lat)),
            (s.diso.desper==null?".":String(s.diso.desper)),(s.diso.desrea==null?".":String(s.diso.desrea))].join("");
  const fn=FUNC.map(x=>s.func[x.k]==null?".":String(s.func[x.k])).join("")
          +FUNC_SN.map(x=>s.sn[x.k]==null?".":String(s.sn[x.k])).join("");
  const cons=s.consent?e36(1+(s.consent.opc[0]?2:0)+(s.consent.opc[1]?4:0)):"0";
  const cuerpo="AP5"+VER+f+al+ed+sx+lec+pcl+ex+fn+cons;
  return agrupa(cuerpo+checksum(cuerpo));
}
function limpiaCodigo(t){return String(t||"").toUpperCase().replace(/[^0-9A-Z.]/g,"");}
function parseCodigo(txt){
  const c=limpiaCodigo(txt);
  if(c.slice(0,3)!=="AP5")return {err:"Ese código no parece de esta evaluación: debe empezar por AP5."};
  if(c.length!==69)return {err:"El código está incompleto o le sobran caracteres ("+c.length+" en vez de 69). Pide que te lo reenvíen copiado y pegado entero."};
  if(checksum(c.slice(0,68))!==c[68])return {err:"El código falla la verificación: algún carácter se ha copiado mal. Pide que te lo reenvíen."};
  try{
    const s=nuevoS();
    let i=4;
    const f=c.slice(i,i+6);i+=6;
    s.fecha="20"+f.slice(0,2)+"-"+f.slice(2,4)+"-"+f.slice(4,6);
    s.alias=c.slice(i,i+3).replace(/\./g,"");i+=3;
    s.edad=c.slice(i,i+2).replace(/^0/,"");i+=2;
    s.sexo=c[i]==="."?"-":c[i];i+=1;
    for(let k=0;k<17;k++){s.lec[k]=lecDec(d36(c[i+k]));}i+=17;
    for(let k=0;k<20;k++){const ch=c[i+k];s.pcl[k]=ch==="."?null:+ch;}i+=20;
    s.idx.ev=d36(c[i]); s.idx.cuando=+c[i+1]||0; s.idx.repet=+c[i+2]||0;
    s.dur=c[i+3]==="."?null:+c[i+3]; s.lat=c[i+4]==="."?null:+c[i+4];
    s.diso.desper=c[i+5]==="."?null:+c[i+5]; s.diso.desrea=c[i+6]==="."?null:+c[i+6];
    i+=7;
    FUNC.forEach((x,k)=>{const ch=c[i+k];s.func[x.k]=ch==="."?null:+ch;});
    FUNC_SN.forEach((x,k)=>{const ch=c[i+5+k];s.sn[x.k]=ch==="."?null:+ch;});
    i+=7;
    const cv=d36(c[i]);
    s.consent=cv?{aceptado:1,ver:CONSENT_VER,opc:[(cv&2)?1:0,(cv&4)?1:0]}:null;
    return {s:s,code:agrupa(c)};
  }catch(e){return {err:"No he podido leer el código. Revisa que esté completo."};}
}

/* ══════════════ CORRECCIÓN ══════════════ */
function corregir(s){
  const r={};
  r.pclResp=s.pcl.filter(v=>v!=null).length;
  r.total=s.pcl.reduce((a,v)=>a+(v||0),0);
  r.cl={};
  Object.keys(CLUSTER).forEach(k=>{
    const c=CLUSTER[k];
    const sum=c.ids.reduce((a,i)=>a+(s.pcl[i]||0),0);
    const n=c.ids.filter(i=>(s.pcl[i]||0)>=2).length;
    r.cl[k]={sum:sum,n:n,max:c.ids.length*4,cumple:n>=c.min,min:c.min,nombre:c.n,col:c.col};
  });
  /* Criterio A · exposición */
  const mIdx=s.idx.ev>0?(s.lec[s.idx.ev-1]||0):0;
  r.expo=LEC_OPC.filter(o=>(mIdx&o.b)&&o.k!=="no"&&o.k!=="dud").map(o=>o.t);
  r.critA=r.expo.length>0;
  r.nLec=Object.keys(s.lec).filter(i=>{const m=s.lec[i]||0;return (m&1)||(m&2)||(m&4)||(m&8);}).length;
  r.critB=r.cl.B.cumple; r.critC=r.cl.C.cumple; r.critD=r.cl.D.cumple; r.critE=r.cl.E.cumple;
  r.critF=s.dur!=null&&s.dur>=1;
  r.funcMax=Math.max.apply(null,FUNC.map(x=>s.func[x.k]==null?-1:s.func[x.k]));
  r.critG=r.funcMax>=2;
  r.areas=FUNC.filter(x=>(s.func[x.k]||0)>=2).length;
  r.diag=r.critA&&r.critB&&r.critC&&r.critD&&r.critE&&r.critF&&r.critG;
  r.diso=(s.diso.desper||0)>=2||(s.diso.desrea||0)>=2;
  r.retardada=s.lat===2;
  r.banda = r.total>=50?{n:"Grave",c:"#b0432f",d:"Sintomatología postraumática grave"}
          : r.total>=33?{n:"Moderada-alta",c:"#C2704F",d:"Por encima del punto de corte habitual (31-33)"}
          : r.total>=31?{n:"En el punto de corte",c:"#a7802f",d:"Zona de corte habitual (31-33): valorar en entrevista"}
          : r.total>=15?{n:"Leve / subumbral",c:"#5c7d54",d:"Por debajo del punto de corte habitual"}
          : {n:"Mínima",c:"#6f675c",d:"Sintomatología mínima en el último mes"};
  /* Banderas clínicas */
  r.flags=[];
  if((s.pcl[15]||0)>=2) r.flags.push({i:"⚠️",t:"Ítem 16 (asumir riesgos / conductas que pueden causar daño): "+ESC5[s.pcl[15]]+". Explorar conducta de riesgo e ideación autolítica en entrevista."});
  if((s.pcl[8]||0)>=3||(s.pcl[9]||0)>=3) r.flags.push({i:"🧠",t:"Cogniciones postraumáticas intensas (creencias negativas y/o culpa). Diana clara de trabajo cognitivo antes o junto a la exposición."});
  if(s.sn.F7===1) r.flags.push({i:"🍷",t:"Refiere aumento del consumo de alcohol, sustancias o medicación para dormir/calmarse. Valorar antes de iniciar exposición."});
  if(r.diso) r.flags.push({i:"🌫️",t:"Síntomas disociativos clínicamente presentes: priorizar anclaje/AIS y ventana de tolerancia; graduar más la exposición."});
  if((s.pcl[19]||0)>=3||(s.pcl[1]||0)>=3) r.flags.push({i:"🌙",t:"Alteración del sueño y/o pesadillas marcadas. Valorar higiene del sueño y trabajo específico de pesadillas."});
  if(r.cl.C.sum>=6) r.flags.push({i:"🚪",t:"Evitación alta (C = "+r.cl.C.sum+"/8): la escalera de exposición es la intervención de primera línea."});
  if(s.idx.repet===2||s.idx.cuando===0) r.flags.push({i:"🔁",t:"Suceso repetido/continuado o de inicio en la infancia-adolescencia: valorar traumatización compleja (síntomas de autoorganización) más allá del TEPT simple."});
  if(r.pclResp<20) r.flags.push({i:"❔",t:"Información incompleta: faltan "+(20-r.pclResp)+" ítems del PCL-5. Las puntuaciones son orientativas."});
  return r;
}

/* Sugerencia de plan enlazada con las apps de APRENS */
function sugerencias(s,r){
  const out=[];
  if(r.diso||r.cl.E.sum>=14) out.push({ic:"🫁",t:"Regulación primero",d:"Antes de exponer: anclaje e interocepción (AIS) para ampliar la ventana de tolerancia.",app:"bajar-alerta.html",n:"Bajar la alerta"});
  if(r.cl.C.sum>=4) out.push({ic:"🪜",t:"Exposición gradual",d:"Construir la escalera de peldaños con las dos llaves: el QUÉ (conductual) y el CÓMO (acompañamiento interno AIS).",app:"../exposicion/index.html",n:"La escalera"});
  if(r.cl.B.sum>=6) out.push({ic:"🤝",t:"Acompañar la intrusión",d:"Entrenar estar con el recuerdo/sensación sin luchar ni comprobar, en dosis cortas y fuera de crisis.",app:"acompanar-sensacion.html",n:"Acompañar la sensación"});
  if((s.pcl[14]||0)>=2||(s.pcl[16]||0)>=3) out.push({ic:"🔥",t:"Irritabilidad e hiperalerta",d:"Autorregistro posterior a episodios de enfado o impulso, y detección de la latencia.",app:"control-ira.html",n:"Control de ira"});
  if(r.cl.D.sum>=10) out.push({ic:"🧭",t:"Reconstruir dirección",d:"Recuperar contacto con valores y actividad con sentido frente al aplanamiento y la retirada.",app:"brujula-valores.html",n:"Brújula de valores"});
  out.push({ic:"📊",t:"Seguimiento",d:"Repetir esta evaluación cada 4-6 semanas y registrar la práctica diaria entre sesiones.",app:"tracker-tec.html",n:"Tracker TEC"});
  return out;
}

/* ══════════════ INFORME DE TEXTO ══════════════ */
function informeTexto(s,r,code){
  const L=[];
  const sn=v=>v===1?"Sí":v===0?"No":"—";
  L.push("EVALUACIÓN DE TRAUMA · LEC-5 + PCL-5 (APRENS)");
  L.push("Fecha de administración: "+s.fecha+"   ·   Alias: "+(s.alias||"—")+"   ·   Edad: "+(s.edad||"—")+"   ·   Sexo: "+(s.sexo||"—"));
  L.push("");
  L.push("SUCESO ÍNDICE");
  L.push("· Suceso: "+(s.idx.ev>0?(s.idx.ev+". "+LEC[s.idx.ev-1]):"No especificado"));
  L.push("· Tipo de exposición: "+(r.expo.length?r.expo.join(" / "):"no marcada"));
  L.push("· Cuándo: "+(CUANDO[s.idx.cuando]||"—")+"   ·   "+(REPETICION[s.idx.repet]||"—"));
  L.push("· Sucesos vitales marcados en el LEC-5: "+r.nLec+"/17");
  L.push("");
  L.push("PCL-5 · ÚLTIMO MES");
  L.push("· Puntuación total: "+r.total+"/80  ("+r.banda.n+" — "+r.banda.d+")");
  Object.keys(CLUSTER).forEach(k=>{const c=r.cl[k];
    L.push("· "+c.nombre+": suma "+c.sum+"/"+c.max+"  ·  síntomas presentes (≥2): "+c.n+"/"+CLUSTER[k].ids.length+"  ·  criterio "+(c.cumple?"CUMPLE":"no cumple")+" (mínimo "+c.min+")");});
  L.push("");
  L.push("CRITERIOS DSM-5 (orientativo)");
  L.push("· A Exposición: "+(r.critA?"Sí":"No"));
  L.push("· B Intrusión: "+(r.critB?"Sí":"No")+"   · C Evitación: "+(r.critC?"Sí":"No")+"   · D Cognición/ánimo: "+(r.critD?"Sí":"No")+"   · E Activación: "+(r.critE?"Sí":"No"));
  L.push("· F Duración >1 mes: "+(r.critF?"Sí":"No")+" ("+(DURACION[s.dur]||"—")+")");
  L.push("· G Malestar/deterioro: "+(r.critG?"Sí":"No")+" ("+r.areas+" áreas afectadas de 5)");
  L.push("· Cribado positivo para TEPT: "+(r.diag?"SÍ — cumple todos los criterios":"No — no cumple todos los criterios"));
  L.push("· Subtipo disociativo: "+(r.diso?"presente (despersonalización "+(s.diso.desper==null?"—":s.diso.desper)+", desrealización "+(s.diso.desrea==null?"—":s.diso.desrea)+")":"no")); 
  L.push("· Expresión retardada: "+(r.retardada?"sí (≥6 meses)":"no")+" ("+(LATENCIA[s.lat]||"—")+")");
  L.push("");
  L.push("FUNCIONAMIENTO (último mes)");
  FUNC.forEach(x=>L.push("· "+x.t+" → "+(s.func[x.k]==null?"—":ESCFUNC[s.func[x.k]])));
  FUNC_SN.forEach(x=>L.push("· "+x.t+" → "+sn(s.sn[x.k])));
  if(r.flags.length){L.push("");L.push("BANDERAS CLÍNICAS");r.flags.forEach(f=>L.push("· "+f.t));}
  L.push("");
  L.push("RESPUESTAS PCL-5 (ítem: 0-4)");
  L.push(s.pcl.map((v,i)=>(i+1)+":"+(v==null?"-":v)).join("  "));
  L.push("");
  L.push("Instrumentos: LEC-5 y PCL-5 (Weathers et al., 2013 · National Center for PTSD, dominio público).");
  L.push("Resultado de cribado. No constituye diagnóstico: requiere entrevista clínica y juicio profesional.");
  L.push("Código de origen: "+(code||"—"));
  return L.join("\n");
}

<script>
/* ══════════════ CONFIGURACIÓN DE ENVÍO ══════════════ */
const WA_PSICOLOGO="34636937661";        /* número del profesional, formato internacional sin + */
const PROG_KEY="aprens_trauma_progreso"; /* autoguardado del paciente en su propio dispositivo */

const app=()=>document.getElementById("app");
function ir(v){vista=v;window.scrollTo({top:0,behavior:"smooth"});render();}
function guardarProgreso(){try{localStorage.setItem(PROG_KEY,JSON.stringify({S:S,vista:vista,qIdx:qIdx}));}catch(e){}}
function borrarProgreso(){try{localStorage.removeItem(PROG_KEY);}catch(e){}}
function hayProgreso(){try{const d=JSON.parse(localStorage.getItem(PROG_KEY)||"null");return d&&d.S?d:null;}catch(e){return null;}}

function copiar(t,idOk){
  const ok=()=>{const m=document.getElementById(idOk||"okm");if(m){m.textContent="✓ Copiado";m.style.display="block";setTimeout(()=>{m.style.display="none";},3000);}};
  if(navigator.clipboard&&navigator.clipboard.writeText&&window.isSecureContext){
    navigator.clipboard.writeText(t).then(ok).catch(met2);
  }else met2();
  function met2(){
    try{const a=document.createElement("textarea");a.value=t;a.style.position="fixed";a.style.opacity="0";
      document.body.appendChild(a);a.focus();a.select();a.setSelectionRange(0,t.length);
      document.execCommand("copy");a.remove();ok();
    }catch(e){}
  }
}
function barra(pct){return '<div class="qprog"><div class="qprog-f" style="width:'+pct+'%"></div></div>';}
const SOS='<div class="sos"><strong>Si en algún momento sientes que no puedes más</strong><br>Llama al <strong>024</strong> (atención a la conducta suicida, gratuito y 24 h) o al <strong>112</strong>. Y avisa a tu psicólogo: no hace falta esperar a la próxima sesión.</div>';

/* ══════════════ RENDER ══════════════ */
function render(){
  const V={
    selector:vSelector, pac_consent:vConsent, pac_datos:vDatos, pac_lec:vLec, pac_suceso:vSuceso,
    pac_pcl:vPcl, pac_extra:vExtra, pac_func:vFunc, pac_fin:vFin,
    prof_inicio:vProfInicio, prof_informe:vProfInforme, prof_historial:vProfHistorial
  };
  app().innerHTML=(V[vista]||vSelector)();
}

/* ── Selector de modo ── */
function vSelector(){
  const pr=hayProgreso();
  return `
  <div class="hero">
    <div class="htitulo">Evaluación de trauma · LEC-5 + PCL-5</div>
    <div class="hsubt">Una evaluación en cuatro partes: qué situaciones difíciles has vivido, cómo te han afectado durante el <strong>último mes</strong>, desde cuándo, y en qué medida está tocando tu vida diaria. Se tarda unos <strong>10-15 minutos</strong> y no hay límite de tiempo.</div>
    <div class="frase">No se trata de revivir lo que pasó, sino de mirar con precisión cómo sigue viviendo hoy en ti. Eso es lo que permite decidir por dónde empezar.</div>
  </div>
  ${pr?`<div class="aviso ok">Tienes una evaluación a medias en este dispositivo (${esc(pr.S.fecha)}). <button class="btn bs bsm" style="margin-left:6px" onclick="retomar()">Retomar donde lo dejé</button> <button class="btn bcopy bsm" onclick="if(confirm('¿Empezar de cero y borrar lo que llevabas?')){borrarProgreso();render();}">Empezar de nuevo</button></div>`:""}
  <div class="selector">
    <button class="mcard px" onclick="modoPaciente()">
      <div class="mico">🧑‍💻</div>
      <div class="mtit" style="color:var(--verde)">Soy paciente</div>
      <div class="mdesc">Responder la evaluación. Al terminar obtendrás un código que envías a tu psicólogo.</div>
    </button>
    <button class="mcard cli" onclick="pedirClave()">
      <div class="mico">🔐</div>
      <div class="mtit" style="color:var(--azul)">Soy el profesional</div>
      <div class="mdesc">Corregir un código, ver el informe con criterios DSM-5 y seguir la evolución.</div>
    </button>
  </div>
  <div class="aviso"><strong>Sobre esta herramienta.</strong> Utiliza el <strong>LEC-5</strong> (listado de acontecimientos) y el <strong>PCL-5</strong> (20 síntomas), instrumentos de dominio público del National Center for PTSD (Weathers et al., 2013). Es un instrumento de <strong>cribado y seguimiento</strong>: orienta, no diagnostica. El diagnóstico lo establece el profesional en entrevista clínica.</div>
  <div class="foot">APRENS Psicologia · Tòfol Villalonga<br>Uso anónimo: no se envía ningún dato a ningún servidor.</div>`;
}
function retomar(){const pr=hayProgreso();if(!pr)return;S=pr.S;qIdx=pr.qIdx||0;modo="paciente";ir(pr.vista||"pac_lec");}
function modoPaciente(){modo="paciente";S=nuevoS();qIdx=0;ir("pac_consent");}

/* ── Consentimiento ── */
let consentTmp={base:false,opc:[false,false]};
function vConsent(){
  return `
  <div class="card">
    <div class="ctit">Antes de empezar</div>
    <div class="cbox">${esc(CONSENT_TEXTO)}</div>
    <div class="opts">
      <button class="opt ${consentTmp.base?"sel":""}" style="align-items:flex-start" onclick="togCons('base')">
        <span class="opt-n">${consentTmp.base?"✔":""}</span>
        <span>He leído la información y <strong>doy mi consentimiento</strong> para el tratamiento de mis datos con la finalidad indicada.</span>
      </button>
      ${CONSENT_OPCIONALES.map((t,i)=>`
      <button class="opt ${consentTmp.opc[i]?"sel":""}" style="align-items:flex-start" onclick="togCons(${i})">
        <span class="opt-n">${consentTmp.opc[i]?"✔":""}</span>
        <span style="font-size:13.5px;color:var(--gris)">${esc(t)} <em>(opcional)</em></span>
      </button>`).join("")}
    </div>
    <div class="qnav">
      <button class="btn bs bsm" onclick="ir('selector')">← Atrás</button>
      <button class="btn bp" ${consentTmp.base?"":"disabled"} onclick="aceptarConsent()">Continuar →</button>
    </div>
    ${consentTmp.base?"":'<div class="hint" style="text-align:right;margin:8px 0 0">Marca la primera casilla para continuar.</div>'}

function vLec(){

    ${barra(28)}
    <div class="hsubt" style="margin-bottom:16px">A continuación aparece un listado de situaciones difíciles o estresantes que a veces ocurren. Para <strong>cada una</strong>, marca lo que corresponda a lo largo de toda tu vida. Puedes marcar <strong>más de una opción</strong> en la misma fila. Si no te ha ocurrido, marca «No me aplica».</div>

    ${LEC.map((t,i)=>{
      const m=S.lec[i]||0;

        <div class="chips">${LEC_OPC.map(o=>`<button class="chip ${o.k==="no"||o.k==="dud"?"no":""} ${(m&o.b)?"on":""}" onclick="togLec(${i},${o.b})">${o.t}</button>`).join("")}</div>

    </div>
  </div>`;
}
function togLec(i,b){
  let m=S.lec[i]||0;
  const EXCL=16|32;                       /* "no estoy seguro" y "no me aplica" son excluyentes */
  if(b&EXCL){ m=(m&b)?0:b; }
  else{ m=(m&EXCL)?0:m; m=(m&b)?(m&~b):(m|b); }
  S.lec[i]=m;guardarProgreso();
  const row=document.getElementById("lr"+i);
  row.classList.toggle("on",!!m);
  row.querySelectorAll(".chip").forEach((c,k)=>c.classList.toggle("on",!!(m&LEC_OPC[k].b)));
}

<script>

function vFin(){

  ${(S.pcl[15]||0)>=2||r.total>=45?SOS:""}
  <div class="card">
    <div class="ctit">Mientras tanto</div>
    <div class="hsubt">Hasta que lo veáis en sesión, lo más útil no es analizar lo que pasó, sino <strong>entrenar presencia interna cuando no hace falta</strong>: sesiones cortas, fuera de la crisis, para que tu cuerpo aprenda que puede estar contigo sin que le exijas cambiar.</div>

  <div class="foot">APRENS Psicologia · LEC-5 y PCL-5 (National Center for PTSD, dominio público)</div>`;
}

<script>
/* ══════════════ ZONA PROFESIONAL ══════════════ */
function pedirClave(){
  const ov=document.createElement("div");ov.className="modal-ov";ov.id="modalC";
  ov.innerHTML=`<div class="modal-bx">
    <div style="font-family:var(--serif);font-size:20px;color:var(--azul);margin-bottom:6px">Acceso profesional</div>
    <div style="font-size:13px;color:var(--gris);line-height:1.55;margin-bottom:16px">Esta zona es solo para el profesional. Si eres paciente, vuelve atrás y elige «Soy paciente».</div>
    <input id="mcK" type="text" class="ipt" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Clave de acceso">
    <div id="mcErr" style="font-size:13px;color:var(--rojo);margin-bottom:10px;display:none"></div>
    <div style="display:flex;gap:10px">
      <button class="btn bs bsm" style="flex:1" onclick="document.getElementById('modalC').remove()">Cancelar</button>
      <button class="btn bp bsm" style="flex:1" id="mcOk">Entrar</button>
    </div></div>`;
  document.body.appendChild(ov);
  const go=()=>{
    if((document.getElementById("mcK").value||"").trim().toUpperCase()===CLAVE_MAESTRA.toUpperCase()){
      ov.remove();modo="profesional";ir("prof_inicio");
    }else{const e=document.getElementById("mcErr");e.textContent="Clave incorrecta.";e.style.display="block";}
  };
  document.getElementById("mcOk").onclick=go;
  document.getElementById("mcK").addEventListener("keydown",e=>{if(e.key==="Enter")go();});
  document.getElementById("mcK").focus();
}

function enlacePaciente(){
  const u=new URL(window.location.href);u.search="?m=px";u.hash="";return u.toString();
}
function vProfInicio(){
  const db=getDB(), alias=Object.keys(db).sort();
  const link=enlacePaciente();
  const waLink="https://wa.me/?text="+encodeURIComponent("Hola, te paso la evaluación de la que hablamos. Se hace desde el móvil, en unos 10-15 minutos, y no hay prisa. Al terminar te dará un código: envíamelo por aquí.\n\n"+link);
  return `
  <div class="hero">
    <div class="htitulo">Zona profesional</div>
    <div class="hsubt">Envía el enlace al paciente, pega aquí el código que te devuelva y obtén el informe con puntuaciones por clúster, criterios DSM-5 y propuesta de plan.</div>
  </div>
  <div class="card">
    <div class="ctit">1 · Enviar la evaluación al paciente</div>

  </div>

      <div class="sc-n">PCL-5 · Puntuación total</div>
      <div class="sc-v" style="color:${r.banda.c}">${r.total}<span style="font-size:16px;color:var(--gris)"> / 80</span></div>
      <div class="sc-d"><strong>${r.banda.n}</strong> — ${r.banda.d}</div>
      <div class="bar"><div class="bar-f" style="width:${pct(r.total/80)}%;background:${r.banda.c}"></div></div>
      <div class="sc-d" style="margin-top:7px">Punto de corte habitual para cribado: 31-33.</div>
    </div>
    ${Object.keys(CLUSTER).map(k=>{const c=r.cl[k];return `
    <div class="sc">
      <div class="sc-n">${c.nombre}</div>
      <div class="sc-v" style="color:${c.col}">${c.sum}<span style="font-size:15px;color:var(--gris)"> / ${c.max}</span></div>
      <div class="sc-d">${c.n} de ${CLUSTER[k].ids.length} síntomas presentes (≥2) · mínimo ${c.min} → <strong style="color:${c.cumple?c.col:"var(--gris)"}">${c.cumple?"cumple":"no cumple"}</strong></div>
      <div class="bar"><div class="bar-f" style="width:${pct(c.sum/c.max)}%;background:${c.col}"></div></div>
    </div>`;}).join("")}
  </div>

  <div class="card">
    <div class="ctit">Suceso índice y exposición</div>
    <div style="font-size:14.5px;line-height:1.65">
      <strong>${s.idx.ev>0&&s.idx.ev<18?esc(s.idx.ev+". "+LEC[s.idx.ev-1]):"Otro acontecimiento (no especificado en la lista)"}</strong><br>
      <span style="color:var(--gris)">${esc(CUANDO[s.idx.cuando]||"—")} · ${esc(REPETICION[s.idx.repet]||"—")}</span>
    </div>
    <div style="margin-top:10px">${r.expo.length?r.expo.map(t=>`<span class="pill">${esc(t)}</span>`).join(""):'<span class="pill" style="background:#F3E3DC;color:var(--rojo)">Sin tipo de exposición marcado</span>'}</div>
    <div class="hint" style="margin:12px 0 0">Sucesos marcados en el LEC-5 (vividos, presenciados, conocidos o por trabajo): <strong>${r.nLec} de 17</strong>. El relato escrito por el paciente no viaja en el código: pedírselo en sesión.</div>
  </div>

  <div class="card">
    <div class="ctit">Criterios DSM-5</div>
    ${[["A","Exposición a acontecimiento traumático",r.critA,r.expo.join(" / ")||"sin marcar"],
       ["B","Síntomas de intrusión (≥1)",r.critB,r.cl.B.n+" de 5 · suma "+r.cl.B.sum+"/20"],
       ["C","Evitación (≥1)",r.critC,r.cl.C.n+" de 2 · suma "+r.cl.C.sum+"/8"],
       ["D","Alteraciones cognitivas y del ánimo (≥2)",r.critD,r.cl.D.n+" de 7 · suma "+r.cl.D.sum+"/28"],
       ["E","Alteraciones de la activación y reactividad (≥2)",r.critE,r.cl.E.n+" de 6 · suma "+r.cl.E.sum+"/24"],
       ["F","Duración superior a 1 mes",r.critF,DURACION[s.dur]||"sin contestar"],
       ["G","Malestar clínico o deterioro funcional",r.critG,r.areas+" de 5 áreas afectadas (≥ moderadamente)"]
      ].map(x=>`<div class="crit ${x[2]?"si":"no"}"><div class="crit-ic">${x[2]?"✔️":"○"}</div><div class="crit-t"><b>Criterio ${x[0]}</b>${esc(x[1])}<br><span style="color:var(--gris);font-size:12.5px">${esc(x[3])}</span></div></div>`).join("")}
    <div class="crit ${r.diso?"si":"no"}"><div class="crit-ic">${r.diso?"✔️":"○"}</div><div class="crit-t"><b>Especificador · síntomas disociativos</b>Despersonalización ${s.diso.desper==null?"—":s.diso.desper+"/4"} · Desrealización ${s.diso.desrea==null?"—":s.diso.desrea+"/4"}</div></div>
    <div class="crit ${r.retardada?"si":"no"}"><div class="crit-ic">${r.retardada?"✔️":"○"}</div><div class="crit-t"><b>Especificador · expresión retardada</b>${esc(LATENCIA[s.lat]||"sin contestar")}</div></div>
  </div>

  <div class="card">
    <div class="ctit">Funcionamiento en el último mes</div>
    ${FUNC.map(x=>{const v=s.func[x.k];return `<div class="flag"><div style="flex:1">${esc(x.t)}</div><div style="font-weight:700;color:${v>=3?"var(--rojo)":v>=2?"var(--naranja)":"var(--gris)"};white-space:nowrap">${v==null?"—":ESCFUNC[v]}</div></div>`;}).join("")}
    ${FUNC_SN.map(x=>`<div class="flag"><div style="flex:1">${esc(x.t)}</div><div style="font-weight:700;color:${s.sn[x.k]===1?"var(--naranja)":"var(--gris)"}">${s.sn[x.k]===1?"Sí":s.sn[x.k]===0?"No":"—"}</div></div>`).join("")}
  </div>

  ${r.flags.length?`<div class="card"><div class="ctit">Banderas clínicas</div>${r.flags.map(f=>`<div class="flag"><div>${f.i}</div><div>${esc(f.t)}</div></div>`).join("")}</div>`:""}

  <div class="card">
    <div class="ctit">Propuesta de plan · herramientas APRENS</div>
    ${sug.map(x=>`<div class="flag"><div style="font-size:19px">${x.ic}</div><div style="flex:1"><strong>${x.t}</strong> — ${esc(x.d)}<br><a href="${x.app}" style="color:var(--azul);font-weight:600;font-size:12.5px">→ ${esc(x.n)}</a></div></div>`).join("")}
    <div class="hint" style="margin-top:12px">Regla de secuencia: si hay disociación marcada o activación muy alta, primero ventana de tolerancia (AIS) y solo después la escalera de exposición. La evitación alta indica exposición, no más psicoeducación.</div>
  </div>

  <div class="card">
    <div class="ctit">Informe para la historia clínica</div>
    <div class="cbox">${esc(txt)}</div>
    <div class="acc" style="justify-content:flex-start">
      <button class="btn bcopy bsm" onclick='copiar(${JSON.stringify(txt)},"okm2")'>📋 Copiar informe</button>
      <button class="btn bs bsm" onclick="window.print()">🖨 Imprimir / PDF</button>
      <button class="btn bpg bsm" onclick="guardarEval()">💾 Guardar en el historial</button>
    </div>
    <div id="okm2" style="display:none;color:var(--verde);font-weight:600;margin-top:10px"></div>
  </div>
  <div class="acc"><button class="btn bs bsm" onclick="ir('prof_inicio')">← Volver</button></div>
  <div class="foot">LEC-5 y PCL-5 · Weathers, Blake, Schnurr, Kaloupek, Marx &amp; Keane (2013) · National Center for PTSD (dominio público).<br>Resultado de cribado: no sustituye la entrevista clínica ni establece diagnóstico.</div>`;
}

function guardarEval(){
  const a=(S.alias||"SIN").toUpperCase();
  const db=getDB();
  if(!db[a])db[a]={ev:[]};
  const r=informeActual||corregir(S);
  const reg={fecha:S.fecha,total:r.total,cl:{B:r.cl.B.sum,C:r.cl.C.sum,D:r.cl.D.sum,E:r.cl.E.sum},
             diag:r.diag,diso:r.diso,code:limpiaCodigo(ultimoCodigo)};
  db[a].ev=(db[a].ev||[]).filter(x=>x.code!==reg.code);
  db[a].ev.push(reg);
  db[a].ev.sort((x,y)=>x.fecha<y.fecha?-1:1);
  setDB(db);
  const m=document.getElementById("okm2");
  if(m){m.textContent="✓ Guardado en el historial de "+a;m.style.display="block";}
}
function verHistorial(a){aliasSel=a;ir("prof_historial");}
function vProfHistorial(){
  const db=getDB(), ev=(db[aliasSel]&&db[aliasSel].ev)||[];
  const max=Math.max(80,...ev.map(x=>x.total));
  return `
  <div class="hero"><div class="htitulo">Evolución · ${esc(aliasSel)}</div>
  <div class="hsubt">${ev.length} administración(es) guardadas en este dispositivo.</div></div>
  <div class="card">
    <div class="ctit">PCL-5 total (0-80)</div>
    ${ev.map((x,i)=>{
      const prev=i?ev[i-1].total:null, d=prev==null?null:x.total-prev;
      return `<div style="margin-bottom:14px">
        <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px">
          <span><strong>${esc(x.fecha)}</strong>${x.diag?' <span class="pill" style="background:#F3E3DC;color:var(--rojo)">cribado +</span>':""}${x.diso?' <span class="pill">disociativo</span>':""}</span>
          <span style="font-weight:700">${x.total}/80 ${d==null?"":(d<0?'<span style="color:var(--verde)">▼ '+Math.abs(d)+"</span>":d>0?'<span style="color:var(--rojo)">▲ '+d+"</span>":'<span style="color:var(--gris)">=</span>')}</span>
        </div>
        <div class="bar" style="height:11px"><div class="bar-f" style="width:${Math.round(x.total/max*100)}%;background:${x.total>=33?"#b0432f":x.total>=15?"#C2704F":"#5c7d54"}"></div></div>
        <div class="hint" style="margin:5px 0 0">B ${x.cl.B} · C ${x.cl.C} · D ${x.cl.D} · E ${x.cl.E}</div>
      </div>`;}).join("")||'<div class="hint">Sin registros.</div>'}
    <div class="hint" style="margin-top:10px">Cambio clínicamente significativo orientativo en el PCL-5: <strong>10-20 puntos</strong> de reducción.</div>
  </div>
  <div class="card">
    <div class="ctit">Reabrir un informe</div>
    ${ev.map(x=>`<div class="hrow"><div>${esc(x.fecha)} · ${x.total}/80</div><button class="btn bs bsm" onclick='reabrir(${JSON.stringify(x.code)})'>Ver informe</button></div>`).join("")||'<div class="hint">Sin registros.</div>'}
  </div>
  <div class="acc"><button class="btn bs bsm" onclick="ir('prof_inicio')">← Volver</button></div>`;
}
function reabrir(code){
  const res=parseCodigo(code);
  if(res.err){alert(res.err);return;}
  S=res.s;ultimoCodigo=res.code;informeActual=corregir(S);ir("prof_informe");
}

/* ══════════════ ARRANQUE ══════════════ */
(function(){
  const q=new URLSearchParams(window.location.search);
  if(q.get("m")==="px"){
    const pr=hayProgreso();
    if(pr){S=pr.S;qIdx=pr.qIdx||0;modo="paciente";vista=pr.vista||"pac_lec";}
    else modoPaciente();
  }
  render();
})();
</script>
