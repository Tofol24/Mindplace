<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Juegos AIS · exposición imaginada · APRENS</title>
<style>
:root{--azul:#565a41;--azulLt:#e8ead9;--verde:#5c7d54;--naranja:#C2704F;--rojo:#b0432f;--gris:#6f665b;--oro:#a9781f;
  --amarillo:#e8b93a;--aire:#6f9fc4;--noche:#1c1a22;--papel:#F4EFE6;--tinta:#2A2622;--linea:#e0d8c8;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:var(--sans);background:var(--papel);min-height:100vh;color:var(--tinta);margin:0;padding-bottom:env(safe-area-inset-bottom);overflow-x:hidden;}
.wrap{max-width:540px;margin:0 auto;padding:18px 16px 90px;}
button{font-family:var(--sans);}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:8px;}
.eyebrow{font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--oro);font-weight:600;}
.langs{display:flex;gap:4px;flex:none;}
.langs button{border:1.5px solid var(--linea);background:#fff;color:var(--gris);border-radius:20px;padding:5px 11px;font-size:12.5px;font-weight:700;cursor:pointer;}
.langs button.on{background:var(--azul);border-color:var(--azul);color:#fff;}
h1{font-family:var(--serif);font-size:clamp(27px,7.6vw,36px);line-height:1.1;margin:6px 0 6px;color:var(--azul);}
.tag{font-family:var(--serif);font-style:italic;font-size:17px;color:#4a4339;margin:0 0 16px;line-height:1.42;}
h2{font-family:var(--serif);font-size:20px;color:var(--azul);margin:0 0 8px;}
p{line-height:1.5;}
.muted{color:var(--gris);font-size:14px;line-height:1.5;}
.card{background:#fff;border:1px solid var(--linea);border-radius:18px;padding:16px;margin:0 0 14px;box-shadow:0 2px 10px rgba(74,63,48,.06);}
.card.soft{background:#fbf8f1;}
.seg{display:flex;background:#fff;border:1.5px solid var(--linea);border-radius:30px;padding:3px;margin:0 0 16px;}
.seg button{flex:1;border:none;background:transparent;border-radius:26px;padding:10px;font-size:15px;font-weight:700;color:var(--gris);cursor:pointer;}
.seg button.on{background:var(--azul);color:#fff;}
.lbl{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gris);font-weight:700;margin:0 0 8px;}
.juego{display:flex;gap:14px;align-items:flex-start;cursor:pointer;text-align:left;width:100%;font:inherit;color:inherit;background:none;border:none;padding:0;}
.juego .ico{flex:none;width:56px;height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:29px;background:#f3ecdd;}
.juego h3{font-family:var(--serif);font-size:19.5px;margin:0 0 3px;color:var(--azul);}
.juego .fase{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--oro);font-weight:700;margin:0 0 4px;}
.juego p{margin:0 0 4px;font-size:14.5px;line-height:1.45;color:#3f3a33;}
.estado{font-size:13px;font-weight:700;color:var(--verde);}
.estado.no{color:var(--gris);font-weight:600;}
.btn{border:none;border-radius:40px;font-weight:700;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;justify-content:center;gap:8px;-webkit-appearance:none;}
.big{width:100%;padding:17px;font-size:17.5px;background:var(--azul);color:#fff;box-shadow:0 6px 18px rgba(74,63,48,.26);margin-top:4px;}
.big:disabled{opacity:.42;box-shadow:none;}
.big:active{transform:scale(.97);}
.big.sec{background:#fff;color:var(--azul);border:2px solid var(--azulLt);box-shadow:none;}
.mini{background:transparent;color:var(--gris);font-size:14.5px;padding:10px 4px;font-weight:600;}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px;}
.chip{border:2px solid var(--linea);background:#fff;border-radius:24px;padding:9px 14px;font-size:14.5px;font-weight:600;color:#3a3630;cursor:pointer;text-align:left;}
.chip.sel{border-color:var(--verde);background:#eef5ea;color:var(--verde);}
.chip:disabled{opacity:.45;cursor:default;}
.escala{display:grid;grid-template-columns:repeat(11,1fr);gap:3px;margin:6px 0 4px;}
.escala button{border:1.5px solid var(--linea);background:#fff;border-radius:8px;padding:9px 0;font-size:14px;font-weight:700;color:#4a4339;cursor:pointer;}
.escala button.sel{background:var(--azul);border-color:var(--azul);color:#fff;}
.escala3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 4px;}
.escala3 button{border:2px solid var(--linea);background:#fff;border-radius:14px;padding:12px 4px;font-size:15px;font-weight:700;color:#4a4339;cursor:pointer;}
.escala3 button.sel{border-color:var(--verde);background:#eef5ea;color:var(--verde);}
.q{margin:0 0 16px;}
.q>p{margin:0 0 2px;font-weight:600;font-size:15.5px;}
input.txt,textarea.txt,select.txt{width:100%;border:2px solid var(--linea);border-radius:14px;padding:12px 14px;font-size:16px;font-family:var(--sans);margin:0 0 14px;background:#fff;}
textarea.txt{min-height:120px;resize:vertical;}
.frase{font-family:var(--serif);font-style:italic;font-size:18px;color:var(--azul);text-align:center;margin:18px 6px;line-height:1.45;}
.aviso{background:#fff5e9;border-left:4px solid #d99a3a;border-radius:10px;padding:10px 12px;font-size:14px;line-height:1.5;color:#6f4f12;margin:0 0 14px;}
.aviso.rojo{background:#fbecea;border-color:var(--rojo);color:#6e2419;}
.aviso.ok{background:#eef5ea;border-color:var(--verde);color:#2f4a29;}
.lista{list-style:none;margin:0 0 12px;padding:0;}
.lista li{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #efe8da;}
.lista li:last-child{border-bottom:none;}
.nivel{flex:none;width:28px;height:28px;border-radius:50%;background:#f3ecdd;color:var(--oro);font-weight:800;display:flex;align-items:center;justify-content:center;font-size:13.5px;}
.escenabtn{flex:1;text-align:left;background:none;border:none;font:inherit;color:inherit;cursor:pointer;padding:0;}
.escenabtn b{display:block;font-size:15.5px;}
.escenabtn span{font-size:13px;color:var(--gris);}
.escenabtn.sel b{color:var(--verde);}
.escenabtn:disabled{opacity:.45;cursor:default;}
.pasos{margin:0 0 6px;padding-left:20px;}
.pasos li{margin:0 0 7px;line-height:1.5;font-size:15px;}
details.vin{margin:4px 0 12px;}
details.vin>summary{cursor:pointer;font-weight:700;font-size:14px;color:var(--azul);list-style:none;}
details.vin>summary::-webkit-details-marker{display:none;}
details.vin>div{margin-top:10px;}
.nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px;margin:4px 0 12px;}
.num{background:#f7f3ea;border-radius:14px;padding:12px 6px;text-align:center;}
.num b{display:block;font-family:var(--serif);font-size:26px;color:var(--azul);line-height:1.1;}
.num span{font-size:12px;color:var(--gris);font-weight:600;}
.spark{width:100%;height:84px;display:block;margin:4px 0 6px;}
.respiro-box{max-width:230px;margin:0 auto 6px;}
.respiro-box .ra-ui,.respiro-box .ra-count,.respiro-box .ra-legend{display:none!important;}
.zonas{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 14px;}
.zonas button{border:2px solid var(--linea);background:#fff;border-radius:14px;padding:12px 4px;font-size:14.5px;font-weight:700;color:#4a4339;cursor:pointer;}
.zonas button.sel{border-color:var(--amarillo);background:#fbf1d6;color:#6b4e0e;}
.flotar-parar{position:fixed;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:9000;border:none;border-radius:30px;background:#fff;color:var(--rojo);border:2px solid #efc9c2;font-weight:800;font-size:14px;padding:10px 15px;box-shadow:0 6px 18px rgba(0,0,0,.12);cursor:pointer;}

/* ===== escenario a pantalla completa ===== */
.stage{position:fixed;inset:0;z-index:10000;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none;}
.stage[hidden]{display:none;}
.st-dark{background:linear-gradient(180deg,#24212b 0%,#2f2a36 60%,#3a3140 100%);color:#e9e2d4;}
.st-top{position:absolute;top:calc(14px + env(safe-area-inset-top));left:16px;right:16px;display:flex;justify-content:space-between;align-items:center;z-index:6;gap:10px;}
.st-top .ttl{font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.65;font-weight:700;}
.st-parar{border:none;border-radius:24px;padding:9px 13px;font-weight:800;font-size:13px;cursor:pointer;background:rgba(255,255,255,.12);color:#f2c9bf;}
.st-light .st-parar{background:#fff;color:var(--rojo);border:1.5px solid #efc9c2;}
.st-txt{position:absolute;left:20px;right:20px;text-align:center;font-family:var(--serif);font-size:19px;line-height:1.42;z-index:5;margin:0;}
.st-hold{position:absolute;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));transform:translateX(-50%);width:128px;height:128px;border-radius:50%;border:none;background:#fff;color:var(--azul);font-size:15px;font-weight:800;line-height:1.2;padding:10px;box-shadow:0 8px 26px rgba(0,0,0,.28);z-index:6;cursor:pointer;touch-action:none;}
.st-hold.on{background:var(--amarillo);color:#2a2214;box-shadow:0 0 0 10px rgba(232,185,58,.25),0 8px 26px rgba(0,0,0,.28);}
.st-hold.dos{width:112px;height:112px;}
.st-hold.izq{left:28%;}
.st-hold.der{left:72%;}
.st-btn{border:none;border-radius:30px;padding:14px 22px;font-size:16px;font-weight:800;cursor:pointer;}

/* escena imaginada */
.esc-ico{position:absolute;left:50%;top:22%;transform:translateX(-50%);width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,rgba(232,185,58,.22) 0%,rgba(232,185,58,0) 70%);display:flex;align-items:center;justify-content:center;font-size:72px;}
.esc-capas{position:absolute;left:22px;right:22px;top:46%;text-align:center;z-index:5;}
.esc-capas p{font-family:var(--serif);font-size:20px;line-height:1.45;margin:0 0 12px;opacity:0;transform:translateY(6px);transition:opacity .9s,transform .9s;color:#efe7d8;}
.esc-capas p.on{opacity:1;transform:none;}
.esc-capas p.old{opacity:.45;font-size:16.5px;}
.esc-pie{position:absolute;left:0;right:0;bottom:calc(28px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:10px;z-index:6;}

/* campana */
.bell{position:absolute;left:50%;top:21%;transform:translateX(-50%) scale(var(--s,1));transform-origin:50% 10%;transition:transform .6s ease,filter .6s;z-index:3;}
.bell svg{width:120px;height:120px;display:block;}
.bell.ring{animation:ring .9s ease;}
@keyframes ring{0%{rotate:0deg}15%{rotate:16deg}30%{rotate:-14deg}45%{rotate:10deg}60%{rotate:-7deg}75%{rotate:4deg}100%{rotate:0deg}}
.bub{position:absolute;z-index:4;background:#fff;color:#3b3530;border-radius:18px;padding:9px 13px;font-size:14.5px;font-weight:600;max-width:62%;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer;animation:sube 7.5s linear forwards;}
.bub::before{content:"¿?";font-weight:900;color:var(--oro);margin-right:6px;}
@keyframes sube{0%{opacity:0;transform:translateY(0)}10%{opacity:1}85%{opacity:.95}100%{opacity:0;transform:translateY(-46vh)}}
.bub.pop{animation:pop .35s ease forwards;}
@keyframes pop{to{opacity:0;transform:scale(1.25)}}
.alivio{position:absolute;inset:0;background:radial-gradient(circle at 50% 40%,rgba(255,200,120,.45),rgba(255,200,120,0) 60%);opacity:0;pointer-events:none;z-index:2;transition:opacity .25s;}
.alivio.on{opacity:1;}
.peri{position:absolute;z-index:2;text-align:center;font-size:12.5px;color:#d9cfbd;opacity:0;transition:opacity 1.6s;}
.peri span{display:block;font-size:34px;}
.peri.on{opacity:.95;}
.st-campana .st-txt{bottom:calc(170px + env(safe-area-inset-bottom));}

/* carrusel */
.st-carrusel{background:linear-gradient(180deg,#1f2733 0%,#283244 100%);color:#e6ecf2;}
.car{position:absolute;left:50%;top:24%;width:210px;height:210px;margin-left:-105px;border-radius:50%;border:3px dashed rgba(232,185,58,.45);z-index:2;}
.car .wag{position:absolute;left:50%;top:50%;width:28px;height:18px;margin:-9px 0 0 -14px;border-radius:6px;background:#3f4d63;border:2px solid #6f86a5;}
.car.parado{border-color:rgba(255,255,255,.15);}
.luz{position:absolute;width:26px;height:26px;border-radius:50%;background:radial-gradient(circle,#ffe39a 0%,#e8b93a 50%,rgba(232,185,58,0) 72%);z-index:3;transition:left .8s,top .8s;}
.car-frase{position:absolute;left:24px;right:24px;top:calc(24% + 228px);text-align:center;font-family:var(--serif);font-size:21px;line-height:1.4;min-height:60px;z-index:4;color:#f3f6fa;transition:opacity .4s;}
.car-btns{position:absolute;left:0;right:0;bottom:calc(30px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:12px;z-index:6;}
.stopbtn{width:132px;height:132px;border-radius:50%;border:none;background:#c4553f;color:#fff;font-size:26px;font-weight:900;letter-spacing:.06em;box-shadow:0 8px 26px rgba(0,0,0,.35);cursor:pointer;}
.cajabtn{border:none;border-radius:24px;padding:10px 16px;background:rgba(255,255,255,.12);color:#e6ecf2;font-weight:700;font-size:14px;cursor:pointer;}
.anclaprog{position:absolute;left:50%;top:22%;width:150px;height:150px;margin-left:-75px;z-index:3;}
.orbe{position:absolute;left:50%;top:24%;width:130px;height:130px;margin-left:-65px;border-radius:50%;background:radial-gradient(circle,rgba(232,185,58,.6) 0%,rgba(232,185,58,.14) 55%,rgba(232,185,58,0) 72%);animation:resp 13.5s ease-in-out infinite;z-index:2;}
@keyframes resp{0%{transform:scale(.72);}30%{transform:scale(1);}44%{transform:scale(1);}89%{transform:scale(.72);}100%{transform:scale(.72);}}

/* llegar a casa */
.st-casa{background:linear-gradient(180deg,#efe5d3 0%,#e6d7bd 62%,#cdb592 62.2%,#c4aa84 100%);color:var(--tinta);}
.sala{position:absolute;left:0;right:0;top:12%;height:44%;z-index:2;}
.puerta{position:absolute;left:5%;bottom:0;width:64px;height:120px;background:#8a6243;border-radius:6px 6px 0 0;box-shadow:inset -6px 0 0 #6f4c33;}
.puerta::after{content:"";position:absolute;right:10px;top:58px;width:8px;height:8px;border-radius:50%;background:#e8c271;}
.ventana{position:absolute;right:8%;top:6%;width:70px;height:56px;border:5px solid #fff;border-radius:6px;background:#bcd5e6;}
.fig{position:absolute;bottom:0;font-size:44px;line-height:1;transition:left 1.2s ease,transform 1.2s ease,opacity 1.2s;text-align:center;}
.fig small{display:block;font-size:11px;font-weight:700;color:#5d5246;margin-top:2px;}
.yo{z-index:3;}
.dolor{position:absolute;left:50%;top:44%;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:radial-gradient(circle,#ffd27f 0%,#f0a04a 55%,rgba(240,160,74,0) 75%);}
.manadaluz{position:absolute;width:10px;height:10px;border-radius:50%;background:#ffe39a;box-shadow:0 0 10px #ffd65c;opacity:0;transition:opacity .8s;}
.manadaluz.on{opacity:1;}
.sombra{position:absolute;inset:0;background:#1b1612;opacity:0;pointer-events:none;transition:opacity 1.2s;z-index:4;}
.st-casa .st-txt{top:calc(12% + 44% + 18px);font-size:18px;color:#3a3129;}
.opciones{position:absolute;left:16px;right:16px;bottom:calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;z-index:6;}
.opciones button{border:none;border-radius:16px;padding:13px 14px;font-size:15px;font-weight:700;cursor:pointer;background:rgba(255,255,255,.82);color:#4b4037;text-align:left;}
.opciones button.tec{background:var(--amarillo);color:#2a2214;}
.burbuja{position:absolute;right:6%;top:2%;max-width:62%;background:#fff;border-radius:16px;padding:10px 12px;font-size:14px;line-height:1.4;box-shadow:0 4px 14px rgba(0,0,0,.12);z-index:5;}
.barra{position:absolute;left:20%;right:20%;height:8px;border-radius:6px;background:rgba(0,0,0,.12);overflow:hidden;z-index:6;}
.barra i{display:block;height:100%;width:0;background:var(--amarillo);transition:width .2s linear;}

/* parar */
.parar{position:fixed;inset:0;z-index:20000;background:rgba(244,239,230,.98);display:flex;align-items:center;justify-content:center;padding:24px;}
.parar[hidden]{display:none;}
.parar .card{max-width:440px;width:100%;}

/* Pavlov */
.lab svg.perro{width:100%;max-width:340px;display:block;margin:0 auto;}
.meter{height:12px;border-radius:8px;background:#efe8da;overflow:hidden;margin:4px 0 10px;}
.meter i{display:block;height:100%;background:var(--aire);transition:width .5s;}
.meter.asoc i{background:var(--oro);}
.gota{animation:gota 1s ease-in infinite;}
@keyframes gota{0%{transform:translateY(0);opacity:1}100%{transform:translateY(16px);opacity:0}}
.campanita{transform-origin:50% 0;}
.campanita.ring{animation:ring .9s ease;}

/* puertas */
.puertas{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 12px;}
.pta{border:2px solid var(--linea);background:#fff;border-radius:16px;padding:12px 4px 10px;text-align:center;cursor:pointer;font:inherit;color:#4a4339;}
.pta span{display:block;font-size:30px;line-height:1.2;}
.pta small{font-size:12.5px;font-weight:700;}
.pta.hecha{border-color:var(--amarillo);background:#fbf3dc;}
</style>

<div class="wrap" id="app"></div>
<div class="stage" id="stage" hidden></div>

<script src="../js/respiro-ais.js"></script>

<script>
"use strict";
/* ============================================================================
   JUEGOS AIS · EXPOSICIÓN IMAGINADA · APRENS  ·  v1
   Diseño: docs/JUEGOS-AIS-exposicion-imaginada.md (se rige por TEC-guia-base).
   Cinco juegos sobre las viñetas de parada de pensamiento, abrazo sentido y
   honestidad emocional:
     · pavlov   — laboratorio de Pavlov (psicoeducación, siempre abierto)
     · campana  — honestidad emocional: la campana del «¿por qué?»
     · carrusel — parada de pensamiento ante la rumiación
     · casa     — abrazo sentido: cómplices del dolor (con modo Co-AIS)
     · puertas  — respiración curiosa en cada entrada y salida (siempre abierto)
   Campana, carrusel y casa comparten el «ensayo de escena»: expectativa →
   entrada (Respiro AIS) → escena imaginada por capas → pico → respuesta →
   frase honesta → después → resultado (fuerza de la campana) → micro-acción.
   Reglas: ninguna puntuación premia que la activación baje; primero aparecer
   (bloque 1 o código del terapeuta), después permanecer; una sesión de
   exposición al día (hasta 3 ensayos); «Necesito parar» siempre visible.
   ============================================================================ */

const KEY = "aprens_juegos_expo_v1";
const KEY_B1 = "aprens_juegos_ais_v1";
const MAX_ENSAYOS = 3;
const CODIGOS = { "AIS-EXPO":["expo"], "AIS-DUELO":["expo","duelo"] };

/* ---------------- textos de interfaz ---------------- */
const ANCLAS = {
  es:{ barriga:["Barriga","la barriga"], pecho:["Pecho","el pecho"], cuello:["Cuello","el cuello"], pies:["Pies y manos","los pies y las manos"] },
  ca:{ barriga:["Panxa","la panxa"], pecho:["Pit","el pit"], cuello:["Coll","el coll"], pies:["Peus i mans","els peus i les mans"] }
};
const ZONAS = {
  es:{ cabeza:"Cabeza", cuello:"Cuello / garganta", pecho:"Pecho", barriga:"Barriga", manos:"Manos / brazos", otra:"Otra zona" },
  ca:{ cabeza:"Cap", cuello:"Coll / gola", pecho:"Pit", barriga:"Panxa", manos:"Mans / braços", otra:"Una altra zona" }
};
const T = {
es:{
  eyebrow:"APRENS · AIS · Exposición", h1:"Juegos de exposición imaginada",
  tag:"La escena hace sonar la campana. Ganas cuando suena y te quedas en el cuerpo, en lugar de ir a por el «¿por qué?».",
  quien:"¿Quién juega?", adulto:"Adulto", peques:"Peques",
  como:"Cómo funciona",
  como_txt:"Imaginas una situación que activa algo por dentro. No se trata de que baje: se trata de quedarte con ello, decirlo con honestidad y dar un paso con valor sin alejarte de los tuyos. Repetido, la campana pierde fuerza.",

function bloque1Ok(){
  try{
    const j = JSON.parse(localStorage.getItem(KEY_B1)||"null");
    if(!j || !Array.isArray(j.hist)) return false;
    const dias = new Set(j.hist.map(h=>h.date));
    return j.hist.length>=6 && dias.size>=3;
  }catch(e){ return false; }
}
function practicaCalmaReciente(){
  try{ const j = JSON.parse(localStorage.getItem(KEY_B1)||"null"); const d=haceDias(6);
       return !!(j && j.hist && j.hist.some(h=>h.date>=d)); }catch(e){ return false; }

function cribadoVigente(){
  const c = st.cribado; if(!c) return null;
  const limite = c.riesgo ? 1 : 30;  // días
  return c.fecha >= haceDias(limite-1) ? c : null;
}
// "ok" | "cribado" | "riesgo" | "espera" | "bloque1" | "hecha"
function acceso(){
  const c = cribadoVigente();
  if(!c) return "cribado";
  if(c.riesgo) return "riesgo";
  if((c.trauma||c.duelo||c.disoc) && !tieneCod("expo")) return "espera";
  if(!bloque1Ok() && !tieneCod("expo")) return "bloque1";
  if(st.sesiones[fechaLocal()]) return "hecha";
  return "ok";
}

let AC = null;
function audioOn(){ try{ AC = AC || new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==="suspended") AC.resume(); }catch(e){ AC=null; } }
function tono(f,dur,vol,delay,tipo){
  if(!AC) return;
  const t0=AC.currentTime+(delay||0), o=AC.createOscillator(), g=AC.createGain();
  o.type=tipo||"sine"; o.frequency.value=f;
  g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(vol,t0+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g); g.connect(AC.destination); o.start(t0); o.stop(t0+dur+0.05);
}
function vib(p){ try{ if(navigator.vibrate) navigator.vibrate(p); }catch(e){} }
function sonCampana(fuerza){ const v=clamp(0.05+0.1*fuerza,0.04,0.28); tono(1318,1.8,v); tono(1975,1.2,v*0.45,0.01); tono(659,2.2,v*0.5,0.0); vib(40); }
const sonVuelta = () => { tono(523,0.6,0.09); tono(784,0.9,0.07,0.18); vib(25); };
let vozSel = null;
function cargarVoz(){
  if(!window.speechSynthesis) return;
  const vs = speechSynthesis.getVoices()||[]; const re = st.lang==="ca" ? /^ca/i : /^es/i;
  vozSel = vs.filter(v=>re.test(v.lang))[0] || null;
}
if(window.speechSynthesis){ cargarVoz(); speechSynthesis.onvoiceschanged = cargarVoz; }
function callar(){ try{ if(window.speechSynthesis) speechSynthesis.cancel(); }catch(e){} }
function hablar(txt, onEnd){
  const espera = Math.max(4200, txt.length*75);
  if(!st.voz || !window.speechSynthesis){ if(onEnd) return setTimeout(onEnd, espera); return; }
  let hecho=false; const fin=()=>{ if(hecho) return; hecho=true; if(onEnd) setTimeout(onEnd, 1300); };
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(txt);
    u.lang = st.lang==="ca" ? "ca-ES" : "es-ES"; if(vozSel) u.voice = vozSel; u.rate = 0.88;
    u.onend = fin; u.onerror = fin;
    speechSynthesis.speak(u);
    setTimeout(fin, Math.max(9000, txt.length*130));
  }catch(e){ setTimeout(fin, espera); }
}

function escenaSel(){
  const lista = escenas(juego), max = nivelMax(juego);
  const k = juego+"_"+st.perfil; const rec = st.recomendado[k] || max;
  let id = st.escena[k];
  const ok = s => s.nivel<=max && (!s.duelo || tieneCod("duelo"));
  if(!lista.some(s=>s.id===id && ok(s))) id = (lista.filter(ok).find(s=>s.nivel===rec) || lista.filter(ok).pop() || lista[0]).id;
  return lista.find(s=>s.id===id);
}

      <p class="muted" style="margin:8px 0 0">${t("co_x")}</p></div>`;
  }
  const puede = !(juego==="carrusel" && sel.propio && st.misVagones.length<2) && !(juego==="casa" && !st.figuras.length);
  app.innerHTML = cabecera() + `<button class="btn mini" onclick="ir('hub')">${t("volver")}</button>
    <h1>${ICO[juego]} ${t("g_"+juego)}</h1><p class="tag">${t("g_"+juego+"_d")}</p>
    ${vinetaHTML()}
    <div class="card"><h2>${t("escena_t")}</h2><ul class="lista">${filas}</ul></div>
    ${extra}
    <div class="lbl">${t("ancla_t")}</div><div class="chips">${anclas}</div>
    <label class="chip ${st.voz?"sel":""}" style="display:block;cursor:pointer;margin:0 0 14px"><input type="checkbox" ${st.voz?"checked":""} onchange="st.voz=this.checked;guardarSt();render()" style="margin-right:8px">🔊 ${t("voz")}</label>
    <button class="btn big" ${puede?"":"disabled"} onclick="nuevoEnsayo(1)">${t("empezar")}</button>`;
}
function guardarVagones(v){
  st.misVagones = v.split("\n").map(s=>s.trim()).filter(Boolean).slice(0,6); guardarSt();
  const b = document.querySelector(".big"); if(b) b.disabled = st.misVagones.length<2;
}
function togFigura(k){
  const i = st.figuras.indexOf(k);
  if(i>=0) st.figuras.splice(i,1); else if(st.figuras.length<4) st.figuras.push(k);
  guardarSt(); render();
}

/* ---------------- motor del ensayo ---------------- */
function nuevoEnsayo(n, sesion){
  audioOn(); wakeOn();
  const sc = escenaSel();
  E = { juego, sc, n, sesion: sesion || ("s"+Date.now()), paso:"exp", inicio:new Date(),
        exp:{act:null,q:null}, pico:{zona:null,act:null,noNoto:false}, resp:null, frase:null, fraseModo:null,
        post:null, comp:null, alarma:null, parcial:false, cerrado:false };
  ir("ens");
}
function setE(path, v){ const [a,b]=path.split("."); if(b) E[a][b]=v; else E[a]=v; render(); }
function escalaHTML(path, val){
  if(P()) return `<div class="escala3">${[["poco",2],["algo",5],["mucho",8]].map(([k,v])=>`<button class="${val===v?"sel":""}" onclick="setE('${path}',${v})">${t(k)}</button>`).join("")}</div>`;
  return `<div class="escala">${Array.from({length:11},(_,i)=>`<button class="${val===i?"sel":""}" onclick="setE('${path}',${i})">${i}</button>`).join("")}</div>`;
}
function irPaso(p){ E.paso=p; if(["entrada","escena","resp"].includes(p)===false) { stage.hidden=true; stage.innerHTML=""; document.body.style.overflow=""; } render(); scrollTo(0,0); }
function vEnsayo(){
  if(!E) return ir("hub");
  const cab = cabecera() + `<p class="eyebrow" style="margin:6px 0 0">${t("g_"+E.juego)} · ${esc(L(E.sc).t)} · ${t("ens_n")(E.n, MAX_ENSAYOS)}</p>`;
  const paso = E.paso;
  if(paso==="exp"){
    const ok = E.exp.act!=null && E.exp.q!=null;
    app.innerHTML = cab + `<h1>${t("exp_t")}</h1>
      <div class="card"><div class="q"><p>${t("exp_act")}</p>${escalaHTML("exp.act",E.exp.act)}${P()?"":`<span class="muted">${t("exp_act_x")}</span>`}</div>
      <div class="q" style="margin:0"><p>${t("exp_q")}</p>${escalaHTML("exp.q",E.exp.q)}${P()?"":`<span class="muted">${t("exp_q_x")}</span>`}</div></div>
      <button class="btn big" ${ok?"":"disabled"} onclick="irPaso('entrada')">${t("seguir")}</button>`;
    return;
  }
  if(paso==="entrada") return pasoEntrada();
  if(paso==="escena") return pasoEscena();
  if(paso==="pico"){
    const ok = E.pico.noNoto || (E.pico.zona && E.pico.act!=null);
    const Z = ZONAS[st.lang];
    app.innerHTML = cab + `<h1>${t("pico_t")}</h1>
      <div class="card"><div class="zonas">${Object.keys(Z).map(k=>`<button class="${E.pico.zona===k?"sel":""}" onclick="E.pico.noNoto=false;setE('pico.zona','${k}')">${Z[k]}</button>`).join("")}</div>
      <div class="q"><p>${t("pico_act")}</p>${escalaHTML("pico.act",E.pico.act)}</div>
      <button class="btn mini" onclick="E.pico.zona=null;E.pico.act=null;setE('pico.noNoto',true)">${E.pico.noNoto?"✓ ":""}${t("no_noto")}</button>
      ${E.pico.noNoto?`<div class="aviso">${esc(fa(t("no_noto_x")))}</div>`:""}</div>
      <button class="btn big" ${ok?"":"disabled"} onclick="irPaso('resp')">${t("seguir")}</button>`;
    return;
  }
  if(paso==="resp") return pasoRespuesta();
  if(paso==="frase"){
    const fr = ["frase1","frase2","frase3"];
    const ok = E.frase && E.fraseModo;
    app.innerHTML = cab + `<h1>${t("frase_t")}</h1>
      <div class="card"><p class="muted" style="margin-top:0">${t("frase_txt")}</p>
      <div class="chips" style="flex-direction:column">${fr.map(k=>`<button class="chip ${E.frase===k?"sel":""}" onclick="setE('frase','${k}')">${t(k)}</button>`).join("")}</div>
      <div class="chips">${["dicha","pensada"].map(k=>`<button class="chip ${E.fraseModo===k?"sel":""}" onclick="setE('fraseModo','${k}')">${t(k)}</button>`).join("")}</div>
      ${vinetaHTML("campana")}</div>
      <button class="btn big" ${ok?"":"disabled"} onclick="irPaso('post')">${t("seguir")}</button>`;
    return;
  }
  if(paso==="post"){
    const ok = E.post!=null && E.comp;
    app.innerHTML = cab + `<h1>${t("post_t")}</h1>
      <div class="card"><div class="q"><p>${t("post_act")}</p>${escalaHTML("post",E.post)}</div>
      <div class="q" style="margin:0"><p>${t("comp_t")}</p><div class="chips">${["facil","igual","dificil"].map(k=>`<button class="chip ${E.comp===k?"sel":""}" onclick="setE('comp','${k}')">${t("comp_"+k)}</button>`).join("")}</div></div></div>
      <button class="btn big" ${ok?"":"disabled"} onclick="cerrarEnsayo()">${t("seguir")}</button>`;
    return;
  }
  if(paso==="res") return pasoResultado();
}

/* ---- paso: entrada (Respiro AIS) ---- */
function pasoEntrada(){
  app.innerHTML = cabecera() + `<h1>${t("entrada_t")}</h1>
    <div class="card"><div class="respiro-box" id="resp"></div>
    <p style="text-align:center;margin:6px 0 12px">${esc(fa(t("entrada_txt")))}</p>
    <button class="btn big" id="btnAp" disabled onclick="finEntrada()">${t("ya_aparezco")}</button></div>`;
  const box = document.getElementById("resp");
  try{ if(respiro) respiro.destroy(); }catch(e){}
  respiro = null;
  const habilita = () => { const b=document.getElementById("btnAp"); if(b) b.disabled=false; };
  if(window.RespiroAIS){
    try{ respiro = RespiroAIS.mount(box,{ lang:"es", figure:P()?"child":"organism", autostart:true, showControl:false, showZones:false, legend:false,
         rhythm:{inhale:4000,anchor:2000,exhale:6000,pause:1500}, onCycle:habilita }); }catch(e){}
  } else box.innerHTML = '<div class="orbe" style="position:relative;left:auto;top:auto;margin:20px auto"></div>';
  later(habilita, 14000);
}
function finEntrada(){ try{ if(respiro) respiro.destroy(); }catch(e){} respiro=null; limpiarTimers(); irPaso("escena"); }

/* ---- paso: escena imaginada por capas ---- */
function pasoEscena(){
  const sc = L(E.sc);
  stage.className = "stage st-dark"; stage.hidden = false; document.body.style.overflow = "hidden";
  stage.innerHTML = `<div class="st-top"><span class="ttl">${esc(sc.t)}</span><button class="st-parar" onclick="necesitoParar()">${t("parar")}</button></div>
    <div class="esc-ico">${E.sc.ico}</div>
    <div class="esc-capas" id="capas"><p class="on" style="font-style:italic;font-size:16.5px;opacity:.8">${esc(t("escena_pre"))}</p></div>
    <div class="esc-pie" id="escPie"><button class="st-btn" style="background:rgba(255,255,255,.14);color:#efe7d8" onclick="sigCapa()">${t("siguiente")}</button></div>`;
  E.capa = -1;
  hablar(t("escena_pre"), sigCapa);
}
function sigCapa(){
  if(!E || E.paso!=="escena" || E.pausa) return;
  const capas = L(E.sc).capas; const box = document.getElementById("capas"); if(!box) return;
  limpiarTimers();
  E.capa++;
  [...box.children].forEach(p=>p.classList.add("old"));
  while(box.children.length>2) box.removeChild(box.firstChild);
  if(E.capa < capas.length){
    const p = document.createElement("p"); p.textContent = capas[E.capa]; box.appendChild(p);
    requestAnimationFrame(()=>p.classList.add("on"));
    const idc = E.capa;
    hablar(capas[E.capa], ()=>{ if(E && E.capa===idc) sigCapa(); });
  } else {
    const p = document.createElement("p"); p.textContent = t("quedate"); p.style.fontStyle="italic"; box.appendChild(p);
    requestAnimationFrame(()=>p.classList.add("on"));
    hablar(t("quedate"));
    document.getElementById("escPie").innerHTML = "";
    later(()=>{ const pie=document.getElementById("escPie"); if(pie) pie.innerHTML = `<button class="st-btn" style="background:var(--amarillo);color:#2a2214" onclick="callar();irPaso('pico')">${t("lo_noto")}</button>`; }, 6000);
  }
}

/* ---- paso: respuesta (mecánica de cada juego) ---- */
function pasoRespuesta(){
  stage.hidden = false; document.body.style.overflow = "hidden";
  if(E.juego==="campana") campanaStart();
  else if(E.juego==="carrusel") carruselStart();
  else casaStart();
}
function finRespuesta(resp){
  limpiarTimers(); callar();
  E.resp = resp;
  stage.hidden = true; stage.innerHTML = ""; document.body.style.overflow = "";
  irPaso(E.juego==="casa" ? "post" : "frase");
}
// botones de mantener (uno o dos, para Co-AIS)
function montarHold(btn, onChange){
  btn.addEventListener("pointerdown", e=>{ e.preventDefault(); try{ btn.setPointerCapture(e.pointerId); }catch(_){} btn.classList.add("on"); onChange(true); });
  const off = ()=>{ if(!btn.classList.contains("on")) return; btn.classList.remove("on"); onChange(false); };
  ["pointerup","pointercancel","lostpointercapture"].forEach(ev=>btn.addEventListener(ev, off));
  btn.addEventListener("contextmenu", e=>e.preventDefault());
}

/* ===== LA CAMPANA ===== */
function campanaSVG(){
  return `<svg viewBox="0 0 120 120" aria-hidden="true"><path d="M60 8a6 6 0 0 1 6 6v4c18 4 28 20 28 40v20l10 12H16l10-12V58c0-20 10-36 28-40v-4a6 6 0 0 1 6-6z" fill="#e8b93a" id="bellBody"/>
    <path d="M40 40c-4 6-6 12-6 20" stroke="#fff" stroke-opacity=".5" stroke-width="5" fill="none" stroke-linecap="round"/>
    <circle cx="60" cy="102" r="9" fill="#b98a1c"/></svg>`;
}
function campanaStart(){
  const sc = L(E.sc);
  const porques = sc.x.slice();
  if(st.miCampana && st.miCampana.comida) porques.push(st.miCampana.comida);
  const dur = (P()?40:60)*1000;
  R = { dur, el:0, last:performance.now(), hold:false, sost:0, rings:0, ringsSin:0, tapped:false, porques:0, lat:null,
        tFirst:null, nextRing:1500, porquesTxt:porques, peri:0, pausa:false };
  stage.className = "stage st-dark st-campana";
  const per = t("c_peri");
  stage.innerHTML = `<div class="st-top"><span class="ttl">${esc(sc.t)}</span><button class="st-parar" onclick="necesitoParar()">${t("parar")}</button></div>
    <div class="alivio" id="alivio"></div>
    <div class="bell" id="bell">${campanaSVG()}</div>
    <div class="peri" id="peri0" style="left:8%;top:50%"><span>☕</span>${per[0]}</div>
    <div class="peri" id="peri1" style="right:8%;top:44%"><span>🌤️</span>${per[1]}</div>
    <div class="peri" id="peri2" style="left:42%;top:60%"><span>🙂</span>${per[2]}</div>
    <div id="bubs"></div>
    <p class="st-txt" id="ctxt">${esc(fa(t("c_txt0")))}</p>
    <button class="st-hold" id="hold">${t("c_quedo")}<br><small style="font-weight:600">${ANCLAS[st.lang][st.ancla][0]}</small></button>`;
  montarHold(document.getElementById("hold"), on=>{
    R.hold = on;
    document.getElementById("ctxt").textContent = fa(t(on ? "c_txt_hold" : "c_txt_suelta"));
  });
  raf = requestAnimationFrame(campanaFrame);
}
function campanaRing(){
  R.rings++; if(R.rings>1 && !R.tapped) R.ringsSin++; R.tapped=false;
  if(R.tFirst==null) R.tFirst = R.el;
  const b = document.getElementById("bell"); b.classList.remove("ring"); void b.offsetWidth; b.classList.add("ring");
  sonCampana(1 + R.porques*0.4 - Math.min(1, R.sost/40)*0.6);
  const n = 1 + (Math.random()<0.6?1:0);
  for(let i=0;i<n;i++) later(burbuja, i*900);
  R.nextRing = R.el + Math.max(3200, rnd(6000,8000) - 900*R.porques);
}
function burbuja(){
  if(!R || E.paso!=="resp") return;
  const box = document.getElementById("bubs"); if(!box) return;
  const d = document.createElement("div"); d.className = "bub";
  d.textContent = R.porquesTxt[Math.floor(Math.random()*R.porquesTxt.length)];
  R.lado = !R.lado;
  if(R.lado){ d.style.left = rnd(3,14)+"%"; } else { d.style.right = rnd(3,14)+"%"; }
  d.style.top = rnd(44,62)+"%";
  d.addEventListener("pointerdown", e=>{
    e.preventDefault(); e.stopPropagation();
    if(R.pausa) return;
    R.porques++; R.tapped = true; if(R.lat==null) R.lat = R.el - (R.tFirst||0);
    d.classList.add("pop"); setTimeout(()=>d.remove(), 350);
    const a = document.getElementById("alivio"); a.classList.add("on"); setTimeout(()=>a.classList.remove("on"), 600);
    document.getElementById("ctxt").textContent = t("c_alivio");
    R.nextRing = Math.min(R.nextRing, R.el + 2200);
  });
  d.addEventListener("animationend", ()=>d.remove());
  box.appendChild(d);
}
function campanaFrame(now){
  if(!R || E.paso!=="resp" || E.juego!=="campana") return;
  const dt = Math.min(0.25,(now-R.last)/1000); R.last = now;
  if(!R.pausa){
    R.el += dt*1000;
    if(R.hold) R.sost += dt;
    if(R.el >= R.nextRing && R.el < R.dur - 2500) campanaRing();
    const s = clamp(1 + 0.13*R.porques - 0.45*Math.min(1, R.sost/(R.dur/1000*0.7)), 0.5, 1.7);
    const b = document.getElementById("bell");
    b.style.setProperty("--s", s.toFixed(3));
    b.style.filter = `saturate(${clamp(s,0.2,1.4)}) brightness(${clamp(0.6+0.4*s,0.6,1.2)})`;
    const nPeri = R.sost>=26?3 : R.sost>=16?2 : R.sost>=8?1 : 0;
    for(let i=0;i<3;i++){ const p=document.getElementById("peri"+i); if(p) p.classList.toggle("on", i<nPeri); }
    if(R.el >= R.dur){
      if(R.rings>0 && !R.tapped) R.ringsSin++;
      const vent = R.dur/1000, lat = R.lat==null ? vent : R.lat/1000;
      const fuerza = Math.round(100*( (1-lat/vent)*0.34 + Math.min(1,R.porques/4)*0.33 + (1-Math.min(1,R.sost/(vent*0.8)))*0.33 ));
      return finRespuesta({ sosten_s:Math.round(R.sost), latencia_captura_s:R.lat==null?null:Math.round(R.lat/100)/10,
        porques_tocados:R.porques, campanas:R.rings, campanas_sin_porque:R.ringsSin, fuerza });
    }
  }
  raf = requestAnimationFrame(campanaFrame);
}

/* ===== EL CARRUSEL ===== */
function carruselFrases(){
  const sc = L(E.sc);
  return (E.sc.propio ? st.misVagones : sc.x).filter(Boolean);
}
function carruselStart(){
  R = { rondas:P()?2:3, ronda:1, fase:"subido", tRonda:0, lats:[], posp:0, sost:0, anclaOk:0, anclaT:0, hold:false,
        idx:0, ang:0, vel:30, sigFrase:0, last:performance.now(), pausa:false, vueltas:[], avisoLargo:false };
  stage.className = "stage st-carrusel";
  const wags = Array.from({length:8},(_,i)=>`<div class="wag" style="transform:rotate(${i*45}deg) translateY(-105px)"></div>`).join("");
  stage.innerHTML = `<div class="st-top"><span class="ttl" id="ronda"></span><button class="st-parar" onclick="necesitoParar()">${t("parar")}</button></div>
    <div class="car" id="car">${wags}</div>
    <div class="luz" id="luz"></div>
    <div class="car-frase" id="cfrase"></div>
    <p class="st-txt" id="rtxt" style="top:calc(14px + env(safe-area-inset-top) + 34px);font-size:15.5px;opacity:.85"></p>
    <div class="car-btns" id="cbtns"></div>`;
  carruselRonda();
  raf = requestAnimationFrame(carruselFrame);
}
function carruselRonda(){
  R.fase="subido"; R.tRonda=0; R.sigFrase=0; R.vel=30; R.avisoLargo=false;
  document.getElementById("ronda").textContent = t("r_ronda")(R.ronda, R.rondas);
  document.getElementById("rtxt").textContent = t("r_txt_subir");
  document.getElementById("car").classList.remove("parado");
  document.getElementById("cbtns").innerHTML = `<button class="stopbtn" onclick="carruselStop(false)">${t("r_stop")}</button><button class="cajabtn" onclick="carruselStop(true)">${t("r_caja")}</button>`;
  luzA("car");
}
function luzA(donde){
  const l = document.getElementById("luz"); if(!l) return;
  if(donde==="car"){ l.style.left="calc(50% - 13px)"; l.style.top="calc(24% + 92px)"; }
  else { l.style.left="calc(50% - 13px)"; l.style.top="calc(24% + 52px)"; }
}
function carruselFrame(now){
  if(!R || E.paso!=="resp" || E.juego!=="carrusel") return;
  const dt = Math.min(0.25,(now-R.last)/1000); R.last = now;
  if(!R.pausa){
    if(R.fase==="subido"){
      R.tRonda += dt;
      R.vel = Math.min(220, 30 + 9*R.tRonda);
      R.ang = (R.ang + R.vel*dt) % 360;
      document.getElementById("car").style.transform = `rotate(${R.ang}deg)`;
      if(R.tRonda >= R.sigFrase){
        const fr = carruselFrases(); const f = fr[R.idx % fr.length]; R.idx++;
        const el = document.getElementById("cfrase"); el.style.opacity=0;
        setTimeout(()=>{ el.textContent = f; el.style.opacity=1; }, 250);
        if(st.voz) hablar(f);
        R.sigFrase += Math.max(2.4, 3.6 - 0.04*R.tRonda);
      }
      if(R.tRonda>45 && !R.avisoLargo){ R.avisoLargo=true; document.getElementById("rtxt").textContent = t("r_txt_largo"); }
      if(R.tRonda>75) carruselStop(false);
    } else if(R.fase==="ancla" && R.hold){
      R.sost += dt; R.anclaT += dt;
      const pr = Math.min(1, R.anclaT/5);
      const c = document.getElementById("aprog"); if(c) c.style.strokeDashoffset = (440*(1-pr)).toFixed(1);
      if(pr>=1) carruselVuelve();
    }
  }
  raf = requestAnimationFrame(carruselFrame);
}
function carruselStop(caja){
  if(R.fase!=="subido") return;
  callar();
  R.lats.push(Math.round(R.tRonda*10)/10); if(caja) R.posp++;
  R.fase = "ancla"; R.anclaT = 0;
  document.getElementById("car").classList.add("parado");
  document.getElementById("cfrase").textContent = "";
  document.getElementById("rtxt").textContent = caja ? t("r_caja_ok") : t("r_para");
  sonVuelta();
  luzA("cuerpo");
  document.getElementById("cbtns").innerHTML = "";
  later(carruselAnclaUI, 1400);
}
function carruselAnclaUI(){
    if(!R || R.fase!=="ancla" || document.getElementById("hold")) return;
    document.getElementById("rtxt").textContent = fa(t("r_ancla"));
    stage.insertAdjacentHTML("beforeend", `<div class="orbe" id="orbe"></div>
      <svg class="anclaprog" id="aprogsvg" viewBox="0 0 150 150"><circle cx="75" cy="75" r="70" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="6"/>
      <circle id="aprog" cx="75" cy="75" r="70" fill="none" stroke="#e8b93a" stroke-width="6" stroke-linecap="round" stroke-dasharray="440" stroke-dashoffset="440" transform="rotate(-90 75 75)"/></svg>`);
    document.getElementById("cbtns").innerHTML = `<button class="st-hold" id="hold" style="position:relative;left:auto;bottom:auto;transform:none">${t("r_ancla_btn")}<br><small style="font-weight:600">${ANCLAS[st.lang][st.ancla][0]}</small></button>`;
    montarHold(document.getElementById("hold"), on=>{ R.hold=on; });
}
function carruselVuelve(){
  R.fase = "vuelve"; R.hold=false; R.anclaOk++;
  sonVuelta();
  ["orbe","aprogsvg"].forEach(id=>{ const e=document.getElementById(id); if(e) e.remove(); });
  document.getElementById("rtxt").textContent = t("r_vuelve");
  document.getElementById("cbtns").innerHTML = t("r_vuelve_opts").map((o,i)=>`<button class="cajabtn" style="background:rgba(255,255,255,.9);color:#283244;font-size:15.5px;padding:13px 18px" onclick="carruselPausa(${i})">${esc(o)}</button>`).join("");
}
function carruselPausa(i){
  R.vueltas.push(t("r_vuelve_opts")[i]);
  R.fase = "pausa";

function carruselSiguiente(){

      const media = R.lats.reduce((a,b)=>a+b,0)/R.lats.length;
      return finRespuesta({ sosten_s:Math.round(R.sost), latencias_s:R.lats, latencia_media_s:Math.round(media*10)/10,
        bajadas:R.lats.length, pospuestos:R.posp, anclajes_completos:R.anclaOk, vuelve_a:R.vueltas,
        fuerza:Math.round(100*Math.min(1, media/30)) });

function casaPausaCo(){

}
function casaHolds(label){
  const c = document.getElementById("hctrl");
  if(R.co){
    c.innerHTML = `<button class="st-hold dos izq" id="hA">${t("yo")}<br><small>${t("h_hold_co")}</small></button><button class="st-hold dos der" id="hB">${t("h_hold_co")}<br><small>+1</small></button>`;

    montarHold(document.getElementById("hB"), on=>{ R.holdB=on; });
  } else {

  }
}
const casaDentro = () => R.holdA && (!R.co || R.holdB);
function casaPuerta(){
  R.sub = "puerta"; R.tPuerta = 0; R.q = 0;
  document.getElementById("htxt").textContent = t("h_puerta");
  casaHolds(fa(t("h_hold")));
}
function casaPosiciones(){
  const lejos = Math.min(1, R.tent*0.28) * (1 - R.walk);
  document.querySelectorAll(".fam").forEach((f,i)=>{
    const base = 60 + i*9 - (R.sub==="abrazo"||R.sub==="mesa" ? 8 : 0);
    f.style.left = Math.min(92, base + lejos*22) + "%";
    f.style.transform = `scale(${1 - lejos*0.35})`;
    f.style.opacity = String(1 - lejos*0.45);
  });
  const yo = document.getElementById("yo");
  const x = R.sub==="puerta"||R.sub==="pausaco" ? 2 : 16 + R.walk*21;
  yo.style.left = x + "%";
  document.getElementById("sombra").style.opacity = String(Math.min(0.45, R.tent*0.12) * (1 - R.walk));
}
function casaFrame(now){
  if(!R || E.paso!=="resp" || E.juego!=="casa") return;
  const dt = Math.min(0.25,(now-R.last)/1000); R.last = now;
  if(!R.pausa){
    const dentro = casaDentro();
    if(dentro) R.sost += dt;
    if(R.sub==="puerta" && dentro){
      R.tPuerta += dt;
      const meta = P()?9:12, cada = meta/3;
      const q = Math.min(3, Math.floor(R.tPuerta/cada)+1);
      if(q!==R.q){ R.q=q; if(q<=3) document.getElementById("htxt").textContent = t("h_q")[q-1]; }
      if(R.tPuerta>=meta) casaEntrar();
    } else if(R.sub==="acercarse" && dentro){
      R.walk = Math.min(1, R.walk + dt/(P()?7:10));
      casaPosiciones();
      if(R.walk>=1) casaAbrazo();
    } else if(R.sub==="abrazo" && dentro){
      R.hug += dt; R.abrazoS += dt;
      const meta = P()?6:10;
      document.getElementById("barraI").style.width = Math.min(100, 100*R.hug/meta)+"%";
      const n = Math.min(st.figuras.length, Math.floor(R.hug/meta*st.figuras.length+0.0001));
      document.querySelectorAll(".manadaluz").forEach((l,i)=>l.classList.toggle("on", i<n));
      if(R.hug>=meta) casaMesa();
    }
  }
  raf = requestAnimationFrame(casaFrame);
}
function casaEntrar(){
  R.sub = "entrar"; R.holdA=false;
  sonVuelta(); casaPosiciones();
  casaOpciones();
}
function casaOpciones(){
  document.getElementById("htxt").textContent = R.tent>=3 ? t("h_otro") : t("h_dentro");
  const ten = t("h_tent");
  document.getElementById("hctrl").innerHTML = `<div class="opciones">${ten.map((o,i)=>`<button onclick="casaTent(${i})">${esc(o)}</button>`).join("")}
    <button class="tec" onclick="casaAcercarse()">${esc(fa(t("h_tec")))}</button></div>`;
}
function casaTent(i){
  R.tent++; R.tentTxt.push(t("h_tent")[i]);
  casaPosiciones();
  document.getElementById("htxt").textContent = t("h_aleja");
  document.getElementById("hctrl").innerHTML = "";
  later(casaOpciones, 2600);
}
function casaAcercarse(){
  R.sub = "acercarse";

}
function casaAbrazo(){
  R.sub = "abrazo"; casaPosiciones();

    const a = (i/st.figuras.length)*Math.PI*2 - Math.PI/2;
    return `<div class="manadaluz" style="left:calc(50% + ${(Math.cos(a)*24-5).toFixed(1)}px);top:calc(44% + ${(Math.sin(a)*24).toFixed(1)}px)"></div>`;

function casaMesa(){
  R.sub = "mesa"; R.holdA=false;

function casaFrase(k){
  R.frase = k;

function casaFin(){

/* ---- cierre del ensayo: alarmas, fuerza, escalera ---- */
function cerrarEnsayo(){
  const k = E.sc.id, rs = E.resp || {};
  if(!st.fuerzas[k]) st.fuerzas[k] = [];
  if(rs.fuerza!=null) st.fuerzas[k].push(rs.fuerza);
  st.fuerzas[k] = st.fuerzas[k].slice(-30);
  // alarmas (guía §12)
  const alarmas = [];
  const pico = E.pico.noNoto ? 0 : E.pico.act;
  if(E.post!=null && pico!=null && E.post > pico && (rs.sosten_s||0) < 20) alarmas.push("post>pre");
  st.noNoto.push(E.pico.noNoto?1:0); st.noNoto = st.noNoto.slice(-3);
  if(st.noNoto.reduce((a,b)=>a+b,0)>=2 && st.ancla!=="pies"){ alarmas.push("no_noto"); st.ancla="pies"; }
  if(!practicaCalmaReciente()) alarmas.push("solo_malestar");
  E.alarmas = alarmas;
  const kn = E.juego+"_"+st.perfil;
  E.subeEscalon = null;
  if(alarmas.includes("post>pre")) st.recomendado[kn] = Math.max(1, E.sc.nivel-1);
  else {
    const f = st.fuerzas[k], max = nivelMax(E.juego), sosMin = P()?15:30;
    if(E.sc.nivel===max && f.length>=3 && f[f.length-1] < f[f.length-2] && f[f.length-2] < f[f.length-3] && (rs.sosten_s||0)>=sosMin && max<5 && escenas(E.juego).some(s=>s.nivel===max+1)){
      st.nivel[kn] = max+1; E.subeEscalon = max+1;
    }
    if(st.recomendado[kn] && st.recomendado[kn] < E.sc.nivel) delete st.recomendado[kn];
  }
  E.recId = "ex"+Date.now();
  guardarRegistro();
  guardarSt();
  irPaso("res");
}
function guardarRegistro(micro){
  if(!window.Aprens || !E) return;
  const rs = E.resp || {};
  const viol = (E.exp.act!=null && E.pico.act!=null) ? E.exp.act - E.pico.act : null;
  const rec = Object.assign({ id:E.recId, date:fechaLocal(E.inicio), ts:Date.now(), bloque:"exposicion", juego:E.juego,
    escena_id:E.sc.id, escena:L(E.sc).t, tema:E.sc.tema, nivel:E.sc.nivel, perfil:st.perfil, ancla:st.ancla,
    sesion:E.sesion, ensayo:E.n, exp_activacion:E.exp.act, exp_quedarme:E.exp.q,
    act_pico:E.pico.noNoto?null:E.pico.act, zona:E.pico.zona, no_noto:E.pico.noNoto,
    act_post:E.post, comparacion:E.comp, violacion_expectativa:viol,
    frase_honesta:E.frase?T.es[E.frase]:null, frase_modo:E.fraseModo,
    alarma:(E.alarmas&&E.alarmas.length)?E.alarmas.join(","):null, parcial:!!E.parcial,
    tec:E.juego==="casa"?"C":"L" }, rs);
  if(micro) rec.microaccion = micro;
  Aprens.save(rec);
}
function sparkSVG(vals){
  if(!vals.length) return "";
  const w=300,h=84,pd=12, n=vals.length;
  const x = i => n===1 ? w/2 : pd + i*(w-2*pd)/(n-1), y = v => h-pd - (v/100)*(h-2*pd);
  const pts = vals.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" role="img" aria-label="${vals.join(", ")}">
    <line x1="${pd}" y1="${h-pd}" x2="${w-pd}" y2="${h-pd}" stroke="#e0d8c8"/>
    ${n>1?`<polyline points="${pts}" fill="none" stroke="#a9781f" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`:""}
    ${vals.map((v,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="${i===n-1?5:3.5}" fill="${i===n-1?"#e8b93a":"#a9781f"}"/>`).join("")}
    <text x="${x(n-1).toFixed(1)}" y="${(y(vals[n-1])-9).toFixed(1)}" text-anchor="middle" font-size="12" font-weight="700" fill="#565a41">${vals[n-1]}</text></svg>`;
}

  ].join("");

function repetirEnsayo(){ const s=E.sesion, n=E.n+1; juego=E.juego; nuevoEnsayo(n, s); }
function cerrarSesion(){

  stage.hidden = true; stage.innerHTML = ""; document.body.style.overflow = "";
  if(E){
    E.parcial = true; E.alarmas = ["parada"]; E.resp = E.resp || (R ? { sosten_s:Math.round(R.sost||0) } : {});

}

function pvAccion(tipo){
  audioOn();
  PV._ring = tipo!=="comida"; PV._comida = tipo==="comida" || tipo==="ambas";
  if(PV._ring) sonCampana(0.8);
  if(PV.fase===1){
    if(tipo==="campana"){ PV.saliva=0; PV.prob.campana=true; PV.msg=t("pv_r_campana0"); }
    else { PV.saliva=1; PV.prob.comida=true; PV.msg=t("pv_r_comida"); }
  } else if(PV.fase===2){
    PV.pares++; PV.asoc = Math.min(1, PV.pares*0.2); PV.saliva = 1; PV.msg = "";
  } else if(PV.fase===3){
    PV.saliva = PV.asoc; PV.prueba=true; PV.msg = t("pv_r_prueba");
  } else if(PV.fase===4){
    PV.acomp = true; PV.saliva = PV.asoc; PV.ext.push(Math.round(PV.saliva*100)); PV.asoc *= 0.68;
    PV.msg = PV.ext.length>=4 ? t("pv_r_ext") : "";
  } else if(PV.fase===5){
    PV.acomp = true;
    if(PV.dia2===0){ PV.asoc = 0.38; }
    PV.saliva = PV.asoc; PV.ext.push(Math.round(PV.saliva*100)); PV.asoc *= 0.5; PV.dia2++;
    PV.msg = t("pv_r_rec");
  }
  render();
  setTimeout(()=>{ PV._ring=false; }, 900);
}
function pvPuedeSeguir(){
  return PV.fase===0 || (PV.fase===1 && PV.prob.campana && PV.prob.comida) || (PV.fase===2 && PV.pares>=5) ||
    (PV.fase===3 && PV.prueba) || (PV.fase===4 && PV.ext.length>=6) || (PV.fase===5 && PV.dia2>=3);
}
function pvSig(){ PV.fase++; PV.msg=""; PV._comida=false; if(PV.fase===5){ PV.ext.push(null); } if(PV.fase===4||PV.fase===5) PV.acomp=true; PV.saliva = 0; render(); scrollTo(0,0); }
function curvaSVG(){
  const vals = PV.ext; if(!vals.length) return "";
  const w=300,h=90,pd=12,n=Math.max(vals.length,6);
  const x=i=>pd+i*(w-2*pd)/(n-1), y=v=>h-pd-(v/100)*(h-2*pd);
  let path="", segs=[]; vals.forEach((v,i)=>{ if(v==null){ segs.push(path); path=""; return; } path += (path?" L":"M")+x(i).toFixed(1)+","+y(v).toFixed(1); }); segs.push(path);
  const corte = vals.indexOf(null);
  return `<svg class="spark" viewBox="0 0 ${w} ${h}"><line x1="${pd}" y1="${h-pd}" x2="${w-pd}" y2="${h-pd}" stroke="#e0d8c8"/>
    ${corte>=0?`<line x1="${x(corte)}" y1="6" x2="${x(corte)}" y2="${h-pd}" stroke="#c8bfae" stroke-dasharray="4 4"/>`:""}
    ${segs.filter(Boolean).map(p=>`<path d="${p}" fill="none" stroke="#6f9fc4" stroke-width="2.5"/>`).join("")}
    ${vals.map((v,i)=>v==null?"":`<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="3.5" fill="#6f9fc4"/>`).join("")}</svg>`;
}
function vPavlov(){
