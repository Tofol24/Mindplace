<!doctype html><html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><title>¿Y a mí qué me pasa?</title>
<link rel="stylesheet" href="assets/fonts/fonts.css">
<link rel="stylesheet" href="assets/reader.css">
</head><body>
<div class="mp">
  <header>
    <div class="ttl"><div class="kick">Un mapa tuyo</div><h1>¿Y a mí qué me pasa?</h1></div>
    <div style="display:flex;gap:8px;flex:none">
      <a class="back" href="index.html">‹ Índice</a>
      <button class="back" id="wipeTop" type="button" style="color:var(--coral);border-color:#e6cfca">Borrar</button>
    </div>
  </header>
  <div class="prog" id="prog"></div>
  <main id="main"></main>
  <nav>
    <button class="nav back2" id="back" type="button" style="display:none">Atrás</button>
    <button class="nav next" id="next" type="button">Empezar</button>
  </nav>
</div>
<script>
var LS="aprens_mimapa";
var state={senales:[],ayuda:[],frases:[],otraSen:"",otraAyu:"",otraFra:""};
try{var raw=localStorage.getItem(LS); if(raw)state=Object.assign(state,JSON.parse(raw));}catch(e){}
function save(){try{localStorage.setItem(LS,JSON.stringify(state));}catch(e){}}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');}
var STEPS=[
 {id:"intro",kind:"intro"},
 {id:"senales",kind:"multi",key:"senales",okey:"otraSen",
  h:"Cuando empiezo a tener demasiadas cosas, a veces noto…",
  hint:"Marca lo que reconozcas. Puedes elegir varias, o ninguna.",
  opts:[["🖐️","las manos"],["🌀","la barriga"],["💓","el pecho"],["🧠","la cabeza"],["🔊","el ruido"],["🔥","el calor"],["🚪","ganas de irme"],["🤫","ganas de que nadie me hable"]]},
 {id:"ayuda",kind:"multi",key:"ayuda",okey:"otraAyu",
  h:"Cuando necesito recuperar espacio, a veces me ayuda…",
  hint:"Lo que a ti te sirve. No tiene por qué servirle a otros.",
  opts:[["⏸️","una pausa"],["🌙","estar solo"],["🤝","que alguien esté cerca"],["🔈","el silencio"],["🗺️","saber qué va a pasar"],["🏃","moverme"],["⭐","algo que me gusta mucho"]]},
 {id:"frases",kind:"multi",key:"frases",okey:"otraFra",frase:true,
  h:"Cuando me queda muy poco espacio, prefiero que me digan…",
  hint:"Elige las frases que a ti te van bien.",
  opts:[["","«Estoy aquí.»"],["","«No hace falta hablar ahora.»"],["","«Cuando quieras, seguimos.»"],["","«Vamos a un sitio más tranquilo.»"]]},
 {id:"map",kind:"map"}
];
var i=0, main=document.getElementById('main'), prog=document.getElementById('prog');
STEPS.forEach(function(){prog.appendChild(document.createElement('i'));});
function render(){
  main.innerHTML="";
  var st=STEPS[i], d=document.createElement('div'); d.className="step on"; d.id="s-"+st.id;
  if(st.kind==="intro"){
    d.innerHTML='<h2>Esto no es un examen.</h2>'+
      '<p class="lead">No hay respuestas buenas ni malas. Solo <b>pistas sobre ti</b>: lo que notas cuando todo se hace demasiado, y lo que te ayuda a hacer espacio.</p>'+
      '<p class="lead">Puedes hacerlo con calma, y cambiarlo otro día.</p>';
  } else if(st.kind==="multi"){
    var arr=state[st.key];
    var html='<h2>'+st.h+'</h2><p class="hint">'+st.hint+'</p><div class="opts">';
    st.opts.forEach(function(o){
      var on=arr.indexOf(o[1])>=0;
      html+='<div class="opt'+(on?' on':'')+(st.frase?' frase':'')+'" data-v="'+esc(o[1])+'">'+
        (o[0]?'<span class="em">'+o[0]+'</span>':'')+'<span>'+o[1]+'</span>'+
        '<span class="tick">'+(on?'✓':'')+'</span></div>';
    });
    html+='</div><div class="otra"><input type="text" id="otra" placeholder="otra cosa (opcional)" value="'+esc(state[st.okey]||"")+'"></div>';
    d.innerHTML=html;
    d.querySelectorAll('.opt').forEach(function(el){
      el.onclick=function(){
        var v=el.getAttribute('data-v'), pos=arr.indexOf(v);
        if(pos>=0){arr.splice(pos,1);el.classList.remove('on');el.querySelector('.tick').textContent="";}
        else{arr.push(v);el.classList.add('on');el.querySelector('.tick').textContent="✓";}
        save();
      };
    });
    d.querySelector('#otra').oninput=function(){state[st.okey]=this.value;save();};
  } else if(st.kind==="map"){
    d.innerHTML=buildMap(); wireMap(d);
  }
  main.appendChild(d);
  prog.querySelectorAll('i').forEach(function(e,idx){e.classList.toggle('done',idx<=i);});
  document.getElementById('back').style.display=i>0?"block":"none";
  var nx=document.getElementById('next');
  nx.textContent=i===0?"Empezar":(i===STEPS.length-1?"Hecho":"Siguiente");
  nx.style.display=i===STEPS.length-1?"none":"block";
  window.scrollTo(0,0);
}
function chips(arr,otra){var all=arr.slice(); if(otra)all.push(otra);
  if(!all.length)return '<div class="empty">— (todavía sin marcar)</div>';
  return '<div class="chips">'+all.map(function(x){return '<span class="chip">'+esc(x)+'</span>';}).join("")+'</div>';}
function buildMap(){
  return '<h2>Mi mapa</h2><p class="hint">Puede cambiar otro día. Es tuyo.</p>'+
   '<div class="map">'+
   '<div class="grp"><div class="glbl">Cuando empiezo a tener demasiadas cosas, noto</div>'+chips(state.senales,state.otraSen)+'</div>'+
   '<div class="grp"><div class="glbl">Lo que me ayuda a recuperar espacio</div>'+chips(state.ayuda,state.otraAyu)+'</div>'+
   '<div class="grp"><div class="glbl">Cuando me queda muy poco espacio, prefiero que me digan</div>'+chips(state.frases,state.otraFra)+'</div>'+
   '</div>'+
   '<div class="closing-line">Cuando todo se hace demasiado, podemos hacer espacio. Y no tienes que hacerlo tú solo.</div>'+
   '<div class="acts"><button class="primary" id="copy" type="button">📋 Copiar mi mapa</button>'+
   '<button id="print" type="button">🖨️ Imprimir</button>'+
   '<button id="again" type="button">Empezar de nuevo</button></div>'+
   '<div class="borrar"><button id="wipe" type="button">Borrar mis respuestas</button></div>'+
   '<div class="saved" id="saved"></div>';
}
function mapText(){function line(a,o){var all=a.slice();if(o)all.push(o);return all.length?all.join(", "):"—";}
  return "MI MAPA (¿Y a mí qué me pasa?)\n\n"+
   "Cuando empiezo a tener demasiadas cosas, noto:\n"+line(state.senales,state.otraSen)+"\n\n"+
   "Lo que me ayuda a recuperar espacio:\n"+line(state.ayuda,state.otraAyu)+"\n\n"+
   "Cuando me queda muy poco espacio, prefiero que me digan:\n"+line(state.frases,state.otraFra)+"\n\n"+
   "Cuando todo se hace demasiado, podemos hacer espacio. Y no tengo que hacerlo yo solo.";}
function fallbackCopy(t){var ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');}catch(e){}document.body.removeChild(ta);}
function wireMap(d){
  d.querySelector('#copy').onclick=function(){var t=mapText(),ok=function(){d.querySelector('#saved').textContent="Copiado ✓";};
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(ok,function(){fallbackCopy(t);ok();});}else{fallbackCopy(t);ok();}};
  d.querySelector('#print').onclick=function(){window.print();};
  d.querySelector('#again').onclick=wipe;
  d.querySelector('#wipe').onclick=wipe;
  save();
}
function wipe(){ if(confirm("¿Borrar tus respuestas? Se borrará lo que has marcado.")){
  state={senales:[],ayuda:[],frases:[],otraSen:"",otraAyu:"",otraFra:""};save();i=0;render();}}
document.getElementById('next').onclick=function(){ if(i<STEPS.length-1){i++;render();} };
document.getElementById('back').onclick=function(){ if(i>0){i--;render();} };
document.getElementById('wipeTop').onclick=wipe;
render();
</script>
</body></html>
