<!doctype html><html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><title>Los cuentos de Nil</title>
<link rel="stylesheet" href="assets/fonts/fonts.css">
<link rel="stylesheet" href="assets/reader.css">
<style>
.langsel{display:flex;gap:0;justify-content:flex-end;margin:0 0 6px}
.langsel button{font-family:var(--sans,system-ui);font-weight:700;font-size:12px;letter-spacing:.06em;
  border:1px solid var(--line,#e3decf);background:var(--card,#fff);color:var(--muted,#8a8f86);
  padding:6px 12px;cursor:pointer}
.langsel button:first-child{border-radius:999px 0 0 999px}
.langsel button:last-child{border-radius:0 999px 999px 0;border-left:0}
.langsel button.on{background:var(--sage,#6f8f83);color:#fff;border-color:var(--sage,#6f8f83)}
</style>
</head><body>
<div class="ix">
  <div class="langsel" id="langsel"></div>
  <div class="kick" id="kick"></div>
  <h1 id="title"></h1>
  <p class="lead" id="lead"></p>
  <div class="ventana" id="ventana"></div>
  <div class="list" id="list"></div>
  <div class="foot" id="foot"></div>
</div>
<script src="assets/content.js"></script>
<script src="assets/cuentos.js"></script>
<script>
(function(){
  var LKEY="aprens_cuentos_lang";
  function getLang(){try{var l=localStorage.getItem(LKEY);if(l==="ca"||l==="es")return l;}catch(e){}return "es";}
  function setLang(l){try{localStorage.setItem(LKEY,l);}catch(e){}location.reload();}
  var LANG=getLang(), C=window.CUENTOS_CONTENT, UI=C.ui[LANG];
  document.documentElement.lang=LANG;
  document.title=UI.hubTitle;
  // selector de idioma
  var ls=document.getElementById("langsel");
  [["es","ES"],["ca","CA"]].forEach(function(o){
    var b=document.createElement("button"); b.type="button"; b.textContent=o[1];
    if(o[0]===LANG)b.className="on"; b.setAttribute("aria-label",o[0]==="es"?"Español":"Català");
    b.onclick=function(){ if(o[0]!==LANG)setLang(o[0]); };
    ls.appendChild(b);
  });
  document.getElementById("kick").textContent=UI.hubKick;
  document.getElementById("title").textContent=UI.hubTitle;
  document.getElementById("lead").textContent=UI.hubLead;
  document.getElementById("ventana").textContent=UI.ventanaHub;
  document.getElementById("foot").textContent=UI.foot;
  var list=document.getElementById("list"), n=0;
  C.order.forEach(function(id){
    n++;
    var b=C.books[id][LANG];
    var a=document.createElement("a"); a.className="cuento"; a.href=id+".html";
    a.innerHTML='<div class="thumb"><img src="img/'+id+'-p01.webp" alt="" loading="lazy"></div>'+
      '<div class="meta"><div class="n">'+UI.cuentoLabel+' '+n+'</div><h2></h2></div>';
    a.querySelector("h2").textContent=b.title;
    list.appendChild(a);
  });
  var t=document.createElement("a"); t.className="cuento tool"; t.href="mapa.html";
  t.innerHTML='<div class="ic">🧭</div><div class="meta"><div class="n"></div><h2></h2></div>';
  t.querySelector(".n").textContent=UI.toolKick;
  t.querySelector("h2").textContent=UI.toolTitle;
  list.appendChild(t);
  try{window.warmCuentos&&window.warmCuentos();}catch(e){}
})();
</script>
</body></html>
