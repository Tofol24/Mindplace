<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#3d6659">
<title>Entre punto y punto · APRENS</title>
<style>
  :root{
    --bg:#f3f0e7; --bg2:#ece7da; --card:#fffdf8; --tinta:#292620; --suau:#726a5c;
    --pista:#3d6659; --pista-d:#2b4a3f; --pista-lt:#e0ece6;
    --tierra:#c1714c; --tierra-d:#985534; --tierra-lt:#f7e6db;
    --pelota:#b98f18; --pelota-lt:#f6edcf;
    --mono:#6d7683; --mono-d:#4f5761; --mono-lt:#e8ebef;
    --calma:#5d8f77; --calma-d:#3f6b56; --calma-lt:#e3efe8;
    --alerta:#b5433a;
    --oro:#a9781f;
    --linia:#e3dbc9; --linia2:#d6cdb8;
    --ombra:0 6px 22px rgba(60,50,30,.10); --ombra-s:0 2px 10px rgba(60,50,30,.07);
    --serif:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,'Times New Roman',serif;
    --r:16px;
  }
  :root[data-theme="dark"]{
    --bg:#1b1e1c; --bg2:#161917; --card:#232825; --tinta:#ebe6db; --suau:#a2998a;
    --pista:#79b399; --pista-d:#9ecbb4; --pista-lt:#233330;
    --tierra:#dd9469; --tierra-d:#ecab84; --tierra-lt:#3a2a1e;
    --pelota:#d9b451; --pelota-lt:#392f16;
    --mono:#9aa3ae; --mono-d:#b6bdc6; --mono-lt:#292e33;
    --calma:#82c3a1; --calma-d:#a2d3ba; --calma-lt:#22302a;
    --alerta:#e0796f;
    --oro:#d7ac5a;
    --linia:#383f3a; --linia2:#454d47;
    --ombra:0 6px 22px rgba(0,0,0,.35); --ombra-s:0 2px 10px rgba(0,0,0,.25);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--tinta);line-height:1.55;font-size:16px;-webkit-font-smoothing:antialiased;
    padding-bottom:calc(78px + env(safe-area-inset-bottom))}
  .wrap{max-width:640px;margin:0 auto;padding:0 15px}

  /* Barra superior */
  .top{position:sticky;top:0;z-index:40;background:linear-gradient(180deg,var(--bg) 62%,rgba(243,240,231,0));padding:14px 15px 8px;display:flex;align-items:center;gap:11px;max-width:640px;margin:0 auto}
  :root[data-theme="dark"] .top{background:linear-gradient(180deg,var(--bg) 62%,rgba(27,30,28,0))}
  .logo{width:34px;height:34px;border-radius:50%;background:var(--pista);color:#fff;display:grid;place-items:center;font-weight:700;font-family:var(--serif);font-size:12px;flex:0 0 auto}
  .top .tt{font-family:var(--serif);font-weight:700;font-size:16px;line-height:1.1}
  .top .ts{font-size:10.5px;color:var(--suau)}
  .top .sp{margin-left:auto}
  .iconbtn{background:var(--card);border:1px solid var(--linia);color:var(--tinta);width:38px;height:38px;border-radius:11px;cursor:pointer;font-size:17px;display:grid;place-items:center}

  h1.view-t{font-family:var(--serif);font-size:24px;margin:6px 0 2px;font-weight:700;line-height:1.15}
  .view-s{color:var(--suau);font-size:14px;margin:0 0 14px}
  .kick{display:inline-block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--pista-d);background:var(--pista-lt);border:1px solid var(--linia);padding:5px 12px;border-radius:999px;font-weight:600;margin:8px 0 6px}

  .card{background:var(--card);border:1px solid var(--linia);border-radius:var(--r);padding:18px 16px;margin:14px 0;box-shadow:var(--ombra-s)}
  .card h2{font-family:var(--serif);font-size:18px;margin:0 0 4px;display:flex;align-items:center;gap:9px;line-height:1.2}
  .card h2 .e{font-size:20px;flex:0 0 auto}
  .card h3{font-family:var(--serif);font-size:16px;margin:14px 0 4px}
  .card .lead{color:var(--suau);font-size:14px;margin:4px 0 10px}
  .card p{margin:8px 0}
  .muted{color:var(--suau);font-size:13.5px}
  .tiny{font-size:12.5px;color:var(--suau)}

  .quote{font-family:var(--serif);font-style:italic;color:var(--pista-d);background:var(--pista-lt);border-left:4px solid var(--oro);border-radius:0 12px 12px 0;padding:12px 15px;margin:12px 0;font-size:15.5px;line-height:1.5}

  /* Botones */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;background:var(--pista);color:#fff;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;padding:13px 18px;min-height:48px;transition:transform .07s}
  .btn:active{transform:scale(.98)}
  .btn.full{width:100%}
  .btn.ghost{background:transparent;color:var(--pista-d);border:1.5px solid var(--pista)}
  .btn.tierra{background:var(--tierra)}
  .btn.calma{background:var(--calma)}
  .btn.sm{padding:9px 13px;min-height:40px;font-size:13.5px;border-radius:10px}
  .btn.gris{background:var(--mono)}
  .btn.danger{background:var(--alerta)}
  .btnrow{display:flex;gap:9px;flex-wrap:wrap}
  .btnrow .btn{flex:1}
  .btn:focus-visible,.qa:focus-visible,.opt:focus-visible,.chip:focus-visible,.scaleb:focus-visible,.tab:focus-visible,.mom:focus-visible,.lvl:focus-visible{outline:3px solid var(--oro);outline-offset:2px}
  .link{background:none;border:0;color:var(--pista-d);text-decoration:underline;cursor:pointer;font-family:inherit;font-size:13.5px;padding:8px 4px}

  /* Accesos rápidos */
  .qgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin:10px 0}
  .qa{background:var(--card);border:1px solid var(--linia);border-radius:14px;padding:15px 13px;text-align:left;cursor:pointer;font-family:inherit;color:var(--tinta);box-shadow:var(--ombra-s);display:flex;flex-direction:column;gap:5px;min-height:92px}
  .qa .qe{font-size:23px}
  .qa .qn{font-weight:700;font-size:14.5px;line-height:1.2}
  .qa .qd{font-size:11.5px;color:var(--suau);line-height:1.3}
  .qa:active{transform:scale(.98)}

  .stat3{display:flex;gap:9px;text-align:center}
  .stat3>div{flex:1;background:var(--pista-lt);border:1px solid var(--linia);border-radius:12px;padding:12px 5px}
  .stat3 b{display:block;font-family:var(--serif);font-size:23px;color:var(--pista-d);line-height:1}
  .stat3 span{font-size:10.5px;color:var(--suau);line-height:1.25;display:block;margin-top:3px}

  /* Formularios */
  .fld{margin:16px 0}
  .fld>label{display:block;font-size:14px;font-weight:600;margin-bottom:8px}
  .fld .hint{display:block;font-size:12.5px;color:var(--suau);font-weight:400;margin-top:2px}
  input[type=text],input[type=number],input[type=time],input[type=date],textarea,select{
    width:100%;border:1.5px solid var(--linia2);border-radius:11px;padding:11px 12px;font-family:inherit;font-size:15px;
    color:var(--tinta);background:var(--card)}
  textarea{resize:vertical;min-height:62px;line-height:1.5}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--pista)}
  .scale{display:flex;gap:4px;flex-wrap:wrap}
  .scaleb{flex:1;min-width:26px;min-height:42px;border:1.5px solid var(--linia2);border-radius:9px;background:var(--card);cursor:pointer;font-family:inherit;font-weight:700;font-size:14px;color:var(--suau)}
  .scaleb.sel{background:var(--pista);border-color:var(--pista);color:#fff}
  .scale-ends{display:flex;justify-content:space-between;font-size:11.5px;color:var(--suau);margin-top:5px}
  .chips{display:flex;gap:7px;flex-wrap:wrap}
  .chip{min-height:42px;border:1.5px solid var(--linia2);border-radius:11px;background:var(--card);cursor:pointer;font-family:inherit;font-size:13.5px;color:var(--tinta);padding:9px 13px;display:inline-flex;align-items:center;gap:6px;text-align:left}
  .chip.sel{background:var(--pista-lt);border-color:var(--pista);color:var(--pista-d);font-weight:600}
  .opt{display:block;width:100%;text-align:left;border:1.5px solid var(--linia2);border-radius:11px;background:var(--card);cursor:pointer;font-family:inherit;font-size:14px;color:var(--tinta);padding:12px 14px;margin:7px 0;line-height:1.4}
  .opt.sel{background:var(--pista-lt);border-color:var(--pista);color:var(--pista-d);font-weight:600}

  .ok-flash{background:var(--calma-lt);border:1px solid var(--calma);color:var(--calma-d);border-radius:12px;padding:13px 15px;margin:12px 0;font-size:14px;display:none}
  .ok-flash.show{display:block;animation:fade .3s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  .safe{display:flex;gap:10px;background:var(--tierra-lt);border:1px solid #e8cdb8;border-radius:12px;padding:12px 14px;font-size:13px;color:var(--tierra-d);line-height:1.45;align-items:flex-start;margin:12px 0}
  :root[data-theme="dark"] .safe{border-color:#5c4028}
  .safe .i{flex:0 0 auto;font-size:17px}

  /* Mapa atencional: momentos */
  .mom{display:flex;align-items:center;gap:11px;width:100%;text-align:left;border:1px solid var(--linia);border-radius:13px;background:var(--card);cursor:pointer;font-family:inherit;color:var(--tinta);padding:12px 13px;margin:8px 0;box-shadow:var(--ombra-s)}
  .mom .me{font-size:21px;flex:0 0 auto}
  .mom .mn{flex:1;font-weight:700;font-size:14.5px;line-height:1.25}
  .mom .mc{font-size:11px;color:var(--suau);font-weight:400;display:block;margin-top:2px}
  .mom .mar{color:var(--suau);flex:0 0 auto;font-size:15px}
  .mom.open{border-color:var(--pista);background:var(--pista-lt)}
  .mdet{display:none;border:1px solid var(--linia);border-top:0;border-radius:0 0 13px 13px;background:var(--card);margin:-9px 0 12px;padding:14px 14px 16px}
  .mdet.show{display:block;animation:fade .25s ease}
  .vs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 4px}
  @media(max-width:430px){.vs{grid-template-columns:1fr}}
  .vsbox{border-radius:12px;padding:12px 13px;font-size:13.2px;line-height:1.45}
  .vsbox.no{background:var(--mono-lt);border:1px solid var(--linia)}
  .vsbox.si{background:var(--calma-lt);border:1px solid #cde0d5}
  .vsbox h4{margin:0 0 6px;font-size:13px;letter-spacing:.02em}
  .vsbox.no h4{color:var(--mono-d)}
  .vsbox.si h4{color:var(--calma-d)}
  .vsbox ul{margin:0;padding-left:16px}
  .vsbox li{margin:3px 0}
  .ancla{background:var(--pelota-lt);border:1px solid #e6d59c;border-radius:12px;padding:11px 13px;font-size:13.5px;margin-top:10px;color:var(--tinta)}
  :root[data-theme="dark"] .ancla{border-color:#5a4b1c}
  .ancla b{color:var(--oro)}

  /* Práctica / cronómetro */
  .timerbox{text-align:center;margin:18px 0 6px}
  .clock{font-family:var(--serif);font-size:46px;font-weight:700;line-height:1;color:var(--pista-d)}
  .guide{color:var(--suau);font-size:14.5px;margin-top:8px;min-height:44px;line-height:1.45;padding:0 6px}
  .ring{width:150px;height:150px;border-radius:50%;margin:14px auto 6px;display:grid;place-items:center;
    background:radial-gradient(circle at 50% 45%,var(--pista-lt),var(--calma-lt));
    box-shadow:inset 0 0 0 2px rgba(61,102,89,.22);transition:transform 1.2s ease-in-out}
  .ring.big{transform:scale(1.12)}
  .ring .rin{width:104px;height:104px;border-radius:50%;background:var(--card);display:grid;place-items:center;box-shadow:var(--ombra-s);text-align:center;padding:6px}
  .ring .rf{font-size:15px;font-weight:700;color:var(--pista-d)}

  /* Pasos wizard */
  .prog{height:6px;background:var(--linia);border-radius:3px;overflow:hidden;margin:4px 0 14px}
  .prog i{display:block;height:100%;background:var(--tierra);border-radius:3px;transition:width .35s}
  .stepbadge{display:inline-block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--tierra-d);background:var(--tierra-lt);border:1px solid var(--linia);padding:4px 11px;border-radius:999px;font-weight:700}

  /* Niveles adentro */
  .lvl{display:flex;align-items:flex-start;gap:11px;width:100%;text-align:left;border:1px solid var(--linia);border-radius:13px;background:var(--card);cursor:pointer;font-family:inherit;color:var(--tinta);padding:13px;margin:9px 0;box-shadow:var(--ombra-s)}
  .lvl.lock{opacity:.5}
  .lvl.on{border-color:var(--calma);background:var(--calma-lt)}
  .lvl .ln{width:30px;height:30px;border-radius:50%;background:var(--pista);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px;font-family:var(--serif);flex:0 0 auto}
  .lvl.done .ln{background:var(--calma)}
  .lvl.lock .ln{background:var(--mono)}
  .lvl .lt{display:block;font-weight:700;font-size:14.5px;line-height:1.25}
  .lvl .ld{display:block;font-size:12.5px;color:var(--suau);line-height:1.35;margin-top:3px}
  .bar{display:block;height:5px;background:var(--linia);border-radius:3px;overflow:hidden;margin-top:7px}
  .bar i{display:block;height:100%;background:var(--calma);border-radius:3px}

  /* Registros */
  .rec{background:var(--card);border:1px solid var(--linia);border-radius:12px;padding:11px 13px;margin:9px 0}
  .rec .rh{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .rec .rt{font-weight:600;font-size:13.5px}
  .rec .rd{font-size:11.5px;color:var(--suau);flex:0 0 auto}
  .rec .rb{font-size:13px;color:var(--suau);margin-top:5px;line-height:1.5}
  .rec .del{background:none;border:0;color:var(--alerta);cursor:pointer;font-size:12.5px;padding:4px}
  .empty{color:var(--suau);font-style:italic;font-size:13.5px;padding:8px 0;margin:0}

  /* Frases */
  .verb{display:flex;gap:9px;align-items:flex-start;background:var(--calma-lt);border:1px solid #d3e3d9;border-radius:12px;padding:10px 12px;margin:7px 0}
  :root[data-theme="dark"] .verb{border-color:#2d3a33}
  .verb .vt{flex:1;font-family:var(--serif);font-style:italic;color:var(--calma-d);font-size:15px;line-height:1.4}
  .verb .va{display:flex;gap:4px;flex:0 0 auto}
  .verb .va button{background:none;border:0;cursor:pointer;font-size:15px;padding:3px;color:var(--suau)}
  .fav-on{color:var(--oro)}
  .grp-t{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--pista-d);font-weight:700;margin:14px 0 4px}

  .chart{width:100%;height:auto;display:block;margin:6px 0}
  .chart-lbl{font-size:11.5px;color:var(--suau);text-align:center;margin-bottom:6px}
  table.rsm{width:100%;border-collapse:collapse;font-size:13.5px}
  table.rsm td{padding:7px 0;border-bottom:1px solid var(--linia)}
  table.rsm td:last-child{text-align:right;font-weight:700}

  /* Nav inferior */
  .nav{position:fixed;bottom:0;left:0;right:0;z-index:45;background:var(--card);border-top:1px solid var(--linia);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
  .tab{flex:1;background:none;border:0;cursor:pointer;font-family:inherit;color:var(--suau);display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 1px;font-size:9.5px;font-weight:600;border-radius:10px}
  .tab .te{font-size:19px}
  .tab.on{color:var(--pista-d)}

  footer{text-align:center;color:var(--suau);font-size:12px;margin:26px 0 10px;line-height:1.5}
  footer b{font-family:var(--serif);color:var(--pista-d)}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  @media(max-width:360px){.clock{font-size:38px}.qa{min-height:84px}}
</style>
</head>

<div class="top">
  <div class="logo">ap</div>
  <div><div class="tt">Entre punto y punto</div><div class="ts">APRENS · TEC / AIS · Tenis de competición</div></div>
  <span class="sp"></span>
  <button class="iconbtn" id="themeBtn" onclick="toggleTheme()" aria-label="Cambiar modo claro/oscuro" title="Modo claro/oscuro">🌙</button>
</div>

<main class="wrap" id="app"></main>

<nav class="nav" id="nav"></nav>

<script src="../js/aprens-core.js"></script>
<script>
"use strict";
/* ============================================================
   ENTRE PUNTO Y PUNTO · APRENS
   ------------------------------------------------------------
   Herramienta autónoma para tenista de competición (adolescente).
   Tres funciones, articuladas sobre TEC (latencia / densidad /
   continuidad) y AIS (atención interoceptiva sistemática):

   1) MAPA ATENCIONAL — psicoeducación: en cada momento del juego,
      dónde se va la atención (mono: pensamiento, evaluación, futuro)
      y dónde tiene que ir (tarea, sensorial, aquí y ahora).
   2) DESPUÉS — autorregistro posterior al entreno o al partido:
      dónde se fue, cuánto tardó en darse cuenta (latencia), cuántas
      veces volvió a propósito (densidad), si pudo sostener el foco
      (continuidad), bucles y tensión corporal.
   3) ENTRENAR entre semana — dos vías:
      · Exposición en imaginación: evocar la escena, dejar que suba
        la tensión, acompañarla (no quitarla) e imaginarse jugando
        BIEN con la tensión dentro. Habituación + generalización.
      · Mirada hacia adentro: escalera progresiva de 6 niveles de
        interocepción, del reposo hasta la pista con la raqueta.

   Todo local (localStorage). Sin backend ni dependencias externas.
   ============================================================ */

/* ---------- almacenamiento ---------- */
var LS="entrepunto_db_v1";
var DEFAULT={
  settings:{nombre:"", cuerpo:"", dark:false, nivelAdentro:1,
    direccion:"Compito para jugar bien, no para dejar de sentir. La tensión puede venir conmigo.",
    intencion:"", favFrases:[]},
  sesiones:[], imag:[], adentro:[], plan:null, frasesUser:[]
};
var DB=load();
function load(){
  try{
    var d=JSON.parse(localStorage.getItem(LS)); if(!d) return clone(DEFAULT);
    var base=clone(DEFAULT); for(var k in d){ base[k]=d[k]; }
    for(var s in DEFAULT.settings){ if(base.settings[s]===undefined) base.settings[s]=DEFAULT.settings[s]; }
    return base;
  }catch(e){ return clone(DEFAULT); }
}
function save(){ try{ localStorage.setItem(LS,JSON.stringify(DB)); }catch(e){} }
function clone(o){ return JSON.parse(JSON.stringify(o)); }

/* ---------- utilidades ---------- */
function esc(s){ return String(s==null?"":s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function jq(s){ return String(s==null?"":s).replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }
function uid(){ return Date.now().toString(36)+Math.floor(Math.random()*1e6).toString(36); }
function p2(n){ return ("0"+n).slice(-2); }
function hoy(){ var d=new Date(); return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate()); }
function nowHM(){ var d=new Date(); return p2(d.getHours())+":"+p2(d.getMinutes()); }
function fechaLarga(iso){ if(!iso) return ""; var p=iso.split("-"); var m=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"]; return parseInt(p[2],10)+" "+m[parseInt(p[1],10)-1]; }
function daysAgo(n){ var d=new Date(); d.setDate(d.getDate()-n); return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate()); }
function within7(iso){ return iso>=daysAgo(6); }
function within30(iso){ return iso>=daysAgo(29); }
function media(arr,f){ var v=arr.map(function(x){ return typeof f==="function"?f(x):x[f]; }).filter(function(n){ return typeof n==="number"&&!isNaN(n); }); if(!v.length) return null; return Math.round(v.reduce(function(a,b){return a+b;},0)/v.length*10)/10; }
function ultimos(arr,n){ return arr.slice().sort(function(a,b){ return (b.ts||0)-(a.ts||0); }).slice(0,n||50); }
function NOM(){ return (DB.settings.nombre||"").trim(); }
function CUERPO(){ return (DB.settings.cuerpo||"").trim()||"mi cuerpo"; }

/* Integración con el ecosistema APRENS: cada registro se guarda también en
   el aprens_db compartido del paciente. No montamos la barra flotante de
   export para no chocar con la navegación inferior propia: la exportación
   de esta herramienta vive en «Datos y ajustes». */
function aprensSave(rec){ if(window.Aprens){ try{ Aprens.save(rec); }catch(e){} } }
if(window.Aprens){ try{ Aprens.config({toolId:"entre_punto_y_punto", toolName:"Entre punto y punto", toolVersion:1}); }catch(e){} }

/* ---------- constructor de formularios ---------- */
/* field: {k,l,t:'scale'|'text'|'num'|'textarea'|'time'|'select'|'chips'|'chips1'|'options', opts, hint, ends, min, max, ph} */
function fieldHTML(f){
  var id="f_"+f.k, h='<div class="fld" data-k="'+f.k+'" data-t="'+f.t+'">';
  h+='<label for="'+id+'">'+esc(f.l)+(f.hint?'<span class="hint">'+esc(f.hint)+'</span>':'')+'</label>';

var LAT_SCORE={'Casi al instante, dentro del mismo punto':4,'En el punto siguiente':3,'Al acabar el juego':2,'Al acabar el set o más tarde':1,'No me he dado cuenta hasta ahora':0};
var DEN_SCORE={'Ninguna':0,'1 o 2':1,'3 a 5':2,'6 a 10':3,'Más de 10':4};
function saveSesion(){
  var d=readForm(document.getElementById('sesForm'));
  d.id=uid(); d.ts=Date.now(); d.date=hoy(); d.hora=nowHM();
  d.lat_score=d.latencia!=null?LAT_SCORE[d.latencia]:null;
  d.den_score=d.densidad!=null?DEN_SCORE[d.densidad]:null;
  d.momentos_id=(d.momentos||[]).map(momIdDeNombre).filter(Boolean);
  DB.sesiones.push(d);
  if(d.proxima) DB.settings.intencion=d.proxima;
  save();
  aprensSave({id:d.id,date:d.date,ts:d.ts,param:'latencia',modulo:'registro_post_sesion',tipo:d.tipo,
    foco:d.foco,sobrepensamiento:d.sobrepensamiento,tension:d.tension,zonas:(d.zonas||[]).join(' | '),
    momentos:(d.momentos||[]).join(' | '),latencia:d.latencia,densidad:d.densidad,continuidad:d.continuidad});
  render(); go('despues');
  setTimeout(function(){ flash(devolucion(d)); },60);
}
function devolucion(d){
  var p=[];
  if(d.lat_score!=null){
    p.push(d.lat_score>=3?"Te has dado cuenta pronto: esa es la latencia que entrenamos."
      : d.lat_score===2?"Te has dado cuenta al acabar el juego. El siguiente paso es pillarlo dentro del punto."
      : "Hoy te has dado cuenta tarde. No es un fallo: es justo el dato que buscábamos.");
  }
  if(d.den_score!=null && d.den_score<=1) p.push("Volver a propósito pocas veces es normal al principio: la próxima, prueba a usar el ritual como excusa para volver.");
  if(d.den_score!=null && d.den_score>=3) p.push("Muchas vueltas a propósito: eso es densidad, y es lo que después sujeta en competición.");
  if(d.destacado) p.push("Has anotado un momento de irte y volver. Eso es exactamente el ejercicio.");
  if(!p.length) p.push("Registro guardado.");
  return "Guardado ✓ "+p.join(" ");
}

var TICK=null, TLEFT=0, TDUR=0, TLINES=[], TEND=null;
function startTimer(dur,lines,onEnd){
  stopTimer(); TDUR=dur; TLEFT=dur; TLINES=lines||[]; TEND=onEnd||null;
  paintTimer();
  TICK=setInterval(function(){ TLEFT--; paintTimer(); if(TLEFT<=0){ var f=TEND; stopTimer(); if(f) f(); } },1000);
}
function paintTimer(){
  var c=document.getElementById('clock'); if(!c){ stopTimer(); return; }
  c.textContent=Math.floor(TLEFT/60)+':'+p2(TLEFT%60);
  var g=document.getElementById('guide');
  if(g&&TLINES.length){ var i=Math.min(TLINES.length-1,Math.floor((TDUR-TLEFT)/Math.max(1,TDUR/TLINES.length))); g.textContent=TLINES[i]; }
  var r=document.getElementById('ring'); if(r) r.classList.toggle('big',((TDUR-TLEFT)%10)<5);
}
function stopTimer(){ if(TICK){ clearInterval(TICK); TICK=null; } }
function pararTodo(){ stopTimer(); }
function timerHTML(txt){
  return '<div class="ring" id="ring"><div class="rin"><div class="rf" id="clock">0:00</div></div></div>'+
         '<div class="guide" id="guide">'+esc(txt||'')+'</div>';
}

function adStart(){ var L=NIVELES[AD.nivel-1]; startTimer(L.dur,L.guide,adFin); }
function adFin(){ var g=document.getElementById('guide'); if(g) g.textContent='Práctica completada. ¿Cómo ha ido?'; var a=document.getElementById('adAfter'); if(a){ a.style.display='block'; a.scrollIntoView({behavior:'smooth',block:'center'}); } }
function adVolver(){ stopTimer(); AD={nivel:null,fase:'lista'}; render(); window.scrollTo(0,0); }
function adSave(){
  var L=NIVELES[AD.nivel-1];
  var idasEl=document.querySelector('[data-k="idas"] .chip.sel');
  var d={id:uid(),ts:Date.now(),date:hoy(),hora:nowHM(),nivel:L.n,titulo:L.t,dur:L.dur,
    c_ini:getK('ci'),c_fin:getK('cf'),idas:idasEl?idasEl.dataset.v:null,nota:val('adNota')};
  DB.adentro.push(d);
  var msg="Práctica registrada ✓";
  var pr=practicasNivel(L.n);
  if(L.n===nivelActual() && pr>=L.meta && L.n<NIVELES.length){
    DB.settings.nivelAdentro=L.n+1;
    msg="¡Nivel "+L.n+" completado! Se abre el nivel "+(L.n+1)+": "+NIVELES[L.n].t+".";
  } else if(L.n===nivelActual() && pr<L.meta){
    msg="Práctica registrada ✓ Te faltan "+(L.meta-pr)+" para abrir el siguiente nivel.";
  }
  save();
  aprensSave({id:d.id,date:d.date,ts:d.ts,param:'densidad',modulo:'mirada_adentro',
    nivel:d.nivel,duracion_seg:d.dur,claridad_antes:d.c_ini,claridad_despues:d.c_fin,idas:d.idas});
  adVolver();
  setTimeout(function(){ flash(msg); },60);
}

function toggleFav(txt,btn){
  if(!DB.settings.favFrases) DB.settings.favFrases=[];

  if(i>=0){ DB.settings.favFrases.splice(i,1); btn.textContent='☆'; btn.classList.remove('fav-on'); }
  else { DB.settings.favFrases.push(txt); btn.textContent='★'; btn.classList.add('fav-on'); }

}

  h+=tr('Continuidad · sostengo el foco (0-10)',media(s7,'continuidad'));
  h+='</table>';
  h+='<p class="tiny" style="margin-top:10px">Se trabajan en este orden: primero darse cuenta antes, después volver más veces, y solo entonces sostener más rato.</p></div>';

  h+='<div class="card"><h2><span class="e">🎾</span>En pista</h2><table class="rsm">';
  h+=tr('Atención en la tarea (0-10)',media(s7,'foco'));
  h+=tr('Sobrepensamiento (0-10)',media(s7,'sobrepensamiento'));
  h+=tr('Tensión corporal (0-10)',media(s7,'tension'));
  h+='</table>'+topMomentos(s7)+'</div>';

  h+=chartCard('Atención en la tarea · últimas 10 sesiones',DB.sesiones.slice(-10).map(function(x){ return x.foco; }));
  h+=chartCard('Tensión pico en imaginación · últimas 10 escenas',DB.imag.slice(-10).map(function(x){ return x.t_pico; }));
  h+=chartCard('Claridad interoceptiva · últimas 10 prácticas',DB.adentro.slice(-10).map(function(x){ return x.c_fin; }));

  h+='<div class="card"><h2><span class="e">📋</span>Resumen para sesión</h2>';
  h+='<div class="quote" id="rsmTxt" style="white-space:pre-wrap;font-style:normal;font-family:inherit;font-size:13.5px">'+esc(resumenTexto())+'</div>';
  h+='<div class="btnrow"><button class="btn ghost" onclick="copiar(document.getElementById(\'rsmTxt\').textContent,this)">📋 Copiar</button>';
  h+='<button class="btn ghost" onclick="enviarWA(document.getElementById(\'rsmTxt\').textContent)">📱 Enviar</button></div>';
  h+='<p class="tiny" style="margin-top:8px">No incluye lo que has escrito en los campos de texto: eso es tuyo y lo cuentas si quieres.</p></div>';
  h+=footerHTML(); return h;
};
function tr(l,v){ return '<tr><td>'+esc(l)+'</td><td>'+(v!=null?v:'–')+'</td></tr>'; }
function diasActivos(n){
  var set={}, all=DB.sesiones.concat(DB.imag,DB.adentro);
  all.forEach(function(x){ if(x.date>=daysAgo(n-1)) set[x.date]=1; });
  return Object.keys(set).length;
}
function racha(){
  var set={}, all=DB.sesiones.concat(DB.imag,DB.adentro);
  all.forEach(function(x){ set[x.date]=1; });
  var c=0; for(var i=0;i<400;i++){ if(set[daysAgo(i)]) c++; else if(i>0) break; }
  return c;
}
function topMomentos(arr){
  var cnt={};
  arr.forEach(function(s){ (s.momentos||[]).forEach(function(m){ cnt[m]=(cnt[m]||0)+1; }); });
  var ks=Object.keys(cnt).sort(function(a,b){ return cnt[b]-cnt[a]; }).slice(0,3);
  if(!ks.length) return '<p class="tiny" style="margin-top:12px">Todavía no hay momentos marcados esta semana.</p>';
  var h='<p class="tiny" style="margin-top:14px;font-weight:700">Dónde se te va más la atención:</p><ul style="margin:4px 0 0;padding-left:18px;font-size:13.5px">';
  ks.forEach(function(k){ h+='<li>'+esc(k)+' <span class="tiny">('+cnt[k]+')</span></li>'; });
  return h+'</ul>';
}
function resumenTexto(){
  var s7=DB.sesiones.filter(function(x){ return within7(x.date); });
  var i7=DB.imag.filter(function(x){ return within7(x.date); });
  var a7=DB.adentro.filter(function(x){ return within7(x.date); });
  var l=["ENTRE PUNTO Y PUNTO · últimos 7 días"];
  if(NOM()) l.push("Deportista: "+NOM());
  l.push("");
  l.push("Sesiones registradas: "+s7.length+" · Escenas en imaginación: "+i7.length+" · Miradas hacia adentro: "+a7.length);
  l.push("Días con práctica: "+diasActivos(7)+"/7 · Racha: "+racha());
  l.push("");
  l.push("TEC");
  l.push("· Latencia (0-4): "+n(media(s7,'lat_score')));
  l.push("· Densidad (0-4): "+n(media(s7,'den_score')));
  l.push("· Continuidad (0-10): "+n(media(s7,'continuidad')));
  l.push("");
  l.push("En pista");
  l.push("· Atención en la tarea: "+n(media(s7,'foco'))+"/10");
  l.push("· Sobrepensamiento: "+n(media(s7,'sobrepensamiento'))+"/10");
  l.push("· Tensión corporal: "+n(media(s7,'tension'))+"/10");
  var cnt={}; s7.forEach(function(s){ (s.momentos||[]).forEach(function(m){ cnt[m]=(cnt[m]||0)+1; }); });
  var ks=Object.keys(cnt).sort(function(a,b){ return cnt[b]-cnt[a]; }).slice(0,3);
  if(ks.length) l.push("· Momentos con más fuga: "+ks.join(", "));
  if(i7.length){
    l.push("");
    l.push("Imaginación");
    l.push("· Tensión pico media: "+n(media(i7,'t_pico'))+"/10 → final "+n(media(i7,'t_fin'))+"/10");
    l.push("· Disposición a competir sintiéndolo: "+n(media(i7,'disposicion'))+"/10");
  }
  l.push("");
  l.push("Mirada hacia adentro: nivel "+nivelActual()+" de "+NIVELES.length+" ("+NIVELES[nivelActual()-1].t+")");
  return l.join("\n");
}
function n(v){ return v==null?'–':v; }

/* ---------------- DATOS Y AJUSTES ---------------- */
VIEWS.datos=function(){
  var h='<h1 class="view-t">💾 Datos y ajustes</h1><p class="view-s">Todo vive en este móvil.</p>';
  h+='<div class="ok-flash" id="okflash"></div>';
  h+='<div class="card"><h2><span class="e">🔒</span>Privacidad</h2>';
  h+='<p class="lead">Los registros se guardan solo en el navegador de este dispositivo. No se envían a ningún sitio ni salen de aquí a menos que tú los exportes o los copies.</p>';
  h+='<p class="tiny">Si borras los datos del navegador o desinstalas la app, se pierden. Exporta de vez en cuando si quieres una copia.</p></div>';
  h+='<div class="card"><h2><span class="e">🙋</span>Nombres</h2>';
  h+='<div class="fld"><label for="stNom">Tu nombre</label><input type="text" id="stNom" value="'+esc(DB.settings.nombre||'')+'"></div>';
  h+='<div class="fld"><label for="stCue">Cómo llamas a tu cuerpo</label><input type="text" id="stCue" value="'+esc(DB.settings.cuerpo||'')+'"></div>';
  h+='<button class="btn ghost full" onclick="saveNombres()">Guardar</button></div>';
  h+='<div class="card"><h2><span class="e">📤</span>Exportar</h2>';
  h+='<p class="lead">'+DB.sesiones.length+' sesiones · '+DB.imag.length+' escenas · '+DB.adentro.length+' prácticas de mirada adentro.</p>';
  h+='<div class="btnrow"><button class="btn" onclick="exportJSON()">Archivo JSON</button><button class="btn" onclick="exportCSV()">Hoja CSV</button></div></div>';
  h+='<div class="card"><h2><span class="e">📥</span>Importar</h2>';
  h+='<p class="lead">Restaurar una copia anterior. Reemplaza los datos actuales.</p>';
  h+='<input type="file" id="impFile" accept="application/json,.json" onchange="importJSON(event)"></div>';
  h+='<div class="card"><h2><span class="e">🗑️</span>Borrar todo</h2>';
  h+='<p class="lead">Elimina todos los registros de este dispositivo. No se puede deshacer.</p>';
  h+='<button class="btn danger full" onclick="resetAll()">Borrar todos mis datos</button></div>';
  h+=footerHTML(); return h;
};
function saveNombres(){ DB.settings.nombre=val('stNom'); DB.settings.cuerpo=val('stCue'); save(); flash("Guardado ✓"); }
function exportJSON(){ downloadFile('entre_punto_'+hoy()+'.json',JSON.stringify(DB,null,2),'application/json'); }
function exportCSV(){
  var rows=[["modulo","fecha","hora","campo","valor"]];
  function push(mod,rec){ for(var k in rec){ if(['id','ts'].indexOf(k)>=0) continue; var v=rec[k]; if(Array.isArray(v)) v=v.join(' | '); rows.push([mod,rec.date||'',rec.hora||'',k,String(v==null?'':v)]); } }
  DB.sesiones.forEach(function(r){ push('sesion',r); });
  DB.imag.forEach(function(r){ push('imaginacion',r); });
  DB.adentro.forEach(function(r){ push('adentro',r); });
  var csv=rows.map(function(r){ return r.map(function(c){ return '"'+String(c).replace(/"/g,'""')+'"'; }).join(','); }).join('\n');
  downloadFile('entre_punto_'+hoy()+'.csv','﻿'+csv,'text/csv');
}
function downloadFile(name,content,type){
  try{
    var blob=new Blob([content],{type:type}), url=URL.createObjectURL(blob), a=document.createElement('a');
    a.href=url; a.download=name; document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); },1000); flash("Archivo generado ✓");
  }catch(e){ alert('No se pudo generar el archivo.'); }
}
function importJSON(ev){
  var file=ev.target.files[0]; if(!file) return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var d=JSON.parse(r.result); if(!d.settings) throw 0;
      if(confirm('¿Reemplazar los datos actuales por los del archivo?')){ DB=d; save(); render(); go('datos'); setTimeout(function(){ flash("Datos importados ✓"); },60); }
    }catch(e){ alert('Archivo no válido.'); }
  };
  r.readAsText(file); ev.target.value='';
}
function resetAll(){
  if(!confirm('¿Seguro que quieres borrar TODOS tus registros?')) return;
  if(!confirm('Esta acción no se puede deshacer. ¿Confirmas?')) return;
  DB=clone(DEFAULT); save(); imReset(); adReset(); render(); go('home');
}

function recientes(arr,store,fmt,emptyMsg){
  var list=ultimos(arr,6);
  if(!list.length) return '<div class="card"><p class="empty">'+esc(emptyMsg||'Sin registros.')+'</p></div>';
  var h='<div class="kick">Últimos registros</div>';
  list.forEach(function(x){
    h+='<div class="rec"><div class="rh"><span class="rt">'+esc(fmt(x))+'</span><span class="rd">'+fechaLarga(x.date)+' · '+esc(x.hora||'')+'</span></div>';
    if(x.nota||x.destacado) h+='<div class="rb">'+esc(x.nota||x.destacado)+'</div>';
    h+='<div style="text-align:right"><button class="del" onclick="delRec(\''+store+'\',\''+x.id+'\')">Borrar</button></div></div>';
  });
  return h;
}
function delRec(store,id){
  if(!DB[store]) return;
  if(!confirm('¿Borrar este registro?')) return;
  DB[store]=DB[store].filter(function(x){ return x.id!==id; });
  save(); render();
}
function chartCard(title,vals){
  vals=vals.filter(function(v){ return typeof v==='number'&&!isNaN(v); });
  return '<div class="card"><div class="chart-lbl">'+esc(title)+'</div>'+(vals.length?barChart(vals):'<p class="empty">Sin datos todavía.</p>')+'</div>';
}
function barChart(vals){
  var W=320,H=90,n=vals.length,bw=W/n,max=10,s='';
  for(var i=0;i<n;i++){
    var v=Math.max(0,Math.min(max,vals[i])), bh=Math.max(2,v/max*(H-18)), x=i*bw+bw*0.16, y=H-18-bh;
    s+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+(bw*0.68).toFixed(1)+'" height="'+bh.toFixed(1)+'" rx="3" fill="var(--pista)"></rect>';
    s+='<text x="'+(x+bw*0.34).toFixed(1)+'" y="'+(H-5)+'" font-size="9" text-anchor="middle" fill="var(--suau)">'+v+'</text>';
  }
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Gráfico de barras">'+s+'</svg>';
}
function copiar(txt,btn){
  txt=String(txt);
  function ok(){ if(btn){ var o=btn.textContent; btn.textContent='✓ Copiado'; setTimeout(function(){ btn.textContent=o; },1600); } }
  function fb(){ var ta=document.createElement('textarea'); ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); ok(); }catch(e){} document.body.removeChild(ta); }
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(ok).catch(fb); } else { fb(); }
}
function enviarWA(txt){ window.open('https://wa.me/?text='+encodeURIComponent(txt),'_blank'); }
function toggleTheme(){ DB.settings.dark=!DB.settings.dark; applyTheme(); save(); }
function applyTheme(){ document.documentElement.setAttribute('data-theme',DB.settings.dark?'dark':'light'); var b=document.getElementById('themeBtn'); if(b) b.textContent=DB.settings.dark?'☀️':'🌙'; }

/* ---------------- init ---------------- */
imReset(); adReset(); applyTheme(); render();
