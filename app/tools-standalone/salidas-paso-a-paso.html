<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Paso a paso, de vuelta a mí · APRENS</title>
<style>
:root{
  --azul:#1B4F8C;--azulLt:#D6E4F0;--verde:#2E7D5E;--verdeLt:#D4EDDA;
  --naranja:#E07B39;--rojo:#C0392B;--gris:#6B7280;--fondo:#F0F4F8;--oro:#C8973A;--lila:#7B4FC1;
}
*{box-sizing:border-box}
body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:linear-gradient(160deg,#EDF3FB 0%,#F7F4EF 100%);min-height:100vh;color:#1a1a2e;margin:0;padding-bottom:env(safe-area-inset-bottom)}
.header{background:var(--azul);color:#fff;padding:14px 22px;display:flex;align-items:center;gap:11px;box-shadow:0 2px 12px rgba(27,79,140,.3);position:sticky;top:0;z-index:50}
.hlogo{width:36px;height:36px;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--azul);font-size:12px;font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,'Times New Roman',serif}
.htitle{font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,'Times New Roman',serif;font-size:17px;font-weight:700}
.hsub{font-size:10px;opacity:.75;margin-top:1px}
.hback{margin-left:auto;background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:20px;padding:7px 14px;font-size:13px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-weight:600;cursor:pointer;display:none}
.wrap{max-width:680px;margin:0 auto;padding:24px 16px calc(60px + env(safe-area-inset-bottom))}
.card{background:#fff;border-radius:18px;padding:24px;box-shadow:0 4px 24px rgba(27,79,140,.08);margin-bottom:18px}
.ctit{font-weight:600;font-size:13px;color:var(--azul);margin-bottom:14px;text-transform:uppercase;letter-spacing:.5px}
.hero{background:#fff;border-radius:18px;padding:30px 28px 26px;box-shadow:0 4px 24px rgba(27,79,140,.08);margin-bottom:20px;border-top:4px solid var(--oro)}
h1{font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,'Times New Roman',serif;font-size:25px;margin:0 0 8px;color:var(--azul);line-height:1.2}
h2{font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,'Times New Roman',serif;font-size:20px;margin:0 0 10px;color:var(--azul)}
h3{font-size:15px;margin:16px 0 6px;color:var(--azul)}
p{line-height:1.62;margin:0 0 12px;font-size:15px}
.mut{color:var(--gris)}.sm{font-size:13px}
.btn{border:none;border-radius:30px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-weight:600;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;justify-content:center;gap:7px;-webkit-appearance:none;touch-action:manipulation}
.bp{background:var(--azul);color:#fff;padding:13px 28px;font-size:14px;box-shadow:0 4px 14px rgba(27,79,140,.3)}
.bpg{background:var(--verde);color:#fff;padding:14px 28px;font-size:15px;box-shadow:0 4px 14px rgba(46,125,94,.3)}
.bs{background:#fff;color:var(--azul);border:2px solid var(--azul);padding:11px 22px;font-size:13px}
.bsm{padding:9px 18px;font-size:13px}
.bwa{background:#25D366;color:#fff;padding:14px 24px;font-size:15px;box-shadow:0 4px 14px rgba(37,211,102,.3)}
.bcopy{background:#fff;color:var(--gris);border:2px solid #E0E7EF;padding:12px 20px;font-size:14px}
.full{width:100%}
.frase{font-style:italic;color:var(--azul);font-size:14px;background:var(--azulLt);border-radius:0 10px 10px 0;border-left:4px solid var(--oro);padding:13px 16px;line-height:1.6;margin:16px 0}
.aviso{background:var(--azulLt);border-left:4px solid var(--azul);border-radius:0 10px 10px 0;padding:13px 16px;font-size:12.5px;color:var(--azul);line-height:1.6;margin-bottom:18px}
.warn{background:#FCEEE4;border-left:4px solid var(--naranja);border-radius:0 10px 10px 0;padding:13px 16px;font-size:13px;color:#8a4b1f;line-height:1.6;margin:14px 0}
.hub{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:4px}
@media(max-width:480px){.hub{grid-template-columns:1fr}}
.tool{background:#fff;border-radius:16px;padding:18px 16px;box-shadow:0 4px 20px rgba(27,79,140,.08);border-left:4px solid var(--azul);cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:4px;transition:transform .12s}
.tool:active{transform:scale(.98)}
.tool .e{font-size:26px}
.tool .n{font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,'Times New Roman',serif;font-size:16px;color:var(--azul);font-weight:700;line-height:1.2;margin-top:4px}
.tool .d{font-size:12px;color:var(--gris);line-height:1.4}
.tool.c-verde{border-left-color:var(--verde)}.tool.c-oro{border-left-color:var(--oro)}.tool.c-lila{border-left-color:var(--lila)}.tool.c-naranja{border-left-color:var(--naranja)}
ul.tidy{margin:4px 0 12px;padding-left:20px;line-height:1.6;font-size:14.5px}
ul.tidy li{margin:5px 0}
label.f{display:block;font-weight:600;font-size:13px;margin:12px 0 5px;color:#1a1a2e}
input[type=text],textarea,select{width:100%;border:2px solid #E3EAF3;border-radius:12px;padding:12px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:15px;color:#1a1a2e;background:#fff}
input:focus,textarea:focus,select:focus{border-color:var(--azul);outline:none}
textarea{resize:vertical;min-height:64px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.sel{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.pill{border:2px solid #E3EAF3;background:#fff;border-radius:20px;padding:8px 14px;font-size:13px;font-weight:600;color:var(--gris);cursor:pointer}
.pill.on{background:var(--azul);border-color:var(--azul);color:#fff}
/* escala 0-10 */
.suds{display:flex;gap:5px;flex-wrap:wrap;margin:6px 0}
.sb{flex:1;min-width:26px;border:2px solid #E3EAF3;background:#fff;border-radius:9px;padding:9px 0;text-align:center;font-weight:700;font-size:13px;color:var(--gris);cursor:pointer}
.sb.on{background:var(--naranja);border-color:var(--naranja);color:#fff}
.sb.lo.on{background:var(--verde);border-color:var(--verde)}
.sb.hi.on{background:var(--rojo);border-color:var(--rojo)}
/* respiración */
.breath-wrap{display:flex;flex-direction:column;align-items:center;gap:14px;padding:10px 0 4px}
.breath{width:150px;height:150px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#D6E4F0,#1B4F8C);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:16px;box-shadow:0 8px 30px rgba(27,79,140,.35);transition:transform .2s}
.breath.anim{animation:bre 11s ease-in-out infinite}
@keyframes bre{0%{transform:scale(.72)}36%{transform:scale(1.08)}45%{transform:scale(1.08)}100%{transform:scale(.72)}}
.pasoline{display:flex;gap:10px;align-items:flex-start;margin:10px 0}
.pasonum{flex:0 0 auto;width:28px;height:28px;border-radius:50%;background:var(--azulLt);color:var(--azul);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:14px}
.step{background:var(--fondo);border:1px solid #E3EAF3;border-radius:14px;padding:14px;margin-bottom:10px}
.step.done{border-color:var(--verde);background:var(--verdeLt)}
.step .sh{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--azul);font-size:15px}
.step .lvl{margin-left:auto;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;background:#fff;color:var(--gris);border:1px solid #E3EAF3}
.keys{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
@media(max-width:480px){.keys{grid-template-columns:1fr}}
.key{background:#fff;border-radius:10px;padding:10px 12px;font-size:12.5px;line-height:1.5}
.key b{display:block;color:var(--azul);margin-bottom:3px;font-size:12px;text-transform:uppercase;letter-spacing:.4px}
.cbox{background:var(--fondo);border:2px solid #E8EFF7;border-radius:12px;padding:16px;font-size:12.5px;line-height:1.7;color:#333;max-height:280px;overflow-y:auto;white-space:pre-wrap;word-break:break-word;margin-bottom:16px}
.acc{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:8px}
.chk{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #eef2f7;font-size:14.5px;cursor:pointer}
.chk:last-child{border-bottom:0}
.chk .box{flex:0 0 auto;width:24px;height:24px;border-radius:7px;border:2px solid #cdd8e6;display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px}
.chk.on .box{background:var(--verde);border-color:var(--verde)}
.chk.on span{color:var(--gris);text-decoration:line-through}
@media(hover:hover){.btn:hover{filter:brightness(1.05)}.tool:hover{border-left-width:6px}}
.hide{display:none!important}
.esc-tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;border-top:1px dashed #d7e0ec;padding-top:10px}
.et{border:1.5px solid #E3EAF3;background:#fff;border-radius:20px;padding:6px 12px;font-size:12.5px;font-weight:600;color:var(--gris);cursor:pointer}
.et:disabled{opacity:.35;cursor:default}
.et.del{color:var(--rojo);border-color:#f2d6d2}
.step.editing{border:2px solid var(--azul);background:#fff}
.sughint{font-size:11.5px;color:var(--gris);margin:6px 0 4px}
.sugs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:4px}
.sug{background:var(--azulLt);color:var(--azul);border-radius:16px;padding:6px 11px;font-size:12px;font-weight:600;cursor:pointer;line-height:1.3}
.pill.nivp.on{background:var(--oro);border-color:var(--oro);color:#fff}
</style>
</head>
<body>
<div class="header">
  <div class="hlogo">ap</div>
  <div>
    <div class="htitle">Paso a paso, de vuelta a mí</div>
    <div class="hsub">APRENS Psicologia · acompañamiento diario</div>
  </div>
  <button class="hback" id="hback" onclick="go('home')">← Inicio</button>
</div>

<div class="wrap" id="screen"></div>

<!-- Silueta AIS con las dos luces (componente compartido de la app) -->
<script src="../js/respiro-ais.js"></script>
<!-- Viñeta compartida «para · respira · vuelve» (misma que en el hub) -->
<script src="../js/vineta-atencion.js"></script>
<script>
"use strict";
var $=function(s){return document.querySelector(s);};
/* ---- datos en memoria (sin guardado, privacidad) ---- */
var D={
  fecha:new Date().toLocaleDateString('es-ES'),
  peldano:null,         // nº de peldaño trabajado hoy
  sudsAntes:null,sudsPico:null,sudsDesp:null,
  imagAntes:null,imagDesp:null,imagReps:0,
  rumia:null,           // 0-10 cuánto he rumiado
  animo:null,           // 0-10
  herramientas:{},      // qué he practicado
  dia:{},               // checklist del día
  salida:'',            // texto de la salida de hoy
  logro:'',             // un logro
  nota:''               // nota para el psicólogo
};
var pelDone={};         // peldaños marcados como logrados

/* ===== Escalera de exposición en vivo ===== */
var ESC_DEFAULT=[
  {t:"Asomarme al portal o la calle, solo/a, 3–5 minutos",lvl:"Muy suave",
   que:"Baja al portal o sal a la puerta. Quédate el tiempo que puedas y vuelve cuando tú decidas, no cuando el miedo mande.",
   como:"Antes: 3 respiraciones curiosas. Fuera: nota los pies en el suelo y una cosa que veas/oigas. No huyes del nervio: lo acompañas."},
  {t:"Vuelta corta a la manzana, en hora tranquila",lvl:"Suave",
   que:"Camina una vuelta a tu ritmo. Si aparece el impulso de volver corriendo, haz una parada de 10 segundos y sigue un poco más.",
   como:"Lleva la atención al cuerpo (pecho, barriga) mientras caminas. El objetivo no es no sentir nervio, es estar contigo mientras lo sientes."},
  {t:"Ir andando a una tienda cercana y comprar algo",lvl:"Suave-media",
   que:"Entra, haz la compra y paga. Aunque notes prisa por salir, quédate unos segundos más tras pagar.",
   como:"Respiración curiosa antes de entrar. Dentro: si sube la alerta, abrazo sentido breve (mano en el pecho) y sigues."},
  {t:"Sentarme en un banco o cafetería tranquila 10–15 min",lvl:"Media",
   que:"Elige un sitio con poca gente. Quédate sentado/a el tiempo marcado, hagas lo que hagas con el móvil o un café.",
   como:"Observa las sensaciones como quien mira el oleaje: suben y bajan. Suelta el «¿y si…?». Vuelve a lo que ves y oyes."},
  {t:"Lugar con más gente en hora de menos afluencia",lvl:"Media-alta",
   que:"Mercado, supermercado grande o centro comercial, cuando haya poca gente. Haz un recorrido y un recado pequeño.",
   como:"Ancla la atención en la respiración y en caminar. Si llega un sobresalto, párate, nómbralo («esto es alerta, no peligro») y continúa."},
  {t:"Recado en una zona donde podría haber conocidos",lvl:"Alta",
   que:"Un sitio donde quepa la idea de cruzarte con alguien conocido. Haz lo que ibas a hacer, sin acortarlo por ese miedo.",
   como:"Recuerda con suavidad: hacer tu vida y que te vean es legítimo. Si aparece «¿y si me ven?», parada de pensamiento y vuelta al cuerpo."},
  {t:"Quedar con alguien de confianza en un sitio público",lvl:"Alta",
   que:"Plan corto en un lugar con gente, acompañado/a. Deja que esa persona sea tu apoyo, no tu escudo para huir.",
   como:"Antes de entrar, abrazo sentido pensando en quien te acompaña. Permítete disfrutar un momento; no tienes que estar en guardia todo el rato."},
  {t:"Ir solo/a a un sitio concurrido en hora punta",lvl:"Reto",
   que:"El peldaño más alto. Ve solo/a a un lugar lleno y quédate sosteniendo la idea de ser visto/a, sin conductas de escape.",
   como:"Trae todo lo entrenado: respiración curiosa, acompañar la sensación, soltar el porqué. Sal cuando el plan termine, no cuando el miedo pique."}
];
/* ---- escalera editable (se guarda solo en este dispositivo) ---- */
var ESC_KEY="aprens.salidas.escalera.v1";
function clon(a){return JSON.parse(JSON.stringify(a));}
function loadEsc(){ try{ var r=localStorage.getItem(ESC_KEY); if(r){var a=JSON.parse(r); if(Array.isArray(a)&&a.length)return a;} }catch(e){} return clon(ESC_DEFAULT); }
function saveEsc(){ try{ localStorage.setItem(ESC_KEY,JSON.stringify(esc)); }catch(e){} }
var esc=loadEsc();
var editIdx=null; // índice del peldaño en edición (o -1 = nuevo)
/* sugerencias para rellenar tocando (menos escritura) */
var SUG={
  sit:["Asomarme al portal","Vuelta a la manzana","Ir a una tienda cercana","Sentarme en una cafetería","Ir al mercado o super","Transporte público (una parada)","Un sitio donde podría haber conocidos","Quedar con alguien en público","Sitio concurrido en hora punta","Hacer un recado yo solo/a"],
  que:["Quédate el tiempo marcado, no menos.","Vuelve cuando tú decidas, no cuando el miedo mande.","Aunque notes prisa por salir, quédate unos segundos más.","Haz lo que ibas a hacer, sin acortarlo por el miedo.","Repite este paso varios días antes de subir.","Sin conductas de escape (no mirar el móvil para huir)."],
  como:["Respiración curiosa antes de empezar.","Acompaña la sensación, no la apartes.","Suelta el «¿y si…?» y vuelve al cuerpo.","Abrazo sentido si sube la alerta.","«Esto es alerta, no peligro».","Sal cuando el plan termine, no cuando el miedo pique.","Nota los pies en el suelo y una cosa que veas/oigas."]
};
var NIVELES=["Muy suave","Suave","Media","Alta","Reto"];

/* ========== NAVEGACIÓN ========== */
function go(v){ VIEW=v; render(); window.scrollTo(0,0); }
var VIEW='home';
function render(){
  if(aisRespiro){ try{aisRespiro.destroy();}catch(e){} aisRespiro=null; }
  if(vineta){ try{vineta.destroy();}catch(e){} vineta=null; }
  $('#hback').style.display = VIEW==='home' ? 'none' : 'inline-flex';
  $('#screen').innerHTML = (VIEWS[VIEW]||VIEWS.home)();
  if(bindAfter[VIEW]) bindAfter[VIEW]();
}
var bindAfter={};
var aisRespiro=null;
var vineta=null;

/* ========== VISTAS ========== */
var VIEWS={};

VIEWS.home=function(){
  return `
  <div class="hero">
    <h1>Tu espacio, paso a paso 🌿</h1>
    <p>Un lugar para <b>cuidarte por dentro</b> y, poco a poco, <b>recuperar tu vida fuera de casa</b> — poder ir donde quieras, sin que el miedo te marque los sitios.</p>
    <p class="sm mut">No busca que dejes de sentir miedo, sino que aprendas a <b>estar contigo mientras lo sientes</b>, hasta que el cuerpo compruebe que puede. Aquí trabajas lo de dentro y tus salidas; lo que tengas pendiente fuera, por sus cauces y con tu psicólogo/a.</p>
    <div class="frase">«Pase lo que pase dentro de mí, yo voy a estar aquí conmigo.»</div>
  </div>

  <div class="card">
    <div class="ctit">Cada día, dos frentes</div>
    <p class="sm"><b>1) Por dentro</b> — aparecer y acompañar: respiración curiosa, parar la rumiación, abrazo sentido, estar con el sobresalto.</p>
    <p class="sm"><b>2) Por fuera</b> — recuperar terreno: un peldaño de tu escalera de salidas y, cuando toque, exposición en imaginación.</p>
    <p class="sm mut">No hace falta hacerlo todo. Tu psicóloga/o te dirá en qué poner el foco esta semana.</p>
  </div>

  <div class="ctit" style="margin:4px 0 2px">Por dentro · herramientas AIS</div>
  <div class="hub">
    <button class="tool c-verde" onclick="go('respiracion')"><span class="e">🫁</span><span class="n">Respiración curiosa</span><span class="d">Acercarte a lo que sientes, con curiosidad.</span></button>
    <button class="tool c-naranja" onclick="go('parada')"><span class="e">🛑</span><span class="n">Parar la rumiación</span><span class="d">Cuando la cabeza da vueltas al conflicto.</span></button>
    <button class="tool c-lila" onclick="go('abrazo')"><span class="e">🤍</span><span class="n">Abrazo sentido</span><span class="d">Acompañarte con cariño, con los tuyos dentro.</span></button>
    <button class="tool c-verde" onclick="go('sobresalto')"><span class="e">🌊</span><span class="n">Estar con el sobresalto</span><span class="d">Cuando una sensación o un susto te sacude.</span></button>
  </div>

  <div class="ctit" style="margin:16px 0 2px">Por fuera · recuperar mi vida</div>
  <div class="hub">
    <button class="tool" onclick="go('escalera')"><span class="e">🪜</span><span class="n">Mi escalera de salidas</span><span class="d">Exposición gradual: salir solo/a, paso a paso.</span></button>
    <button class="tool" onclick="go('imaginacion')"><span class="e">🎬</span><span class="n">Exposición en imaginación</span><span class="d">Ensayar por dentro lo que temo, sin huir.</span></button>
    <button class="tool c-oro" onclick="go('dia')"><span class="e">🗓️</span><span class="n">Mi día a día</span><span class="d">Estructura y pequeños pasos con sentido.</span></button>
    <button class="tool c-oro" onclick="go('registro')"><span class="e">📝</span><span class="n">Registro del día</span><span class="d">Anotar cómo fue y enviárselo a tu psicólogo.</span></button>
  </div>

  <div class="card" style="margin-top:18px">
    <div class="warn" style="margin:0">Si en algún momento aparecen pensamientos de no querer seguir o de hacerte daño, no te quedes a solas con eso: habla con tu psicólogo/a o tu psiquiatra. Urgencias en España: <b>024</b> (conducta suicida) o <b>112</b>.</div>
  </div>
  <p class="sm mut" style="text-align:center">Tu <b>escalera</b> se guarda solo en este dispositivo. El resto (el registro del día) no se guarda: envíalo a tu psicólogo/a desde «Registro del día» si quieres que quede.</p>`;
};

/* ---- Respiración curiosa ---- */
VIEWS.respiracion=function(){
  return `
  <h2>Respiración curiosa</h2>
  <p class="mut sm">No respiras para quitarte el nervio, sino para <b>acercarte a lo que sientes con curiosidad</b>, como quien observa sin juzgar. Unos 2–3 minutos.</p>
  <div class="card">
    <div id="aisBox" class="breath-wrap" style="max-width:280px;margin:0 auto"></div>
  </div>
  <div class="card">
    <div class="ctit">Mientras respiras, observa con curiosidad</div>
    <ul class="tidy">
      <li>¿Dónde noto el aire al entrar y al salir?</li>
      <li>¿Qué sensación hay en el pecho o en la barriga? ¿Cambia?</li>
      <li>No tengo que cambiarla ni entenderla. Solo <b>estar con ella</b>.</li>
    </ul>
    <div class="frase">«No necesito que estés bien para estar contigo. Estoy aquí también cuando cuesta.»</div>
    <div class="warn">Y ahora, <b>vuelve</b>: ¿cuál es el siguiente paso pequeño? Retoma lo que estabas haciendo, con la sensación que haya.</div>
    <button class="btn bs full" onclick="marca('Respiración curiosa');go('home')">Hecho ✓</button>
  </div>`;
};
var breathOn=false,breathTimer=null;
function toggleBreath(){
  var b=$('#breath'),t=$('#breathTxt'),btn=$('#breathBtn');
  if(breathOn){ breathOn=false; b.classList.remove('anim'); b.textContent='Prepárate'; t.textContent=''; btn.textContent='▶ Empezar'; if(breathTimer)clearInterval(breathTimer); return; }
  breathOn=true; b.classList.add('anim'); btn.textContent='⏸ Parar';
  var fase=0; // ciclo 11s: inhala 4 (0-36%), sostén 1, exhala 6
  function tick(){
    var cycle=[['Inhala… despacio',4000],['Sostén',1000],['Exhala… suelta',6000]];
    b.textContent=cycle[fase][0].split('…')[0];
    t.textContent=cycle[fase][0];
    var dur=cycle[fase][1];
    fase=(fase+1)%3;
    breathTimer=setTimeout(function(){ if(breathOn)tick(); },dur);
  }
  tick();
}

function moveStep(i,dir){ var j=i+dir; if(j<0||j>=esc.length)return; var tmp=esc[i]; esc[i]=esc[j]; esc[j]=tmp;

function delStep(i){ if(esc.length<=1){alert('Deja al menos un peldaño.');return;} if(!confirm('¿Quitar este peldaño?'))return; esc.splice(i,1); pelDone={}; saveEsc(); render(); }
function resetEsc(){ if(!confirm('¿Restaurar la escalera sugerida? Perderás tus cambios.'))return; esc=clon(ESC_DEFAULT); pelDone={}; editIdx=null; saveEsc(); render(); }

function sudsBind(sel,campo){
  var c=$(sel); if(!c)return;
  c.innerHTML=''; for(var i=0;i<=10;i++){ var cls='sb'+(i<=3?' lo':'')+(i>=8?' hi':'')+(D[campo]===i?' on':''); c.innerHTML+='<div class="'+cls+'" data-v="'+i+'">'+i+'</div>'; }

}
function prep(){
  // recoger campos de texto visibles
  if($('#rLogro')) D.logro=$('#rLogro').value;
  if($('#rNota')) D.nota=$('#rNota').value;
  var L=[];
  L.push('APRENS · Registro del día');
  L.push('Fecha: '+D.fecha);
  L.push('');
  if(D.peldano||D.sudsAntes!=null||D.salida){
    L.push('— Salida (exposición en vivo) —');
    if(D.peldano) L.push('Peldaño trabajado: '+D.peldano+' de '+esc.length);
    var s=[]; if(D.sudsAntes!=null)s.push('antes '+D.sudsAntes); if(D.sudsPico!=null)s.push('pico '+D.sudsPico); if(D.sudsDesp!=null)s.push('después '+D.sudsDesp);
    if(s.length) L.push('Ansiedad (0-10): '+s.join(' · '));
    if(D.salida) L.push('Qué me ayudó: '+D.salida);
    L.push('');
  }
  if(D.imagAntes!=null||D.imagDesp!=null||D.imagReps){
    L.push('— Exposición en imaginación —');
    var s2=[]; if(D.imagAntes!=null)s2.push('inicio '+D.imagAntes); if(D.imagDesp!=null)s2.push('final '+D.imagDesp);
    if(s2.length) L.push('Ansiedad (0-10): '+s2.join(' · ')); if(D.imagReps) L.push('Repeticiones: '+D.imagReps);
    L.push('');
  }
  var ht=Object.keys(D.herramientas); if(ht.length){ L.push('— Herramientas de dentro practicadas —'); L.push(ht.join(' · ')); L.push(''); }
  var nd=0; for(var k in D.dia){ if(D.dia[k])nd++; }
  if(nd) { L.push('Rutina del día: '+nd+' de '+DIA.length+' pasos'); }
  if(D.rumia!=null) L.push('Rumiación hoy (0-10): '+D.rumia);
  if(D.animo!=null) L.push('Ánimo hoy (0-10): '+D.animo);
  if(D.logro) { L.push(''); L.push('Logro de hoy: '+D.logro); }
  if(D.nota) { L.push(''); L.push('Para mi psicólogo/a: '+D.nota); }
  L.push('');
  L.push('(Enviado desde mi app de acompañamiento APRENS)');
  $('#msgBox').textContent=L.join('\n');
}
function abrirWA(e){ e.preventDefault(); if($('#msgBox').textContent.indexOf('Pulsa')===0)prep(); var t=$('#msgBox').innerText||$('#msgBox').textContent; window.open('https://wa.me/?text='+encodeURIComponent(t),'_blank'); }
function copiar(btn){
  if($('#msgBox').textContent.indexOf('Pulsa')===0)prep();
  var box=$('#msgBox'),txt=box.innerText||box.textContent;
  if(navigator.clipboard&&window.isSecureContext){ navigator.clipboard.writeText(txt).then(function(){btn.textContent='✓ Copiado';setTimeout(function(){btn.textContent='📋 Copiar texto';},2200);}); }
  else{ var r=document.createRange();r.selectNodeContents(box);var s=window.getSelection();s.removeAllRanges();s.addRange(r);try{document.execCommand('copy');}catch(e){} s.removeAllRanges(); btn.textContent='✓ Copiado';setTimeout(function(){btn.textContent='📋 Copiar texto';},2200); }
}

render();
</script>
