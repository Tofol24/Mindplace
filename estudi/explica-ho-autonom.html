<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>Explica-ho</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: taula d'estudi. Columna esquerra = assignatures i temes; dreta = el tema obert, amb pestanyes
   Material · Guia · Autoavaluació · Progrés. La profunditat (N1→N4) es pinta com una escala de blaus. */
:root{
  --paper:#f5f7fb; --card:#ffffff; --ink:#18203a; --muted:#59627e; --line:#dde2ee; --soft:#eef1f8;
  --accent:#2c47c9; --accent-ink:#ffffff; --accent-soft:#e3e8fb;
  --marker:#ffe766; --marker-ink:#2f2800;
  --d1:#bcd9f2; --d2:#7cb2e0; --d3:#3b7fc0; --d4:#163f78;
  --ok:#1d7f55; --ok-soft:#dcf1e7; --warn:#a96b10; --warn-soft:#fbefd9; --bad:#b83b34; --bad-soft:#f8e1df;
  --s1:#2f9e6b; --s2:#c2543d; --s3:#7a52c7; --s4:#d08a12; --s5:#2b7bbf; --s6:#c23f86; --s7:#5c7d1e; --s8:#5b6478;
  --f-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0f121b; --card:#171b28; --ink:#e7eaf4; --muted:#9ba4be; --line:#2a3044; --soft:#1d2232;
  --accent:#8fa3ff; --accent-ink:#0f1430; --accent-soft:#232c52;
  --marker:#6b5d12; --marker-ink:#fff6c2;
  --d1:#27405e; --d2:#2f6aa3; --d3:#5299dc; --d4:#a9d3ff;
  --ok:#5fcf9a; --ok-soft:#173528; --warn:#e7b153; --warn-soft:#382a12; --bad:#f08a82; --bad-soft:#3a1c1b;
  --s1:#5fcf9a; --s2:#f08a72; --s3:#b39af0; --s4:#efbd55; --s5:#6fb4f0; --s6:#f08cc0; --s7:#a8cc5a; --s8:#a0a8bd;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0f121b; --card:#171b28; --ink:#e7eaf4; --muted:#9ba4be; --line:#2a3044; --soft:#1d2232;
  --accent:#8fa3ff; --accent-ink:#0f1430; --accent-soft:#232c52;
  --marker:#6b5d12; --marker-ink:#fff6c2;
  --d1:#27405e; --d2:#2f6aa3; --d3:#5299dc; --d4:#a9d3ff;
  --ok:#5fcf9a; --ok-soft:#173528; --warn:#e7b153; --warn-soft:#382a12; --bad:#f08a82; --bad-soft:#3a1c1b;
  --s1:#5fcf9a; --s2:#f08a72; --s3:#b39af0; --s4:#efbd55; --s5:#6fb4f0; --s6:#f08cc0; --s7:#a8cc5a; --s8:#a0a8bd;
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
h2{font-size:1.5rem;font-weight:700}
h3{font-size:1.1rem;font-weight:700}
p{margin:0}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.label{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.small{font-size:.88rem}

/* barra superior */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:14px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  border-bottom:1px solid var(--line);background:var(--card)}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto;min-width:0}
.brand h1{font-size:1.6rem;font-weight:800;letter-spacing:-.02em}
.brand h1 span{background:linear-gradient(transparent 58%,var(--marker) 58%);padding:0 .1em;color:inherit}
.conn{display:inline-flex;align-items:center;gap:6px;font-size:.85rem;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
.dot.on{background:var(--ok)} .dot.off{background:var(--warn)}

/* botons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--card);
  padding:9px 14px;border-radius:999px;cursor:pointer;font-weight:700;font-size:.95rem;line-height:1.2;text-decoration:none}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);border-color:var(--line)}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn.sm{padding:6px 11px;font-size:.85rem}
.btn svg{width:18px;height:18px;flex:none}

/* estructura */
.shell{display:grid;grid-template-columns:270px minmax(0,1fr);gap:0;min-height:calc(100vh - 70px)}
.side{border-right:1px solid var(--line);padding-block:18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;display:flex;flex-direction:column;gap:18px;background:var(--card)}
main{min-width:0;padding-block:22px 60px;padding-left:max(16px,2.5vw);padding-right:max(16px,env(safe-area-inset-right,0px),2.5vw)}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:20px}

.subj{display:flex;flex-direction:column;gap:2px}
.subj-head{display:flex;align-items:center;gap:8px;font-weight:700;padding:4px 0}
.subj-head .sw{width:10px;height:10px;border-radius:3px;background:var(--c,var(--s8));flex:none}
.subj-head .n{margin-left:auto;font-family:var(--f-mono);font-size:.75rem;color:var(--muted)}
.tema-link{display:block;width:100%;text-align:left;border:0;background:transparent;padding:6px 10px 6px 18px;border-radius:8px;cursor:pointer;color:var(--ink);font-size:.95rem}
.tema-link:hover{background:var(--soft)}
.tema-link.sel{background:var(--accent-soft);font-weight:700}
.tema-link .ex{font-family:var(--f-mono);font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-left:6px}
.side-actions{display:flex;flex-direction:column;gap:8px;margin-top:auto}

@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .side{border-right:0;border-bottom:1px solid var(--line);padding-right:max(16px,env(safe-area-inset-right,0px))}
  .side-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
  .side-actions{flex-direction:row;flex-wrap:wrap;margin-top:0}
  main{padding-left:max(16px,env(safe-area-inset-left,0px))}
  .side.in-tema{padding-block:10px}
  .side.in-tema .side-list,.side.in-tema .side-actions{display:none}
}

/* capçalera de tema i pestanyes */
.tema-head{display:flex;flex-direction:column;gap:6px}
.tema-head .crumb{display:flex;gap:8px;align-items:center}
.tema-head .crumb .sw{width:10px;height:10px;border-radius:3px;background:var(--c)}
.tema-head h2{font-size:clamp(1.6rem,3.4vw,2.3rem);font-weight:800;letter-spacing:-.02em}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tab{border:0;background:transparent;padding:10px 14px;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab.sel{color:var(--ink);border-bottom-color:var(--accent)}
.tab .badge{font-family:var(--f-mono);font-size:.7rem;background:var(--soft);border-radius:999px;padding:1px 7px;margin-left:6px;color:var(--muted)}

.banner{border:1px dashed var(--line);border-radius:var(--r);padding:12px 14px;background:var(--soft);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.banner p{flex:1 1 260px;min-width:0}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}

/* material */
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:26px 18px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;background:var(--card);transition:border-color .15s,background .15s}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop svg{width:34px;height:34px;color:var(--accent)}
.drop strong{font-family:var(--f-display);font-size:1.15rem}
.mats{display:flex;flex-direction:column;gap:8px}
.mat{border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
.mat summary{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;list-style:none}
.mat summary::-webkit-details-marker{display:none}
.mat .kind{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.06em;border:1px solid var(--line);border-radius:6px;padding:2px 6px;color:var(--muted);flex:none}
.mat .nm{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.mat .sz{font-family:var(--f-mono);font-size:.75rem;color:var(--muted);flex:none}
.mat .body{padding:0 12px 12px;display:flex;flex-direction:column;gap:8px}
textarea{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--paper);padding:10px 12px;resize:vertical;min-height:110px;line-height:1.5}
input[type=text],input[type=password],select{border:1px solid var(--line);border-radius:8px;background:var(--paper);padding:8px 10px;min-width:0}
.pending{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
.err{color:var(--bad)}

.spin{width:16px;height:16px;border:2.5px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.working{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:var(--r);background:var(--accent-soft)}
.working p{flex:1;min-width:0}

/* guia */
.mk{background:linear-gradient(transparent 56%,var(--marker) 56%);color:inherit;padding:0 .08em}
.resum{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.resum section{border-top:3px solid var(--ink);padding-top:10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.resum ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:4px}
.map{display:flex;flex-direction:column;align-items:center;gap:0;overflow-x:auto;padding-bottom:4px}
.map-centre{font-family:var(--f-display);font-weight:800;font-size:1.25rem;background:var(--ink);color:var(--paper);padding:10px 20px;border-radius:999px;text-align:center;max-width:100%}
.map-stem{width:2px;height:18px;background:var(--line)}
.map-branches{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;width:100%;border-top:2px solid var(--line);padding-top:18px;position:relative}
.branch{position:relative;border:1px solid var(--line);border-radius:var(--r);padding:12px;background:var(--card);display:flex;flex-direction:column;gap:6px;min-width:0}
.branch::before{content:"";position:absolute;top:-19px;left:50%;width:2px;height:18px;background:var(--line)}
.branch-name{font-family:var(--f-display);font-weight:700;font-size:1.05rem;display:flex;gap:8px;align-items:center}
.branch-name::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--b);flex:none}
.branch-idea{font-size:.9rem;color:var(--muted)}
.kids{list-style:none;margin:2px 0 0;padding:0 0 0 12px;border-left:2px solid var(--b);display:flex;flex-direction:column;gap:6px}
.kids li{font-size:.92rem}
.kids b{display:block}
.kids span{color:var(--muted);font-size:.86rem}
.rels{display:flex;flex-direction:column;gap:10px}
.rel{display:flex;flex-direction:column;gap:3px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.rel:last-child{border-bottom:0;padding-bottom:0}
.rel-line{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-weight:700}
.node{border:1px solid var(--line);border-radius:6px;padding:1px 8px;background:var(--soft)}
.arrow{font-family:var(--f-mono);font-size:.78rem;color:var(--accent);font-weight:500}
.concepts{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.concept{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.concept .cn{font-weight:700;display:flex;align-items:center;gap:8px}
.concept p{font-size:.9rem;color:var(--muted)}
.st{width:10px;height:10px;border-radius:50%;flex:none;border:2px solid var(--line);background:transparent}
.st.feble{background:var(--bad);border-color:var(--bad)}
.st.proces{background:var(--warn);border-color:var(--warn)}
.st.solid{background:var(--ok);border-color:var(--ok)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.legend span{display:inline-flex;gap:6px;align-items:center}

/* profunditat */
.depth{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.lvl{border:1px solid var(--line);border-radius:var(--r);background:var(--card);padding:10px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-width:0;position:relative}
.lvl:hover{border-color:var(--accent)}
.lvl.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.lvl .lv{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:800;font-size:1.05rem}
.lvl .lv i{width:14px;height:14px;border-radius:4px;background:var(--dc);flex:none}
.lvl .ld{font-size:.8rem;color:var(--muted);line-height:1.35}
.meter{height:6px;border-radius:99px;background:var(--soft);overflow:hidden}
.meter b{display:block;height:100%;background:var(--dc);border-radius:99px}
/* exercicis */
.enunciat{white-space:pre-wrap;font-size:1.1rem;line-height:1.5;font-weight:700;font-family:var(--f-display)}
.hints{display:flex;flex-direction:column;gap:6px}
.mathbox,.steps-in textarea{font-family:var(--f-mono);font-size:.98rem}
.mathtxt{white-space:pre-wrap}
.steps-in{display:flex;flex-direction:column;gap:10px}
.steps-in textarea{min-height:60px}
.syms{display:flex;flex-wrap:wrap;gap:4px}
.sym{min-width:36px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--card);font-family:var(--f-mono);font-size:.95rem;cursor:pointer;color:var(--ink)}
.sym:hover{border-color:var(--accent)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumb{position:relative;width:96px;height:96px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--soft)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .x{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:0;background:var(--ink);color:var(--paper);cursor:pointer;font-weight:700;line-height:1}
.chip.good{color:var(--ok);border-color:var(--ok)} .chip.bad{color:var(--bad);border-color:var(--bad)}
.pasos{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.pas{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);min-width:0}
.pas:last-child{border-bottom:0}
.pas>div{min-width:0;display:flex;flex-direction:column;gap:2px}
.pas .ico{width:24px;height:24px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;font-size:.85rem;color:var(--paper);background:var(--ok)}
.pas.error .ico{background:var(--bad)} .pas.arrossegat .ico{background:var(--warn)}
.pas.falta .ico{background:transparent;color:var(--muted);border:2px dashed var(--line)}
.sol{margin:8px 0 0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;white-space:pre-wrap}
.res{font-family:var(--f-mono);background:var(--soft);border-radius:6px;padding:1px 6px;white-space:nowrap}
.formulas{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.formula{border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.formula .expr{font-family:var(--f-mono);font-size:1.2rem;background:var(--soft);padding:8px 10px;border-radius:8px;overflow-x:auto;white-space:nowrap}
.resum ol{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr) 28px;gap:10px;align-items:center;font-size:.92rem}
.bar .track{height:10px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar .track b{display:block;height:100%;background:var(--bad);border-radius:99px}
.bar .n{font-variant-numeric:tabular-nums;font-weight:700;text-align:right}
.lvl .rec{position:absolute;top:-9px;right:8px;font-family:var(--f-mono);font-size:.62rem;letter-spacing:.06em;text-transform:uppercase;background:var(--marker);color:var(--marker-ink);padding:1px 6px;border-radius:4px}
@media (max-width:640px){.depth{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* preguntes */
.q{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.q-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:.7rem;letter-spacing:.05em;text-transform:uppercase;border:1px solid var(--line);border-radius:999px;padding:2px 9px;color:var(--muted)}
.chip i{width:9px;height:9px;border-radius:3px;background:var(--dc)}
.q-text{font-family:var(--f-display);font-size:1.22rem;font-weight:700;line-height:1.3}
.hint{font-size:.92rem;background:var(--soft);border-radius:8px;padding:8px 12px}
.answer{display:flex;flex-direction:column;gap:8px}
.answer textarea{min-height:130px;font-size:1rem;background:var(--paper)}
.mic{position:relative}
.mic.recording{background:var(--bad);border-color:var(--bad);color:#fff}
.mic.recording::after{content:"";position:absolute;inset:-4px;border-radius:999px;border:2px solid var(--bad);animation:pulse 1.4s ease-out infinite}
@keyframes pulse{from{opacity:.8;transform:scale(1)}to{opacity:0;transform:scale(1.18)}}
.interim{font-style:italic;color:var(--muted);font-size:.95rem;min-height:1.4em}
.tip{font-size:.88rem;border-left:3px solid var(--warn);background:var(--warn-soft);padding:8px 12px;border-radius:0 8px 8px 0}

.fb{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:12px}
.score{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.score .big{font-family:var(--f-display);font-weight:800;font-size:2.4rem;line-height:1;font-variant-numeric:tabular-nums}
.score .big small{font-size:1rem;color:var(--muted);font-weight:500}
.fb-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.fb-box{border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.fb-box ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:4px}
.fb-box.good{background:var(--ok-soft)} .fb-box.good h3{color:var(--ok)}
.fb-box.miss{background:var(--warn-soft)} .fb-box.miss h3{color:var(--warn)}
.fb-box.wrong{background:var(--bad-soft)} .fb-box.wrong h3{color:var(--bad)}
.care{border:2px solid var(--accent);background:var(--accent-soft);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.weave{border-left:4px solid var(--accent);padding:4px 0 4px 14px;display:flex;flex-direction:column;gap:4px}
details.better{border:1px solid var(--line);border-radius:var(--r);padding:10px 14px}
details.better summary{cursor:pointer;font-weight:700}
details.better p{margin-top:8px;white-space:pre-wrap}
.attempts{display:flex;gap:6px;flex-wrap:wrap}

/* progrés */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{border:1px solid var(--line);border-radius:var(--r);padding:12px;background:var(--card)}
.stat b{display:block;font-family:var(--f-display);font-size:1.7rem;font-variant-numeric:tabular-nums}
.hist{width:100%;border-collapse:collapse;font-size:.92rem}
.hist th{text-align:left;font-family:var(--f-mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500;padding:6px 8px;border-bottom:1px solid var(--line)}
.hist td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.hist td.n{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.tbl{overflow-x:auto}
.report{display:flex;flex-direction:column;gap:12px}
.report ol,.report ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px}

/* inici */
.hero{display:flex;flex-direction:column;gap:10px;max-width:68ch}
.hero h2{font-size:clamp(1.8rem,4vw,2.6rem);font-weight:800;letter-spacing:-.02em}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.step{border-top:3px solid var(--ink);padding-top:10px;display:flex;flex-direction:column;gap:4px}
.step .label{color:var(--accent)}
.empty{text-align:center;padding:30px 16px;display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--muted)}

dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);padding:0;width:min(560px,calc(100vw - 32px));max-height:calc(100vh - 40px)}
dialog::backdrop{background:rgba(10,14,30,.45)}
.dlg{padding:20px;display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field input,.field select{width:100%}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;font-weight:700;z-index:50;max-width:calc(100vw - 32px)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

   Emmagatzematge: base de dades privada de claude.ai si n'hi ha;
   si no, aquest navegador (localStorage).
   ============================================================ */
const Store = {
  kind: "mem", db: null, uid: null, q: {}, running: {}, failed: false, pendingRetry: {},
  async init() {
    if (window.claude?.use) {
      try {
        const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
        if (db && user) {
          const id = await user.id().catch(() => null);
          const canW = await user.can("data.write").catch(() => null);
          if (id && canW !== false) { this.db = db; this.uid = id; this.kind = "db"; return; }
        }
      } catch {}
    }
    // Fitxer obert al propi ordinador: es guarda al navegador. Dins claude.ai sense espai al compte: només si s'ha triat.
    const framed = !!window.claude?.use;
    this.kind = lsAvailable() && (!framed || ls("explica:optLocal") === "1") ? "local" : "mem";
  },
  async loadAll() {
    const out = [];
    if (this.kind === "db") {
      const snap = await this.db.collection("data/users/" + this.uid).limit(1000).get();
      for (const d of snap.docs) if (d.exists) out.push([d.id, JSON.parse(JSON.stringify(d.data()))]);
      if (snap.size >= 1000) toast("Tens molt de material guardat: potser no surt tot. Esborra temes antics.");
    } else if (this.kind === "local") {
      try {
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (k && k.startsWith("explica:doc:")) { try { out.push([k.slice(12), JSON.parse(localStorage.getItem(k))]); } catch {} }
        }
      } catch {}
    }
    return out;
  },
  // Una escriptura a la vegada per document; si n'arriben més, només es guarda l'última.
  put(key, val) { this.q[key] = {val}; this.retry(key); this.flush(key); },
  retry(except) { for (const [k, job] of Object.entries(this.pendingRetry)) { delete this.pendingRetry[k]; if (k !== except && !this.q[k]) { this.q[k] = job; this.flush(k); } } },
  del(key) { this.q[key] = {del: true}; delete this.pendingRetry[key]; this.flush(key); },
  async flush(key) {
    if (this.running[key]) return;
    this.running[key] = true;
    try {
      while (this.q[key]) {
        const job = this.q[key]; delete this.q[key];
        try { await this.write(key, job); delete this.pendingRetry[key]; const f = Object.keys(this.pendingRetry).length > 0; if (this.failed !== f) { this.failed = f; renderConn(); } }
        catch (e) {
          if (this.kind === "db" && ["invalid_argument", "revoked", "not_granted"].includes(e?.code) && JSON.stringify(job.val || {}).length < 250000) {
            // Aquest compte no pot escriure al seu espai: no copiem res al navegador sense que ho demani.
            this.kind = "mem"; this.q = {}; renderConn(); toast("No es pot guardar al compte. Obre Configuració per descarregar una còpia o guardar en aquest navegador.");
          } else {
            // Es conserva el canvi (si no n'ha arribat un de més nou) per tornar-ho a provar al següent desament.
            if (!this.q[key]) this.pendingRetry[key] = job;
            this.failed = true; renderConn();
            toast(e?.code === "quota_exceeded" || e?.name === "QuotaExceededError" ? "No queda espai per guardar. Esborra material que ja no facis servir." : "No s'ha pogut guardar. Es tornarà a provar amb el següent canvi.");
          }
        }
      }
    } finally { this.running[key] = false; }
  },
  async write(key, job) {
    if (this.kind === "db") {
      const ref = this.db.collection("data/users/" + this.uid).doc(key);
      if (job.del) await ref.delete(); else await ref.set(job.val);
    } else if (this.kind === "local") {
      if (job.del) localStorage.removeItem("explica:doc:" + key); else localStorage.setItem("explica:doc:" + key, JSON.stringify(job.val));
    }
  },
};

// Versió per a pacients: la pàgina porta <meta name="explica-proxy"> i parla amb Claude a través
// del servidor propi (que guarda la clau); aquí només cal el codi d'accés de cada alumne.
const PROXY = document.querySelector('meta[name="explica-proxy"]')?.content || "";
if (PROXY) document.querySelector(".brand .label").textContent = "Estudi d'ESO i batxillerat";
const AI = {
  mode: "none", sample: null, imgMax: 5,
  memKey: "", memCodi: "",
  get codi() { return this.memCodi || ls("explica:codi") || ""; },
  get apiKey() { return this.memKey || ls("explica:apikey") || ""; },
  get model() { return ls("explica:model") || "claude-sonnet-5-5"; },
  async init() {
    if (PROXY) { this.mode = "proxy"; return; }
    if (window.claude?.use) {
      try {
        const s = await claude.use("sample");
        if (s) {
          this.sample = s; this.mode = "claude";
          const lim = await s.limits().catch(() => null);
          this.imgMax = lim?.images?.maxCount || 0;
          return;
        }
      } catch {}

    this.mode = this.apiKey ? "api" : "none";
  },
  ready() { return this.mode === "claude" || (this.mode === "proxy" ? !!this.codi : !!this.apiKey); },
  async json(prompt, opts = {}) {
    if (this.mode === "claude") {

        onText: opts.onText ? ({text}) => opts.onText(text.length) : undefined});

  },
  async text(prompt, opts = {}) {

      return r.text;
    }
    if (!this.ready()) throw {code: "no_ai"};
    return this.api(prompt, opts);
  },
  async api(prompt, opts) {
    const content = [];
    for (const b of opts.images || []) {
      const small = await shrinkImage(b, 1600);
      const type = ["image/jpeg", "image/png", "image/gif", "image/webp"].includes(small.type) ? small.type : null;
      if (!type) throw {code: "image_rejected"};
      content.push({type: "image", source: {type: "base64", media_type: type, data: await blobToB64(small)}});
    }
    content.push({type: "text", text: prompt});
    if (this.mode === "proxy") return this.viaProxy(content, opts);
    let res;
    try {
      res = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST", signal: opts.signal,
        headers: {"content-type": "application/json", "x-api-key": this.apiKey, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true"},
        body: JSON.stringify({model: this.model, max_tokens: 12000, messages: [{role: "user", content}]}),
      });
    } catch (e) {
      if (e?.name === "AbortError") throw {code: "cancelled"};
      throw {code: "upstream_error", message: "No hi ha connexió amb Claude. Comprova internet."};
    }
    const body = await res.json().catch(() => ({}));
    if (!res.ok) {
      if (res.status === 401) throw {code: "bad_key"};
      if (res.status === 429) throw {code: "rate_limited"};
      if (res.status === 413) throw {code: "prompt_too_large"};
      throw {code: "upstream_error", message: body?.error?.message || ("HTTP " + res.status)};
    }
    return arr(body.content).filter(c => c.type === "text").map(c => c.text).join("");
  },
  // Servidor propi: respon en streaming (SSE) perquè les correccions llargues no tallin per temps.
  async viaProxy(content, opts) {
    let res;
    try {
      res = await fetch(PROXY, {
        method: "POST", signal: opts.signal,
        headers: {"content-type": "application/json", "x-codi": this.codi},
        body: JSON.stringify({tier: opts.tier || "default", max_tokens: 12000, messages: [{role: "user", content}]}),
      });
    } catch (e) {
      if (e?.name === "AbortError") throw {code: "cancelled"};
      throw {code: "upstream_error", message: "No hi ha connexió. Comprova internet."};
    }
    if (!res.ok) {
      const b = await res.json().catch(() => ({}));
      if (res.status === 401) { this.codiOk = false; renderConn(); }
    throw {code: ({401: "bad_code", 413: "prompt_too_large"})[res.status] || (b.error === "limit" ? "daily_limit" : b.error === "saldo" ? "no_credit" : res.status === 429 ? "rate_limited" : "upstream_error"),
        message: b.message || ("HTTP " + res.status)};
    }
    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = "", text = "", stop = null;
    try {
      for (;;) {
        const {value, done} = await reader.read();
        if (done) break;
        buf += dec.decode(value, {stream: true}).replace(/\r\n/g, "\n");
        let i;
        while ((i = buf.indexOf("\n\n")) >= 0) {
          const ev = buf.slice(0, i); buf = buf.slice(i + 2);
          const data = ev.split("\n").filter(l => l.startsWith("data:")).map(l => l.slice(5).trim()).join("");
          if (!data) continue;
          let j; try { j = JSON.parse(data); } catch { continue; }
          if (j.type === "content_block_delta" && j.delta?.type === "text_delta") { text += j.delta.text; opts.onText?.(text.length); }
          else if (j.type === "message_delta" && j.delta?.stop_reason) stop = j.delta.stop_reason;
          else if (j.type === "message_stop") stop ||= "end_turn";
          else if (j.type === "error") throw {code: j.error?.type === "overloaded_error" ? "rate_limited" : "upstream_error", message: j.error?.message};
        }
      }
    } catch (e) {
      if (e?.name === "AbortError") throw {code: "cancelled"};
      throw e?.code ? e : {code: "upstream_error", message: "La connexió s'ha tallat. Torna-ho a provar."};
    }
    // Una resposta que no arriba al final (tall de connexió o massa llarga) no es dona per bona.
    if (!stop) throw {code: "upstream_error", message: "La resposta s'ha tallat. Torna-ho a provar."};
    if (stop === "max_tokens") throw {code: "prompt_too_large", message: "La resposta era massa llarga."};
    if (!text.trim()) throw {code: "empty_completion"};
    this.codiOk = true;
    return text;
  },
};

    const c = document.createElement("canvas"); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);

function kindOf(f) {

  if ((f.type || "").startsWith("image/") || /\.(png|jpe?g|webp|gif|heic)$/.test(n)) return "IMG";
  if (n.endsWith(".pdf") || f.type === "application/pdf") return "PDF";

`Aquestes ${group.length} imatges són material d'estudi ${WHO.duna} (fotos o captures d'apunts, llibre de text, fitxes o diapositives), en ordre.
Transcriu fidelment tot el text que s'hi llegeix, imatge per imatge, començant cada una amb una línia "--- Pàgina ${i + 1}… ---" (numera-les a partir de ${i + 1}).

async function extract(f, signal, status) {
  const k = kindOf(f);
  if (k === "IMG") { status("Llegint la imatge amb Claude…"); return {kind: k, text: await ocr([f], signal)}; }
  if (k === "TEXT") return {kind: k, text: await f.text()};
  if (k === "WORD") { status("Llegint el Word…"); const m = await getMammoth(); const r = await m.extractRawText({arrayBuffer: await f.arrayBuffer()}); return {kind: k, text: r.value.trim()}; }
  if (k === "DOC") throw new Error("Els .doc antics no es poden llegir. Obre'l amb Word i desa'l com a .docx o PDF.");
  if (k === "PPT") throw new Error("Les presentacions no es poden llegir directament. Exporta-la a PDF i puja el PDF.");
  if (k === "PDF") {
    status("Llegint el PDF…");
    const lib = await getPdfjs();
    const pdf = await lib.getDocument({data: new Uint8Array(await f.arrayBuffer()), isEvalSupported: false}).promise;
    const pages = [];
    for (let p = 1; p <= pdf.numPages; p++) {
      const pg = await pdf.getPage(p); const tc = await pg.getTextContent();
      let line = "", txt = "", lastY = null;
      for (const it of tc.items) { const y = it.transform?.[5]; if (lastY !== null && Math.abs(y - lastY) > 4) { txt += line.trim() + "\n"; line = ""; } line += it.str + (it.hasEOL ? "\n" : " "); lastY = y; }
      txt += line; pages.push(txt.replace(/[ \t]+\n/g, "\n").trim());
    }
    // Les pàgines sense text (escanejades o fotos) es converteixen en imatge i les llegeix Claude, una per una.
    const scan = pages.map((t, i) => t.replace(/\s/g, "").length < 40 ? i : -1).filter(i => i >= 0);
    const MAXOCR = 15, todo = scan.slice(0, MAXOCR);
    for (let j = 0; j < todo.length; j++) {
      const i = todo[j];
      status(`Pàgina escanejada ${i + 1}: llegint-la amb Claude (${j + 1} de ${todo.length})…`);
      const pg = await pdf.getPage(i + 1); const vp0 = pg.getViewport({scale: 1}); const vp = pg.getViewport({scale: Math.min(2.2, 1500 / vp0.width)});
      const c = document.createElement("canvas"); c.width = vp.width; c.height = vp.height;
      await pg.render({canvasContext: c.getContext("2d"), viewport: vp}).promise;
      const img = await new Promise(r => c.toBlob(r, "image/jpeg", .85));
      pages[i] = (await ocr([img], signal)).replace(/^--- Pàgina[^\n]*\n?/, "");
    }
    const skipped = scan.slice(MAXOCR).map(i => i + 1);
    return {kind: k, text: (skipped.length ? `[No s'han llegit ${skipped.length} pàgines escanejades: ${skipped.join(", ")}. Puja-les com a fotos si les necessites.]\n\n` : "") +
      pages.map((t, i) => `--- Pàgina ${i + 1} ---\n${t}`).join("\n\n")};
  }
  throw new Error("Aquest tipus de fitxer no es pot llegir. Fes servir fotos, PDF, Word (.docx) o text.");
}
async function addFiles(files) {
  const t = getTema(S.view.temaId); if (!t || t.exemple) return;

// Cada pregunta compta una sola vegada: el seu últim intent.
function evidence(t) { const seen = new Set(), out = []; for (const h of arr(t.historial).slice().reverse()) { if (h.qid) { if (seen.has(h.qid)) continue; seen.add(h.qid); } out.push(h); } return out.reverse(); }
// kind: "teoria" (preguntes per explicar) o "ex" (exercicis); cada un té la seva escala.
function levelScores(t, kind = "teoria") { const st = {1: [], 2: [], 3: [], 4: []}; for (const h of evidence(t)) if (st[h.nivell] && (h.mode === "ex") === (kind === "ex")) st[h.nivell].push(h.nota); return st; }
function levelAvg(list) { const l = list.slice(-3); return l.length ? l.reduce((a, b) => a + b, 0) / l.length : null; }
// Es passa de nivell quan les 2-3 últimes respostes d'aquell nivell fan mitjana de 7 o més.
function recommended(t, kind = "teoria") { const st = levelScores(t, kind); for (let L = 1; L <= 4; L++) { const l = st[L].slice(-3); const a = levelAvg(l); if (!(l.length >= 2 && a >= 7)) return L; } return 4; }
function conceptStatus(t) {
  const m = {};
  for (const c of arr(t.guia?.conceptes)) m[c.id] = {ok: 0, feb: 0, last: null};
  for (const h of evidence(t)) {
    for (const id of arr(h.ok)) if (m[id]) { m[id].ok++; m[id].last = "ok"; }
    for (const id of arr(h.feble)) if (m[id]) { m[id].feb++; m[id].last = "feb"; }
  }
  const out = {};
  for (const [id, v] of Object.entries(m)) out[id] = !v.last ? "none" : v.last === "feb" ? "feble" : v.ok >= 2 ? "solid" : "proces";
  return out;
}

/* ============================================================
   Micròfon (reconeixement de veu del navegador)
   ============================================================ */
const Mic = {
  rec: null, qid: null, base: "", finals: "", want: false, t0: 0, timer: null,
  supported() { return !!(window.SpeechRecognition || window.webkitSpeechRecognition); },
  start(qid, lang) {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { S.micTip = true; render(); return; }
    this.stop(); clearInterval(this.timer);
    const ta = document.getElementById("ans_" + qid);
    this.tema = getTema(S.view.temaId); this.qid = qid; this.base = ta ? ta.value.replace(/\s*$/, "") : ""; this.finals = ""; this.want = true; this.t0 = Date.now();
    const android = /android/i.test(navigator.userAgent);
    const rec = new SR(); rec.lang = lang; rec.interimResults = true; rec.continuous = !android; rec.maxAlternatives = 1;
    this.rec = rec;
    rec.onresult = (e) => {
      if (this.rec !== rec) return;
      let interim = "";
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const r = e.results[i];
        if (r.isFinal) this.finals += (this.finals ? " " : "") + r[0].transcript.trim(); else interim += r[0].transcript;
      }
      this.sync(interim);
    };
    rec.onerror = (e) => {
      if (this.rec !== rec) return;
      if (e.error === "not-allowed" || e.error === "service-not-allowed" || e.error === "audio-capture") { this.want = false; S.micTip = true; render(); }
      else if (e.error === "network" || e.error === "language-not-supported") { this.want = false; toast(e.error === "network" ? "El dictat necessita connexió. Escriu la resposta o torna-ho a provar." : "El navegador no reconeix aquesta llengua. Tria'n una altra o escriu."); }
    };
    rec.onend = () => { if (this.rec !== rec) return; if (this.want) { try { rec.start(); } catch { this.want = false; this.end(); } } else this.end(); };
    try { rec.start(); } catch { S.micTip = true; this.want = false; this.rec = null; this.qid = null; render(); return; }
    this.timer = setInterval(() => { const el = document.querySelector(`[data-mic="${qid}"] .mt`); if (el) { const s = Math.floor((Date.now() - this.t0) / 1000); el.textContent = Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); } }, 500);
    render();
  },
  sync(interim) {
    const t = this.tema; const q = t?.ronda?.items.find(x => x.id === this.qid); if (!q) return;
    q.resposta = (this.base ? this.base + " " : "") + this.finals; q.oral = true;
    const ta = document.getElementById("ans_" + this.qid); if (ta) ta.value = q.resposta;
    const im = document.getElementById("int_" + this.qid); if (im) im.textContent = interim;
    saveTemaSoon(t);
  },
  stop() { if (!this.rec) return; this.want = false; try { this.rec.stop(); } catch { this.end(); } },
  // Atura i espera que arribin els últims resultats (o 2,5 s com a màxim).
  stopAndWait() {
    if (!this.rec) return Promise.resolve();
    const p = new Promise(res => { this.waiters.push(res); setTimeout(res, 2500); });
    this.stop(); return p;
  },
  waiters: [],
  end() {
    clearInterval(this.timer); this.timer = null; this.rec = null;
    const im = document.getElementById("int_" + this.qid); if (im) im.textContent = "";
    this.qid = null; render();
    this.waiters.splice(0).forEach(f => f());
  },
};

  cam: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>`,
  plus: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>`,
};

function renderSide() {
  const subs = allSubjects();
  const list = subs.map(s => {
    const ts = s.exemple ? Object.values(ex.temes).filter(x => x.subjId === s.id) : temesOf(s.id);
    return `<div class="subj" style="--c:${subjColor(s)}">
      <div class="subj-head"><span class="sw"></span>${esc(s.nom)}<span class="n">${ts.length}</span></div>
      ${ts.map(t => `<button id="tl_${t.id}" class="tema-link ${S.view.temaId === t.id ? "sel" : ""}" data-act="open" data-id="${t.id}" type="button">${esc(t.titol)}${t.exemple ? '<span class="ex">exemple</span>' : ""}</button>`).join("")}
      ${s.exemple ? "" : `<button class="tema-link muted" data-act="newTema" data-subj="${s.id}" type="button">+ Nou tema</button>`}

      <button class="btn sm" data-act="newSubj" type="button">${ICON.plus} Assignatura</button>

}

function renderHome() {
  const has = S.subjects.length > 0 || !S.loaded;
  return `<div class="wrap">
    ${S.loaded && Store.kind === "mem" ? `<div class="banner" role="note"><p><strong>Ara mateix no es guarda res.</strong> ${lsAvailable() ? "Pots guardar-ho en aquest navegador o descarregar còpies des de Configuració." : "Descarrega còpies des de Configuració."}</p>${lsAvailable() ? `<button class="btn sm" data-act="useLocal" type="button">Guarda en aquest navegador</button>` : ""}</div>` : ""}
    ${S.loadError ? `<div class="banner" role="alert"><p><strong>No s'han pogut carregar les teves dades.</strong> No hi facis canvis fins que es carreguin, perquè no es perdi res.</p><button class="btn sm primary" data-act="retryLoad" type="button">Torna-ho a provar</button></div>` : ""}
    ${AI.mode === "proxy" && !AI.codi && S.loaded ? `<div class="banner" role="note"><p><strong>Per començar, posa el teu codi d'accés.</strong> És el codi que t'han donat per fer servir l'eina.</p><button class="btn sm primary" data-act="settings" type="button">Posa el codi</button></div>` : ""}
    <div class="hero">
      <span class="label">Com funciona</span>
      <h2>Puja els apunts, explica-ho en veu alta i descobreix fins on t'ho saps.</h2>
      <p class="muted">Claude ordena el material en un resum i un mapa conceptual, et fa preguntes que comencen per les dades concretes i van baixant fins a relacionar-ho tot, i et diu què has explicat bé, què t'has deixat i com encaixar-ho. A Matemàtiques i Física i Química et posa exercicis, els resols pas a pas i et diu en quin pas t'has equivocat.</p>
      <p class="muted small">Les respostes les genera una intel·ligència artificial (Claude) i es pot equivocar: si alguna cosa no et quadra, consulta el llibre o el professorat.</p>
    </div>
    <div class="steps">
      <div class="step"><span class="label">Pas 1 · Material</span><h3>Fotos, PDF o Word</h3><p class="muted small">Captures del llibre, fotos del quadern, apunts en PDF o .docx.</p></div>
      <div class="step"><span class="label">Pas 2 · Guia</span><h3>Resum i mapa</h3><p class="muted small">Les idees ordenades, els conceptes clau i com es relacionen.</p></div>
      <div class="step"><span class="label">Pas 3 · Explica-ho</span><h3>Preguntes en 4 nivells</h3><p class="muted small">Respon parlant pel micròfon o escrivint. Claude ho avalua.</p></div>
      <div class="step"><span class="label">Pas 4 · Progrés</span><h3>Fins on t'ho saps</h3><p class="muted small">Quins conceptes tens sòlids i quin nivell de profunditat domines.</p></div>
    </div>
    ${has ? "" : `<div class="panel">
      <h3>Comença triant les teves assignatures</h3>
      <p class="muted small">Pots afegir-ne quan vulguis. Matemàtiques i Física i Química funcionen amb exercicis: els resols pas a pas i Claude et diu on t'has equivocat.</p>
      <div class="row">${PRESETS.map((p, i) => `<label class="chip" style="cursor:pointer;text-transform:none;font-family:var(--f-body);font-size:.92rem;letter-spacing:0;color:var(--ink);padding:6px 12px"><input type="checkbox" id="pre_${i}" ${i < 9 ? "checked" : ""}> ${esc(p.nom)}</label>`).join("")}</div>
      <div class="row"><button class="btn primary" data-act="addPresets" type="button">Afegeix aquestes assignatures</button></div>
    </div>`}
    ${S.exampleHidden ? "" : `<div class="banner"><p><strong>Mira els exemples:</strong> «La cèl·lula», de Biologia (preguntes per explicar), i «Moviment rectilini uniforme», de Física i Química (exercicis). No es guarden.</p><button class="btn sm" data-act="open" data-id="exemple" type="button">Biologia</button><button class="btn sm" data-act="open" data-id="exemple-fq" type="button">Física i Química</button><button class="btn sm ghost" data-act="hideExample" type="button">Amaga'l</button></div>`}
  </div>`;
}

function renderTema(t) {
  const s = getSubj(t.subjId);
  const tab = S.view.tab;
  const nm = arr(t.mats).length, nq = arr(t.historial).length;
  const tabs = isProb(s)
    ? [["material", "Material", nm], ["guia", "Guia i fórmules", null], ["ex", "Exercicis", null], ["quiz", "Teoria", null], ["prog", "Progrés", nq]]
    : [["material", "Material", nm], ["guia", "Guia i mapa", null], ["quiz", "Explica-ho", null], ["prog", "Progrés", nq]];
  let body = "";
  if (tab === "material") body = viewMaterial(t);
  else if (tab === "guia") body = viewGuide(t);
  else if (tab === "ex" && isProb(s)) body = viewExercises(t, s);
  else if (tab === "quiz" || tab === "ex") body = viewQuiz(t, s);
  else body = viewProgress(t);
  return `<div class="wrap">
    ${t.exemple ? `<div class="banner"><p>Això és un <strong>exemple</strong>. Pots provar-ho tot, però no es guarda. Crea el teu primer tema des d'una assignatura.</p></div>` : ""}
    <div class="tema-head" style="--c:${subjColor(s)}">
      <div class="crumb"><span class="sw"></span><span class="label">${esc(s?.nom)}</span><span class="spacer"></span>
        ${t.exemple ? "" : `<button class="btn sm ghost" data-act="renameTema" type="button">Canvia el nom</button><button class="btn sm ghost danger" data-act="delTema" type="button">Esborra</button>`}</div>
      <h2 id="temaTitle" tabindex="-1">${esc(t.titol)}</h2>
    </div>
    <nav class="tabs" role="tablist">${tabs.map(([k, l, n]) => `<button id="tab_${k}" class="tab ${tab === k ? "sel" : ""}" role="tab" aria-selected="${tab === k}" tabindex="${tab === k ? 0 : -1}" data-act="tab" data-tab="${k}" type="button">${l}${n ? `<span class="badge">${n}</span>` : ""}</button>`).join("")}</nav>
    ${body}
  </div>`;
}

const pasteOf = (t) => S.paste[t.id] ||= {text: "", nom: ""};
function viewMaterial(t) {
  const mats = arr(t.mats).map(getMat).filter(Boolean);
  const total = mats.reduce((a, m) => a + m.text.length, 0);
  return `
    ${t.exemple ? "" : `<div class="drop" id="drop" data-act="pick" role="button" tabindex="0">
      ${ICON.up}<strong>Afegeix material d'estudi</strong>
      <span class="muted small">Arrossega-hi fitxers, toca per triar-los o enganxa una captura (Ctrl+V). Fotos, captures, PDF, Word (.docx) o text.</span>
    </div>`}
    ${busyBox("mat")}
    ${S.pending.map(p => `<div class="pending" data-pend="${p.id}"><span class="spin"></span><span class="chip">${p.kind}</span><strong style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(p.nom)}</strong><span class="pm muted small" style="margin-left:auto">${esc(p.msg)}</span></div>`).join("")}
    <div class="mats">
      ${mats.map(m => `<details class="mat" id="md_${m.id}"><summary><span class="kind">${esc(m.tipus)}</span><span class="nm">${esc(m.nom)}</span><span class="sz">${kchars(m.text.length)}</span></summary>
        <div class="body"><p class="muted small">Revisa el text llegit i corregeix el que calgui: és el que farà servir Claude.</p>
          <textarea id="mt_${m.id}" data-mat="${m.id}" rows="8" aria-label="Text del material ${esc(m.nom)}" ${t.exemple ? "readonly" : ""}>${esc(m.text)}</textarea>
          ${t.exemple ? "" : `<div class="row"><span class="spacer"></span><button class="btn sm ghost danger" data-act="delMat" data-id="${m.id}" type="button">Esborra aquest material</button></div>`}</div></details>`).join("")}
    </div>
    ${t.exemple ? "" : `<details class="panel" ${pasteOf(t).text ? "open" : ""}><summary style="cursor:pointer;font-weight:700">Enganxa o escriu text</summary>
      <label class="label" for="pasteText">Text</label><textarea id="pasteText" data-paste="text" rows="6" placeholder="Enganxa aquí apunts, un fragment del llibre o el que hagis copiat d'una web…">${esc(pasteOf(t).text)}</textarea>
      <div class="row"><label class="label" for="pasteName">Nom</label><input type="text" id="pasteName" data-paste="nom" value="${esc(pasteOf(t).nom)}" placeholder="Nom (opcional)" style="flex:1 1 200px"><button class="btn" data-act="addText" type="button">Afegeix el text</button></div></details>`}
    <div class="panel">
      <div class="row"><div style="flex:1 1 260px;min-width:0"><h3>Organitza el tema</h3><p class="muted small">${mats.length ? `${mats.length} material${mats.length > 1 ? "s" : ""}, ${kchars(total)}. ` : ""}Claude en farà el resum ordenat, el mapa conceptual i la llista de conceptes clau.</p></div>
      <button id="btnGuide" class="btn primary" data-act="guide" type="button" ${mats.length && !S.busy.guia && !t.exemple ? "" : "disabled"}>${t.guia ? "Torna a fer la guia" : "Fes la guia"}</button></div>
      ${busyBox("guia")}
    </div>`;
}

function viewGuide(t) {
  const g = t.guia;
  if (!g) return `<div class="panel empty"><h3>Encara no hi ha guia</h3><p>Afegeix material i prem «Fes la guia».</p><button class="btn" data-act="tab" data-tab="material" type="button">Ves a Material</button>${busyBox("guia")}</div>`;
  const st = conceptStatus(t);
  const colors = ["var(--s1)","var(--s5)","var(--s3)","var(--s4)","var(--s2)","var(--s6)"];
  return `
    <section class="panel"><div class="row"><h3>Resum ordenat</h3><span class="spacer"></span><span class="label">Fet el ${fmtDate(g.generat)}</span></div>
      <div class="resum">${arr(g.resum).map(r => `<section><h3>${esc(r.apartat)}</h3><ul>${arr(r.punts).map(p => `<li>${esc(p)}</li>`).join("")}</ul></section>`).join("")}</div>
    </section>
    ${arr(g.formules).length ? `<section class="panel"><h3>Fórmules</h3><div class="formulas">${arr(g.formules).map(f => `<div class="formula"><span class="label">${esc(f.nom)}</span><div class="expr">${esc(f.expressio)}</div>${f.variables ? `<p class="small">${esc(f.variables)}</p>` : ""}${f.quan ? `<p class="muted small">${esc(f.quan)}</p>` : ""}</div>`).join("")}</div></section>` : ""}
    ${arr(g.metodes).length ? `<section class="panel"><h3>Mètodes pas a pas</h3><div class="resum">${arr(g.metodes).map(m => `<section><h3>${esc(m.nom)}</h3><ol>${arr(m.passos).map(x => `<li>${esc(x)}</li>`).join("")}</ol></section>`).join("")}</div>
      ${arr(g.tipus_problemes).length ? `<p class="small"><span class="label">Tipus de problemes</span> ${arr(g.tipus_problemes).map(x => `<span class="chip" title="${esc(x.descripcio)}">${esc(x.nom)}</span>`).join(" ")}</p>` : ""}</section>` : ""}
    <section class="panel"><h3>Mapa conceptual</h3>
      <div class="map">
        <div class="map-centre">${esc(g.mapa?.centre || t.titol)}</div><div class="map-stem"></div>
        <div class="map-branches">${arr(g.mapa?.branques).map((b, i) => `<div class="branch" style="--b:${colors[i % colors.length]}">
          <div class="branch-name">${esc(b.nom)}</div>${b.idea ? `<p class="branch-idea">${esc(b.idea)}</p>` : ""}
          <ul class="kids">${arr(b.fills).map(f => `<li><b>${esc(f.nom)}</b>${f.idea ? `<span>${esc(f.idea)}</span>` : ""}</li>`).join("")}</ul></div>`).join("")}</div>
      </div>
    </section>
    ${arr(g.relacions).length ? `<section class="panel"><h3>Com es relacionen les idees</h3><p class="muted small">Aquestes connexions són les que et preguntaran als nivells 3 i 4.</p>
      <div class="rels">${arr(g.relacions).map(r => `<div class="rel"><div class="rel-line"><span class="node">${esc(r.de)}</span><span class="arrow">— ${esc(r.tipus)} →</span><span class="node">${esc(r.a)}</span></div><p class="muted small">${esc(r.explicacio)}</p></div>`).join("")}</div></section>` : ""}
    <section class="panel"><div class="row"><h3>Conceptes clau</h3><span class="spacer"></span>
      <div class="legend"><span><i class="st"></i>no treballat</span><span><i class="st feble"></i>a reforçar</span><span><i class="st proces"></i>en procés</span><span><i class="st solid"></i>sòlid</span></div></div>
      <div class="concepts">${arr(g.conceptes).map(c => `<div class="concept"><span class="cn"><i class="st ${st[c.id] === "none" ? "" : st[c.id]}" aria-hidden="true"></i><span class="mk">${esc(c.nom)}</span><span class="sr">(${ST_LABEL[st[c.id]]})</span></span><p>${esc(c.definicio)}</p></div>`).join("")}</div>
    </section>
    <div class="row">${isProb(getSubj(t.subjId)) ? `<button class="btn primary" data-act="tab" data-tab="ex" type="button">Fes exercicis</button><button class="btn" data-act="tab" data-tab="quiz" type="button">Preguntes de teoria</button>` : `<button class="btn primary" data-act="tab" data-tab="quiz" type="button">Comença a explicar-ho</button>`}
      ${t.exemple ? "" : `<button class="btn ghost" data-act="guide" type="button" ${S.busy.guia ? "disabled" : ""}>Torna a fer la guia</button>`}</div>
    ${busyBox("guia")}`;
}

function depthPicker(t, sel, kind = "teoria") {
  const st = levelScores(t, kind), rec = recommended(t, kind), LV = levelsFor(kind);
  return `<div class="depth" role="group" aria-label="${kind === "ex" ? "Dificultat dels exercicis" : "Nivell de profunditat"}">${[1,2,3,4].map(L => {
    const a = levelAvg(st[L]);
    return `<button id="lvl_${kind}${sel === null ? "p" : "q"}${L}" class="lvl ${sel === L ? "sel" : ""}" style="--dc:var(--d${L})" aria-pressed="${sel === L}" data-act="level" data-kind="${kind}" data-l="${L}" type="button">
      ${rec === L ? '<span class="rec">recomanat</span>' : ""}
      <span class="lv"><i></i>${lvlTag(kind, L)} ${LV[L].nom}</span>
      <span class="ld">${LV[L].curt}</span>
      <span class="meter" title="${a === null ? "sense respostes" : "mitjana " + a.toFixed(1)}"><b style="width:${a === null ? 0 : a * 10}%"></b></span>
      <span class="label">${st[L].length ? `${st[L].length} resp. · ${a.toFixed(1)}` : "sense respostes"}</span>
    </button>`; }).join("")}</div>`;
}

function viewQuiz(t, s) {
  if (!t.guia) return `<div class="panel empty"><h3>Primer cal la guia del tema</h3><p>Les preguntes surten del material ordenat.</p><button class="btn" data-act="tab" data-tab="material" type="button">Ves a Material</button></div>`;
  S.levelSel ??= {};
  const sel = S.levelSel[t.id] ?? recommended(t);
  const r = t.ronda;
  return `
    <section class="panel">
      <div class="row"><div style="flex:1 1 260px;min-width:0"><h3>Tria la profunditat</h3><p class="muted small">Comença per dalt i ves baixant. Quan les últimes respostes d'un nivell fan mitjana de 7, passes al següent.</p></div></div>
      ${depthPicker(t, sel)}
      <div class="row">
        <button id="btnAsk" class="btn primary" data-act="ask" type="button" ${S.busy.quiz ? "disabled" : ""}>Fes-me preguntes de nivell ${sel}</button>
        <button id="btnFree" class="btn" data-act="free" type="button" ${S.busy.quiz ? "disabled" : ""}>Explica tot el tema</button>
      </div>
      ${busyBox("quiz")}
    </section>
    ${S.micTip ? micTip() : ""}
    ${Mic.supported() ? `<p class="muted small">El botó «Parla» fa servir el reconeixement de veu del navegador: a Chrome l'àudio es processa als servidors de Google i a Safari als d'Apple. Si no ho vols, escriu la resposta o dicta amb el teclat.</p>` : ""}
    ${r ? arr(r.items).map((q, i) => viewQuestion(t, s, q, i)).join("") : `<div class="empty"><p>Tria un nivell i prem «Fes-me preguntes», o prova d'explicar tot el tema de cop.</p></div>`}`;
}
function micTip() {
  return `<div class="tip" role="note"><strong>El micròfon d'aquesta pàgina no està disponible aquí.</strong> Pots dictar igualment amb el teclat: al mòbil, toca el micròfon del teclat; a Windows, prem <b>Windows + H</b>; al Mac, prem dues vegades la tecla <b>Fn</b> (o <b>Control</b>). El text apareixerà a la caixa de resposta. <button class="btn sm ghost" data-act="hideTip" type="button">Entesos</button></div>`;
}
function viewQuestion(t, s, q, i) {
  const last = q.avals[q.avals.length - 1];
  const rec = Mic.qid === q.id;
  const lang = S.micLang?.[q.id] || LANGS[s.llengua]?.sr || "ca-ES";
  const dc = q.nivell ? `var(--d${q.nivell})` : "var(--accent)";
  return `<article class="q" style="--dc:${dc}">
    <div class="q-top"><span class="label">Pregunta ${i + 1}</span><span class="chip"><i></i>${q.nivell ? "N" + q.nivell + " " + LEVELS[q.nivell].nom : "Explicació lliure"}</span>${q.tipus && q.nivell ? `<span class="chip">${esc(q.tipus)}</span>` : ""}</div>
    <p class="q-text">${esc(q.pregunta)}</p>
    ${q.pista ? (S.showHint[q.id] ? `<p class="hint" id="hint_${q.id}" tabindex="-1"><strong>Pista:</strong> ${esc(q.pista)}</p>` : `<button class="btn sm ghost" data-act="hint" data-id="${q.id}" type="button" style="align-self:flex-start">Vull una pista</button>`) : ""}
    <div class="answer">
      <label class="label" for="ans_${q.id}">${last ? "La teva resposta (pots millorar-la i tornar-la a enviar)" : "La teva resposta"}</label>
      <textarea id="ans_${q.id}" data-ans="${q.id}" maxlength="20000" ${S.busy["ev_" + q.id] ? "readonly" : ""} rows="5" placeholder="Prem el micròfon i explica-ho en veu alta, o escriu aquí.">${esc(q.resposta)}</textarea>
      <p class="interim" id="int_${q.id}" aria-live="polite"></p>
      <div class="row" data-mic="${q.id}">
        <button id="mic_${q.id}" class="btn mic ${rec ? "recording" : ""}" data-act="mic" data-id="${q.id}" type="button" aria-pressed="${rec}">${rec ? ICON.stop + " Atura <span class=\"mt\">0:00</span>" : ICON.mic + " Parla"}</button>
        <select id="ml_${q.id}" data-miclang="${q.id}" aria-label="Llengua del micròfon">${Object.entries(LANGS).map(([k, v]) => `<option value="${v.sr}" ${v.sr === lang ? "selected" : ""}>${v.nom}</option>`).join("")}</select>
        <span class="spacer"></span>
        <button id="ev_${q.id}" class="btn primary" data-act="eval" data-id="${q.id}" type="button" ${S.busy["ev_" + q.id] ? "disabled" : ""}>${last ? "Torna-ho a avaluar" : "Avalua la resposta"}</button>
      </div>
      ${busyBox("ev_" + q.id)}
    </div>
    ${last ? viewFeedback(q, last) : ""}
  </article>`;
}
function viewFeedback(q, a) {
  const tone = a.nota >= 7 ? "var(--ok)" : a.nota >= 5 ? "var(--warn)" : "var(--bad)";
  const list = (xs) => `<ul>${xs.map(x => `<li>${esc(x)}</li>`).join("")}</ul>`;
  return `<div class="fb">
    <div class="score"><span class="big" style="color:${tone}">${a.nota}<small>/10</small></span>
      <div><span class="label">Profunditat que demostres</span><div class="row" style="gap:6px;margin-top:4px">${[1,2,3,4].map(L => `<span class="chip" style="--dc:var(--d${L});${L <= a.profunditat ? "color:var(--ink);border-color:var(--d" + L + ")" : "opacity:.5"}"><i style="${L <= a.profunditat ? "" : "background:transparent"}"></i>N${L}</span>`).join("")}</div></div>
      ${q.avals.length > 1 ? `<div class="attempts"><span class="label">Intents:</span>${q.avals.map(v => `<span class="chip">${v.nota}</span>`).join("")}</div>` : ""}</div>
${a.benestar ? `<div class="care" role="note"><strong>Un moment</strong><p>${esc(a.benestar)}</p></div>` : ""}
    ${a.millora ? `<p><strong>Què has millorat:</strong> ${esc(a.millora)}</p>` : ""}
    <div class="fb-grid">
      ${a.punts_forts.length ? `<div class="fb-box good"><h3>El que ja saps</h3>${list(a.punts_forts)}</div>` : ""}
      ${a.falta.length ? `<div class="fb-box miss"><h3>El que t'has deixat</h3>${list(a.falta)}</div>` : ""}
      ${a.errors.length ? `<div class="fb-box wrong"><h3>Per corregir</h3>${list(a.errors)}</div>` : ""}
    </div>

function viewExFeedback(q, a) {
  const tone = a.nota >= 7 ? "var(--ok)" : a.nota >= 5 ? "var(--warn)" : "var(--bad)";
  const ICO = {ok: "✓", error: "✗", arrossegat: "→", falta: "…"};
  const LBL = {ok: "correcte", error: "error", arrossegat: "error arrossegat", falta: "falta"};
  return `<div class="fb">
    <div class="score"><span class="big" style="color:${tone}">${a.nota}<small>/10</small></span>
      <span class="chip ${a.correcte ? "good" : "bad"}">${a.correcte ? "Resultat correcte" : "Resultat per revisar"}</span>
      ${q.avals.length > 1 ? `<div class="attempts"><span class="label">Intents:</span>${q.avals.map(v => `<span class="chip">${v.nota}</span>`).join("")}</div>` : ""}</div>
${a.benestar ? `<div class="care" role="note"><strong>Un moment</strong><p>${esc(a.benestar)}</p></div>` : ""}
    ${a.millora ? `<p><strong>Què has arreglat:</strong> ${esc(a.millora)}</p>` : ""}
    ${a.transcripcio ? `<details class="better"><summary>El que Claude ha llegit a la teva foto</summary><p class="mathtxt">${esc(a.transcripcio)}</p></details>` : ""}
    ${a.passos.length ? `<ol class="pasos" aria-label="Correcció pas a pas">${a.passos.map(p => `<li class="pas ${p.estat}"><span class="ico" aria-hidden="true">${ICO[p.estat]}</span><div><p class="mathtxt"><strong>${esc(p.pas)}</strong> <span class="sr">(${LBL[p.estat]})</span>${p.estat !== "ok" ? ` <span class="chip">${LBL[p.estat]}</span>` : ""}</p>${p.comentari ? `<p class="muted small">${esc(p.comentari)}</p>` : ""}</div></li>`).join("")}</ol>` : ""}
    <div class="fb-grid">
      ${a.punts_forts.length ? `<div class="fb-box good"><h3>El que has fet bé</h3><ul>${a.punts_forts.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>` : ""}
      ${a.errors.length ? `<div class="fb-box wrong"><h3>On t'has equivocat</h3><ul>${a.errors.map(e => `<li><span class="chip">${esc(e.tipus)}</span> ${esc(e.explicacio)}</li>`).join("")}</ul></div>` : ""}
    </div>
    ${a.com_continuar && !a.correcte ? `<div class="weave"><span class="label">Com arreglar-ho</span><p>${esc(a.com_continuar)}</p></div>` : ""}
    ${solutionBlock(q, a.resultat_correcte)}
    <div class="row"><button id="xsb_${q.id}" class="btn" data-act="exSimilar" data-id="${q.id}" type="button" ${S.busy["xs_" + q.id] ? "disabled" : ""}>Fes-me'n un de semblant</button>
      <span class="muted small">${a.correcte ? "Per fixar-ho, prova'n un altre sense pistes." : "Arregla'l i torna'l a corregir, o practica amb un de semblant."}</span></div>
    ${busyBox("xs_" + q.id)}
  </div>`;
}

function viewProgress(t) {
  const h = arr(t.historial), ev = evidence(t);
  const st = conceptStatus(t);
  const counts = {none: 0, feble: 0, proces: 0, solid: 0}; Object.values(st).forEach(v => counts[v]++);
  const rec = recommended(t), prob = isProb(getSubj(t.subjId)), recP = recommended(t, "ex"), es = errStats(t);
  const avg = ev.length ? (ev.reduce((a, x) => a + x.nota, 0) / ev.length).toFixed(1) : "–";
  const inf = t.informe;
  return `
    <div class="stats">
      <div class="stat"><span class="label">${prob ? "Teoria" : "Nivell on ets"}</span><b>N${rec}</b><span class="muted small">${LEVELS[rec].nom}</span></div>
      ${prob ? `<div class="stat"><span class="label">Exercicis</span><b>P${recP}</b><span class="muted small">${LEVELS_P[recP].nom}</span></div>` : ""}
      <div class="stat"><span class="label">Dies d'estudi</span><b>${studyDays(t)}</b><span class="muted small">amb preguntes</span></div>
      <div class="stat"><span class="label">Respostes</span><b>${ev.length}</b><span class="muted small">mitjana ${avg}${h.length > ev.length ? ` · ${h.length} intents` : ""}</span></div>
      <div class="stat"><span class="label">Conceptes sòlids</span><b>${counts.solid}<small class="muted" style="font-size:1rem"> / ${Object.keys(st).length}</small></b><span class="muted small">${counts.feble} a reforçar</span></div>
    </div>
    ${prob ? `<section class="panel"><h3>Exercicis per dificultat</h3>${depthPicker(t, null, "ex")}</section>` : ""}
    ${prob && es.length ? `<section class="panel"><h3>On t'equivoques més</h3><p class="muted small">Tipus d'error en els exercicis (compta l'últim intent de cada un).</p>
      <div class="bars">${es.map(([k, v]) => `<div class="bar"><span>${esc(k)}</span><span class="track"><b style="width:${Math.round(v / es[0][1] * 100)}%"></b></span><span class="n">${v}</span></div>`).join("")}</div></section>` : ""}
    <section class="panel"><h3>${prob ? "Teoria per nivells" : "Profunditat per nivells"}</h3>${depthPicker(t, null)}</section>
    ${t.guia ? `<section class="panel"><h3>Mapa de domini dels conceptes</h3>
      <div class="concepts">${arr(t.guia.conceptes).map(c => `<div class="concept"><span class="cn"><i class="st ${st[c.id] === "none" ? "" : st[c.id]}"></i>${esc(c.nom)}</span><p>${ST_LABEL[st[c.id]]}</p></div>`).join("")}</div></section>` : ""}
    <section class="panel">
      <div class="row"><div style="flex:1 1 260px;min-width:0"><h3>Valoració global</h3><p class="muted small">Claude mira tot l'historial i et diu fins a quin nivell domines el tema i què fer a la propera sessió.</p></div>
        <button id="btnReport" class="btn primary" data-act="report" type="button" ${S.busy.inf ? "disabled" : ""}>${inf ? "Actualitza la valoració" : "Fes la valoració"}</button></div>
      ${busyBox("inf")}
      ${inf ? `<div class="report">
        <span class="label">${fmtDate(inf.t)}</span>
        <p>${esc(inf.valoracio)}</p>
        ${inf.nivells.length ? `<ul>${inf.nivells.map(n => `<li><strong>${esc(/^[NP]/.test(String(n.nivell)) ? n.nivell : "N" + n.nivell)}:</strong> ${esc(n.text)}</li>`).join("")}</ul>` : ""}
        <div class="fb-grid">
          ${inf.domina.length ? `<div class="fb-box good"><h3>Ja ho domines</h3><ul>${inf.domina.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>` : ""}
          ${inf.reforcar.length ? `<div class="fb-box miss"><h3>Per reforçar</h3><ul>${inf.reforcar.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>` : ""}
        </div>
        ${inf.pla.length ? `<div class="weave"><span class="label">Propera sessió</span><ol>${inf.pla.map(x => `<li>${esc(x)}</li>`).join("")}</ol></div>` : ""}
      </div>` : ""}
    </section>
    ${h.length ? `<section class="panel"><h3>Historial</h3><div class="tbl"><table class="hist"><thead><tr><th>Dia</th><th>Nivell</th><th>Pregunta</th><th>Nota</th></tr></thead><tbody>
      ${h.slice().reverse().map(x => `<tr><td>${fmtDate(x.t)}</td><td><span class="chip" style="--dc:var(--d${x.nivell || 1})"><i></i>${x.nivell ? lvlTag(x.mode, x.nivell) : "lliure"}</span></td><td>${esc(x.pregunta)}</td><td class="n">${x.nota}/10</td></tr>`).join("")}
    </tbody></table></div></section>` : ""}`;
}

function render() {
  // Es conserva el focus i el cursor de la caixa on s'escriu.
  const a = document.activeElement, aid = a?.id, ss = a?.selectionStart, se = a?.selectionEnd;
  const open = [...document.querySelectorAll("#main details[id][open]")].map(d => d.id);
  renderSide();
  const t = S.view.temaId && getTema(S.view.temaId);
  $("#main").innerHTML = t ? renderTema(t) : renderHome();
  for (const id of open) { const d = document.getElementById(id); if (d) d.open = true; }
  if (aid) { const el = document.getElementById(aid); if (el && el !== a) { el.focus(); try { if (ss != null) el.setSelectionRange(ss, se); } catch {} } }
  renderConn();
}
function renderConn() {
  const m = AI.mode, el = $("#conn");
  const st = Store.kind === "db" ? "es guarda al teu compte" : Store.kind === "local" ? "es guarda en aquest navegador" : "no es guarda";
  if (Store.failed) { el.innerHTML = `<span class="dot off"></span><span>No s'ha pogut guardar l'últim canvi</span>`; return; }
  el.innerHTML = m === "claude" ? `<span class="dot on"></span><span>Claude connectat · ${st}</span>`
    : m === "api" ? `<span class="dot on"></span><span>Claude (clau API) · ${st}</span>`
    : m === "proxy" ? (!AI.codi ? `<span class="dot off"></span><span>Falta el codi d'accés</span>` : AI.codiOk ? `<span class="dot on"></span><span>Codi d'accés actiu · ${st}</span>` : `<span class="dot"></span><span>Codi desat (es comprovarà en fer servir Claude) · ${st}</span>`)
    : `<span class="dot off"></span><span>Claude sense connectar</span>`;
}

    conceptes: arr(t.guia.conceptes).filter(c => okId(c?.id)).map(c => ({id: c.id, nom: str(c.nom, 300), definicio: str(c.definicio)})),

  const exItems = arr(t.exRonda?.items).filter(q => okId(q?.id)).map(q => ({...cleanExercise(q, num(q.nivell, 1, 4)), id: q.id,

    avals: arr(q.avals).map(a => ({t: num(a?.t, 0, 9e15), nota: num(a?.nota, 0, 10), correcte: a?.correcte === true, transcripcio: str(a?.transcripcio, 6000),
      passos: arr(a?.passos).map(p => ({pas: str(p?.pas, 600), estat: ["ok", "error", "arrossegat", "falta"].includes(p?.estat) ? p.estat : "ok", comentari: str(p?.comentari, 1000)})),
      errors: arr(a?.errors).map(e => ({tipus: str(e?.tipus, 40), explicacio: str(e?.explicacio, 1000)})), punts_forts: strs(a?.punts_forts, 600),
      com_continuar: str(a?.com_continuar, 1500), resultat_correcte: str(a?.resultat_correcte, 300), conceptes_ok: strs(a?.conceptes_ok, 60), conceptes_febles: strs(a?.conceptes_febles, 60),
      millora: str(a?.millora, 800), benestar: str(a?.benestar, 800), sig: str(a?.sig, 30000), all: a?.all == null ? undefined : str(a.all, 40000), resposta: str(a?.resposta, 20000)}))}));
  const items = arr(t.ronda?.items).filter(q => okId(q?.id)).map(q => ({id: q.id, nivell: num(q.nivell, 0, 4), tipus: str(q.tipus, 60), pregunta: str(q.pregunta), pista: str(q.pista), conceptes: strs(q.conceptes, 60), criteris: strs(q.criteris), resposta: str(q.resposta, 100000), oral: !!q.oral, avals: arr(q.avals).map(cleanAval)}));
  return {id: t.id, subjId: t.subjId, titol: str(t.titol, 200) || "Tema", creat: num(t.creat, 0, 9e15), mats: arr(t.mats).filter(okId), guia: g,
    ronda: items.length ? {nivell: num(t.ronda.nivell, 0, 4), items} : null,

function cleanBackup(d) {
  const subjects = arr(d.subjects).filter(s => okId(s?.id)).map(s => ({id: s.id, nom: str(s.nom, 80) || "Assignatura", llengua: LANGS[s.llengua] ? s.llengua : "ca", c: num(s.c, 1, 8), tipus: s.tipus === "problemes" || s.tipus === "teoria" ? s.tipus : withTipus({nom: s.nom}).tipus}));
  const temes = {}, mats = {};
  for (const t of Object.values(d.temes || {})) if (okId(t?.id) && okId(t?.subjId) && !ex.temes[t.id]) temes[t.id] = cleanTema(t);
  for (const m of Object.values(d.mats || {})) if (okId(m?.id) && temes[m?.temaId]) mats[m.id] = {id: m.id, temaId: m.temaId, nom: str(m.nom, 200), tipus: str(m.tipus, 10), text: str(m.text, MAX_MAT), creat: num(m.creat, 0, 9e15)};

}
async function importAll(file) {
  try {
    const d = JSON.parse(await file.text());
    if (d.app !== "explica-ho") throw 0;
    const c = cleanBackup(d);
    // El que ja existeix aquí no es toca: només s'afegeix el que falta.
    for (const s of c.subjects) if (!S.subjects.some(x => x.id === s.id)) S.subjects.push(s);
    let nous = 0, iguals = 0;
    for (const t of Object.values(c.temes)) { if (S.temes[t.id]) { iguals++; continue; } S.temes[t.id] = t; nous++; for (const id of t.mats) if (c.mats[id] && !S.mats[id]) S.mats[id] = c.mats[id]; }
    saveEverything(); closeDialog(); render();
    toast(`${nous} tema${nous === 1 ? "" : "s"} recuperat${nous === 1 ? "" : "s"}` + (iguals ? `; ${iguals} ja hi eren i no s'han tocat` : ""));
  } catch { toast("Aquest fitxer no és una còpia d'Explica-ho"); }
}

// Abans de substituir una ronda amb feina sense corregir, es demana confirmació.
// Compta com a feina pendent tot el que ha canviat des de l'última correcció (o no s'ha corregit mai).
function unsaved(q) {
  const last = q.avals[q.avals.length - 1];
  if (q.solucio) { const all = exAll(q); return all !== "|" && (!last || (last.all ?? last.sig) !== all); }
  const ans = String(q.resposta || "").trim(); return !!ans && (!last || String(last.resposta || "").trim() !== ans);
}
function keepWork(rondes, go) {
  const busy = [rondes].flat().some(r => arr(r?.items).some(unsaved));
  if (!busy) return go();
  confirmBox("Continuar?", "Tens respostes (o canvis) que encara no has fet corregir i es perdran.", go, "Continua igualment");
}

    const subjects = [], temes = {}, mats = {};
    for (const [k, v] of await Store.loadAll()) {
      if (k === "config") subjects.push(...arr(v.subjects).map(withTipus));
      else if (k.startsWith("t_")) temes[v.id] = v;
      else if (k.startsWith("m_")) mats[v.id] = v;
    }
    S.subjects = subjects; S.temes = temes; S.mats = mats; S.loaded = true;
  } catch { S.loadError = true; }
  render();
}
render();
boot();
</script>

</body>
</html>
