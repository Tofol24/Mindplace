# Explica-ho · versió amb codis d'accés (lloc Netlify independent, p. ex. "explica-ho")
# Estàtic, sense compilació, amb una edge function que fa d'intermediari amb Claude.
#
# Per desplegar-lo des d'aquest repositori, al panell de Netlify:
#   Add new site → Import an existing project → GitHub → Tofol24/Mindplace
#     · Base directory:    estudi/web-pacients   ← IMPRESCINDIBLE (llegeix AQUEST toml)
#     · Publish directory: estudi/web-pacients
#     · Build command:     (buit)
# Després, a Environment variables: ANTHROPIC_API_KEY i EXPLICA_CODIS (vegeu README.md).
[build]
  publish = "."
  command = ""

# explicalo.net (i www) és una porta d'entrada: porta sempre a explica.aprens.net, l'adreça principal.
# Així la feina i el codi de cada estudiant queden guardats en una sola adreça (el navegador els
# separa per domini). Si mai explicalo.net passa a ser la principal, cal traslladar abans les dades.
[[redirects]]
  from = "https://explicalo.net/*"
  to = "https://explica.aprens.net/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://explicalo.net/*"
  to = "https://explica.aprens.net/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.explicalo.net/*"
  to = "https://explica.aprens.net/:splat"
  status = 301
  force = true
