<title>Explica-ho</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: taula d'estudi. Columna esquerra = assignatures i temes; dreta = el tema obert, amb pestanyes
   Material · Guia · Autoavaluació · Progrés. La profunditat (N1→N4) es pinta com una escala de blaus. */
:root{
  --paper:#f5f7fb; --card:#ffffff; --ink:#18203a; --muted:#59627e; --line:#dde2ee; --soft:#eef1f8;
  --accent:#2c47c9; --accent-ink:#ffffff; --accent-soft:#e3e8fb;
  --marker:#ffe766; --marker-ink:#2f2800;
  --d1:#bcd9f2; --d2:#7cb2e0; --d3:#3b7fc0; --d4:#163f78;
  --ok:#1d7f55; --ok-soft:#dcf1e7; --warn:#a96b10; --warn-soft:#fbefd9; --bad:#b83b34; --bad-soft:#f8e1df;
  --s1:#2f9e6b; --s2:#c2543d; --s3:#7a52c7; --s4:#d08a12; --s5:#2b7bbf; --s6:#c23f86; --s7:#5c7d1e; --s8:#5b6478;
  --f-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0f121b; --card:#171b28; --ink:#e7eaf4; --muted:#9ba4be; --line:#2a3044; --soft:#1d2232;
  --accent:#8fa3ff; --accent-ink:#0f1430; --accent-soft:#232c52;
  --marker:#6b5d12; --marker-ink:#fff6c2;
  --d1:#27405e; --d2:#2f6aa3; --d3:#5299dc; --d4:#a9d3ff;
  --ok:#5fcf9a; --ok-soft:#173528; --warn:#e7b153; --warn-soft:#382a12; --bad:#f08a82; --bad-soft:#3a1c1b;
  --s1:#5fcf9a; --s2:#f08a72; --s3:#b39af0; --s4:#efbd55; --s5:#6fb4f0; --s6:#f08cc0; --s7:#a8cc5a; --s8:#a0a8bd;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0f121b; --card:#171b28; --ink:#e7eaf4; --muted:#9ba4be; --line:#2a3044; --soft:#1d2232;
  --accent:#8fa3ff; --accent-ink:#0f1430; --accent-soft:#232c52;
  --marker:#6b5d12; --marker-ink:#fff6c2;
  --d1:#27405e; --d2:#2f6aa3; --d3:#5299dc; --d4:#a9d3ff;
  --ok:#5fcf9a; --ok-soft:#173528; --warn:#e7b153; --warn-soft:#382a12; --bad:#f08a82; --bad-soft:#3a1c1b;
  --s1:#5fcf9a; --s2:#f08a72; --s3:#b39af0; --s4:#efbd55; --s5:#6fb4f0; --s6:#f08cc0; --s7:#a8cc5a; --s8:#a0a8bd;
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
h2{font-size:1.5rem;font-weight:700}
h3{font-size:1.1rem;font-weight:700}
p{margin:0}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.label{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.small{font-size:.88rem}

/* barra superior */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:14px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  border-bottom:1px solid var(--line);background:var(--card)}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto;min-width:0}
.brand h1{font-size:1.6rem;font-weight:800;letter-spacing:-.02em}
.brand h1 span{background:linear-gradient(transparent 58%,var(--marker) 58%);padding:0 .1em;color:inherit}
.conn{display:inline-flex;align-items:center;gap:6px;font-size:.85rem;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
.dot.on{background:var(--ok)} .dot.off{background:var(--warn)}

/* botons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--card);
  padding:9px 14px;border-radius:999px;cursor:pointer;font-weight:700;font-size:.95rem;line-height:1.2;text-decoration:none}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);border-color:var(--line)}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn.sm{padding:6px 11px;font-size:.85rem}
.btn svg{width:18px;height:18px;flex:none}

/* estructura */
.shell{display:grid;grid-template-columns:270px minmax(0,1fr);gap:0;min-height:calc(100vh - 70px)}
.side{border-right:1px solid var(--line);padding-block:18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;display:flex;flex-direction:column;gap:18px;background:var(--card)}
main{min-width:0;padding-block:22px 60px;padding-left:max(16px,2.5vw);padding-right:max(16px,env(safe-area-inset-right,0px),2.5vw)}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:20px}

.subj{display:flex;flex-direction:column;gap:2px}
.subj-head{display:flex;align-items:center;gap:8px;font-weight:700;padding:4px 0}
.subj-head .sw{width:10px;height:10px;border-radius:3px;background:var(--c,var(--s8));flex:none}
.subj-head .n{margin-left:auto;font-family:var(--f-mono);font-size:.75rem;color:var(--muted)}
.tema-link{display:block;width:100%;text-align:left;border:0;background:transparent;padding:6px 10px 6px 18px;border-radius:8px;cursor:pointer;color:var(--ink);font-size:.95rem}
.tema-link:hover{background:var(--soft)}
.tema-link.sel{background:var(--accent-soft);font-weight:700}
.tema-link .ex{font-family:var(--f-mono);font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-left:6px}
.side-actions{display:flex;flex-direction:column;gap:8px;margin-top:auto}

@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .side{border-right:0;border-bottom:1px solid var(--line);padding-right:max(16px,env(safe-area-inset-right,0px))}
  .side-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
  .side-actions{flex-direction:row;flex-wrap:wrap;margin-top:0}
  main{padding-left:max(16px,env(safe-area-inset-left,0px))}
  .side.in-tema{padding-block:10px}
  .side.in-tema .side-list,.side.in-tema .side-actions{display:none}
}

/* capçalera de tema i pestanyes */
.tema-head{display:flex;flex-direction:column;gap:6px}
.tema-head .crumb{display:flex;gap:8px;align-items:center}
.tema-head .crumb .sw{width:10px;height:10px;border-radius:3px;background:var(--c)}
.tema-head h2{font-size:clamp(1.6rem,3.4vw,2.3rem);font-weight:800;letter-spacing:-.02em}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tab{border:0;background:transparent;padding:10px 14px;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab.sel{color:var(--ink);border-bottom-color:var(--accent)}
.tab .badge{font-family:var(--f-mono);font-size:.7rem;background:var(--soft);border-radius:999px;padding:1px 7px;margin-left:6px;color:var(--muted)}

.banner{border:1px dashed var(--line);border-radius:var(--r);padding:12px 14px;background:var(--soft);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.banner p{flex:1 1 260px;min-width:0}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}

/* material */
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:26px 18px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;background:var(--card);transition:border-color .15s,background .15s}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop svg{width:34px;height:34px;color:var(--accent)}
.drop strong{font-family:var(--f-display);font-size:1.15rem}
.mats{display:flex;flex-direction:column;gap:8px}
.mat{border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
.mat summary{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;list-style:none}
.mat summary::-webkit-details-marker{display:none}
.mat .kind{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.06em;border:1px solid var(--line);border-radius:6px;padding:2px 6px;color:var(--muted);flex:none}
.mat .nm{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.mat .sz{font-family:var(--f-mono);font-size:.75rem;color:var(--muted);flex:none}
.mat .body{padding:0 12px 12px;display:flex;flex-direction:column;gap:8px}
textarea{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--paper);padding:10px 12px;resize:vertical;min-height:110px;line-height:1.5}
input[type=text],input[type=password],select{border:1px solid var(--line);border-radius:8px;background:var(--paper);padding:8px 10px;min-width:0}
.pending{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
.err{color:var(--bad)}

.spin{width:16px;height:16px;border:2.5px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.working{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:var(--r);background:var(--accent-soft)}
.working p{flex:1;min-width:0}

/* guia */
.mk{background:linear-gradient(transparent 56%,var(--marker) 56%);color:inherit;padding:0 .08em}
.resum{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.resum section{border-top:3px solid var(--ink);padding-top:10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.resum ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:4px}
.map{display:flex;flex-direction:column;align-items:center;gap:0;overflow-x:auto;padding-bottom:4px}
.map-centre{font-family:var(--f-display);font-weight:800;font-size:1.25rem;background:var(--ink);color:var(--paper);padding:10px 20px;border-radius:999px;text-align:center;max-width:100%}
.map-stem{width:2px;height:18px;background:var(--line)}
.map-branches{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;width:100%;border-top:2px solid var(--line);padding-top:18px;position:relative}
.branch{position:relative;border:1px solid var(--line);border-radius:var(--r);padding:12px;background:var(--card);display:flex;flex-direction:column;gap:6px;min-width:0}
.branch::before{content:"";position:absolute;top:-19px;left:50%;width:2px;height:18px;background:var(--line)}
.branch-name{font-family:var(--f-display);font-weight:700;font-size:1.05rem;display:flex;gap:8px;align-items:center}
.branch-name::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--b);flex:none}
.branch-idea{font-size:.9rem;color:var(--muted)}
.kids{list-style:none;margin:2px 0 0;padding:0 0 0 12px;border-left:2px solid var(--b);display:flex;flex-direction:column;gap:6px}
.kids li{font-size:.92rem}
.kids b{display:block}
.kids span{color:var(--muted);font-size:.86rem}
.rels{display:flex;flex-direction:column;gap:10px}
.rel{display:flex;flex-direction:column;gap:3px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.rel:last-child{border-bottom:0;padding-bottom:0}
.rel-line{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-weight:700}
.node{border:1px solid var(--line);border-radius:6px;padding:1px 8px;background:var(--soft)}
.arrow{font-family:var(--f-mono);font-size:.78rem;color:var(--accent);font-weight:500}
.concepts{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.concept{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.concept .cn{font-weight:700;display:flex;align-items:center;gap:8px}
.concept p{font-size:.9rem;color:var(--muted)}
.st{width:10px;height:10px;border-radius:50%;flex:none;border:2px solid var(--line);background:transparent}
.st.feble{background:var(--bad);border-color:var(--bad)}
.st.proces{background:var(--warn);border-color:var(--warn)}
.st.solid{background:var(--ok);border-color:var(--ok)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.legend span{display:inline-flex;gap:6px;align-items:center}

/* profunditat */
.depth{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.lvl{border:1px solid var(--line);border-radius:var(--r);background:var(--card);padding:10px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-width:0;position:relative}
.lvl:hover{border-color:var(--accent)}
.lvl.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.lvl .lv{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:800;font-size:1.05rem}
.lvl .lv i{width:14px;height:14px;border-radius:4px;background:var(--dc);flex:none}
.lvl .ld{font-size:.8rem;color:var(--muted);line-height:1.35}
.meter{height:6px;border-radius:99px;background:var(--soft);overflow:hidden}
.meter b{display:block;height:100%;background:var(--dc);border-radius:99px}
.lvl .rec{position:absolute;top:-9px;right:8px;font-family:var(--f-mono);font-size:.62rem;letter-spacing:.06em;text-transform:uppercase;background:var(--marker);color:var(--marker-ink);padding:1px 6px;border-radius:4px}
@media (max-width:640px){.depth{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* preguntes */
.q{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.q-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:.7rem;letter-spacing:.05em;text-transform:uppercase;border:1px solid var(--line);border-radius:999px;padding:2px 9px;color:var(--muted)}
.chip i{width:9px;height:9px;border-radius:3px;background:var(--dc)}
.q-text{font-family:var(--f-display);font-size:1.22rem;font-weight:700;line-height:1.3}
.hint{font-size:.92rem;background:var(--soft);border-radius:8px;padding:8px 12px}
.answer{display:flex;flex-direction:column;gap:8px}
.answer textarea{min-height:130px;font-size:1rem;background:var(--paper)}
.mic{position:relative}
.mic.recording{background:var(--bad);border-color:var(--bad);color:#fff}
.mic.recording::after{content:"";position:absolute;inset:-4px;border-radius:999px;border:2px solid var(--bad);animation:pulse 1.4s ease-out infinite}
@keyframes pulse{from{opacity:.8;transform:scale(1)}to{opacity:0;transform:scale(1.18)}}
.interim{font-style:italic;color:var(--muted);font-size:.95rem;min-height:1.4em}
.tip{font-size:.88rem;border-left:3px solid var(--warn);background:var(--warn-soft);padding:8px 12px;border-radius:0 8px 8px 0}

.fb{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:12px}
.score{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.score .big{font-family:var(--f-display);font-weight:800;font-size:2.4rem;line-height:1;font-variant-numeric:tabular-nums}
.score .big small{font-size:1rem;color:var(--muted);font-weight:500}
.fb-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.fb-box{border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.fb-box ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:4px}
.fb-box.good{background:var(--ok-soft)} .fb-box.good h3{color:var(--ok)}
.fb-box.miss{background:var(--warn-soft)} .fb-box.miss h3{color:var(--warn)}
.fb-box.wrong{background:var(--bad-soft)} .fb-box.wrong h3{color:var(--bad)}
.weave{border-left:4px solid var(--accent);padding:4px 0 4px 14px;display:flex;flex-direction:column;gap:4px}
details.better{border:1px solid var(--line);border-radius:var(--r);padding:10px 14px}
details.better summary{cursor:pointer;font-weight:700}
details.better p{margin-top:8px;white-space:pre-wrap}
.attempts{display:flex;gap:6px;flex-wrap:wrap}

/* progrés */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{border:1px solid var(--line);border-radius:var(--r);padding:12px;background:var(--card)}
.stat b{display:block;font-family:var(--f-display);font-size:1.7rem;font-variant-numeric:tabular-nums}
.hist{width:100%;border-collapse:collapse;font-size:.92rem}
.hist th{text-align:left;font-family:var(--f-mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500;padding:6px 8px;border-bottom:1px solid var(--line)}
.hist td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.hist td.n{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.tbl{overflow-x:auto}
.report{display:flex;flex-direction:column;gap:12px}
.report ol,.report ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px}

/* inici */
.hero{display:flex;flex-direction:column;gap:10px;max-width:68ch}
.hero h2{font-size:clamp(1.8rem,4vw,2.6rem);font-weight:800;letter-spacing:-.02em}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.step{border-top:3px solid var(--ink);padding-top:10px;display:flex;flex-direction:column;gap:4px}
.step .label{color:var(--accent)}
.empty{text-align:center;padding:30px 16px;display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--muted)}

dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);padding:0;width:min(560px,calc(100vw - 32px));max-height:calc(100vh - 40px)}
dialog::backdrop{background:rgba(10,14,30,.45)}
.dlg{padding:20px;display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field input,.field select{width:100%}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;font-weight:700;z-index:50;max-width:calc(100vw - 32px)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<header class="top">
  <div class="brand"><h1><span>Explica</span>-ho</h1><span class="label">Estudi de 4t d'ESO</span></div>
  <span class="conn" id="conn"><span class="dot"></span><span>Connectant…</span></span>

/* ============================================================
   Emmagatzematge: base de dades privada de claude.ai si n'hi ha;
   si no, aquest navegador (localStorage).
   ============================================================ */
const Store = {
  kind: "mem", db: null, uid: null, q: {}, running: {}, failed: false, pendingRetry: {},
  async init() {
    if (window.claude?.use) {
      try {
        const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
        if (db && user) {
          const id = await user.id().catch(() => null);
          const canW = await user.can("data.write").catch(() => null);
          if (id && canW !== false) { this.db = db; this.uid = id; this.kind = "db"; return; }
        }
      } catch {}
    }
    // Fitxer obert al propi ordinador: es guarda al navegador. Dins claude.ai sense espai al compte: només si s'ha triat.
    const framed = !!window.claude?.use;
    this.kind = lsAvailable() && (!framed || ls("explica:optLocal") === "1") ? "local" : "mem";
  },
  async loadAll() {
    const out = [];
    if (this.kind === "db") {
      const snap = await this.db.collection("data/users/" + this.uid).limit(1000).get();
      for (const d of snap.docs) if (d.exists) out.push([d.id, JSON.parse(JSON.stringify(d.data()))]);
      if (snap.size >= 1000) toast("Tens molt de material guardat: potser no surt tot. Esborra temes antics.");
    } else if (this.kind === "local") {
      try {
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (k && k.startsWith("explica:doc:")) { try { out.push([k.slice(12), JSON.parse(localStorage.getItem(k))]); } catch {} }
        }
      } catch {}
    }
    return out;
  },
  // Una escriptura a la vegada per document; si n'arriben més, només es guarda l'última.
  put(key, val) { this.q[key] = {val}; this.retry(key); this.flush(key); },
  retry(except) { for (const [k, job] of Object.entries(this.pendingRetry)) { delete this.pendingRetry[k]; if (k !== except && !this.q[k]) { this.q[k] = job; this.flush(k); } } },
  del(key) { this.q[key] = {del: true}; delete this.pendingRetry[key]; this.flush(key); },
  async flush(key) {
    if (this.running[key]) return;
    this.running[key] = true;
    try {
      while (this.q[key]) {
        const job = this.q[key]; delete this.q[key];
        try { await this.write(key, job); delete this.pendingRetry[key]; const f = Object.keys(this.pendingRetry).length > 0; if (this.failed !== f) { this.failed = f; renderConn(); } }
        catch (e) {
          if (this.kind === "db" && ["invalid_argument", "revoked", "not_granted"].includes(e?.code) && JSON.stringify(job.val || {}).length < 250000) {
            // Aquest compte no pot escriure al seu espai: no copiem res al navegador sense que ho demani.
            this.kind = "mem"; this.q = {}; renderConn(); toast("No es pot guardar al compte. Obre Configuració per descarregar una còpia o guardar en aquest navegador.");
          } else {
            // Es conserva el canvi (si no n'ha arribat un de més nou) per tornar-ho a provar al següent desament.
            if (!this.q[key]) this.pendingRetry[key] = job;
            this.failed = true; renderConn();
            toast(e?.code === "quota_exceeded" || e?.name === "QuotaExceededError" ? "No queda espai per guardar. Esborra material que ja no facis servir." : "No s'ha pogut guardar. Es tornarà a provar amb el següent canvi.");
          }
        }
      }
    } finally { this.running[key] = false; }
  },
  async write(key, job) {
    if (this.kind === "db") {
      const ref = this.db.collection("data/users/" + this.uid).doc(key);
      if (job.del) await ref.delete(); else await ref.set(job.val);
    } else if (this.kind === "local") {
      if (job.del) localStorage.removeItem("explica:doc:" + key); else localStorage.setItem("explica:doc:" + key, JSON.stringify(job.val));
    }
  },
};
const MAX_MAT = 150000;   // caràcters per material (límit d'un document)
const MAX_HIST = 120;

const draftTimers = {}, dirty = new Map();

/* ============================================================
   Connexió amb Claude
   Dins de claude.ai: capacitat "sample" (el compte de qui la fa servir).
   Fora (fitxer obert al navegador): clau de l'API d'Anthropic.
   ============================================================ */
const AI = {
  mode: "none", sample: null, imgMax: 5,
  memKey: "",
  get apiKey() { return this.memKey || ls("explica:apikey") || ""; },
  get model() { return ls("explica:model") || "claude-sonnet-5-5"; },
  async init() {
    if (window.claude?.use) {
      try {
        const s = await claude.use("sample");
        if (s) {
          this.sample = s; this.mode = "claude";
          const lim = await s.limits().catch(() => null);
          this.imgMax = lim?.images?.maxCount || 0;
          return;
        }
      } catch {}
    }
    this.mode = this.apiKey ? "api" : "none";
  },
  ready() { return this.mode === "claude" || !!this.apiKey; },
  async json(prompt, opts = {}) {
    if (this.mode === "claude") {
      return this.sample.json(prompt, {modelTier: opts.tier || "default", signal: opts.signal, images: opts.images?.length ? opts.images : undefined, cache: false,
        onText: opts.onText ? ({text}) => opts.onText(text.length) : undefined});
    }
    if (!this.ready()) throw {code: "no_ai"};
    const text = await this.api(prompt, opts);
    return parseLoose(text);
  },
  async text(prompt, opts = {}) {
    if (this.mode === "claude") {
      const r = await this.sample(prompt, {modelTier: opts.tier || "default", signal: opts.signal, images: opts.images?.length ? opts.images : undefined, cache: false});
      return r.text;
    }
    if (!this.ready()) throw {code: "no_ai"};
    return this.api(prompt, opts);
  },
  async api(prompt, opts) {
    const content = [];
    for (const b of opts.images || []) {
      const small = await shrinkImage(b, 1600);
      content.push({type: "image", source: {type: "base64", media_type: "image/jpeg", data: await blobToB64(small)}});
    }
    content.push({type: "text", text: prompt});
    let res;
    try {
      res = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST", signal: opts.signal,
        headers: {"content-type": "application/json", "x-api-key": this.apiKey, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true"},
        body: JSON.stringify({model: this.model, max_tokens: 12000, messages: [{role: "user", content}]}),
      });
    } catch (e) {
      if (e?.name === "AbortError") throw {code: "cancelled"};
      throw {code: "upstream_error", message: "No hi ha connexió amb Claude. Comprova internet."};
    }
    const body = await res.json().catch(() => ({}));
    if (!res.ok) {
      if (res.status === 401) throw {code: "bad_key"};
      if (res.status === 429) throw {code: "rate_limited"};
      if (res.status === 413) throw {code: "prompt_too_large"};

const libs = {};
function loadScript(src) {

async function getPdfjs() {

  await loadScript("https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js");
  await loadScript("https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js");

async function getMammoth() { await loadScript("https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js"); return window.mammoth; }

function kindOf(f) {
  const n = (f.name || "").toLowerCase();
  if ((f.type || "").startsWith("image/") || /\.(png|jpe?g|webp|gif|heic)$/.test(n)) return "IMG";
  if (n.endsWith(".pdf") || f.type === "application/pdf") return "PDF";
  if (n.endsWith(".docx")) return "WORD";
  if (n.endsWith(".doc")) return "DOC";
  if (n.endsWith(".pptx") || n.endsWith(".ppt")) return "PPT";
  if (/\.(txt|md)$/.test(n) || (f.type || "").startsWith("text/")) return "TEXT";
  return "?";
}
async function ocr(blobs, signal, onPage) {
  if (AI.mode === "claude" && !AI.imgMax) throw {code: "images_unavailable"};
  const per = AI.mode === "claude" ? Math.max(1, Math.min(AI.imgMax, 5)) : 5;
  const out = [];
  for (let i = 0; i < blobs.length; i += per) {
    const group = blobs.slice(i, i + per);
    onPage?.(i + 1, blobs.length);
    const text = await AI.text(
`Aquestes ${group.length} imatges són material d'estudi d'una alumna de 4t d'ESO (fotos o captures d'apunts, llibre de text, fitxes o diapositives), en ordre.
Transcriu fidelment tot el text que s'hi llegeix, imatge per imatge, començant cada una amb una línia "--- Pàgina ${i + 1}… ---" (numera-les a partir de ${i + 1}).
- Respecta títols, llistes i l'ordre de lectura.
- Si hi ha esquemes, mapes, taules o dibuixos amb rètols, descriu-los com a text estructurat (per exemple: "Esquema: A → B → C").
- Si hi ha text manuscrit, transcriu-lo tal com és; marca amb [?] el que no es llegeixi bé.
- No afegeixis comentaris ni explicacions teves. Respon només amb la transcripció.`, {images: group, signal});
    out.push(text.trim());
  }
  return out.join("\n\n");
}
async function extract(f, signal, status) {
  const k = kindOf(f);
  if (k === "IMG") { status("Llegint la imatge amb Claude…"); return {kind: k, text: await ocr([f], signal)}; }
  if (k === "TEXT") return {kind: k, text: await f.text()};
  if (k === "WORD") { status("Llegint el Word…"); const m = await getMammoth(); const r = await m.extractRawText({arrayBuffer: await f.arrayBuffer()}); return {kind: k, text: r.value.trim()}; }
  if (k === "DOC") throw new Error("Els .doc antics no es poden llegir. Obre'l amb Word i desa'l com a .docx o PDF.");
  if (k === "PPT") throw new Error("Les presentacions no es poden llegir directament. Exporta-la a PDF i puja el PDF.");
  if (k === "PDF") {
    status("Llegint el PDF…");
    const lib = await getPdfjs();
    const pdf = await lib.getDocument({data: new Uint8Array(await f.arrayBuffer()), isEvalSupported: false}).promise;
    const pages = [];
    for (let p = 1; p <= pdf.numPages; p++) {
      const pg = await pdf.getPage(p); const tc = await pg.getTextContent();
      let line = "", txt = "", lastY = null;
      for (const it of tc.items) { const y = it.transform?.[5]; if (lastY !== null && Math.abs(y - lastY) > 4) { txt += line.trim() + "\n"; line = ""; } line += it.str + (it.hasEOL ? "\n" : " "); lastY = y; }
      txt += line; pages.push(txt.replace(/[ \t]+\n/g, "\n").trim());
    }
    // Les pàgines sense text (escanejades o fotos) es converteixen en imatge i les llegeix Claude, una per una.
    const scan = pages.map((t, i) => t.replace(/\s/g, "").length < 40 ? i : -1).filter(i => i >= 0);
    const MAXOCR = 15, todo = scan.slice(0, MAXOCR);
    for (let j = 0; j < todo.length; j++) {
      const i = todo[j];
      status(`Pàgina escanejada ${i + 1}: llegint-la amb Claude (${j + 1} de ${todo.length})…`);
      const pg = await pdf.getPage(i + 1); const vp0 = pg.getViewport({scale: 1}); const vp = pg.getViewport({scale: Math.min(2.2, 1500 / vp0.width)});
      const c = document.createElement("canvas"); c.width = vp.width; c.height = vp.height;
      await pg.render({canvasContext: c.getContext("2d"), viewport: vp}).promise;
      const img = await new Promise(r => c.toBlob(r, "image/jpeg", .85));
      pages[i] = (await ocr([img], signal)).replace(/^--- Pàgina[^\n]*\n?/, "");
    }
    const skipped = scan.slice(MAXOCR).map(i => i + 1);
    return {kind: k, text: (skipped.length ? `[No s'han llegit ${skipped.length} pàgines escanejades: ${skipped.join(", ")}. Puja-les com a fotos si les necessites.]\n\n` : "") +
      pages.map((t, i) => `--- Pàgina ${i + 1} ---\n${t}`).join("\n\n")};
  }
  throw new Error("Aquest tipus de fitxer no es pot llegir. Fes servir fotos, PDF, Word (.docx) o text.");
}

function evidence(t) { const seen = new Set(), out = []; for (const h of arr(t.historial).slice().reverse()) { if (h.qid) { if (seen.has(h.qid)) continue; seen.add(h.qid); } out.push(h); } return out.reverse(); }

function recommended(t) { const st = levelScores(t); for (let L = 1; L <= 4; L++) { const l = st[L].slice(-3); const a = levelAvg(l); if (!(l.length >= 2 && a >= 7)) return L; } return 4; }

  for (const h of evidence(t)) {
    for (const id of arr(h.ok)) if (m[id]) { m[id].ok++; m[id].last = "ok"; }
    for (const id of arr(h.feble)) if (m[id]) { m[id].feb++; m[id].last = "feb"; }

  if (!r) return;

/* ============================================================
   Micròfon (reconeixement de veu del navegador)
   ============================================================ */
const Mic = {
  rec: null, qid: null, base: "", finals: "", want: false, t0: 0, timer: null,
  supported() { return !!(window.SpeechRecognition || window.webkitSpeechRecognition); },
  start(qid, lang) {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { S.micTip = true; render(); return; }
    this.stop(); clearInterval(this.timer);
    const ta = document.getElementById("ans_" + qid);
    this.tema = getTema(S.view.temaId); this.qid = qid; this.base = ta ? ta.value.replace(/\s*$/, "") : ""; this.finals = ""; this.want = true; this.t0 = Date.now();
    const android = /android/i.test(navigator.userAgent);
    const rec = new SR(); rec.lang = lang; rec.interimResults = true; rec.continuous = !android; rec.maxAlternatives = 1;
    this.rec = rec;
    rec.onresult = (e) => {
      if (this.rec !== rec) return;
      let interim = "";
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const r = e.results[i];
        if (r.isFinal) this.finals += (this.finals ? " " : "") + r[0].transcript.trim(); else interim += r[0].transcript;
      }
      this.sync(interim);
    };
    rec.onerror = (e) => {
      if (this.rec !== rec) return;
      if (e.error === "not-allowed" || e.error === "service-not-allowed" || e.error === "audio-capture") { this.want = false; S.micTip = true; render(); }
      else if (e.error === "network" || e.error === "language-not-supported") { this.want = false; toast(e.error === "network" ? "El dictat necessita connexió. Escriu la resposta o torna-ho a provar." : "El navegador no reconeix aquesta llengua. Tria'n una altra o escriu."); }
    };
    rec.onend = () => { if (this.rec !== rec) return; if (this.want) { try { rec.start(); } catch { this.want = false; this.end(); } } else this.end(); };
    try { rec.start(); } catch { S.micTip = true; this.want = false; this.rec = null; this.qid = null; render(); return; }
    this.timer = setInterval(() => { const el = document.querySelector(`[data-mic="${qid}"] .mt`); if (el) { const s = Math.floor((Date.now() - this.t0) / 1000); el.textContent = Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); } }, 500);
    render();
  },
  sync(interim) {
    const t = this.tema; const q = t?.ronda?.items.find(x => x.id === this.qid); if (!q) return;
    q.resposta = (this.base ? this.base + " " : "") + this.finals; q.oral = true;
    const ta = document.getElementById("ans_" + this.qid); if (ta) ta.value = q.resposta;
    const im = document.getElementById("int_" + this.qid); if (im) im.textContent = interim;
    saveTemaSoon(t);
  },
  stop() { if (!this.rec) return; this.want = false; try { this.rec.stop(); } catch { this.end(); } },
  // Atura i espera que arribin els últims resultats (o 2,5 s com a màxim).
  stopAndWait() {
    if (!this.rec) return Promise.resolve();
    const p = new Promise(res => { this.waiters.push(res); setTimeout(res, 2500); });
    this.stop(); return p;
  },
  waiters: [],
  end() {
    clearInterval(this.timer); this.timer = null; this.rec = null;
    const im = document.getElementById("int_" + this.qid); if (im) im.textContent = "";
    this.qid = null; render();
    this.waiters.splice(0).forEach(f => f());
  },
};

    return `<button id="lvl_${sel === null ? "p" : "q"}${L}" class="lvl ${sel === L ? "sel" : ""}" style="--dc:var(--d${L})" aria-pressed="${sel === L}" data-act="level" data-l="${L}" type="button">

      <span class="label">${st[L].length ? `${st[L].length} resp. · ${a.toFixed(1)}` : "sense respostes"}</span>
    </button>`; }).join("")}</div>`;
}

  S.levelSel ??= {};

  return `
    <section class="panel">
      <div class="row"><div style="flex:1 1 260px;min-width:0"><h3>Tria la profunditat</h3><p class="muted small">Comença per dalt i ves baixant. Quan les últimes respostes d'un nivell fan mitjana de 7, passes al següent.</p></div></div>
      ${depthPicker(t, sel)}
      <div class="row">
        <button id="btnAsk" class="btn primary" data-act="ask" type="button" ${S.busy.quiz ? "disabled" : ""}>Fes-me preguntes de nivell ${sel}</button>
        <button id="btnFree" class="btn" data-act="free" type="button" ${S.busy.quiz ? "disabled" : ""}>Explica tot el tema</button>
      </div>
      ${busyBox("quiz")}
    </section>
    ${S.micTip ? micTip() : ""}
    ${Mic.supported() ? `<p class="muted small">El botó «Parla» fa servir el reconeixement de veu del navegador: a Chrome l'àudio es processa als servidors de Google i a Safari als d'Apple. Si no ho vols, escriu la resposta o dicta amb el teclat.</p>` : ""}
    ${r ? arr(r.items).map((q, i) => viewQuestion(t, s, q, i)).join("") : `<div class="empty"><p>Tria un nivell i prem «Fes-me preguntes», o prova d'explicar tot el tema de cop.</p></div>`}`;

function micTip() {
  return `<div class="tip" role="note"><strong>El micròfon d'aquesta pàgina no està disponible aquí.</strong> Pots dictar igualment amb el teclat: al mòbil, toca el micròfon del teclat; a Windows, prem <b>Windows + H</b>; al Mac, prem dues vegades la tecla <b>Fn</b> (o <b>Control</b>). El text apareixerà a la caixa de resposta. <button class="btn sm ghost" data-act="hideTip" type="button">Entesos</button></div>`;

function viewQuestion(t, s, q, i) {

    <div class="answer">

function viewFeedback(q, a) {

  return `<div class="fb">
    <div class="score"><span class="big" style="color:${tone}">${a.nota}<small>/10</small></span>
      <div><span class="label">Profunditat que demostres</span><div class="row" style="gap:6px;margin-top:4px">${[1,2,3,4].map(L => `<span class="chip" style="--dc:var(--d${L});${L <= a.profunditat ? "color:var(--ink);border-color:var(--d" + L + ")" : "opacity:.5"}"><i style="${L <= a.profunditat ? "" : "background:transparent"}"></i>N${L}</span>`).join("")}</div></div>
      ${q.avals.length > 1 ? `<div class="attempts"><span class="label">Intents:</span>${q.avals.map(v => `<span class="chip">${v.nota}</span>`).join("")}</div>` : ""}</div>
    ${a.millora ? `<p><strong>Què has millorat:</strong> ${esc(a.millora)}</p>` : ""}
    <div class="fb-grid">
      ${a.punts_forts.length ? `<div class="fb-box good"><h3>El que ja saps</h3>${list(a.punts_forts)}</div>` : ""}

function render() {
  // Es conserva el focus i el cursor de la caixa on s'escriu.
  const a = document.activeElement, aid = a?.id, ss = a?.selectionStart, se = a?.selectionEnd;

function renderConn() {

async function exportAll() {
  const data = JSON.stringify({app: "explica-ho", v: 1, exportat: Date.now(), subjects: S.subjects, temes: S.temes, mats: S.mats});
  const name = `explica-ho-copia-${today()}.json`;
  const dl = window.claude?.use ? await claude.use("downloads").catch(() => null) : null;
  if (dl) { try { await dl.save({filename: name, data: new Blob([data], {type: "application/json"})}); } catch (e) { if (e?.code !== "declined") toast("No s'ha pogut descarregar la còpia"); } return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([data], {type: "application/json"})); a.download = name; document.body.append(a); a.click(); a.remove();
}
// Una còpia ve d'un fitxer: es reconstrueix camp a camp, amb id segurs i tipus forçats.
const okId = (x) => typeof x === "string" && /^[A-Za-z0-9_-]{1,60}$/.test(x);
const str = (x, n = 2000) => String(x ?? "").slice(0, n);
const num = (x, lo, hi) => Math.max(lo, Math.min(hi, Math.round(Number(x) || 0)));
const strs = (x, n) => arr(x).map(v => str(v, n));
function cleanAval(a) { return {t: num(a?.t, 0, 9e15), nota: num(a?.nota, 0, 10), profunditat: num(a?.profunditat, 1, 4), punts_forts: strs(a?.punts_forts), falta: strs(a?.falta), errors: strs(a?.errors),
  com_integrar: str(a?.com_integrar), resposta_millorada: str(a?.resposta_millorada, 6000), conceptes_ok: strs(a?.conceptes_ok, 60), conceptes_febles: strs(a?.conceptes_febles, 60), millora: str(a?.millora), resposta: str(a?.resposta, 100000)}; }
function cleanTema(t) {
  const g = t.guia && typeof t.guia === "object" ? {generat: num(t.guia.generat, 0, 9e15), titol: str(t.guia.titol, 200),
    resum: arr(t.guia.resum).map(r => ({apartat: str(r?.apartat, 300), punts: strs(r?.punts)})),
    mapa: {centre: str(t.guia.mapa?.centre, 300), branques: arr(t.guia.mapa?.branques).map(b => ({nom: str(b?.nom, 300), idea: str(b?.idea), fills: arr(b?.fills).map(f => ({nom: str(f?.nom, 300), idea: str(f?.idea)}))}))},
    relacions: arr(t.guia.relacions).map(r => ({de: str(r?.de, 300), a: str(r?.a, 300), tipus: str(r?.tipus, 100), explicacio: str(r?.explicacio)})),
    conceptes: arr(t.guia.conceptes).filter(c => okId(c?.id)).map(c => ({id: c.id, nom: str(c.nom, 300), definicio: str(c.definicio)}))} : null;
  const items = arr(t.ronda?.items).filter(q => okId(q?.id)).map(q => ({id: q.id, nivell: num(q.nivell, 0, 4), tipus: str(q.tipus, 60), pregunta: str(q.pregunta), pista: str(q.pista), conceptes: strs(q.conceptes, 60), criteris: strs(q.criteris), resposta: str(q.resposta, 100000), oral: !!q.oral, avals: arr(q.avals).map(cleanAval)}));
  return {id: t.id, subjId: t.subjId, titol: str(t.titol, 200) || "Tema", creat: num(t.creat, 0, 9e15), mats: arr(t.mats).filter(okId), guia: g,
    ronda: items.length ? {nivell: num(t.ronda.nivell, 0, 4), items} : null,
    historial: arr(t.historial).map(h => ({t: num(h?.t, 0, 9e15), qid: okId(h?.qid) ? h.qid : undefined, nivell: num(h?.nivell, 0, 4), nota: num(h?.nota, 0, 10), prof: num(h?.prof, 1, 4), ok: strs(h?.ok, 60), feble: strs(h?.feble, 60), pregunta: str(h?.pregunta, 300), intent: num(h?.intent, 1, 99)})),
    informe: t.informe ? {t: num(t.informe.t, 0, 9e15), valoracio: str(t.informe.valoracio, 4000), nivells: arr(t.informe.nivells).map(n => ({nivell: num(n?.nivell, 1, 4), text: str(n?.text)})), domina: strs(t.informe.domina), reforcar: strs(t.informe.reforcar), pla: strs(t.informe.pla)} : null};
}
function cleanBackup(d) {
  const subjects = arr(d.subjects).filter(s => okId(s?.id)).map(s => ({id: s.id, nom: str(s.nom, 80) || "Assignatura", llengua: LANGS[s.llengua] ? s.llengua : "ca", c: num(s.c, 1, 8)}));
  const temes = {}, mats = {};
  for (const t of Object.values(d.temes || {})) if (okId(t?.id) && okId(t?.subjId) && t.id !== "exemple") temes[t.id] = cleanTema(t);
  for (const m of Object.values(d.mats || {})) if (okId(m?.id) && temes[m?.temaId]) mats[m.id] = {id: m.id, temaId: m.temaId, nom: str(m.nom, 200), tipus: str(m.tipus, 10), text: str(m.text, MAX_MAT), creat: num(m.creat, 0, 9e15)};
  return {subjects, temes, mats};
}
async function importAll(file) {
  try {
    const d = JSON.parse(await file.text());
    if (d.app !== "explica-ho") throw 0;
    const c = cleanBackup(d);
    // El que ja existeix aquí no es toca: només s'afegeix el que falta.
    for (const s of c.subjects) if (!S.subjects.some(x => x.id === s.id)) S.subjects.push(s);
    let nous = 0, iguals = 0;
    for (const t of Object.values(c.temes)) { if (S.temes[t.id]) { iguals++; continue; } S.temes[t.id] = t; nous++; for (const id of t.mats) if (c.mats[id] && !S.mats[id]) S.mats[id] = c.mats[id]; }
    saveEverything(); closeDialog(); render();
    toast(`${nous} tema${nous === 1 ? "" : "s"} recuperat${nous === 1 ? "" : "s"}` + (iguals ? `; ${iguals} ja hi eren i no s'han tocat` : ""));
  } catch { toast("Aquest fitxer no és una còpia d'Explica-ho"); }
}

/* ============================================================
   Esdeveniments
   ============================================================ */
document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act, t = getTema(S.view.temaId);
  if (!S.loaded && !["home", "open", "tab", "hint", "level", "dlgClose", "stop", "hideTip", "retryLoad", "export"].includes(act)) { toast("Un moment: s'estan carregant les dades…"); return; }
  switch (act) {
    case "home": Mic.stop(); S.view = {temaId: null, tab: "material"}; render(); break;
    case "open": Mic.stop(); S.view = {temaId: b.dataset.id, tab: getTema(b.dataset.id)?.guia ? "quiz" : "material"}; render(); window.scrollTo(0, 0); $("#temaTitle")?.focus({preventScroll: true}); break;
    case "tab": Mic.stop(); S.view.tab = b.dataset.tab; render(); $("#tab_" + b.dataset.tab)?.focus(); break;
    case "newSubj": newSubject(); break;
    case "newTema": newTema(b.dataset.subj); break;
    case "addPresets": PRESETS.forEach((p, i) => { if ($("#pre_" + i)?.checked && !S.subjects.some(s => s.nom === p.nom)) S.subjects.push({id: uid(), nom: p.nom, llengua: p.llengua, c: p.c}); }); saveConfig(); render(); break;
    case "hideExample": Mic.stop(); S.exampleHidden = true; ls("explica:hideExample", "1"); if (S.view.temaId === "exemple") S.view.temaId = null; if ($("#dlg").open) closeDialog(); render(); break;
    case "showExample": S.exampleHidden = false; ls("explica:hideExample", null); closeDialog(); render(); break;
    case "renameTema": askText("Canvia el nom", "Nom del tema", t.titol, (v) => { t.titol = v; saveTema(t); render(); }); break;
    case "delTema": confirmBox("Esborrar el tema?", `S'esborraran «${t.titol}», el seu material i tot l'historial. No es pot desfer.`, () => {
        Mic.stop(); Object.values(S.busy).forEach(x => x.ctl.abort()); S.pending.forEach(p => p.ctl.abort()); cancelSoon(t.id);
        for (const id of arr(t.mats)) { cancelSoon("m" + id); delete S.mats[id]; Store.del("m_" + id); }
        delete S.temes[t.id]; Store.del("t_" + t.id); S.view = {temaId: null, tab: "material"}; render(); }); break;
    case "pick": $("#fileIn").click(); break;
    case "delMat": confirmBox("Esborrar aquest material?", "La guia ja feta no canvia fins que la tornis a fer.", () => {
        const id = b.dataset.id; cancelSoon("m" + id); delete S.mats[id]; Store.del("m_" + id); t.mats = arr(t.mats).filter(x => x !== id); saveTema(t); render(); }); break;
    case "addText": {
      const txt = $("#pasteText").value.trim(); if (!txt) return;
      const m = {id: uid(), temaId: t.id, nom: $("#pasteName").value.trim() || "Text enganxat", tipus: "TEXT", text: txt.slice(0, MAX_MAT), creat: Date.now()};
      S.mats[m.id] = m; t.mats = [...arr(t.mats), m.id]; saveMat(m); saveTema(t); S.paste = {text: "", nom: ""}; render(); break; }
    case "guide": makeGuide(t); break;
    case "stop": S.busy[b.dataset.key]?.ctl.abort(); break;
    case "level": S.view.tab = "quiz"; (S.levelSel ??= {})[t.id] = +b.dataset.l; render(); break;
    case "ask": if (evaluating(t)) { toast("Espera que acabi la valoració de la resposta."); break; } Mic.stop(); makeQuestions(t, (S.levelSel?.[t.id]) ?? recommended(t)); break;
    case "free": if (evaluating(t)) { toast("Espera que acabi la valoració de la resposta."); break; } Mic.stop(); freeExplain(t); break;
    case "hint": S.showHint[b.dataset.id] = true; render(); $("#hint_" + b.dataset.id)?.focus(); break;
    case "mic": {
      const id = b.dataset.id;
      if (Mic.qid === id) { Mic.stop(); break; }
      const lang = $("#ml_" + id)?.value || "ca-ES";
      Mic.stopAndWait().then(() => Mic.start(id, lang)); break; }
    case "hideTip": S.micTip = false; render(); break;
    case "eval": { const q = t.ronda?.items.find(x => x.id === b.dataset.id); if (q) Mic.stopAndWait().then(() => evaluate(t, q)); break; }
    case "report": makeReport(t); break;
    case "dlgClose": closeDialog(); break;
    case "dlgOk": $("#dlg")._submit?.(); break;
    case "export": exportAll(); break;
    case "useLocal": Store.kind = "local"; ls("explica:optLocal", "1"); saveEverything(); if ($("#dlg").open) closeDialog(); render(); toast("Es guardarà en aquest navegador"); break;
    case "retryLoad": boot(); break;
    case "wipe": confirmBox("Esborrar-ho tot d'aquest navegador?", "S'esborraran assignatures, temes, material, historial i la clau de l'API guardats aquí. Descarrega abans una còpia si la vols.", () => {
        try { Object.keys(localStorage).filter(k => k.startsWith("explica:")).forEach(k => localStorage.removeItem(k)); } catch {}
        Mic.stop(); Object.values(S.busy).forEach(x => x.ctl.abort()); S.pending.forEach(p => p.ctl.abort()); dirty.clear(); Store.q = {}; Store.pendingRetry = {}; S.paste = {text: "", nom: ""};
        AI.memKey = ""; if (AI.mode === "api") AI.mode = "none"; S.subjects = []; S.temes = {}; S.mats = {}; S.view = {temaId: null, tab: "material"}; render(); toast("Dades esborrades"); }, "Esborra-ho tot"); break;
    case "import": $("#importIn").click(); break;
  }
});
document.addEventListener("keydown", (e) => {
  if (e.target.classList?.contains("tab") && (e.key === "ArrowRight" || e.key === "ArrowLeft")) {
    const tabs = [...document.querySelectorAll(".tab")], i = tabs.indexOf(e.target);
    tabs[(i + (e.key === "ArrowRight" ? 1 : tabs.length - 1)) % tabs.length]?.click(); e.preventDefault();
  }
  if (e.key === "Enter" && e.target.id === "dlgIn") { e.preventDefault(); $("#dlg")._submit?.(); }
  if ((e.key === "Enter" || e.key === " ") && e.target.id === "drop") { e.preventDefault(); $("#fileIn").click(); }
});
document.addEventListener("input", (e) => {
  const el = e.target, t = getTema(S.view.temaId); if (!t) return;
  if (el.dataset.paste) S.paste[el.dataset.paste] = el.value;
  if (el.dataset.ans) { const q = t.ronda?.items.find(x => x.id === el.dataset.ans); if (q) { q.resposta = el.value;
      if (Mic.qid === q.id) { Mic.base = el.value.replace(/\s*$/, ""); Mic.finals = ""; } /* el dictat continua des del text corregit */ if (Mic.qid !== q.id && !el.value.trim()) q.oral = false; saveTemaSoon(t); } }
  if (el.dataset.mat && !t.exemple) { const m = S.mats[el.dataset.mat]; if (m) { m.text = el.value.slice(0, MAX_MAT); saveSoon("m" + m.id, () => saveMat(m)); } }
});
document.addEventListener("change", (e) => {
  if (e.target.dataset.miclang) (S.micLang ??= {})[e.target.dataset.miclang] = e.target.value;
});
$("#btnSettings").addEventListener("click", settings);
window.addEventListener("pagehide", () => { Mic.stop(); flushSoon(); });
document.addEventListener("visibilitychange", () => { if (document.hidden) { Mic.stop(); flushSoon(); } });
$("#fileIn").addEventListener("change", (e) => { const fs = [...e.target.files]; e.target.value = ""; addFiles(fs); });
$("#importIn").addEventListener("change", (e) => { const f = e.target.files[0]; e.target.value = ""; if (f) importAll(f); });
document.addEventListener("dragover", (e) => { const d = e.target.closest?.("#drop"); if (d) { e.preventDefault(); d.classList.add("over"); } });
document.addEventListener("dragleave", (e) => { const d = e.target.closest?.("#drop"); if (d) d.classList.remove("over"); });
document.addEventListener("drop", (e) => { const d = e.target.closest?.("#drop"); if (!d) return; e.preventDefault(); d.classList.remove("over"); addFiles([...e.dataTransfer.files]); });
document.addEventListener("paste", (e) => {
  if (S.view.tab !== "material" || !S.view.temaId || S.view.temaId === "exemple") return;
  if (e.target.closest?.("textarea,input")) return;
  const imgs = [...(e.clipboardData?.items || [])].filter(i => i.type.startsWith("image/")).map(i => i.getAsFile()).filter(Boolean);
  if (imgs.length) { e.preventDefault(); addFiles(imgs.map((f, i) => new File([f], `Captura ${new Date().toLocaleTimeString("ca-ES")}${imgs.length > 1 ? " " + (i + 1) : ""}.png`, {type: f.type}))); }
});

/* ============================================================
   Arrencada
   ============================================================ */
let inited = null;
async function boot() {
  S.loadError = false; render();
  inited ||= Promise.all([AI.init(), Store.init()]);
  await inited;
  try {
    const subjects = [], temes = {}, mats = {};
    for (const [k, v] of await Store.loadAll()) {
      if (k === "config") subjects.push(...arr(v.subjects));
      else if (k.startsWith("t_")) temes[v.id] = v;
      else if (k.startsWith("m_")) mats[v.id] = v;
    }
    S.subjects = subjects; S.temes = temes; S.mats = mats; S.loaded = true;
  } catch { S.loadError = true; }
  render();
}
render();
boot();
</script>
